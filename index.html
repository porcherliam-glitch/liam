    z.legPhase += moved * (z.id === 'runner' ? 0.16 : 0.1);
    z.moveX = dx; z.moveY = dy;
    if (z.state !== 'attack') z.angle = lerpAngle(z.angle, Math.atan2(dy, dx), Math.min(1, dt * 8));
  }

  _separate(z) {
    const raid = this.raid;
    if (!raid.hash) return;
    this._near.length = 0;
    raid.hash.query(z.x, z.y, 40, this._near);
    let n = 0, pxs = 0, pys = 0;
    for (const o of this._near) {
      if (o === z || o.dead) continue;
      const dx = z.x - o.x, dy = z.y - o.y;
      const r = z.radius + o.radius;
      const d2v = dx * dx + dy * dy;
      if (d2v >= r * r) continue;
      const d = Math.sqrt(d2v) || 0.01;
      const push = (r - d) * (o.id === 'boss' || o.id === 'brute' ? 0.8 : 0.5);
      pxs += dx / d * push; pys += dy / d * push;
      if (++n >= 6) break;
    }
    if (n && (pxs || pys)) {
      if (z.id === 'boss') { pxs *= 0.2; pys *= 0.2; }
      const m = Physics.moveCircle(this.world, z.x, z.y, z.radius, clamp(pxs, -8, 8), clamp(pys, -8, 8));
      z.x = m.x; z.y = m.y;
    }
  }

  _hit(z, d) {
    const p = this.player, raid = this.raid, type = z.type;
    if (!p || p.dead || z.hitThisAttack) return;
    if (!Physics.lineOfSight(this.world, z.x, z.y, p.x, p.y)) return;
    z.hitThisAttack = true;
    this._audio('zombie_attack', { x: z.x, y: z.y });
    p.takeDamage(z.damage, { source: type.name || 'Zombie', from: { x: z.x, y: z.y }, bleedChance: ZAI_BLEED[z.id] || 0.15 });
    if (z.id === 'brute') {
      const a = angleTo(z.x, z.y, p.x, p.y);
      const kb = (type.knockback || 140) / 0.2;
      p.knock = { vx: Math.cos(a) * kb, vy: Math.sin(a) * kb, t: 0.2 };
      if (raid.game && raid.game.camera) raid.game.camera.addShake(9);
    }
    if (z.id === 'toxic') {
      raid.addHazard({ kind: 'toxic', x: p.x, y: p.y, r: type.toxicRadius || 70, duration: type.toxicDuration || 8 });
      p.toxic = Math.max(p.toxic, 4);
      if (raid.fx) raid.fx.toxicCloud(p.x, p.y, type.toxicRadius || 70);
      this._audio('toxic', { x: p.x, y: p.y });
    }
  }

  // ---------------- boss ----------------
  _bossSpeedMul(z) {
    const ph = (z.type.phases || [])[z.phase];
    return ph && ph.speedMul ? ph.speedMul : 1;
  }
  _bossPhase(z) {
    const phases = z.type.phases || [];
    const pct = z.hp / z.hpMax;
    let ph = 0;
    for (let i = 0; i < phases.length; i++) if (pct <= phases[i].hpPct) ph = i;
    if (ph > z.phase) {
      z.phase = ph;
      this._audio('boss_roar', { x: z.x, y: z.y });
      const raid = this.raid;
      if (raid.game && raid.game.camera) raid.game.camera.addShake(12);
      if (raid.game && raid.game.ui) raid.game.ui.toast(ph === 1 ? 'Der Wirt wird rasend!' : 'Der Wirt ruft seine Brut!', 'danger', 3000);
      raid.emitNoise(z.x, z.y, 1200, 'scream');
    }
  }
  _bossAbilities(z, d, dt) {
    const abil = ((z.type.phases || [])[z.phase] || { abilities: ['slam'] }).abilities || ['slam'];
    const t = z.abilityTimers;
    for (const k of Object.keys(t)) t[k] -= dt;
    if (abil.includes('summon') && t.summon <= 0) {
      t.summon = 15;
      this.spawnNearPlayer('walker', 300, 500, 3);
      this._audio('screamer', { x: z.x, y: z.y, pitch: 0.7 });
    }
    if (abil.includes('slam') && t.slam <= 0 && d < 170) {
      z.state = 'ability'; z.ability = { kind: 'slam', t: 0.7, total: 0.7 };
      return true;
    }
    if (abil.includes('charge') && t.charge <= 0 && d > 180 && d < 650 && z.seesPlayer) {
      const a = angleTo(z.x, z.y, this.player.x, this.player.y);
      z.state = 'ability'; z.ability = { kind: 'charge', t: 0.5, total: 0.5, dash: 0.9, vx: Math.cos(a), vy: Math.sin(a), hit: false };
      this._audio('boss_roar', { x: z.x, y: z.y, volume: 0.7 });
      return true;
    }
    return false;
  }
  _bossAbilityUpdate(z, d, dt) {
    const ab = z.ability, p = this.player, raid = this.raid;
    if (!ab || !p) { z.state = 'chase'; return; }
    if (ab.kind === 'slam') {
      ab.t -= dt;
      z.attackAnim = clamp(1 - ab.t / ab.total, 0, 1);
      if (ab.t <= 0) {
        if (d <= 120 + p.radius) p.takeDamage(45, { source: z.type.name || 'Boss', from: { x: z.x, y: z.y }, bleedChance: 0.3 });
        if (raid.fx) { raid.fx.explosion(z.x, z.y, 60); }
        if (raid.game && raid.game.camera) raid.game.camera.addShake(12);
        this._audio('explosion', { x: z.x, y: z.y, volume: 0.6, pitch: 0.6 });
        z.abilityTimers.slam = 6;
        z.ability = null; z.state = 'chase'; z.attackAnim = 1; z.cooldown = 0.8;
      }
      return;
    }
    if (ab.kind === 'charge') {
      if (ab.t > 0) { ab.t -= dt; z.attackAnim = clamp(1 - ab.t / ab.total, 0, 1) * 0.6; z.angle = Math.atan2(ab.vy, ab.vx); return; }
      ab.dash -= dt;
      const step = 420 * dt;
      const m = Physics.moveCircle(this.world, z.x, z.y, z.radius, ab.vx * step, ab.vy * step);
      const blocked = m.collided && Math.hypot(m.x - z.x, m.y - z.y) < step * 0.3;
      z.x = m.x; z.y = m.y;
      z.legPhase += step * 0.08;
      if (!ab.hit && dist(z.x, z.y, p.x, p.y) < z.radius + p.radius + 8) {
        ab.hit = true;
        p.takeDamage(50, { source: z.type.name || 'Boss', from: { x: z.x, y: z.y }, bleedChance: 0.5 });
        p.knock = { vx: ab.vx * 900, vy: ab.vy * 900, t: 0.2 };
        if (raid.game && raid.game.camera) raid.game.camera.addShake(14);
      }
      if (ab.dash <= 0 || blocked) {
        if (blocked && raid.game && raid.game.camera) raid.game.camera.addShake(8);
        z.abilityTimers.charge = 9;
        z.ability = null; z.state = 'chase';
        if (blocked) z.stagger = 0.6;
      }
    }
  }
}


// ===== 15_missions.js =====
// 15_missions.js — MissionSystem: availability, accept/abandon, hand-in, rewards (base side) and objective tracking,
// persistence rule §16.1, HUD lines (raid side) (SPEC §16).
// Dependencies: 00_util.js, 01/03/04 data, 10_items_inventory.js, 19_progression.js; game.profileMgr at runtime.

const MS_POI_NAMES = { crash_site: 'Absturzstelle', radio_tower: 'Funkturm', lab_entrance: 'Laboreingang', mass_grave: 'Massengrab', boss_arena: 'Versuchshalle',
  supply_drop: 'Abwurfstelle', checkpoint: 'Kontrollpunkt', server_room: 'Serverraum', water_tower: 'Wasserturm', generator: 'Generator' };

class MissionSystem {
  constructor(game) {
    this.game = game || null;
  }
  static allObjectives(def) { return [...(def.objectives || []), ...(def.optional || [])]; }

  // ---------------- base side ----------------
  _m(profile) {
    if (!profile.missions || typeof profile.missions !== 'object') profile.missions = { active: [], completed: [], progress: {} };
    const m = profile.missions;
    if (!Array.isArray(m.active)) m.active = [];
    if (!Array.isArray(m.completed)) m.completed = [];
    if (!m.progress || typeof m.progress !== 'object') m.progress = {};
    return m;
  }
  _level(profile) { return Progression.levelFromXp(profile.xp || 0); }
  _mapUnlocked(profile, mapId) {
    const lvl = this._level(profile);
    const radio = (profile.upgrades && profile.upgrades.radio) || 0;
    return Progression.unlockedMapsFor(lvl, radio).includes(mapId);
  }
  availableFor(profile) {
    if (!profile || typeof MISSIONS === 'undefined') return [];
    const m = this._m(profile);
    const done = new Set(m.completed);
    const lvl = this._level(profile);
    return MISSIONS.filter(def => {
      if (m.active.includes(def.id)) return false;
      if (done.has(def.id) && !def.repeatable) return false;
      if ((def.unlockedBy || []).some(id => !done.has(id))) return false;
      if ((def.requiresLevel || 1) > lvl) return false;
      return this._mapUnlocked(profile, def.mapId);
    });
  }
  lockedFor(profile) {
    // missions not yet available, with the German reason (radio screen preview)
    if (!profile || typeof MISSIONS === 'undefined') return [];
    const m = this._m(profile);
    const done = new Set(m.completed);
    const lvl = this._level(profile);
    const out = [];
    for (const def of MISSIONS) {
      if (m.active.includes(def.id) || (done.has(def.id) && !def.repeatable)) continue;
      const missing = (def.unlockedBy || []).filter(id => !done.has(id));
      let reason = null;
      if (missing.length) reason = 'Voraussetzung: ' + missing.map(id => (MISSION_BY_ID[id] || {}).title || id).join(', ');
      else if ((def.requiresLevel || 1) > lvl) reason = 'Ab Stufe ' + def.requiresLevel;
      else if (!this._mapUnlocked(profile, def.mapId)) reason = 'Gebiet gesperrt';
      if (reason) out.push({ def, reason });
    }
    return out;
  }
  active(profile) {
    if (!profile) return [];
    return this._m(profile).active.map(id => MISSION_BY_ID[id]).filter(Boolean);
  }
  maxActive(profile) { return 1 + ((profile && profile.upgrades && profile.upgrades.radio) || 0); }
  completed(profile) { return profile ? this._m(profile).completed.slice() : []; }
  accept(profile, missionId) {
    if (!profile) return { ok: false, reason: 'Kein Spielstand' };
    const def = MISSION_BY_ID[missionId];
    if (!def) return { ok: false, reason: 'Unbekannter Auftrag' };
    const m = this._m(profile);
    if (m.active.includes(missionId)) return { ok: false, reason: 'Bereits angenommen' };
    if (m.active.length >= this.maxActive(profile)) return { ok: false, reason: 'Maximal ' + this.maxActive(profile) + ' aktive Aufträge (Funkstation ausbauen)' };
    if (!this.availableFor(profile).some(d => d.id === missionId)) return { ok: false, reason: 'Auftrag nicht verfügbar' };
    m.active.push(missionId);
    m.progress[missionId] = m.progress[missionId] || {};
    return { ok: true, reason: null };
  }
  abandon(profile, missionId) {
    if (!profile) return false;
    const m = this._m(profile);
    const i = m.active.indexOf(missionId);
    if (i < 0) return false;
    m.active.splice(i, 1);
    delete m.progress[missionId];
    return true;
  }
  _stash(profile) {
    const pm = this.game && this.game.profileMgr;
    if (pm && pm.profile === profile && pm.stash) return pm.stash;
    return profile.stash && typeof profile.stash.count === 'function' ? profile.stash : null;
  }
  progressOf(profile, missionId) {
    const def = MISSION_BY_ID[missionId];
    if (!def || !profile) return { objectives: [], optional: [], done: false };
    const prog = this._m(profile).progress[missionId] || {};
    const map = (o) => {
      const progress = Math.min(o.count || 1, prog[o.id] || 0);
      return { def: o, progress, done: progress >= (o.count || 1) };
    };
    const objectives = (def.objectives || []).map(map);
    const optional = (def.optional || []).map(map);
    return { objectives: [...objectives, ...optional], required: objectives, optional, done: objectives.every(o => o.done) };
  }
  canHandIn(profile, missionId, objId) {
    const def = MISSION_BY_ID[missionId];
    if (!def || !profile || !this._m(profile).active.includes(missionId)) return false;
    const o = MissionSystem.allObjectives(def).find(x => x.id === objId);
    if (!o || o.type !== 'collect') return false;
    const prog = this._m(profile).progress[missionId] || {};
    const need = (o.count || 1) - (prog[o.id] || 0);
    if (need <= 0) return false;
    const stash = this._stash(profile);
    return !!stash && stash.count(o.target) >= need;
  }
  handIn(profile, missionId, objId) {
    if (!this.canHandIn(profile, missionId, objId)) return { ok: false, reason: 'Gegenstände fehlen im Lager' };
    const def = MISSION_BY_ID[missionId];
    const o = MissionSystem.allObjectives(def).find(x => x.id === objId);
    const m = this._m(profile);
    const prog = m.progress[missionId] = m.progress[missionId] || {};
    const need = (o.count || 1) - (prog[o.id] || 0);
    this._stash(profile).removeById(o.target, need);
    prog[o.id] = o.count || 1;
    const audio = this.game && this.game.audio;
    if (audio) audio.play('objective');
    let completed = false, rewards = null;
    if ((def.objectives || []).every(x => (prog[x.id] || 0) >= (x.count || 1))) {
      const optDone = (def.optional || []).length > 0 && def.optional.every(x => (prog[x.id] || 0) >= (x.count || 1));
      rewards = this._complete(profile, def, optDone);
      completed = true;
    }
    return { ok: true, completed, rewards };
  }
  _complete(profile, def, withOptional) {
    const m = this._m(profile);
    m.active = m.active.filter(id => id !== def.id);
    if (!m.completed.includes(def.id)) m.completed.push(def.id);
    delete m.progress[def.id];
    return this.grantRewards(profile, def, withOptional);
  }
  grantRewards(profile, missionDef, withOptional) {
    const r = missionDef.rewards || {};
    const o = withOptional ? (missionDef.optionalRewards || {}) : {};
    const credits = (r.credits || 0) + (o.credits || 0);
    const xp = (r.xp || 0) + (o.xp || 0);
    const items = [];
    profile.credits = (profile.credits || 0) + credits;
    if (profile.stats) profile.stats.creditsEarned = (profile.stats.creditsEarned || 0) + credits;
    const pm = this.game && this.game.profileMgr;
    const stash = this._stash(profile);
    for (const it of r.items || []) {
      const inst = Items.create(it.id, it.count || 1);
      if (!inst) continue;
      items.push({ id: it.id, count: it.count || 1 });
      if (stash) {
        const res = stash.add(inst);
        if (res.remaining) {
          const credit = Math.max(1, Math.round(Items.value(res.remaining) * (ECONOMY.overflowSellMul || 0.6)));
          profile.credits += credit;
        }
      }
    }
    if (pm && pm.profile === profile) pm.addXp(xp);
    else profile.xp = (profile.xp || 0) + xp;
    if (profile.stats) profile.stats.missionsCompleted = (profile.stats.missionsCompleted || 0) + 1;
    if (this.game && this.game.events) this.game.events.emit('missionComplete', { mission: missionDef, rewards: { credits, xp, items } });
    const audio = this.game && this.game.audio;
    if (audio) audio.play('mission_complete');
    return { credits, xp, items };
  }

  static validate() {
    const problems = [];
    if (typeof MISSIONS === 'undefined') return { ok: false, problems: ['MISSIONS fehlt'] };
    const buildingTypes = ['house', 'apartment', 'shop', 'supermarket', 'pharmacy', 'garage', 'barracks', 'armory', 'warehouse', 'checkpoint', 'hq', 'factory', 'workshop', 'storage', 'office', 'lab', 'security', 'medical', 'server', 'bunker'];
    const containerTypes = typeof CONTAINER_NAMES !== 'undefined' ? Object.keys(CONTAINER_NAMES) : ['crate', 'locker', 'fridge', 'desk', 'medcabinet', 'safe', 'military_crate', 'toolbox', 'weapon_rack', 'server_rack', 'lab_cabinet', 'body'];
    const poiTypes = Object.keys(MS_POI_NAMES);
    const ids = new Set(MISSIONS.map(m => m.id));
    for (const m of MISSIONS) {
      const map = MAPS[m.mapId];
      if (!map) problems.push(m.id + ': unbekannte Karte ' + m.mapId);
      for (const u of m.unlockedBy || []) if (!ids.has(u)) problems.push(m.id + ': unbekannte Voraussetzung ' + u);
      const oids = new Set();
      for (const o of MissionSystem.allObjectives(m)) {
        if (oids.has(o.id)) problems.push(m.id + ': doppelte Ziel-ID ' + o.id);
        oids.add(o.id);
        if (!(o.count >= 1)) problems.push(m.id + '/' + o.id + ': count < 1');
        const t = o.target;
        let ok = true;
        switch (o.type) {
          case 'collect': case 'retrieve': case 'find_key': ok = !!ITEMS[t]; break;
          case 'kill': ok = t === 'any' || !!ZOMBIE_TYPES[t]; break;
          case 'kill_boss': ok = !!(map && map.boss); break;
          case 'search': ok = buildingTypes.includes(t) || containerTypes.includes(t); break;
          case 'investigate': ok = poiTypes.includes(t); break;
          case 'generator': ok = t === 'generator'; break;
          case 'extract_at': ok = !!(map && (map.extractions || []).some(e => e.id === t)); break;
          case 'rescue_medical': ok = t === 'medical'; break;
          default: ok = false;
        }
        if (!ok) problems.push(m.id + '/' + o.id + ': ungültiges Ziel ' + o.type + ':' + t);
      }
      for (const it of (m.rewards && m.rewards.items) || []) if (!ITEMS[it.id]) problems.push(m.id + ': unbekannte Belohnung ' + it.id);
    }
    return { ok: problems.length === 0, problems };
  }

  // ---------------- raid side ----------------
  startRaid(raid, missionDefs) {
    const profile = this.game && this.game.profileMgr ? this.game.profileMgr.profile : null;
    const prog = profile ? this._m(profile).progress : {};
    raid.missionStates = (missionDefs || []).filter(Boolean).map(def => {
      const p = prog[def.id] || {};
      const mk = (o, optional) => ({ def: o, progress: Math.min(o.count || 1, p[o.id] || 0), done: (p[o.id] || 0) >= (o.count || 1), optional });
      const st = { def, objectives: (def.objectives || []).map(o => mk(o, false)), optional: (def.optional || []).map(o => mk(o, true)), done: false, optionalDone: false };
      return st;
    });
    if (raid.events) {
      for (const name of ['kill', 'containerOpened', 'itemPicked', 'poiReached', 'generatorOn', 'bossDead', 'extracted']) {
        raid.events.on(name, (data) => this.onEvent(raid, name, data));
      }
    }
    return raid.missionStates;
  }

  _advance(raid, st, o, amount, absolute = false) {
    if (o.done) return;
    const before = o.progress;
    o.progress = Math.min(o.def.count || 1, absolute ? Math.max(o.progress, amount) : o.progress + amount);
    if (o.progress >= (o.def.count || 1)) {
      o.done = true;
      if (raid.events) raid.events.emit('objectiveComplete', { mission: st.def, objective: o.def });
      const ui = raid.game && raid.game.ui;
      if (ui) ui.toast('Ziel erfüllt: ' + o.def.text, 'success', 3000);
      const audio = raid.game && raid.game.audio;
      if (audio) audio.play('objective');
      st.done = st.objectives.every(x => x.done);
      st.optionalDone = st.optional.length > 0 && st.optional.every(x => x.done);
    } else if (o.progress !== before && raid.game && raid.game.ui && ['kill', 'search'].includes(o.def.type)) {
      raid.game.ui.toast(o.def.text + ' (' + o.progress + '/' + (o.def.count || 1) + ')', 'info', 1500);
    }
  }

  onEvent(raid, name, data) {
    for (const st of raid.missionStates || []) {
      for (const o of [...st.objectives, ...st.optional]) {
        if (o.done) continue;
        const d = o.def;
        if (name === 'kill' && d.type === 'kill' && data && data.zombie) {
          if (d.target === 'any' || d.target === data.zombie.id) this._advance(raid, st, o, 1);
        } else if (name === 'containerOpened' && d.type === 'search' && data && data.container) {
          const c = data.container;
          if (c.buildingType === d.target || c.type === d.target) this._advance(raid, st, o, 1);
        } else if (name === 'itemPicked' && d.type === 'find_key' && data && data.inst && data.inst.id === d.target) {
          this._advance(raid, st, o, 1);
        } else if (name === 'poiReached' && d.type === 'investigate' && data && data.poi && data.poi.type === d.target) {
          this._advance(raid, st, o, 1);
        } else if (name === 'generatorOn' && d.type === 'generator') {
          this._advance(raid, st, o, 1);
        } else if (name === 'bossDead' && d.type === 'kill_boss') {
          this._advance(raid, st, o, 1);
        } else if (name === 'extracted' && data) {
          if (d.type === 'extract_at' && data.extractionId === d.target) this._advance(raid, st, o, 1);
          else if (d.type === 'retrieve' || d.type === 'collect' || d.type === 'rescue_medical') {
            const invs = [data.inventory, data.secure].filter(Boolean);
            let n = 0;
            for (const inv of invs) for (const it of inv.all()) {
              if (!it.raidFound) continue;
              if (d.type === 'rescue_medical') { const def = Items.def(it); if (def && def.cat === 'medical') n += it.count; }
              else if (it.id === d.target) n += it.count;
            }
            if (n > 0) this._advance(raid, st, o, Math.min(n, (d.count || 1) - o.progress));
          }
        }
      }
    }
  }

  _consume(invs, id, count, catMedical) {
    let need = count;
    for (const inv of invs) {
      for (let i = inv.slots - 1; i >= 0 && need > 0; i--) {
        const it = inv.items[i];
        if (!it || !it.raidFound) continue;
        if (catMedical) { const d = Items.def(it); if (!d || d.cat !== 'medical') continue; }
        else if (it.id !== id) continue;
        const take = Math.min(need, it.count);
        it.count -= take; need -= take;
        if (it.count <= 0) inv.items[i] = null;
      }
    }
  }

  finalizeOnExtract(raid, profile) {
    const res = { completed: [], objectivesDone: 0, rewards: { credits: 0, xp: 0, items: [] }, failed: [] };
    if (!profile) return res;
    const m = this._m(profile);
    const persistTypes = ['kill', 'search', 'investigate', 'generator', 'find_key', 'kill_boss'];
    const pm = this.game && this.game.profileMgr;
    const invs = [];
    if (pm && pm.stash) invs.push(pm.stash);
    for (const st of raid.missionStates || []) {
      const id = st.def.id;
      if (!m.active.includes(id)) continue;
      const prog = m.progress[id] = m.progress[id] || {};
      for (const o of [...st.objectives, ...st.optional]) {
        if (persistTypes.includes(o.def.type)) prog[o.def.id] = Math.max(prog[o.def.id] || 0, o.progress);
        else if (o.done) prog[o.def.id] = o.def.count || 1;
        if (o.done) res.objectivesDone++;
      }
      const allDone = (st.def.objectives || []).every(o => (prog[o.id] || 0) >= (o.count || 1));
      if (allDone) {
        // consume delivered retrieve / collect / medical items from the stash (they were moved there by applyRaidResult)
        for (const o of st.objectives.concat(st.optional)) {
          if (!o.done) continue;
          if (o.def.type === 'retrieve' || o.def.type === 'collect') this._consume(invs, o.def.target, o.def.count || 1, false);
          else if (o.def.type === 'rescue_medical') this._consume(invs, null, o.def.count || 1, true);
        }
        const optDone = (st.def.optional || []).length > 0 && st.def.optional.every(o => (prog[o.id] || 0) >= (o.count || 1));
        const r = this._complete(profile, st.def, optDone);
        res.completed.push(st.def);
        res.rewards.credits += r.credits; res.rewards.xp += r.xp; res.rewards.items.push(...r.items);
      }
    }
    return res;
  }

  finalizeOnDeath(raid, profile) {
    const res = { completed: [], objectivesDone: 0, rewards: { credits: 0, xp: 0, items: [] }, failed: [] };
    if (!profile) return res;
    const m = this._m(profile);
    for (const st of raid.missionStates || []) if (m.active.includes(st.def.id)) res.failed.push(st.def);
    if (profile.stats) profile.stats.missionsFailed = (profile.stats.missionsFailed || 0) + res.failed.length;
    return res;
  }

  hudLines(raid) {
    const out = [];
    for (const st of raid.missionStates || []) {
      for (const o of st.objectives) out.push({ text: o.def.text + ((o.def.count || 1) > 1 ? ' (' + o.progress + '/' + o.def.count + ')' : ''), done: o.done, optional: false, mission: st.def.title });
      for (const o of st.optional) out.push({ text: o.def.text + ((o.def.count || 1) > 1 ? ' (' + o.progress + '/' + o.def.count + ')' : ''), done: o.done, optional: true, mission: st.def.title });
    }
    return out;
  }
}


// ===== 16_extraction.js =====
// 16_extraction.js — ExtractionSystem: activation rules per kind, countdown, cancel/decay, horde hazard,
// required-item consumption, German HUD/prompt texts, events (SPEC §17).
// Dependencies: 00_util.js, 10_items_inventory.js; raid subsystems at runtime.

class ExtractionSystem {
  constructor(raid) {
    this.raid = raid;
    this.points = (raid && raid.world ? raid.world.extractions : []);
    for (const p of this.points) {
      p.active = false; p.state = 'idle'; p.progress = 0; p.hazardTimer = 0; p.lockReason = ''; p.tick = 0;
      if (!p.radius) p.radius = 72;
    }
    this._current = null;
  }
  _ui() { return this.raid && this.raid.game && this.raid.game.ui; }
  _audio(name, opts) { const a = this.raid && this.raid.game && this.raid.game.audio; if (a) a.play(name, opts); }
  _itemName(id) { const d = Items.def(id); return d ? d.name : id; }

  _evaluate(p) {
    const raid = this.raid, pl = raid.player;
    const has = (id) => !!pl && ((pl.inventory && pl.inventory.has(id)) || (pl.secure && pl.secure.has(id)));
    p.lockReason = '';
    switch (p.kind) {
      case 'always': return true;
      case 'timed': {
        const w = p.window || [0, Infinity];
        if (raid.time < w[0]) { p.lockReason = 'öffnet in ' + formatTime(w[0] - raid.time); return false; }
        if (raid.time > w[1]) { p.lockReason = 'Hubschrauber abgeflogen'; return false; }
        return true;
      }
      case 'key': case 'fuel':
        if (has(p.requires)) return true;
        p.lockReason = 'Benötigt: ' + this._itemName(p.requires);
        return false;
      case 'power':
        if (raid.flags && raid.flags.generatorOn) return true;
        p.lockReason = 'Strom nötig (Generator)';
        return false;
      default: return true;
    }
  }

  update(dt) {
    const raid = this.raid, pl = raid && raid.player;
    if (!raid || !pl || pl.dead || raid.ended) return;
    this._current = null;
    for (const p of this.points) {
      if (p.state === 'done') continue;
      const wasActive = p.active;
      p.active = this._evaluate(p);
      const inside = dist(pl.x, pl.y, p.x, p.y) <= p.radius;
      if (p.kind === 'timed' && !p.active && raid.time > (p.window || [0, Infinity])[1]) {
        if (p.state !== 'locked' && wasActive && raid.game && raid.game.ui) raid.game.ui.toast(p.name + ': Hubschrauber abgeflogen', 'warning');
      }
      if (p.state === 'extracting') {
        if (!inside || !p.active) {
          p.state = !p.active && p.kind === 'timed' && raid.time > (p.window || [0, Infinity])[1] ? 'locked' : 'idle';
          const reason = !inside ? 'left' : 'inactive';
          raid.events.emit('extractionCancel', { point: p, reason });
          const ui = this._ui();
          if (ui) ui.toast(reason === 'left' ? 'Extraktion abgebrochen – Zone verlassen' : 'Extraktion abgebrochen – Fenster geschlossen', 'warning');
          this._audio('ui_error');
          continue;
        }
        p.progress += dt;
        p.tick += dt;
        if (p.tick >= 1) { p.tick -= 1; this._audio('extract_tick', { volume: 0.7 }); }
        if (p.hazard === 'horde' && raid.zombies) {
          p.hazardTimer -= dt;
          if (p.hazardTimer <= 0) {
            p.hazardTimer = 3;
            const n = raid.zombies.rng.int(1, 2);
            const zs = raid.zombies.spawnNearPlayer(raid.zombies.rng.chance(0.5) ? 'runner' : 'walker', 400, 700, n);
            for (const z of zs) { z.state = 'chase'; z.alert = 1; z.lastSeen = { x: pl.x, y: pl.y, t: raid.time }; }
          }
        }
        this._current = p;
        if (p.progress >= p.duration) { this._complete(p); return; }
        continue;
      }
      if (!p.active && p.kind === 'timed' && raid.time > (p.window || [0, Infinity])[1]) p.state = 'locked';
      if (inside && p.active) {
        p.state = 'extracting';
        p.tick = 0; p.hazardTimer = 1.5;
        raid.events.emit('extractionStart', { point: p });
        this._audio('extract_start');
        const ui = this._ui();
        if (ui) ui.toast('Extraktion läuft: ' + p.name + (p.hazard === 'horde' ? ' – der Lärm lockt Zombies an!' : ''), 'info', 3000);
        if (p.hazard === 'horde') { this._audio('alarm', { x: p.x, y: p.y }); raid.emitNoise(p.x, p.y, 1200, 'alarm'); }
        this._current = p;
      } else if (p.progress > 0) {
        p.progress = Math.max(0, p.progress - 2 * dt);
      }
    }
  }

  _complete(p) {
    const raid = this.raid, pl = raid.player;
    if ((p.kind === 'key' || p.kind === 'fuel') && p.requires) {
      if (!pl.inventory.removeById(p.requires, 1)) pl.secure.removeById(p.requires, 1);
    }
    p.state = 'done';
    this._audio('extract_done');
    const ui = this._ui();
    if (ui) ui.toast('Extraktion erfolgreich: ' + p.name, 'success', 3000);
    raid.events.emit('extractionDone', { point: p });
    raid.onExtracted(p);
  }

  current() {
    const p = this._current;
    return p ? { point: p, progress: p.progress, duration: p.duration } : null;
  }
  nearestInfo(x, y) {
    let best = null, bd = Infinity;
    for (const p of this.points) { const d = dist(x, y, p.x, p.y); if (d < bd) { bd = d; best = p; } }
    return best ? { point: best, dist: bd } : null;
  }
  hudText() {
    const c = this.current();
    if (c) return 'Extraktion: ' + c.point.name + ' ' + Math.max(0, Math.ceil(c.duration - c.progress)) + ' s';
    const pl = this.raid && this.raid.player;
    if (!pl) return '';
    const active = this.points.filter(p => p.active && p.state !== 'done');
    if (active.length) {
      let best = null, bd = Infinity;
      for (const p of active) { const d = dist(pl.x, pl.y, p.x, p.y); if (d < bd) { bd = d; best = p; } }
      return 'Extraktion offen: ' + best.name + ' (' + Math.round(bd / TILE) + ' m)';
    }
    const timed = this.points.find(p => p.kind === 'timed' && p.lockReason.startsWith('öffnet'));
    if (timed) return timed.name + ' ' + timed.lockReason;
    const n = this.nearestInfo(pl.x, pl.y);
    return n ? n.point.name + ': ' + (n.point.lockReason || 'gesperrt') : '';
  }
  promptFor(point) {
    if (!point) return '';
    if (point.active) return 'Bleib in der Zone, um zu extrahieren';
    return point.name + ' – ' + (point.lockReason || 'gesperrt');
  }
}


// ===== 17_raid.js =====
// 17_raid.js — RaidManager: owns one raid (world, nav, player, zombies, weapons, loot, extraction, fx), runs the
// fixed update order, interaction, containers, doors, hazards, POI timers, day/night and the end sequence (SPEC §18).
// Public top-level functions: darknessForHour(h), formatHour(h).
// Dependencies: everything in 00–16, 18 (ProfileManager via game), 21 (FX) at runtime.

function darknessForHour(h) {
  h = ((Number(h) || 0) % 24 + 24) % 24;
  if (h >= 8 && h < 17) return 0.08;
  if (h >= 17 && h < 20) return lerp(0.08, 0.85, (h - 17) / 3);
  if (h >= 5 && h < 8) return lerp(0.85, 0.08, (h - 5) / 3);
  return 0.85;
}

function formatHour(h) {
  h = ((Number(h) || 0) % 24 + 24) % 24;
  const hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
  return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
}

const RAID_DOOR_PROMPTS = { open: 'E – Tür schließen', closed: 'E – Tür öffnen', locked: 'E – Verschlossene Tür (Laborkarte)' };

class RaidManager {
  constructor(game) {
    this.game = game;
    this.world = null; this.nav = null; this.hash = null; this.player = null; this.zombies = null; this.weapons = null;
    this.loot = null; this.extraction = null; this.fx = null; this.events = new EventBus();
    this.rng = null; this.seed = 0; this.mapId = null; this.map = null; this.missionStates = [];
    this.xp = 0; this.time = 0; this.timeLimit = 1500; this.hour = 12; this.darkness = 0;
    this.flags = { generatorOn: false, bossKilled: false };
    this.hazards = []; this.grenades = []; this.noiseMarkers = [];
    this.ended = false; this.result = null; this.paused = false;
    this.navTimer = 0;
    this.warned = { 300: false, 60: false };
    this.hazardTick = 0;
  }

  start({ mapId, missionIds = [], seed, loadout }) {
    const map = (typeof MAPS !== 'undefined' && MAPS[mapId]) || MAPS.city;
    this.mapId = map.id; this.map = map;
    this.seed = (typeof seed === 'number' && Number.isFinite(seed)) ? seed >>> 0 : hashString(String(seed));
    this.rng = new RNG(this.seed);
    const defs = (missionIds || []).map(id => MISSION_BY_ID[id]).filter(d => d && d.mapId === map.id);
    this.missionIds = defs.map(d => d.id);
    this.world = WorldGenerator.generate(map.id, this.seed, defs);
    this.nav = new Nav(this.world);
    this.hash = new SpatialHash(96);
    this.fx = new FX(this);
    this.loot = new LootSystem(this);
    this.zombies = new ZombieAI(this);
    this.weapons = new WeaponSystem(this);
    this.player = new Player(this, loadout || {});
    this.player.x = this.world.playerSpawn.x;
    this.player.y = this.world.playerSpawn.y;
    // face the map centre
    this.player.angle = angleTo(this.player.x, this.player.y, this.world.pixelW / 2, this.world.pixelH / 2);
    if (this.game && this.game.input) this.game.input.lastAim = this.player.angle;
    this.zombies.spawnInitial(this.world);
    this.extraction = new ExtractionSystem(this);
    if (this.game && this.game.missions) this.game.missions.startRaid(this, defs);
    this.time = 0;
    this.timeLimit = map.raidDuration || 1500;
    this.hour = Number.isFinite(map.startHour) ? map.startHour : 12;
    this.darkness = darknessForHour(this.hour);
    this.flags = { generatorOn: false, bossKilled: false };
    this.navTimer = 0;
    this.nav.rebuild(this.player.x, this.player.y, 60);
    const cam = this.game && this.game.camera;
    if (cam) { cam.setBounds(this.world.pixelW, this.world.pixelH); cam.snap(this.player.x, this.player.y); }
    const audio = this.game && this.game.audio;
    if (audio) { audio.startAmbient(map.id); audio.setListener(this.player.x, this.player.y); }
    return this;
  }

  get input() { return this.game && this.game.input; }

  darknessAt(x, y) {
    return clamp(this.darkness + (this.world && this.world.isIndoor(x, y) ? 0.35 : 0), 0, 0.92);
  }

  update(dt) {
    if (this.ended || !this.world) return;
    dt = Math.min(dt, 0.1);
    // 1. time
    this.time += dt;
    this.hour = ((this.map.startHour || 0) + this.time * 10 / this.timeLimit) % 24;
    this.darkness = darknessForHour(this.hour);
    // 2. spatial hash
    this.hash.clear();
    for (const z of this.zombies.zombies) if (!z.dead) this.hash.insert(z);
    // 3–6
    this.player.update(dt, this.input);
    if (this.ended) return;
    this.weapons.update(dt);
    if (this.ended) return;
    this.zombies.update(dt);
    if (this.ended) return;
    this.extraction.update(dt);
    if (this.ended) return;
    // 7. hazards and toxic tiles
    this._hazards(dt);
    if (this.ended) return;
    // 8. POIs and generator
    this._pois(dt);
    // 9. flow field
    if ((this.navTimer += dt) >= 0.4) { this.navTimer = 0; this.nav.rebuild(this.player.x, this.player.y, 60); }
    // 10. fx, camera, audio, noise markers
    this.fx.update(dt);
    const cam = this.game && this.game.camera;
    if (cam) {
      const la = 60;
      cam.follow(this.player.x, this.player.y, dt, Math.cos(this.player.angle) * la, Math.sin(this.player.angle) * la);
      cam.update(dt);
    }
    const audio = this.game && this.game.audio;
    if (audio) audio.setListener(this.player.x, this.player.y);
    for (let i = this.noiseMarkers.length - 1; i >= 0; i--) { this.noiseMarkers[i].ttl -= dt; if (this.noiseMarkers[i].ttl <= 0) this.noiseMarkers.splice(i, 1); }
    // 11. timer
    const left = this.timeLimit - this.time;
    const ui = this.game && this.game.ui;
    if (left <= 300 && !this.warned[300]) { this.warned[300] = true; if (ui) ui.toast('Noch 5 Minuten bis zum Ende des Einsatzes', 'warning', 4000); if (audio) audio.play('warning'); }
    if (left <= 60 && !this.warned[60]) { this.warned[60] = true; if (ui) ui.toast('Noch 60 Sekunden – sofort extrahieren!', 'danger', 4000); if (audio) audio.play('warning'); }
    if (left <= 0) this.onTimeout();
  }

  _hazards(dt) {
    const p = this.player;
    for (let i = this.hazards.length - 1; i >= 0; i--) {
      const h = this.hazards[i];
      h.timer += dt;
      if (h.timer >= h.duration) { this.hazards.splice(i, 1); continue; }
      if (h.kind === 'fire' && this.fx) this.fx.fire(h.x, h.y, h.r);
      if (h.kind === 'toxic' && this.fx && Math.floor(h.timer * 3) !== Math.floor((h.timer - dt) * 3)) this.fx.toxicCloud(h.x, h.y, h.r * 0.5);
      const inside = dist(p.x, p.y, h.x, h.y) <= h.r;
      if (inside && !p.dead) {
        if (h.kind === 'toxic') {
          p._drainTick = (p._drainTick || 0) + dt;
          p.toxic = Math.max(p.toxic, 3);
          this._damageOverTime(p, 3 * dt, 'Vergiftung');
        } else if (h.kind === 'fire') {
          this._damageOverTime(p, 8 * dt, 'Feuer');
        }
      }
      if (h.kind === 'fire') {
        for (const z of this.zombies.inRadius(h.x, h.y, h.r)) this.zombies.damage(z, 18 * dt, { pen: 3, source: 'fire' });
      }
    }
    // toxic floor tiles
    if (!p.dead && this.world.tile(Math.floor(p.x / TILE), Math.floor(p.y / TILE)) === T.TOXIC) {
      p.toxic = Math.max(p.toxic, 2);
      this._damageOverTime(p, 2 * dt, 'Vergiftung');
      this.hazardTick += dt;
      if (this.hazardTick > 1.2) { this.hazardTick = 0; const a = this.game && this.game.audio; if (a) a.play('toxic', { volume: 0.5 }); }
    }
  }

  _damageOverTime(p, amount, source) {
    if (p.god || p.dead) return;
    p.hp -= amount;
    p.stats.damageTaken += amount;
    if (this.fx) this.fx.damageFlash(0.15);
    if (p.hp <= 0) { p.hp = 0; p.causeOfDeath = source; p.die(); }
  }

  _pois(dt) {
    const p = this.player;
    let shownHold = false;
    for (const poi of this.world.pois) {
      if (poi.used || poi.type === 'generator') continue;
      const inside = dist(p.x, p.y, poi.x, poi.y) <= (poi.radius || 64);
      // only POIs relevant to an active objective run the timer
      const relevant = (this.missionStates || []).some(st => [...st.objectives, ...st.optional].some(o => !o.done && o.def.type === 'investigate' && o.def.target === poi.type));
      if (!relevant) continue;
      if (inside) {
        poi.timer += dt;
        p.holdProgress = clamp(poi.timer / 5, 0, 1);
        p.holdLabel = 'Gebiet untersuchen …';
        shownHold = true;
        if (poi.timer >= 5) {
          poi.used = true;
          p.holdProgress = 0;
          this.events.emit('poiReached', { poi });
        }
      } else poi.timer = Math.max(0, poi.timer - dt);
    }
    // generator hold
    const it = p.interactTarget;
    const input = this.input;
    if (it && it.kind === 'poi' && it.ref && it.ref.type === 'generator' && !this.flags.generatorOn && input && input.isDown('interact')) {
      p.holdProgress += dt / 4;
      p.holdLabel = 'Generator starten …';
      shownHold = true;
      if (p.holdProgress >= 1) {
        p.holdProgress = 0;
        this.flags.generatorOn = true;
        it.ref.used = true;
        this.events.emit('generatorOn');
        const ui = this.game && this.game.ui;
        if (ui) ui.toast('Generator läuft – Strom ist wieder da', 'success', 3000);
        const audio = this.game && this.game.audio;
        if (audio) audio.play('alarm', { x: it.ref.x, y: it.ref.y });
        this.emitNoise(it.ref.x, it.ref.y, 500, 'alarm');
        // power brings the lights back on
        for (const l of this.world.lights) if (l.indoor) l.flicker = false;
      }
    } else if (!shownHold) {
      p.holdProgress = 0;
      p.holdLabel = null;
    }
  }

  emitNoise(x, y, radius, kind = 'shot') {
    if (!(radius > 0)) return;
    if (this.zombies) this.zombies.onNoise(x, y, radius, kind);
    if (kind !== 'step') {
      this.noiseMarkers.push({ x, y, radius, kind, ttl: 1.2 });
      if (this.noiseMarkers.length > 40) this.noiseMarkers.shift();
    }
    this.events.emit('noise', { x, y, radius, kind });
  }

  addHazard(h) {
    if (!h) return;
    this.hazards.push({ kind: h.kind || 'toxic', x: h.x, y: h.y, r: h.r || 60, duration: h.duration || 6, timer: 0 });
    if (this.hazards.length > 40) this.hazards.shift();
  }

  // ---------------- interaction ----------------
  findInteractable(x, y, maxDist = 56) {
    const w = this.world;
    const cands = [];
    const prio = { container: 0, loot: 1, body: 2, door: 3, poi: 4, extraction: 5 };
    for (const c of w.containers) {
      const d = dist(x, y, c.x, c.y);
      if (d > maxDist) continue;
      if (!Physics.lineOfSight(w, x, y, c.x, c.y)) continue;
      const name = (typeof CONTAINER_NAMES !== 'undefined' && CONTAINER_NAMES[c.type]) || 'Behälter';
      const kind = c.type === 'body' ? 'body' : 'container';
      const verb = c.type === 'body' ? 'durchsuchen' : (c.opened ? 'öffnen' : 'durchsuchen');
      cands.push({ kind, ref: c, x: c.x, y: c.y, dist: d, prompt: 'E – ' + name + ' ' + verb + (c.opened && c.items && !c.items.some(Boolean) ? ' (leer)' : ''), hold: false });
    }
    for (const fl of w.floorLoot) {
      const d = dist(x, y, fl.x, fl.y);
      if (d > maxDist) continue;
      const def = Items.def(fl.inst);
      cands.push({ kind: 'loot', ref: fl, x: fl.x, y: fl.y, dist: d, prompt: 'E – ' + (def ? def.name : 'Gegenstand') + (fl.inst.count > 1 ? ' ×' + fl.inst.count : '') + ' aufheben', hold: false });
    }
    // doors in the 3×3 tiles around
    const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const t = w.tile(tx + dx, ty + dy);
      if (!tileIsDoor(t)) continue;
      const cx = (tx + dx + 0.5) * TILE, cy = (ty + dy + 0.5) * TILE;
      const d = dist(x, y, cx, cy);
      if (d > maxDist) continue;
      const prompt = t === T.DOOR_OPEN ? RAID_DOOR_PROMPTS.open : t === T.DOOR_LOCKED ? RAID_DOOR_PROMPTS.locked : RAID_DOOR_PROMPTS.closed;
      cands.push({ kind: 'door', ref: { tx: tx + dx, ty: ty + dy }, x: cx, y: cy, dist: d, prompt, hold: false });
    }
    for (const poi of w.pois) {
      if (poi.type !== 'generator') continue;
      const d = dist(x, y, poi.x, poi.y);
      if (d > maxDist) continue;
      cands.push({ kind: 'poi', ref: poi, x: poi.x, y: poi.y, dist: d, prompt: this.flags.generatorOn ? 'Generator läuft' : 'E halten – Generator starten', hold: !this.flags.generatorOn });
    }
    if (this.extraction) {
      for (const p of this.extraction.points) {
        const d = dist(x, y, p.x, p.y);
        if (d > p.radius || p.active || p.state === 'done') continue;
        cands.push({ kind: 'extraction', ref: p, x: p.x, y: p.y, dist: d + 40, prompt: this.extraction.promptFor(p), hold: false });
      }
    }
    if (!cands.length) return null;
    cands.sort((a, b) => (Math.abs(a.dist - b.dist) <= 8 ? prio[a.kind] - prio[b.kind] : a.dist - b.dist));
    return cands[0];
  }

  interact(it) {
    if (!it || this.ended) return;
    const ui = this.game && this.game.ui;
    switch (it.kind) {
      case 'container': case 'body': this.openContainer(it.ref); break;
      case 'door': {
        const t = this.world.tile(it.ref.tx, it.ref.ty);
        if (t === T.DOOR_LOCKED) {
          const p = this.player;
          if (p.inventory.has('key_lab_card') || p.secure.has('key_lab_card')) {
            this.world.setTile(it.ref.tx, it.ref.ty, T.DOOR_OPEN);
            const b = this.world.buildingAt((it.ref.tx + 0.5) * TILE, (it.ref.ty + 0.5) * TILE);
            if (b) b.locked = false;
            if (ui) ui.toast('Laborkarte akzeptiert – Tür entriegelt', 'success');
            const a = this.game.audio; if (a) a.play('door_open', { x: it.x, y: it.y });
            this.events.emit('doorToggled', { tx: it.ref.tx, ty: it.ref.ty, open: true });
            this.emitNoise(it.x, it.y, 300, 'door');
          } else {
            if (ui) ui.toast('Verschlossen – Laborkarte nötig', 'warning');
            const a = this.game && this.game.audio; if (a) a.play('ui_error');
          }
        } else this.toggleDoor(it.ref.tx, it.ref.ty, false);
        break;
      }
      case 'loot': this.pickFloorLoot(it.ref); break;
      case 'extraction': if (ui) ui.toast(this.extraction.promptFor(it.ref), 'info'); break;
      default: break;
    }
  }

  openContainer(c) {
    if (!c) return;
    if (c.items === null || c.items === undefined) this.loot.rollContainer(c, this.world);
    if (!c.opened) {
      c.opened = true;
      this.player.stats.containersOpened++;
      this.events.emit('containerOpened', { container: c });
    }
    const a = this.game && this.game.audio;
    if (a) a.play('loot_open', { x: c.x, y: c.y });
    this.emitNoise(c.x, c.y, 70, 'step');
    if (this.game && this.game.ui) this.game.ui.openLoot(c);
  }

  takeFromContainer(c, idx, count = Infinity) {
    if (!c || !Array.isArray(c.items)) return { ok: false, remaining: null };
    const inst = c.items[idx];
    if (!inst) return { ok: false, remaining: null };
    const p = this.player;
    let part = inst;
    const takeAll = !(count < inst.count);
    if (!takeAll) { part = Items.clone(inst); part.count = Math.max(1, Math.floor(count)); }
    const before = part.count;
    part.raidFound = true;
    const r = p.inventory.add(part);
    const taken = before - (r.remaining ? r.remaining.count : 0);
    if (taken > 0) {
      const takenPart = Items.clone(part); takenPart.count = taken;
      p.stats.lootValue += Items.value(takenPart);
      if (takeAll) {
        if (r.remaining) c.items[idx] = r.remaining; else c.items[idx] = null;
      } else {
        inst.count -= taken;
        if (inst.count <= 0) c.items[idx] = null;
      }
      this.events.emit('itemPicked', { inst: takenPart, source: 'container' });
      const a = this.game && this.game.audio; if (a) a.play('pickup', { volume: 0.6 });
    }
    return { ok: taken > 0 && !r.remaining, remaining: r.remaining || null, taken };
  }

  takeAll(c) {
    if (!c || !Array.isArray(c.items)) return 0;
    let n = 0, left = false;
    for (let i = 0; i < c.items.length; i++) {
      if (!c.items[i]) continue;
      const r = this.takeFromContainer(c, i);
      if (r.taken > 0) n++;
      if (r.remaining) left = true;
    }
    c.items = c.items.filter(Boolean);
    if (left) {
      const ui = this.game && this.game.ui; if (ui) ui.toast('Inventar voll', 'warning');
      const a = this.game && this.game.audio; if (a) a.play('ui_error');
    }
    return n;
  }

  putIntoContainer(c, inst) {
    if (!c || !inst) return false;
    if (!Array.isArray(c.items)) c.items = [];
    for (const it of c.items) {
      if (it && Items.canStack(it, inst) && it.count < Items.stackMax(it)) {
        const mv = Math.min(inst.count, Items.stackMax(it) - it.count);
        it.count += mv; inst.count -= mv;
        if (inst.count <= 0) return true;
      }
    }
    if (c.items.filter(Boolean).length >= 12) return false;
    c.items.push(inst);
    return true;
  }

  toggleDoor(tx, ty, byZombie = false) {
    const t = this.world.tile(tx, ty);
    if (t !== T.DOOR_CLOSED && t !== T.DOOR_OPEN) return false;
    const open = t === T.DOOR_CLOSED;
    if (!open && !byZombie) {
      // do not close a door on someone standing in it
      const cx = (tx + 0.5) * TILE, cy = (ty + 0.5) * TILE;
      if (dist(this.player.x, this.player.y, cx, cy) < this.player.radius + 14) return false;
      if (this.zombies.inRadius(cx, cy, 14).length) return false;
    }
    this.world.setTile(tx, ty, open ? T.DOOR_OPEN : T.DOOR_CLOSED);
    const a = this.game && this.game.audio;
    const x = (tx + 0.5) * TILE, y = (ty + 0.5) * TILE;
    if (a) a.play(byZombie ? 'melee_hit' : (open ? 'door_open' : 'door_close'), { x, y });
    if (byZombie && this.fx) this.fx.impact(x, y, 0, T.DOOR_CLOSED);
    this.emitNoise(x, y, byZombie ? 350 : 200, 'door');
    this.events.emit('doorToggled', { tx, ty, open });
    return true;
  }

  dropItem(inst, x, y) {
    if (!inst) return null;
    const w = this.world;
    let px = x, py = y;
    for (let k = 0; k < 6; k++) {
      const a = this.rng.float(0, Math.PI * 2), r = this.rng.float(0, 20);
      const nx = x + Math.cos(a) * r, ny = y + Math.sin(a) * r;
      if (w.isWalkable(Math.floor(nx / TILE), Math.floor(ny / TILE))) { px = nx; py = ny; break; }
    }
    if (!w.isWalkable(Math.floor(px / TILE), Math.floor(py / TILE)) && this.player) { px = this.player.x; py = this.player.y; }
    const fl = { uid: Uid.next(), inst, x: px, y: py };
    w.floorLoot.push(fl);
    if (w.floorLoot.length > 300) w.floorLoot.shift();
    return fl;
  }

  pickFloorLoot(fl) {
    const w = this.world;
    if (!fl || !w.floorLoot.includes(fl)) return { picked: 0, remaining: 0 };
    const p = this.player;
    const inst = fl.inst;
    const before = inst.count;
    inst.raidFound = true;
    const r = p.inventory.add(inst);
    const picked = before - (r.remaining ? r.remaining.count : 0);
    const ui = this.game && this.game.ui;
    const a = this.game && this.game.audio;
    if (!r.remaining) w.floorLoot.splice(w.floorLoot.indexOf(fl), 1);
    else {
      fl.inst = r.remaining;
      if (ui) ui.toast('Inventar voll', 'warning');
      if (a) a.play('ui_error');
    }
    if (picked > 0) {
      const part = Items.clone(inst); part.count = picked;
      p.stats.lootValue += Items.value(part);
      this.events.emit('itemPicked', { inst: part, source: 'floor' });
      if (a) a.play('pickup', { volume: 0.7 });
      const def = Items.def(inst);
      if (ui) ui.toast('+' + picked + ' ' + (def ? def.name : ''), 'success', 1400);
    }
    return { picked, remaining: r.remaining ? r.remaining.count : 0 };
  }

  addXp(n) { if (Number.isFinite(n) && n > 0) this.xp += n; }

  onPlayerDeath() { if (!this.ended) this.end('death'); }
  onTimeout() {
    if (this.ended) return;
    const ui = this.game && this.game.ui;
    if (ui) ui.toast('Zeit abgelaufen – Als vermisst gemeldet', 'danger', 5000);
    this.player.causeOfDeath = 'Zeit abgelaufen';
    this.end('mia');
  }
  onExtracted(point) {
    if (this.ended) return;
    this.events.emit('extracted', { extractionId: point ? point.id : null, inventory: this.player.inventory, secure: this.player.secure });
    this.end('extracted', point);
  }
  abort() { if (!this.ended) { this.player.causeOfDeath = 'Einsatz abgebrochen'; this.end('abort'); } }
  pause() { this.paused = true; }
  resume() { this.paused = false; }

  end(outcome, point = null) {
    if (this.ended) return;
    this.ended = true;
    const game = this.game;
    const pm = game && game.profileMgr;
    const p = this.player;
    const st = p.stats;
    const result = {
      outcome, mapId: this.mapId, mapName: this.map.name, seed: this.seed, extractionName: point ? point.name : null,
      causeOfDeath: outcome === 'extracted' ? null : (p.causeOfDeath || null),
      durationSec: Math.round(this.time), kills: st.kills, killsByType: Object.assign({}, st.killsByType), shotsFired: st.shotsFired, shotsHit: st.shotsHit,
      accuracy: st.shotsFired ? clamp(st.shotsHit / st.shotsFired, 0, 1) : 0, damageTaken: Math.round(st.damageTaken), containersOpened: st.containersOpened,
      distance: Math.round(st.distance / TILE), xpGained: 0, creditsGained: 0, levelBefore: pm ? pm.level() : 1, levelAfter: 1, leveledUp: false,
      xpBefore: pm ? pm.xp() : 0, xpAfter: 0, xpToNext: 0, itemsKept: [], itemsLost: [], itemsSold: [], lootValue: 0,
      missionsCompleted: [], missionsFailed: [], objectivesDone: 0, rewards: { credits: 0, xp: 0, items: [] }, insuranceReturned: [],
    };
    if (pm && pm.profile) {
      pm.applyRaidResult(result, p, this);
      const m = outcome === 'extracted' ? game.missions.finalizeOnExtract(this, pm.profile) : game.missions.finalizeOnDeath(this, pm.profile);
      result.missionsCompleted = m.completed; result.missionsFailed = m.failed; result.objectivesDone = m.objectivesDone; result.rewards = m.rewards;
      result.xpGained += m.rewards.xp; result.creditsGained += m.rewards.credits;
      result.levelAfter = pm.level(); result.leveledUp = result.levelAfter > result.levelBefore;
      result.xpAfter = pm.xp(); result.xpToNext = pm.xpProgress().next;
      if (typeof evaluateAchievements === 'function') result.achievements = evaluateAchievements(pm.profile);
    }
    this.result = result;
    this.events.emit('raidEnd', { result });
    this.events.clear();
    if (game && game.save && pm && pm.profile) game.save.save(pm.serialize());
    if (game && game.audio) game.audio.stopAmbient();
    if (game && game.onRaidEnded) game.onRaidEnded(result);
  }

  debugState() {
    return {
      mapId: this.mapId, seed: this.seed, time: Math.round(this.time), hour: formatHour(this.hour), darkness: Math.round(this.darkness * 100) / 100,
      player: this.player ? { x: Math.round(this.player.x), y: Math.round(this.player.y), hp: Math.round(this.player.hp) } : null,
      zombies: this.zombies ? this.zombies.aliveCount() : 0, projectiles: this.weapons ? this.weapons.projectiles.length : 0,
      particles: this.fx ? this.fx.particles.length : 0, flags: Object.assign({}, this.flags), ended: this.ended,
    };
  }
}


// ===== 18_profile.js =====
// 18_profile.js — ProfileManager: profile lifecycle, progression, loadout, base economy (trader, repair, crafting,
// healing, upgrades), loss rules, MIA rule, validation/migration (SPEC §19).
// Runtime vs saved form: profile.stash/loadout/secure are live Inventory instances and profile.equipment a live
//   Equipment while the game runs; serialize() returns the plain JSON-safe shape, setProfile(plain) hydrates it.
// Decisions: quickPack() is an extra convenience (Ausrüstung „Schnell packen“); upgrade effects follow the
//   SPEC formulas (stash +12 slots/level, medbay +10 HP/level, defense +1 secure slot and +5 kg/level, insurance at 3).
// Dependencies: 00_util.js, 01–04 data, 10_items_inventory.js, 19_progression.js.

const DEFAULT_SETTINGS = { master: 0.8, sfx: 1.0, music: 0.6, screenShake: true, showFps: false, touchControls: 'auto',
  quality: 'high', aimAssist: true, minimap: true, damageNumbers: true };

const PM_STATS_DEFAULT = { raids: 0, extractions: 0, deaths: 0, mia: 0, kills: 0, killsByType: {}, shotsFired: 0, shotsHit: 0, lootValue: 0,
  creditsEarned: 0, creditsSpent: 0, missionsCompleted: 0, missionsFailed: 0, playTime: 0, bestRaidValue: 0, containersOpened: 0, distance: 0,
  itemsCrafted: 0, upgradesBought: 0, achievements: [] };
const PM_UPGRADE_AREAS = ['stash', 'workshop', 'medbay', 'radio', 'defense', 'trader'];
const PM_AREA_NAMES = { stash: 'Lager', workshop: 'Werkstatt', medbay: 'Krankenstation', radio: 'Funkstation', defense: 'Verteidigungsanlage', trader: 'Händler' };

class ProfileManager {
  constructor(game) {
    this.game = game || null;
    this.profile = null;
  }

  // ---------------- accessors ----------------
  get stash() { return this.profile ? this.profile.stash : null; }
  get loadoutInventory() { return this.profile ? this.profile.loadout : null; }
  get equipment() { return this.profile ? this.profile.equipment : null; }
  get secureInv() { return this.profile ? this.profile.secure : null; }
  get stats() { return this.profile ? this.profile.stats : null; }
  _up(area) { return (this.profile && this.profile.upgrades && this.profile.upgrades[area]) || 0; }
  _rng() { return (this.game && this.game.rng) || (this._fallbackRng || (this._fallbackRng = new RNG(4242))); }
  _audio(n) { const a = this.game && this.game.audio; if (a) a.play(n); }
  _emit(name, data) { if (this.game && this.game.events) this.game.events.emit(name, data); }
  stashSlotsFor(level) { return STASH_SLOTS_BASE + 12 * (level || 0); }

  newProfile() {
    const eq = new Equipment();
    eq.secondary = Items.create('pistol_m9');
    if (eq.secondary) { eq.secondary.mag = Items.def('pistol_m9').weapon.magSize; eq.secondary.ammoId = 'ammo_9mm'; }
    eq.melee = Items.create('melee_knife');
    eq.backpack = Items.create('pack_small');
    const loadout = new Inventory(eq.backpackSlots());
    loadout.add(Items.create('ammo_9mm', 30));
    loadout.add(Items.create('med_bandage', 2));
    const stash = new Inventory(STASH_SLOTS_BASE);
    for (const [id, n] of [['ammo_9mm', 30], ['med_bandage', 2], ['food_beans', 2], ['water_bottle', 2]]) stash.add(Items.create(id, n));
    this.profile = {
      version: SAVE_VERSION, createdAt: Date.now(), name: 'Überlebender', credits: START_CREDITS, xp: 0, level: 1, hp: 100, hunger: 100, thirst: 100,
      stash, loadout, equipment: eq, secure: new Inventory(SECURE_SLOTS_BASE),
      upgrades: { stash: 0, workshop: 0, medbay: 0, radio: 0, defense: 0, trader: 0 },
      unlockedMaps: ['city'],
      missions: { active: [], completed: [], progress: {} },
      trader: { stock: [], restocks: 0 },
      stats: deepClone(PM_STATS_DEFAULT),
      raidInProgress: null, lastSaved: null,
    };
    this.unlockedMaps();
    this.restockTrader();
    this._emit('profileChanged');
    return this.profile;
  }

  setProfile(plain) {
    const v = ProfileManager.validate(plain);
    if (!v.ok) return false;
    const p = v.profile;
    const live = Object.assign({}, p);
    live.stash = Inventory.deserialize(p.stash, this.stashSlotsFor(p.upgrades.stash));
    if (live.stash.slots < this.stashSlotsFor(p.upgrades.stash)) live.stash.setSlots(this.stashSlotsFor(p.upgrades.stash));
    live.equipment = Equipment.deserialize(p.equipment);
    live.loadout = Inventory.deserialize(p.loadout, live.equipment.backpackSlots());
    live.secure = Inventory.deserialize(p.secure, SECURE_SLOTS_BASE + (p.upgrades.defense || 0));
    this.profile = live;
    // slots must follow the equipment / upgrades
    const over = live.loadout.setSlots(live.equipment.backpackSlots());
    for (const it of over) live.stash.add(it);
    const over2 = live.secure.setSlots(this.secureSlots());
    for (const it of over2) live.stash.add(it);
    this.unlockedMaps();
    this._emit('profileChanged');
    return true;
  }

  serialize() {
    const p = this.profile;
    if (!p) return null;
    const out = {};
    for (const [k, v] of Object.entries(p)) {
      if (k === 'stash' || k === 'loadout' || k === 'secure' || k === 'equipment') out[k] = v && typeof v.serialize === 'function' ? v.serialize() : v;
      else out[k] = deepClone(v);
    }
    out.version = SAVE_VERSION;
    out.level = this.level();
    return out;
  }

  // ---------------- progression ----------------
  addXp(n) {
    const p = this.profile;
    if (!p || !(n > 0)) return { leveledUp: false, newLevel: this.level(), unlockedMaps: [] };
    const before = this.level();
    const mapsBefore = this.unlockedMaps().slice();
    p.xp = Math.round((p.xp || 0) + n);
    const after = this.level();
    p.level = after;
    const maps = this.unlockedMaps();
    const fresh = maps.filter(m => !mapsBefore.includes(m));
    if (after > before) {
      this._emit('levelUp', { level: after, unlockedMaps: fresh });
      this._audio('level_up');
    }
    return { leveledUp: after > before, newLevel: after, unlockedMaps: fresh };
  }
  level() { return this.profile ? Progression.levelFromXp(this.profile.xp || 0) : 1; }
  xp() { return this.profile ? this.profile.xp || 0 : 0; }
  xpProgress() { return Progression.progress(this.xp()); }
  unlockedMaps() {
    if (!this.profile) return ['city'];
    const ids = Progression.unlockedMapsFor(this.level(), this._up('radio'));
    this.profile.unlockedMaps = ids;
    return ids;
  }
  isMapUnlocked(mapId) { return this.unlockedMaps().includes(mapId); }

  // ---------------- loadout ----------------
  secureSlots() { return SECURE_SLOTS_BASE + this._up('defense'); }
  carryLimit() { return CARRY_BASE + (this.equipment ? this.equipment.carryBonus() : 0) + 5 * this._up('defense'); }
  hpMax() { return 100 + 10 * this._up('medbay'); }
  loadoutWeight() {
    if (!this.profile) return 0;
    return this.profile.loadout.weight() + this.profile.equipment.weight() + this.profile.secure.weight();
  }

  buildLoadout() {
    const p = this.profile;
    const equipment = Equipment.deserialize(p.equipment.serialize());
    const inv = Inventory.deserialize(p.loadout.serialize(), equipment.backpackSlots());
    const over = inv.setSlots(equipment.backpackSlots());
    for (const it of over) p.stash.add(it);
    const secure = Inventory.deserialize(p.secure.serialize(), this.secureSlots());
    secure.setSlots(this.secureSlots());
    return { equipment, inventory: inv, secure, hp: p.hp, hpMax: this.hpMax(), hunger: p.hunger, thirst: p.thirst };
  }

  loadoutWarnings() {
    const p = this.profile;
    if (!p) return [];
    const W = [];
    const eq = p.equipment;
    const guns = [eq.primary, eq.secondary].filter(Boolean);
    if (!guns.length && !eq.melee) W.push('Keine Waffe ausgerüstet');
    else if (!guns.length) W.push('Nur eine Nahkampfwaffe ausgerüstet');
    for (const g of guns) {
      const d = Items.def(g);
      if (!d || !d.weapon) continue;
      const cal = d.weapon.ammo;
      const reserve = [...p.loadout.all(), ...p.secure.all()].reduce((n, it) => { const ad = Items.def(it); return n + (ad && ad.ammo && ad.ammo.caliber === cal ? it.count : 0); }, 0);
      if (reserve === 0) W.push('Keine Ersatzmunition für ' + d.name);
    }
    if (![...p.loadout.all(), ...p.secure.all()].some(it => { const d = Items.def(it); return d && d.medical; })) W.push('Keine Medizin dabei');
    if (this.loadoutWeight() > this.carryLimit()) W.push('Überladen: ' + formatWeight(this.loadoutWeight()) + ' / ' + formatWeight(this.carryLimit()));
    if (p.hp < this.hpMax() * 0.6) W.push('Verletzt (' + Math.round(p.hp) + '/' + this.hpMax() + ') – Krankenstation aufsuchen');
    if ((p.hunger ?? 100) < 40 || (p.thirst ?? 100) < 40) W.push('Hunger/Durst niedrig – Nahrung/Wasser einpacken');
    for (const g of guns) if (g.durability !== undefined && g.durability < 25) W.push((Items.def(g) || {}).name + ' ist stark beschädigt');
    return W;
  }

  _fixLoadoutSlots() {
    const p = this.profile;
    const over = p.loadout.setSlots(p.equipment.backpackSlots());
    for (const it of over) { const r = p.stash.add(it); if (r.remaining) { /* no space anywhere: keep it in loadout by growing temporarily is not possible */ } }
  }

  moveStashToLoadout(uid, count = Infinity) {
    const p = this.profile;
    if (!p) return false;
    const inst = p.stash.remove(uid, count);
    if (!inst) return false;
    const r = p.loadout.add(inst);
    if (r.remaining) p.stash.add(r.remaining);
    return !r.remaining || r.remaining.count < (inst.count || 0) + 1;
  }
  moveLoadoutToStash(uid, count = Infinity) {
    const p = this.profile;
    if (!p) return false;
    let src = p.loadout;
    if (src.indexOf(uid) < 0) src = p.secure;
    const inst = src.remove(uid, count);
    if (!inst) return false;
    const r = p.stash.add(inst);
    if (r.remaining) src.add(r.remaining);
    return !r.remaining;
  }
  moveToSecure(uid, fromLoadout = false) {
    const p = this.profile;
    const src = fromLoadout ? p.loadout : p.stash;
    const inst = src.remove(uid);
    if (!inst) return false;
    const r = p.secure.add(inst);
    if (r.remaining) src.add(r.remaining);
    return !r.remaining;
  }
  _equipFrom(inv, uid, slot) {
    const p = this.profile;
    const idx = inv.indexOf(uid);
    if (idx < 0) return { ok: false, reason: 'Gegenstand nicht gefunden' };
    const inst = inv.items[idx];
    const s = slot || Equipment.slotFor(inst);
    if (!s || !Equipment.accepts(s, inst)) return { ok: false, reason: 'Kann nicht ausgerüstet werden' };
    inv.items[idx] = null;
    const r = p.equipment.equip(inst, s);
    if (!r.ok) { inv.items[idx] = inst; return { ok: false, reason: 'Kann nicht ausgerüstet werden' }; }
    if (r.replaced) {
      const back = inv.add(r.replaced);
      if (back.remaining) { const s2 = p.stash.add(back.remaining); if (s2.remaining) { p.equipment.equip(r.replaced, s); inv.items[idx] = inst; return { ok: false, reason: 'Kein Platz für den alten Gegenstand' }; } }
    }
    if (s === 'backpack') this._fixLoadoutSlots();
    return { ok: true };
  }
  equipFromStash(uid, slot) { return this.profile ? this._equipFrom(this.profile.stash, uid, slot) : { ok: false }; }
  equipFromLoadout(uid, slot) { return this.profile ? this._equipFrom(this.profile.loadout, uid, slot) : { ok: false }; }
  unequipToStash(slot) {
    const p = this.profile;
    if (!p) return false;
    const inst = p.equipment.get(slot);
    if (!inst || !p.stash.canAdd(inst)) return false;
    p.equipment.unequip(slot);
    p.stash.add(inst);
    if (slot === 'backpack') this._fixLoadoutSlots();
    return true;
  }

  // Convenience: pack ammo for the equipped guns, two meds, food and water from the stash.
  quickPack() {
    const p = this.profile;
    if (!p) return 0;
    let moved = 0;
    const take = (pred, amount) => {
      let need = amount;
      for (const it of p.stash.all()) {
        if (need <= 0) break;
        if (!pred(it)) continue;
        const n = Math.min(need, it.count);
        if (this.moveStashToLoadout(it.uid, n)) { moved++; need -= n; }
      }
    };
    for (const g of [p.equipment.primary, p.equipment.secondary].filter(Boolean)) {
      const d = Items.def(g);
      if (!d || !d.weapon || !d.weapon.ammo) continue;
      const have = p.loadout.all().reduce((n, it) => { const ad = Items.def(it); return n + (ad && ad.ammo && ad.ammo.caliber === d.weapon.ammo ? it.count : 0); }, 0);
      const want = d.weapon.magSize * 3 - have;
      if (want > 0) take(it => { const ad = Items.def(it); return ad && ad.ammo && ad.ammo.caliber === d.weapon.ammo; }, want);
    }
    const count = pred => p.loadout.all().filter(pred).reduce((n, it) => n + it.count, 0);
    const isMed = it => { const d = Items.def(it); return d && d.medical && (d.medical.heal || d.medical.stopBleed); };
    if (count(isMed) < 2) take(isMed, 2 - count(isMed));
    const isFood = it => { const d = Items.def(it); return d && d.food; };
    const isWater = it => { const d = Items.def(it); return d && d.water; };
    if (count(isFood) < 1) take(isFood, 1);
    if (count(isWater) < 1) take(isWater, 1);
    return moved;
  }

  // ---------------- economy ----------------
  sellPrice(inst, count = inst ? inst.count : 1) {
    if (!inst) return 0;
    const unit = Items.value(inst) / Math.max(1, inst.count || 1);
    return Math.max(1, Math.round(unit * count * ECONOMY.sellMul * (1 + this._up('trader') * ECONOMY.traderSellBonus)));
  }
  buyPrice(def) {
    if (!def) return 0;
    return Math.max(1, Math.round((def.value || 1) * ECONOMY.buyMul * (1 - this._up('trader') * ECONOMY.traderBuyDiscount)));
  }
  sell(uid, count = Infinity) {
    const p = this.profile;
    if (!p) return { ok: false, credits: 0 };
    const idx = p.stash.indexOf(uid);
    if (idx < 0) return { ok: false, credits: 0 };
    const it = p.stash.items[idx];
    const n = Math.min(it.count, Number.isFinite(count) ? Math.max(1, Math.floor(count)) : it.count);
    const credits = this.sellPrice(it, n);
    p.stash.remove(uid, n);
    p.credits += credits;
    p.stats.creditsEarned += credits;
    this._audio('sell');
    return { ok: true, credits };
  }
  restockTrader() {
    const p = this.profile;
    if (!p) return;
    const lvl = this._up('trader');
    const rng = this._rng();
    const stock = [];
    for (const line of TRADER_STOCK) {
      if ((line.minLevel || 0) > lvl) continue;
      if ((line.minLevel || 0) > 0 && !rng.chance(line.chance ?? 1)) continue;
      const def = Items.def(line.id);
      if (!def) continue;
      const range = Array.isArray(line.stock) ? line.stock : [1, 3];
      let count = rng.int(range[0], range[1]);
      if (def.ammo && (line.minLevel || 0) === 0) count = Math.max(20, count);
      if ((line.minLevel || 0) === 0) count = Math.max(1, count);
      const price = line.basePrice ? Math.round(line.basePrice * (1 - lvl * ECONOMY.traderBuyDiscount)) : this.buyPrice(def);
      stock.push({ id: def.id, price, count });
    }
    p.trader = { stock, restocks: ((p.trader && p.trader.restocks) || 0) + 1 };
  }
  buy(stockIndex, count = 1) {
    const p = this.profile;
    if (!p || !p.trader) return { ok: false, reason: 'Kein Händler' };
    const line = p.trader.stock[stockIndex];
    if (!line) return { ok: false, reason: 'Nicht im Angebot' };
    const n = Math.min(line.count, Math.max(1, Math.floor(count)));
    if (n <= 0) return { ok: false, reason: 'Ausverkauft' };
    const cost = line.price * n;
    if (p.credits < cost) return { ok: false, reason: 'Nicht genug Credits' };
    const def = Items.def(line.id);
    const stack = Math.max(1, def.stack || 1);
    // build instances and check space first
    const test = new Inventory(p.stash.slots);
    test.items = p.stash.items.map(it => (it ? Items.clone(it) : null));
    const insts = [];
    for (let left = n; left > 0;) { const c = Math.min(stack, left); const inst = Items.create(line.id, c); insts.push(inst); left -= c; }
    for (const inst of insts) { const r = test.add(Items.clone(inst)); if (r.remaining) return { ok: false, reason: 'Lager voll' }; }
    for (const inst of insts) p.stash.add(inst);
    p.credits -= cost;
    p.stats.creditsSpent += cost;
    line.count -= n;
    this._audio('buy');
    return { ok: true, reason: null, cost };
  }
  findItem(uid) {
    const p = this.profile;
    if (!p) return null;
    for (const inv of [p.stash, p.loadout, p.secure]) { const i = inv.indexOf(uid); if (i >= 0) return { inst: inv.items[i], inv }; }
    const slot = p.equipment.slotOf(uid);
    if (slot) return { inst: p.equipment[slot], slot };
    return null;
  }
  repairCost(inst) {
    const d = Items.def(inst);
    if (!d || !d.durabilityMax || inst.durability === undefined) return 0;
    const missing = (d.durabilityMax - inst.durability) / d.durabilityMax;
    if (missing <= 0) return 0;
    return Math.max(1, Math.round(missing * (d.value || 0) * ECONOMY.repairCostMul * (1 - 0.15 * this._up('workshop'))));
  }
  repair(uid) {
    const p = this.profile;
    const f = this.findItem(uid);
    if (!f) return { ok: false, reason: 'Gegenstand nicht gefunden' };
    const cost = this.repairCost(f.inst);
    if (cost <= 0) return { ok: false, reason: 'Nicht beschädigt' };
    if (p.credits < cost) return { ok: false, reason: 'Nicht genug Credits' };
    p.credits -= cost;
    p.stats.creditsSpent += cost;
    f.inst.durability = Items.def(f.inst).durabilityMax;
    this._audio('craft');
    return { ok: true, cost };
  }
  stationLevel(station) { return station === 'medbay' ? this._up('medbay') : this._up('workshop'); }
  recipesFor(station) {
    const lvl = this.stationLevel(station);
    return RECIPES.filter(r => r.station === station).map(r => ({ recipe: r, unlocked: (r.requiresLevel || 0) <= lvl, can: this.canCraft(r.id).ok }));
  }
  canCraft(recipeId) {
    const p = this.profile;
    const r = RECIPES.find(x => x.id === recipeId);
    if (!p || !r) return { ok: false, reason: 'Unbekanntes Rezept' };
    if ((r.requiresLevel || 0) > this.stationLevel(r.station)) return { ok: false, reason: 'Ausbaustufe ' + r.requiresLevel + ' nötig' };
    for (const i of r.inputs) if (p.stash.count(i.id) < i.count) return { ok: false, reason: 'Material fehlt: ' + ((Items.def(i.id) || {}).name || i.id) };
    const out = Items.create(r.output.id, r.output.count || 1);
    if (!out) return { ok: false, reason: 'Ungültiges Rezept' };
    return { ok: true, reason: null };
  }
  craft(recipeId) {
    const c = this.canCraft(recipeId);
    if (!c.ok) return c;
    const p = this.profile;
    const r = RECIPES.find(x => x.id === recipeId);
    const removed = [];
    for (const i of r.inputs) { p.stash.removeById(i.id, i.count); removed.push(i); }
    const out = Items.create(r.output.id, r.output.count || 1);
    const res = p.stash.add(out);
    if (res.remaining) {
      // no space: refund the inputs
      p.stash.removeById(r.output.id, (r.output.count || 1) - res.remaining.count);
      for (const i of removed) p.stash.add(Items.create(i.id, i.count));
      return { ok: false, reason: 'Lager voll' };
    }
    p.stats.itemsCrafted++;
    this._audio('craft');
    return { ok: true, reason: null };
  }
  healCost() {
    const p = this.profile;
    if (!p) return 0;
    if (this._up('medbay') >= 3) return 0;
    return Math.max(0, Math.ceil((this.hpMax() - p.hp) * ECONOMY.healCostPerHp));
  }
  heal() {
    const p = this.profile;
    if (!p) return { ok: false, reason: 'Kein Spielstand' };
    const cost = this.healCost();
    if (p.hp >= this.hpMax() && p.hunger >= 100 && p.thirst >= 100) return { ok: false, reason: 'Du bist bereits fit' };
    if (p.credits < cost) return { ok: false, reason: 'Nicht genug Credits' };
    p.credits -= cost;
    p.stats.creditsSpent += cost;
    p.hp = this.hpMax();
    p.hunger = 100; p.thirst = 100;
    this._audio('heal');
    return { ok: true, cost };
  }
  useMedicalFromStash(uid) { return this.useFromStash(uid); }
  useFromStash(uid) {
    const p = this.profile;
    const idx = p ? p.stash.indexOf(uid) : -1;
    if (idx < 0) return { ok: false, reason: 'Nicht gefunden' };
    const d = Items.def(p.stash.items[idx]);
    if (!d || !(d.medical || d.food || d.water)) return { ok: false, reason: 'Nicht benutzbar' };
    if (d.medical) p.hp = Math.min(this.hpMax(), p.hp + (d.medical.heal || 0) + (d.medical.overTime || 0));
    if (d.food) p.hunger = clamp(p.hunger + (d.food.hunger || 0), 0, 100);
    if (d.water) p.thirst = clamp(p.thirst + (d.water.thirst || 0), 0, 100);
    p.stash.remove(uid, 1);
    this._audio(d.medical ? 'heal' : 'eat');
    return { ok: true };
  }
  canUpgrade(area) {
    const p = this.profile;
    if (!p || !PM_UPGRADE_AREAS.includes(area)) return { ok: false, reason: 'Unbekannter Bereich' };
    const lvl = this._up(area);
    if (lvl >= 3) return { ok: false, reason: 'Maximale Stufe erreicht' };
    const info = upgradeInfo(area, lvl + 1);
    if (!info) return { ok: false, reason: 'Keine weitere Stufe' };
    const cost = info.cost || {};
    if (p.credits < (cost.credits || 0)) return { ok: false, reason: 'Nicht genug Credits' };
    for (const it of cost.items || []) if (p.stash.count(it.id) < it.count) return { ok: false, reason: 'Material fehlt: ' + ((Items.def(it.id) || {}).name || it.id) + ' ×' + it.count };
    if (info.requiresLevel && this.level() < info.requiresLevel) return { ok: false, reason: 'Ab Stufe ' + info.requiresLevel };
    return { ok: true, reason: null, info };
  }
  upgrade(area) {
    const c = this.canUpgrade(area);
    if (!c.ok) return c;
    const p = this.profile;
    const cost = c.info.cost || {};
    p.credits -= cost.credits || 0;
    p.stats.creditsSpent += cost.credits || 0;
    for (const it of cost.items || []) p.stash.removeById(it.id, it.count);
    p.upgrades[area] = this._up(area) + 1;
    if (area === 'stash') p.stash.setSlots(this.stashSlotsFor(p.upgrades.stash));
    if (area === 'defense') p.secure.setSlots(this.secureSlots());
    if (area === 'radio') this.unlockedMaps();
    if (area === 'trader') this.restockTrader();
    p.stats.upgradesBought++;
    this._audio('craft');
    return { ok: true, reason: null };
  }

  // ---------------- loss rules ----------------
  recordStat(key, n = 1) { if (this.profile && this.profile.stats) this.profile.stats[key] = (this.profile.stats[key] || 0) + n; }

  _mergeRaidStats(st) {
    const s = this.profile.stats;
    for (const k of ['kills', 'shotsFired', 'shotsHit', 'containersOpened']) s[k] = (s[k] || 0) + (st[k] || 0);
    s.distance = (s.distance || 0) + Math.round((st.distance || 0) / TILE);
    s.killsByType = s.killsByType || {};
    for (const [k, v] of Object.entries(st.killsByType || {})) s.killsByType[k] = (s.killsByType[k] || 0) + v;
  }

  applyRaidResult(result, player, raid) {
    const p = this.profile;
    if (!p || !player) return result;
    const rng = this._rng();
    const strip = (inst) => { if (inst) delete inst.rt; return inst; };
    this._mergeRaidStats(player.stats || {});
    p.stats.raids++;
    if (result.outcome === 'extracted') {
      p.equipment = player.equipment;
      for (const s of EQUIP_SLOTS) strip(p.equipment[s]);
      let lootValue = 0;
      const kept = [], sold = [];
      for (const inv of [player.inventory, player.secure]) {
        for (const it of inv.all()) {
          strip(it);
          if (it.raidFound) lootValue += Items.value(it);
          const copy = Items.clone(it);
          const r = p.stash.add(it);
          if (r.remaining) {
            const credits = Math.max(1, Math.round(Items.value(r.remaining) * ECONOMY.overflowSellMul));
            p.credits += credits;
            p.stats.creditsEarned += credits;
            result.creditsGained += credits;
            sold.push({ inst: Items.clone(r.remaining), credits });
            if (copy.count > r.remaining.count) { copy.count -= r.remaining.count; kept.push({ inst: copy }); }
          } else kept.push({ inst: copy });
        }
      }
      for (const s of EQUIP_SLOTS) if (p.equipment[s]) kept.push({ inst: Items.clone(p.equipment[s]), equipped: true });
      result.itemsKept = kept;
      result.itemsSold = sold;
      result.lootValue = Math.round(lootValue);
      p.loadout = new Inventory(p.equipment.backpackSlots());
      p.secure = new Inventory(this.secureSlots());
      p.hp = clamp(Math.round(player.hp), 1, this.hpMax());
      p.hunger = clamp(player.hunger, 0, 100);
      p.thirst = clamp(player.thirst, 0, 100);
      const xp = Math.round((raid ? raid.xp : 0) + XP_REWARDS.extraction + lootValue * XP_REWARDS.perLootValue);
      result.xpGained = xp;
      this.addXp(xp);
      p.stats.extractions++;
      p.stats.lootValue += Math.round(lootValue);
      p.stats.bestRaidValue = Math.max(p.stats.bestRaidValue || 0, Math.round(lootValue));
    } else {
      const lost = [], insured = [];
      const insurance = this._up('defense') >= 3 ? 0.5 : 0;
      const newEq = new Equipment();
      for (const s of EQUIP_SLOTS) {
        const it = player.equipment[s];
        if (!it) continue;
        strip(it);
        if (insurance > 0 && rng.chance(insurance)) { newEq[s] = it; insured.push(Items.clone(it)); }
        else lost.push({ inst: Items.clone(it), equipped: true });
      }
      for (const it of player.inventory.all()) lost.push({ inst: Items.clone(it) });
      const kept = [];
      for (const it of player.secure.all()) {
        strip(it);
        const copy = Items.clone(it);
        const r = p.stash.add(it);
        if (r.remaining) {
          const credits = Math.max(1, Math.round(Items.value(r.remaining) * ECONOMY.overflowSellMul));
          p.credits += credits; result.creditsGained += credits;
          result.itemsSold.push({ inst: Items.clone(r.remaining), credits });
        }
        kept.push({ inst: copy, secure: true });
      }
      p.equipment = newEq;
      p.loadout = new Inventory(newEq.backpackSlots());
      p.secure = new Inventory(this.secureSlots());
      p.hp = 35;
      p.hunger = 60; p.thirst = 60;
      result.itemsLost = lost;
      result.itemsKept = kept;
      result.insuranceReturned = insured;
      const xp = Math.round(raid ? raid.xp : 0);
      result.xpGained = xp;
      this.addXp(xp);
      if (result.outcome === 'mia') p.stats.mia++; else p.stats.deaths++;
    }
    p.raidInProgress = null;
    this.restockTrader();
    return result;
  }

  applyMiaOnReload() {
    const p = this.profile;
    const res = { lost: [], insured: [] };
    if (!p) return res;
    const rng = this._rng();
    const insurance = this._up('defense') >= 3 ? 0.5 : 0;
    const newEq = new Equipment();
    for (const s of EQUIP_SLOTS) {
      const it = p.equipment[s];
      if (!it) continue;
      if (insurance > 0 && rng.chance(insurance)) { newEq[s] = it; res.insured.push(it); } else res.lost.push(it);
    }
    for (const it of p.loadout.all()) res.lost.push(it);
    for (const it of p.secure.all()) p.stash.add(it);
    p.equipment = newEq;
    p.loadout = new Inventory(newEq.backpackSlots());
    p.secure = new Inventory(this.secureSlots());
    p.hp = 35; p.hunger = 60; p.thirst = 60;
    p.stats.mia++; p.stats.raids++;
    p.raidInProgress = null;
    this.restockTrader();
    return res;
  }

  // ---------------- validation ----------------
  static migrate(obj) {
    switch (obj.version) {
      case 0:
        obj.version = 1;
      // falls through
      default:
        obj.version = SAVE_VERSION;
    }
    return obj;
  }

  static validate(obj) {
    const repaired = [];
