        for (const lot of WorldGenerator._splitLots(rng, r, 0)) {
          const fits = defs.filter(d => allows(block.zone, d) && d.w[0] + 2 <= lot.w && d.h[0] + 2 <= lot.h);
          let total = 0;
          const weights = fits.map(d => {
            let w = d.placed < d.count[0] ? 6 : d.placed < d.target ? 2 : 0;
            // prefer defs whose size range uses the lot well
            if (w > 0 && d.w[1] + 2 < lot.w * 0.55 && d.h[1] + 2 < lot.h * 0.55) w *= 0.5;
            total += w;
            return w;
          });
          if (total <= 0 || (rng.chance(0.12) && defs.every(d => d.placed >= d.count[0]))) { freeRects.push(lot); continue; }
          let roll = rng.next() * total, pick = fits[fits.length - 1];
          for (let i = 0; i < fits.length; i++) { roll -= weights[i]; if (roll < 0) { pick = fits[i]; break; } }
          const bw = rng.int(pick.w[0], Math.max(pick.w[0], Math.min(pick.w[1], lot.w - 2)));
          const bh = rng.int(pick.h[0], Math.max(pick.h[0], Math.min(pick.h[1], lot.h - 2)));
          const ox = lot.tx + 1 + rng.int(0, Math.max(0, lot.w - 2 - bw));
          const oy = lot.ty + 1 + rng.int(0, Math.max(0, lot.h - 2 - bh));
          WorldGenerator._building(ctx, pick, ox, oy, bw, bh, block);
          pick.placed++;
          // the rest of the lot is yard space
          freeRects.push(lot);
        }
      }
    }
    ctx.outdoor.push(...freeRects, ...layout.yards);
  }

  static _splitLots(rng, r, depth) {
    const out = [];
    const canV = r.w >= 14, canH = r.h >= 14;
    const big = r.w > 16 || r.h > 16;
    if (depth < 6 && (canV || canH) && (big || rng.chance(0.55))) {
      const vertical = canV && (!canH || r.w >= r.h);
      if (vertical) {
        const s = rng.int(7, r.w - 7);
        out.push(...WorldGenerator._splitLots(rng, { tx: r.tx, ty: r.ty, w: s, h: r.h }, depth + 1));
        out.push(...WorldGenerator._splitLots(rng, { tx: r.tx + s, ty: r.ty, w: r.w - s, h: r.h }, depth + 1));
      } else {
        const s = rng.int(7, r.h - 7);
        out.push(...WorldGenerator._splitLots(rng, { tx: r.tx, ty: r.ty, w: r.w, h: s }, depth + 1));
        out.push(...WorldGenerator._splitLots(rng, { tx: r.tx, ty: r.ty + s, w: r.w, h: r.h - s }, depth + 1));
      }
    } else if (r.w >= 7 && r.h >= 7) out.push(r);
    return out;
  }

  static _buildingName(ctx, type, index) {
    const names = (typeof BUILDING_NAMES !== 'undefined' && BUILDING_NAMES) || WG_FALLBACK_NAMES;
    const base = names[type] || WG_FALLBACK_NAMES[type] || type;
    if (ctx.map.layout === 'city') return base + ' ' + WG_STREETS[(index * 7 + ctx.world.buildings.length) % WG_STREETS.length];
    const letter = String.fromCharCode(65 + (index % 6));
    return base + ' ' + letter + (1 + Math.floor(index / 6));
  }

  static _building(ctx, def, bx, by, bw, bh, block, opts = {}) {
    const { world, rng, map } = ctx;
    const pal = map.palette || {};
    const id = 'b' + world.buildings.length;
    const typeCount = world.buildings.filter(b => b.type === def.type).length;
    const roofs = [pal.roofA || '#4a3b33', pal.roofB || '#3b3f46', pal.roofC || '#55463a'];
    const walls = [pal.wallA || '#6b6259', pal.wallB || '#5a5550'];
    const b = {
      id, type: def.type, name: opts.name || WorldGenerator._buildingName(ctx, def.type, typeCount), tx: bx, ty: by, w: bw, h: bh,
      roofColor: rng.pick(roofs), wallColor: rng.pick(walls), floorColor: pal.floor || '#4a4440',
      doors: [], rooms: [], lootTier: def.lootTier || 1, locked: !!opts.locked, containers: [], zone: block ? block.zone : null,
    };
    const idx = world.buildings.length;
    world.buildings.push(b);
    world.indexBuilding(b, idx);
    // reserve footprint + 1 ring
    for (let y = by - 1; y <= by + bh; y++) for (let x = bx - 1; x <= bx + bw; x++) if (world.inBounds(x, y)) ctx.reserved[y * world.w + x] = 1;
    // walls + floor
    for (let y = by; y < by + bh; y++) for (let x = bx; x < bx + bw; x++) {
      const edge = x === bx || y === by || x === bx + bw - 1 || y === by + bh - 1;
      world.put(x, y, edge ? T.WALL : T.FLOOR);
    }
    // rooms
    const rooms = [];
    if (opts.singleRoom) rooms.push({ tx: bx + 1, ty: by + 1, w: bw - 2, h: bh - 2 });
    else WorldGenerator._splitRooms(ctx, bx + 1, by + 1, bw - 2, bh - 2, 0, rooms);
    b.rooms = rooms;
    // exterior doors
    const area = bw * bh;
    const nDoors = opts.doors || (area < 60 ? 1 : area < 150 ? 2 : 3);
    WorldGenerator._exteriorDoors(ctx, b, nDoors, opts.locked ? T.DOOR_LOCKED : T.DOOR_CLOSED, block);
    // windows
    if (!opts.noWindows) WorldGenerator._windows(ctx, b);
    // containers
    const tier = clamp((map.lootTierBase || 1) + (b.lootTier || 1) - 1 + (opts.tierBonus || 0), 1, 5);
    let n = rng.int(def.containerCount[0], def.containerCount[1]) + Math.floor(area / 90);
    if (opts.containerCount) n = opts.containerCount;
    WorldGenerator._containers(ctx, b, def.containers, n, tier);
    // ceiling lights in 30 % of the rooms
    for (const r of rooms) {
      if (rng.chance(0.3)) world.lights.push({ x: (r.tx + r.w / 2) * TILE, y: (r.ty + r.h / 2) * TILE, radius: clamp(Math.max(r.w, r.h) * 18, 90, 220), color: '#ffdcae', flicker: rng.chance(0.25), indoor: true });
    }
    return b;
  }

  static _isDoorAt(world, x, y) { return tileIsDoor(world.tile(x, y)); }

  static _splitRooms(ctx, rx, ry, rw, rh, depth, out) {
    const { world, rng } = ctx;
    const vertical = rw >= rh;
    const len = vertical ? rw : rh;
    if (depth >= 3 || len < 7 || (len < 10 && rng.chance(0.45)) || (rw * rh < 30)) { out.push({ tx: rx, ty: ry, w: rw, h: rh }); return; }
    const cands = [];
    for (let p = 3; p <= len - 4; p++) cands.push(p);
    rng.shuffle(cands);
    let pos = -1;
    for (const p of cands) {
      if (vertical) {
        const x = rx + p;
        if (WorldGenerator._isDoorAt(world, x, ry - 1) || WorldGenerator._isDoorAt(world, x, ry + rh)) continue;
      } else {
        const y = ry + p;
        if (WorldGenerator._isDoorAt(world, rx - 1, y) || WorldGenerator._isDoorAt(world, rx + rw, y)) continue;
      }
      pos = p; break;
    }
    if (pos < 0) { out.push({ tx: rx, ty: ry, w: rw, h: rh }); return; }
    if (vertical) {
      const x = rx + pos;
      for (let y = ry; y < ry + rh; y++) world.put(x, y, T.WALL);
      const dy = ry + rng.int(0, rh - 1);
      world.put(x, dy, T.DOOR_CLOSED);
      WorldGenerator._splitRooms(ctx, rx, ry, pos, rh, depth + 1, out);
      WorldGenerator._splitRooms(ctx, x + 1, ry, rw - pos - 1, rh, depth + 1, out);
    } else {
      const y = ry + pos;
      for (let x = rx; x < rx + rw; x++) world.put(x, y, T.WALL);
      const dx = rx + rng.int(0, rw - 1);
      world.put(dx, y, T.DOOR_CLOSED);
      WorldGenerator._splitRooms(ctx, rx, ry, rw, pos, depth + 1, out);
      WorldGenerator._splitRooms(ctx, rx, y + 1, rw, rh - pos - 1, depth + 1, out);
    }
  }

  static _exteriorDoors(ctx, b, n, doorTile, block) {
    const { world, rng } = ctx;
    const sides = [
      { name: 'n', len: b.w, at: i => ({ x: b.tx + i, y: b.ty, ix: b.tx + i, iy: b.ty + 1, ox: b.tx + i, oy: b.ty - 1 }) },
      { name: 's', len: b.w, at: i => ({ x: b.tx + i, y: b.ty + b.h - 1, ix: b.tx + i, iy: b.ty + b.h - 2, ox: b.tx + i, oy: b.ty + b.h }) },
      { name: 'w', len: b.h, at: i => ({ x: b.tx, y: b.ty + i, ix: b.tx + 1, iy: b.ty + i, ox: b.tx - 1, oy: b.ty + i }) },
      { name: 'e', len: b.h, at: i => ({ x: b.tx + b.w - 1, y: b.ty + i, ix: b.tx + b.w - 2, iy: b.ty + i, ox: b.tx + b.w, oy: b.ty + i }) },
    ];
    // prefer the sides closest to the block edge (= toward a road)
    if (block) {
      const dist = { n: b.ty - block.ty, s: block.ty + block.h - (b.ty + b.h), w: b.tx - block.tx, e: block.tx + block.w - (b.tx + b.w) };
      sides.sort((a, c) => dist[a.name] - dist[c.name] + rng.float(-0.5, 0.5));
    } else rng.shuffle(sides);
    let placed = 0;
    for (let s = 0; s < sides.length && placed < n; s++) {
      const side = sides[s];
      const idxs = [];
      for (let i = 2; i <= side.len - 3; i++) idxs.push(i);
      if (!idxs.length) for (let i = 1; i <= side.len - 2; i++) idxs.push(i);
      rng.shuffle(idxs);
      for (const i of idxs) {
        const p = side.at(i);
        if (world.tile(p.ix, p.iy) !== T.FLOOR) continue;
        const ot = world.tile(p.ox, p.oy);
        if (tileBlocksMove(ot) || world.buildingIndexAtTile(p.ox, p.oy) >= 0) continue;
        world.put(p.x, p.y, doorTile);
        b.doors.push({ tx: p.x, ty: p.y, ox: p.ox, oy: p.oy, side: side.name });
        // reserve the approach (2 tiles out + sides) so no prop ever blocks a door
        const dx = p.ox - p.x, dy = p.oy - p.y;
        for (let k = 1; k <= 3; k++) for (let q = -1; q <= 1; q++) {
          const rx = p.x + dx * k + (dy !== 0 ? q : 0), ry = p.y + dy * k + (dx !== 0 ? q : 0);
          if (world.inBounds(rx, ry)) ctx.reserved[ry * world.w + rx] = 2;
        }
        placed++;
        break;
      }
    }
    if (placed === 0) {
      // fallback: force one door on any side with a walkable outside tile
      for (const side of sides) {
        for (let i = 1; i <= side.len - 2 && placed === 0; i++) {
          const p = side.at(i);
          if (tileBlocksMove(world.tile(p.ox, p.oy))) continue;
          world.put(p.x, p.y, doorTile);
          if (world.tile(p.ix, p.iy) !== T.FLOOR) world.put(p.ix, p.iy, T.FLOOR);
          b.doors.push({ tx: p.x, ty: p.y, ox: p.ox, oy: p.oy, side: side.name });
          placed++;
        }
        if (placed) break;
      }
    }
  }

  static _windows(ctx, b) {
    const { world, rng } = ctx;
    const tryWin = (x, y, ix, iy, ox, oy) => {
      if (world.tile(x, y) !== T.WALL || world.tile(ix, iy) !== T.FLOOR) return false;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (tileIsDoor(world.tile(x + dx, y + dy))) return false;
      if (world.buildingIndexAtTile(ox, oy) >= 0) return false;
      world.put(x, y, T.WINDOW);
      return true;
    };
    for (let i = 2; i < b.w - 2; i += rng.int(3, 5)) {
      tryWin(b.tx + i, b.ty, b.tx + i, b.ty + 1, b.tx + i, b.ty - 1);
      tryWin(b.tx + i, b.ty + b.h - 1, b.tx + i, b.ty + b.h - 2, b.tx + i, b.ty + b.h);
    }
    for (let i = 2; i < b.h - 2; i += rng.int(3, 5)) {
      tryWin(b.tx, b.ty + i, b.tx + 1, b.ty + i, b.tx - 1, b.ty + i);
      tryWin(b.tx + b.w - 1, b.ty + i, b.tx + b.w - 2, b.ty + i, b.tx + b.w, b.ty + i);
    }
  }

  static _containers(ctx, b, types, n, tier) {
    const { world, rng } = ctx;
    const cands = [];
    for (let y = b.ty + 1; y < b.ty + b.h - 1; y++) {
      for (let x = b.tx + 1; x < b.tx + b.w - 1; x++) {
        if (world.tile(x, y) !== T.FLOOR) continue;
        let wall = false, doorNear = false;
        for (let k = 0; k < 4; k++) {
          const t = world.tile(x + NAV_DX[k], y + NAV_DY[k]);
          if (t === T.WALL || t === T.WINDOW) wall = true;
        }
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (tileIsDoor(world.tile(x + dx, y + dy))) doorNear = true;
        if (wall && !doorNear) cands.push({ x, y });
      }
    }
    rng.shuffle(cands);
    const used = new Set();
    let placed = 0;
    for (const c of cands) {
      if (placed >= n) break;
      const key = c.x + ',' + c.y;
      if (used.has(key)) continue;
      // keep containers apart
      let crowded = false;
      for (let dy = -1; dy <= 1 && !crowded; dy++) for (let dx = -1; dx <= 1; dx++) if (used.has((c.x + dx) + ',' + (c.y + dy))) { crowded = true; break; }
      if (crowded) continue;
      used.add(key);
      const type = rng.pick(types) || 'crate';
      const cont = {
        uid: 'c' + (++ctx.containerSeq), type, tx: c.x, ty: c.y, x: (c.x + 0.5) * TILE, y: (c.y + 0.5) * TILE,
        tier, buildingId: b.id, buildingType: b.type, items: null, opened: false, locked: false, preset: [],
      };
      world.containers.push(cont);
      b.containers.push(cont.uid);
      placed++;
    }
  }

  static _bossHall(ctx, arena) {
    const { world, rng, map } = ctx;
    const hw = clamp(arena.w - 4, 20, 30), hh = clamp(arena.h - 4, 16, 22);
    const bx = arena.tx + Math.floor((arena.w - hw) / 2), by = arena.ty + Math.floor((arena.h - hh) / 2);
    const def = { type: 'bunker', lootTier: 3, containers: ['lab_cabinet', 'safe', 'military_crate', 'weapon_rack'], containerCount: [4, 6] };
    const b = WorldGenerator._building(ctx, def, bx, by, hw, hh, { tx: arena.tx, ty: arena.ty, w: arena.w, h: arena.h, zone: 'arena' },
      { singleRoom: true, locked: true, doors: 1, noWindows: true, name: 'Sektor U – Versuchshalle', tierBonus: 1, containerCount: 5 });
    b.hall = true;
    // concrete pillars for cover
    for (let k = 0; k < 6; k++) {
      const x = bx + 3 + rng.int(0, hw - 7), y = by + 3 + rng.int(0, hh - 7);
      if (Math.abs(x - (bx + hw / 2)) < 3 && Math.abs(y - (by + hh / 2)) < 3) continue;
      if (world.tile(x, y) === T.FLOOR && world.tile(x + 1, y) === T.FLOOR) {
        world.put(x, y, T.PROP_SOLID);
        world.props.push({ id: 'p' + (++ctx.propSeq), type: 'pillar', tx: x, ty: y, w: 1, h: 1, rot: 0, color: '#5b6066', solid: true });
      }
    }
    world.bossArena = { x: (bx + hw / 2) * TILE, y: (by + hh / 2) * TILE, r: Math.min(hw, hh) * TILE / 2, buildingId: b.id };
    world.pois.push({ id: 'poi' + (++ctx.poiSeq), type: 'boss_arena', x: world.bossArena.x, y: world.bossArena.y, radius: 64, buildingId: b.id, used: false, timer: 0 });
    const door = b.doors[0];
    if (door) {
      world.pois.push({ id: 'poi' + (++ctx.poiSeq), type: 'lab_entrance', x: (door.ox + 0.5) * TILE, y: (door.oy + 0.5) * TILE, radius: 64, buildingId: b.id, used: false, timer: 0 });
      world.lights.push({ x: (door.ox + 0.5) * TILE, y: (door.oy + 0.5) * TILE, radius: 140, color: '#ff4a3a', flicker: true });
    }
    for (let k = 0; k < 3; k++) world.lights.push({ x: (bx + hw * (k + 1) / 4) * TILE, y: (by + hh / 2) * TILE, radius: 200, color: '#9fd0ff', flicker: k === 1 });
  }

  // decorative features coming from the layout (tank farms, toxic pools, gate checkpoints, plaza benches)
  static _layoutFeatures(ctx) {
    const { world, rng, layout, map } = ctx;
    const sp = layout.special || {};
    if (sp.pools) {
      for (const p of sp.pools) {
        let ok = true;
        for (let y = p.ty - p.r; y <= p.ty + p.r && ok; y++) for (let x = p.tx - p.r; x <= p.tx + p.r; x++) if (world.buildingIndexAtTile(x, y) >= 0) { ok = false; break; }
        if (!ok) continue;
        wgl_blob(world, rng, p.tx, p.ty, p.r, T.TOXIC, [T.GRAVEL, T.GROUND, T.RUBBLE, T.GRASS]);
        world.toxicZones.push({ x: (p.tx + 0.5) * TILE, y: (p.ty + 0.5) * TILE, r: (p.r + 0.5) * TILE });
      }
    }
    if (map.layout === 'campus' && !sp.pools) {
      const n = Number.isFinite(map.toxicZones) ? map.toxicZones : 0;
      for (let k = 0; k < n; k++) {
        const y = rng.pick(ctx.outdoor);
        if (!y || y.w < 8 || y.h < 8) continue;
        const cx = y.tx + rng.int(3, y.w - 4), cy = y.ty + rng.int(3, y.h - 4);
        wgl_blob(world, rng, cx, cy, 2, T.TOXIC, [T.GRASS, T.GROUND, T.GRAVEL]);
        world.toxicZones.push({ x: (cx + 0.5) * TILE, y: (cy + 0.5) * TILE, r: 2.5 * TILE });
      }
    }
    if (sp.gates) {
      for (const gte of sp.gates) {
        const horiz = gte.dir === 'n' || gte.dir === 's';
        // sandbag nests either side of each gate
        for (const off of [-3, 5]) {
          const x = horiz ? gte.tx + off : gte.tx + (gte.dir === 'w' ? 1 : -1);
          const y = horiz ? gte.ty + (gte.dir === 'n' ? 1 : -1) : gte.ty + off;
          WorldGenerator._tryProp(ctx, horiz ? 'sandbag' : 'sandbag', x, y, horiz ? 2 : 1, horiz ? 1 : 2, T.PROP_LOW, false);
        }
      }
      const f = sp.fence;
      for (const [x, y] of [[f.x0 + 1, f.y0 + 1], [f.x1 - 2, f.y0 + 1], [f.x0 + 1, f.y1 - 2], [f.x1 - 2, f.y1 - 2]]) {
        WorldGenerator._tryProp(ctx, 'tower', x, y, 2, 2, T.PROP_SOLID, true, true);
        world.lights.push({ x: (x + 1) * TILE, y: (y + 1) * TILE, radius: 240, color: '#fff2c8', flicker: false });
      }
    }
    for (const y of layout.yards) {
      if (y.kind === 'tankfarm') {
        for (let k = 0; k < 5; k++) WorldGenerator._tryProp(ctx, 'tank', y.tx + rng.int(1, y.w - 5), y.ty + rng.int(1, y.h - 5), 3, 3, T.PROP_SOLID, true);
        for (let k = 0; k < 4; k++) {
          const vertical = rng.chance(0.5);
          const len = rng.int(4, 8);
          WorldGenerator._tryProp(ctx, 'pipe', y.tx + rng.int(1, y.w - 2), y.ty + rng.int(1, y.h - 2), vertical ? 1 : len, vertical ? len : 1, T.PROP_LOW, false);
        }
      } else if (y.kind === 'plaza' || y.kind === 'quad') {
        for (let k = 0; k < 6; k++) WorldGenerator._tryProp(ctx, 'bench', y.tx + rng.int(2, y.w - 4), y.ty + rng.int(2, y.h - 3), 2, 1, T.PROP_LOW, false);
      } else if (y.kind === 'parade') {
        WorldGenerator._tryProp(ctx, 'antenna', y.tx + (y.w >> 1), y.ty + (y.h >> 1), 1, 1, T.PROP_SOLID, true);
      }
    }
  }

  // ---------------- spawn / extraction ----------------
  static _edgeSpot(ctx, edge, along) {
    const { world, layout } = ctx;
    const m = Math.max(5, Math.floor((layout.margin || 8) / 2) + 1);
    const W = world.w, H = world.h;
    let tx, ty;
    if (edge === 0) { tx = Math.round(along * W); ty = m; }
    else if (edge === 1) { tx = Math.round(along * W); ty = H - 1 - m; }
    else if (edge === 2) { tx = m; ty = Math.round(along * H); }
    else { tx = W - 1 - m; ty = Math.round(along * H); }
    return { tx: clamp(tx, 4, W - 5), ty: clamp(ty, 4, H - 5) };
  }

  static _nearestWalkable(world, tx, ty, maxR = 8, avoidIndoor = true) {
    for (let r = 0; r <= maxR; r++) {
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        const x = tx + dx, y = ty + dy;
        if (!world.isWalkable(x, y)) continue;
        if (avoidIndoor && world.buildingIndexAtTile(x, y) >= 0) continue;
        if (world.tile(x, y) === T.TOXIC) continue;
        return { tx: x, ty: y };
      }
    }
    return null;
  }

  static _playerSpawn(ctx) {
    const { world, rng } = ctx;
    let edge = rng.int(0, 3);
    if (world.bossArena) {
      const ax = world.bossArena.x / world.pixelW, ay = world.bossArena.y / world.pixelH;
      const scores = [ay, 1 - ay, ax, 1 - ax]; // distance of arena to edges n, s, w, e
      edge = scores.indexOf(Math.max(...scores)) === 0 ? 1 : scores.indexOf(Math.max(...scores)) === 1 ? 0 : scores.indexOf(Math.max(...scores)) === 2 ? 3 : 2;
      // choose the edge farthest from the arena: arena near north (ay small) -> spawn south, etc.
      const far = [1 - ay, ay, 1 - ax, ax];
      edge = far.indexOf(Math.max(...far));
      // far[0] = distance from north edge... map to the edge index whose distance to the arena is maximal
      edge = [0, 1, 2, 3].sort((a, b) => WorldGenerator._edgeDist(world, b) - WorldGenerator._edgeDist(world, a))[0];
    }
    const s = WorldGenerator._edgeSpot(ctx, edge, rng.float(0.3, 0.7));
    const p = WorldGenerator._nearestWalkable(world, s.tx, s.ty, 12) || s;
    world.playerSpawn = { x: (p.tx + 0.5) * TILE, y: (p.ty + 0.5) * TILE, edge };
    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
      const x = p.tx + dx, y = p.ty + dy;
      if (world.inBounds(x, y) && !ctx.reserved[y * world.w + x]) ctx.reserved[y * world.w + x] = 4;
    }
  }

  static _edgeDist(world, edge) {
    const a = world.bossArena;
    if (!a) return 0;
    const ax = a.x / TILE, ay = a.y / TILE;
    return edge === 0 ? ay : edge === 1 ? world.h - ay : edge === 2 ? ax : world.w - ax;
  }

  static _extractions(ctx) {
    const { world, rng, map } = ctx;
    const defs = Array.isArray(map.extractions) ? map.extractions : [];
    const cands = [];
    for (let edge = 0; edge < 4; edge++) {
      for (let a = 0.12; a <= 0.88; a += 0.04) {
        const s = WorldGenerator._edgeSpot(ctx, edge, a);
        const p = WorldGenerator._nearestWalkable(world, s.tx, s.ty, 4);
        if (p) cands.push({ tx: p.tx, ty: p.ty, edge });
      }
    }
    const sp = { tx: world.playerSpawn.x / TILE, ty: world.playerSpawn.y / TILE };
    const diag = Math.hypot(world.w, world.h);
    const chosen = [];
    const order = defs.slice().sort((a, b) => (a.kind === 'always' ? -1 : 0) - (b.kind === 'always' ? -1 : 0));
    for (const def of order) {
      let best = null, bs = -Infinity;
      for (const c of cands) {
        const ds = Math.hypot(c.tx - sp.tx, c.ty - sp.ty);
        let score;
        if (def.kind === 'always') score = ds + rng.float(0, 6);
        else {
          if (ds < diag * 0.3) continue;
          let md = Infinity;
          for (const o of chosen) md = Math.min(md, Math.hypot(c.tx - o.tx, c.ty - o.ty));
          if (md < 30) continue;
          score = Math.min(md, ds) + (chosen.some(o => o.edge === c.edge) ? -20 : 0) + rng.float(0, 8);
        }
        if (score > bs) { bs = score; best = c; }
      }
      if (!best) best = cands.length ? cands[rng.int(0, cands.length - 1)] : { tx: 6, ty: 6, edge: 0 };
      chosen.push({ ...best, def });
    }
    for (const c of chosen) {
      const def = c.def;
      // clear pad
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
        if (dx * dx + dy * dy > 6) continue;
        const x = c.tx + dx, y = c.ty + dy;
        if (world.buildingIndexAtTile(x, y) >= 0) continue;
        const t = world.tile(x, y);
        if (t === T.VOID || t === T.FENCE || (t === T.WALL && world.buildingIndexAtTile(x, y) < 0 && (x <= 2 || y <= 2 || x >= world.w - 3 || y >= world.h - 3))) continue;
        world.put(x, y, T.GRAVEL);
      }
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const x = c.tx + dx, y = c.ty + dy;
        if (world.inBounds(x, y) && !ctx.reserved[y * world.w + x]) ctx.reserved[y * world.w + x] = 3;
      }
      world.extractions.push({
        id: def.id, name: def.name, kind: def.kind || 'always', requires: def.requires || null, duration: def.duration || 10,
        window: def.window || null, hazard: def.hazard || null, x: (c.tx + 0.5) * TILE, y: (c.ty + 0.5) * TILE, radius: 72,
      });
      world.props.push({ id: 'p' + (++ctx.propSeq), type: 'lamp', tx: c.tx + 2, ty: c.ty - 2, w: 1, h: 1, rot: 0, color: '#3ddc84', solid: false, extraction: def.id });
      world.lights.push({ x: (c.tx + 0.5) * TILE, y: (c.ty + 0.5) * TILE, radius: 150, color: '#59ff9c', flicker: false, extraction: def.id });
    }
  }

  static _generator(ctx) {
    const { world, rng } = ctx;
    const prefs = ['warehouse', 'factory', 'hq', 'garage', 'storage', 'workshop', 'security', 'office'];
    const sorted = world.buildings.filter(b => !b.hall).sort((a, b) => {
      const pa = prefs.indexOf(a.type), pb = prefs.indexOf(b.type);
      return (pa < 0 ? 99 : pa) - (pb < 0 ? 99 : pb);
    });
    const sp = world.playerSpawn;
    for (const b of sorted.slice(0, 12)) {
      // outside tiles adjacent to the wall, away from doors
      const cands = [];
      for (let x = b.tx + 1; x < b.tx + b.w - 1; x++) { cands.push([x, b.ty - 1]); cands.push([x, b.ty + b.h]); }
      for (let y = b.ty + 1; y < b.ty + b.h - 1; y++) { cands.push([b.tx - 1, y]); cands.push([b.tx + b.w, y]); }
      rng.shuffle(cands);
      for (const [x, y] of cands) {
        if (!world.inBounds(x, y)) continue;
        const r = ctx.reserved[y * world.w + x];
        if (r >= 2) continue;
        if (!world.isWalkable(x, y) || world.buildingIndexAtTile(x, y) >= 0) continue;
        // keep both perpendicular neighbours walkable so the 2-tile gap between buildings stays passable
        let open = 0;
        for (let k = 0; k < 8; k++) if (world.isWalkable(x + NAV_DX[k], y + NAV_DY[k])) open++;
        if (open < 5) continue;
        if (Math.hypot(x * TILE - sp.x, y * TILE - sp.y) < 20 * TILE) continue;
        world.put(x, y, T.PROP_SOLID);
        ctx.reserved[y * world.w + x] = 5;
        world.props.push({ id: 'p' + (++ctx.propSeq), type: 'generator', tx: x, ty: y, w: 1, h: 1, rot: 0, color: '#c49a2c', solid: true });
        world.pois.push({ id: 'poi' + (++ctx.poiSeq), type: 'generator', x: (x + 0.5) * TILE, y: (y + 0.5) * TILE, radius: 64, buildingId: b.id, used: false, timer: 0 });
        world.lights.push({ x: (x + 0.5) * TILE, y: (y + 0.5) * TILE, radius: 90, color: '#ffb347', flicker: true });
        return;
      }
    }
    // fallback: any open outdoor tile
    for (let k = 0; k < 400; k++) {
      const o = rng.pick(ctx.outdoor);
      if (!o) break;
      const x = o.tx + rng.int(1, Math.max(1, o.w - 2)), y = o.ty + rng.int(1, Math.max(1, o.h - 2));
      if (!world.isWalkable(x, y) || world.buildingIndexAtTile(x, y) >= 0 || ctx.reserved[y * world.w + x]) continue;
      world.put(x, y, T.PROP_SOLID);
      world.props.push({ id: 'p' + (++ctx.propSeq), type: 'generator', tx: x, ty: y, w: 1, h: 1, rot: 0, color: '#c49a2c', solid: true });
      world.pois.push({ id: 'poi' + (++ctx.poiSeq), type: 'generator', x: (x + 0.5) * TILE, y: (y + 0.5) * TILE, radius: 64, buildingId: null, used: false, timer: 0 });
      return;
    }
  }

  // ---------------- props ----------------
  static _tryProp(ctx, type, tx, ty, w, h, tile, solid, ignoreRing = false, color = null) {
    const { world } = ctx;
    if (tx < 3 || ty < 3 || tx + w > world.w - 3 || ty + h > world.h - 3) return false;
    for (let y = ty; y < ty + h; y++) for (let x = tx; x < tx + w; x++) {
      if (ctx.reserved[y * world.w + x]) return false;
      const t = world.tile(x, y);
      if (tileBlocksMove(t) || t === T.TOXIC || t === T.WATER) return false;
      if (world.buildingIndexAtTile(x, y) >= 0) return false;
    }
    if (!ignoreRing) {
      // keep a free ring so props never close a corridor
      for (let y = ty - 1; y <= ty + h; y++) for (let x = tx - 1; x <= tx + w; x++) {
        if (x >= tx && x < tx + w && y >= ty && y < ty + h) continue;
        const t = world.tile(x, y);
        if (t === T.PROP_SOLID || t === T.PROP_LOW || t === T.BARRICADE || t === T.WALL || t === T.WINDOW || tileIsDoor(t)) return false;
      }
    }
    for (let y = ty; y < ty + h; y++) for (let x = tx; x < tx + w; x++) { world.put(x, y, tile); ctx.reserved[y * world.w + x] = 5; }
    world.props.push({ id: 'p' + (++ctx.propSeq), type, tx, ty, w, h, rot: w > h ? Math.PI / 2 : 0, color, solid });
    return true;
  }

  static _roadSpot(ctx, r, len, across) {
    // returns a spot inside road r away from intersections
    const { world, rng, layout } = ctx;
    const bands = layout.bands;
    for (let k = 0; k < 12; k++) {
      if (r.dir === 'v') {
        const y = r.ty + rng.int(0, Math.max(0, r.h - len));
        if (wgl_inBands(y - 2, bands.y, bands.band) || wgl_inBands(y + len + 1, bands.y, bands.band)) continue;
        const lane = rng.chance(0.5) ? r.tx : r.tx + r.w - across;
        return { tx: lane, ty: y, w: across, h: len };
      }
      const x = r.tx + rng.int(0, Math.max(0, r.w - len));
      if (wgl_inBands(x - 2, bands.x, bands.band) || wgl_inBands(x + len + 1, bands.x, bands.band)) continue;
      const lane = rng.chance(0.5) ? r.ty : r.ty + r.h - across;
      return { tx: x, ty: lane, w: len, h: across };
    }
    return null;
  }

  static _props(ctx) {
    const { world, rng, map, layout } = ctx;
    const props = map.props || {};
    const palette = map.palette || {};
    const carColors = ['#7a2b2b', '#2b4a7a', '#4a4a4a', '#8a8a7a', '#2f5d3a', '#6d5a2a', '#3b3b55'];
    const outdoorSpot = () => {
      const o = rng.pick(ctx.outdoor);
      if (!o) return null;
      return { tx: o.tx + rng.int(0, Math.max(0, o.w - 1)), ty: o.ty + rng.int(0, Math.max(0, o.h - 1)) };
    };
    const marginSpot = () => {
      const m = layout.margin || 8;
      const edge = rng.int(0, 3);
      const a = rng.int(4, (edge < 2 ? world.w : world.h) - 5);
      const d = rng.int(3, m - 2);
      if (edge === 0) return { tx: a, ty: d };
      if (edge === 1) return { tx: a, ty: world.h - 1 - d };
      if (edge === 2) return { tx: d, ty: a };
      return { tx: world.w - 1 - d, ty: a };
    };
    const anySpot = () => (rng.chance(0.7) ? outdoorSpot() : marginSpot());
    const roads = layout.roads || [];
    for (const [type, rawCount] of Object.entries(props)) {
      const count = Math.max(0, Math.round(Number(rawCount) || 0));
      let placed = 0;
      for (let tries = 0; placed < count && tries < count * 25; tries++) {
        let ok = false;
        if (type === 'car' || type === 'truck') {
          const r = rng.pick(roads);
          if (!r) break;
          const len = type === 'car' ? 4 : 5;
          const across = 2;
          if ((r.dir === 'v' ? r.w : r.h) < 3) continue;
          const s = WorldGenerator._roadSpot(ctx, r, len, across);
          if (!s) continue;
          ok = WorldGenerator._tryProp(ctx, type, s.tx, s.ty, s.w, s.h, T.PROP_SOLID, true, false, rng.pick(carColors));
        } else if (type === 'barricade') {
          const r = rng.pick(roads);
          if (!r) break;
          const s = WorldGenerator._roadSpot(ctx, r, 1, 2);
          if (!s) continue;
          ok = WorldGenerator._tryProp(ctx, 'barricade', s.tx, s.ty, r.dir === 'v' ? 2 : 1, r.dir === 'v' ? 1 : 2, T.BARRICADE, true, true, '#6b5a3a');
        } else {
          const s = anySpot();
          if (!s) continue;
          if (type === 'tree') ok = WorldGenerator._tryProp(ctx, 'tree', s.tx, s.ty, 1, 1, T.PROP_SOLID, true, false, palette.grass || '#2f4a2c');
          else if (type === 'dumpster') ok = WorldGenerator._tryProp(ctx, 'dumpster', s.tx, s.ty, 2, 1, T.PROP_SOLID, true, false, '#2f5144');
          else if (type === 'bench') ok = WorldGenerator._tryProp(ctx, 'bench', s.tx, s.ty, 2, 1, T.PROP_LOW, false, false, '#5a4632');
          else if (type === 'barrel') ok = WorldGenerator._tryProp(ctx, 'barrel', s.tx, s.ty, 1, 1, T.PROP_LOW, false, false, rng.pick(['#7a3b22', '#3b5a7a', '#5a6a2a']));
          else if (type === 'crate' || type === 'pallet') ok = WorldGenerator._tryProp(ctx, type, s.tx, s.ty, 1, 1, T.PROP_LOW, false, false, '#7a5f3a');
          else if (type === 'sandbag') ok = WorldGenerator._tryProp(ctx, 'sandbag', s.tx, s.ty, rng.chance(0.5) ? 3 : 1, rng.chance(0.5) ? 1 : 3, T.PROP_LOW, false, false, '#8a7a55');
          else if (type === 'tank') ok = WorldGenerator._tryProp(ctx, 'tank', s.tx, s.ty, 3, 3, T.PROP_SOLID, true, false, '#6a6e72');
          else if (type === 'pipe') { const v = rng.chance(0.5), l = rng.int(3, 7); ok = WorldGenerator._tryProp(ctx, 'pipe', s.tx, s.ty, v ? 1 : l, v ? l : 1, T.PROP_LOW, false, false, '#7a6a5a'); }
          else if (type === 'tower') ok = WorldGenerator._tryProp(ctx, 'tower', s.tx, s.ty, 2, 2, T.PROP_SOLID, true, false, '#5a5040');
          else if (type === 'antenna') ok = WorldGenerator._tryProp(ctx, 'antenna', s.tx, s.ty, 1, 1, T.PROP_SOLID, true, false, '#888');
          else if (type === 'generator') ok = true; // generator handled separately
          else ok = WorldGenerator._tryProp(ctx, type, s.tx, s.ty, 1, 1, T.PROP_LOW, false, false, '#666');
        }
        if (ok) placed++;
      }
    }
    // dead bodies to search ("body" containers) in the streets
    const bodies = map.layout === 'campus' ? 8 : 10;
    for (let k = 0, tries = 0; k < bodies && tries < 200; tries++) {
      const s = anySpot();
      if (!s || !world.isWalkable(s.tx, s.ty) || world.buildingIndexAtTile(s.tx, s.ty) >= 0 || ctx.reserved[s.ty * world.w + s.tx]) continue;
      world.containers.push({
        uid: 'c' + (++ctx.containerSeq), type: 'body', tx: s.tx, ty: s.ty, x: (s.tx + 0.5) * TILE, y: (s.ty + 0.5) * TILE,
        tier: clamp((map.lootTierBase || 1), 1, 5), buildingId: null, buildingType: null, items: null, opened: false, locked: false, preset: [],
      });
      ctx.reserved[s.ty * world.w + s.tx] = 5;
      k++;
    }
  }

  static _lights(ctx) {
    const { world, rng, map, layout } = ctx;
    const street = map.lights !== 'none';
    if (street) {
      for (const r of layout.roads || []) {
        const step = 10;
        if (r.dir === 'v') {
          for (let y = r.ty + 3; y < r.ty + r.h - 2; y += step) {
            const x = r.tx - 1;
            if (!world.isWalkable(x, y)) continue;
            world.props.push({ id: 'p' + (++ctx.propSeq), type: 'lamp', tx: x, ty: y, w: 1, h: 1, rot: 0, color: '#bbb', solid: false });
            if (rng.chance(0.75)) world.lights.push({ x: (x + 0.5) * TILE, y: (y + 0.5) * TILE, radius: 170, color: map.layout === 'campus' ? '#d6ecff' : '#ffd79a', flicker: rng.chance(0.2) });
          }
        } else {
          for (let x = r.tx + 3; x < r.tx + r.w - 2; x += step) {
            const y = r.ty - 1;
            if (!world.isWalkable(x, y)) continue;
            world.props.push({ id: 'p' + (++ctx.propSeq), type: 'lamp', tx: x, ty: y, w: 1, h: 1, rot: 0, color: '#bbb', solid: false });
            if (rng.chance(0.75)) world.lights.push({ x: (x + 0.5) * TILE, y: (y + 0.5) * TILE, radius: 170, color: map.layout === 'campus' ? '#d6ecff' : '#ffd79a', flicker: rng.chance(0.2) });
          }
        }
      }
    }
    for (const z of world.toxicZones) world.lights.push({ x: z.x, y: z.y, radius: z.r * 1.6, color: '#7dff5a', flicker: true, toxic: true });
    // bucket lights by chunk for the renderer
    world.lightBuckets = new Map();
    for (const l of world.lights) {
      const k = Math.floor(l.x / (TILE * 16)) + ',' + Math.floor(l.y / (TILE * 16));
      if (!world.lightBuckets.has(k)) world.lightBuckets.set(k, []);
      world.lightBuckets.get(k).push(l);
    }
  }

  // ---------------- zombies ----------------
  static _zombies(ctx) {
    const { world, rng, map } = ctx;
    const zdef = map.zombies || { count: 60, weights: { walker: 1 } };
    const weights = Object.entries(zdef.weights || { walker: 1 }).filter(([t]) => t !== 'boss' && (typeof ZOMBIE_TYPES === 'undefined' || ZOMBIE_TYPES[t])).map(([id, w]) => ({ id, w }));
    if (!weights.length) weights.push({ id: 'walker', w: 1 });
    const sp = world.playerSpawn;
    const minD = 28 * TILE;
    let remaining = Math.max(0, zdef.count | 0);
    const floorTiles = [];
    for (const b of world.buildings) if (!b.hall) for (const r of b.rooms) floorTiles.push(r);
    let guard = 0;
    while (remaining > 0 && guard++ < 2000) {
      const n = Math.min(remaining, rng.int(2, 6));
      let spot = null;
      const indoor = floorTiles.length && rng.chance(0.35);
      for (let k = 0; k < 30 && !spot; k++) {
        let tx, ty;
        if (indoor) { const r = rng.pick(floorTiles); tx = r.tx + rng.int(0, r.w - 1); ty = r.ty + rng.int(0, r.h - 1); }
        else { tx = rng.int(4, world.w - 5); ty = rng.int(4, world.h - 5); }
        if (!world.isWalkable(tx, ty) || world.tile(tx, ty) === T.TOXIC) continue;
        const x = (tx + 0.5) * TILE, y = (ty + 0.5) * TILE;
        if (Math.hypot(x - sp.x, y - sp.y) < minD) continue;
        if (world.extractions.some(e => Math.hypot(e.x - x, e.y - y) < 6 * TILE)) continue;
        if (world.bossArena && world.buildingIndexAtTile(tx, ty) >= 0 && world.buildings[world.buildingIndexAtTile(tx, ty)].hall) continue;
        spot = { x, y };
      }
      if (!spot) continue;
      const types = [];
      for (let i = 0; i < n; i++) types.push((rng.weighted(weights) || weights[0]).id);
      if (indoor) {
        const special = weights.filter(w => w.id === 'stalker' || w.id === 'screamer');
        if (special.length && rng.chance(0.5)) types[0] = rng.pick(special).id;
      }
      world.zombieSpawns.push({ x: spot.x, y: spot.y, count: n, types, indoor: !!indoor });
      remaining -= n;
    }
    if (map.boss && world.bossArena) {
      world.zombieSpawns.push({ x: world.bossArena.x, y: world.bossArena.y, count: 5, types: [map.boss, 'walker', 'walker', 'walker', 'walker'], boss: true });
    }
  }

  // ---------------- missions (never changes tiles) ----------------
  static _missionPlacement(ctx, mrng, missionDefs) {
    const { world, map } = ctx;
    const containersByType = (types, minTier = 1) => world.containers.filter(c => c.type !== 'body' && c.tier >= minTier && (!types || types.includes(c.buildingType)));
    const putInContainer = (id, count, types, minTier = 2) => {
      let list = containersByType(types, minTier);
      if (!list.length) list = containersByType(null, minTier);
      if (!list.length) list = containersByType(null, 1);
      if (!list.length) return false;
      const c = mrng.pick(list);
      const inst = wg_makeItem(id, count);
      if (!inst) return false;
      c.preset.push(inst);
      return true;
    };
    const outdoorPoint = (minFromSpawn) => {
      const sp = world.playerSpawn;
      for (let k = 0; k < 200; k++) {
        const o = mrng.pick(ctx.outdoor);
        if (!o) break;
        const tx = o.tx + mrng.int(0, Math.max(0, o.w - 1)), ty = o.ty + mrng.int(0, Math.max(0, o.h - 1));
        if (!world.isWalkable(tx, ty) || world.buildingIndexAtTile(tx, ty) >= 0 || world.tile(tx, ty) === T.TOXIC) continue;
        const x = (tx + 0.5) * TILE, y = (ty + 0.5) * TILE;
        if (Math.hypot(x - sp.x, y - sp.y) < minFromSpawn) continue;
        if (world.pois.some(p => Math.hypot(p.x - x, p.y - y) < 8 * TILE)) continue;
        return { x, y };
      }
      for (let k = 0; k < 400; k++) {
        const tx = mrng.int(5, world.w - 6), ty = mrng.int(5, world.h - 6);
        if (world.isWalkable(tx, ty) && world.buildingIndexAtTile(tx, ty) < 0) return { x: (tx + 0.5) * TILE, y: (ty + 0.5) * TILE };
      }
      return { x: world.playerSpawn.x, y: world.playerSpawn.y };
    };
    const indoorPoint = (types) => {
      const bl = world.buildings.filter(b => !b.hall && (!types || types.includes(b.type)));
      const b = bl.length ? mrng.pick(bl) : null;
      if (!b || !b.rooms.length) return null;
      const r = mrng.pick(b.rooms);
      for (let k = 0; k < 20; k++) {
        const tx = r.tx + mrng.int(0, r.w - 1), ty = r.ty + mrng.int(0, r.h - 1);
        if (world.tile(tx, ty) === T.FLOOR) return { x: (tx + 0.5) * TILE, y: (ty + 0.5) * TILE, buildingId: b.id };
      }
      return null;
    };
    const addPoi = (type) => {
      let p = null;
      if (type === 'server_room') p = indoorPoint(['server', 'lab', 'office', 'hq']);
      else if (type === 'lab_entrance') p = indoorPoint(['lab', 'medical', 'bunker']);
      else if (type === 'checkpoint') {
        const cp = world.buildings.find(b => b.type === 'checkpoint');
        if (cp && cp.doors[0]) p = { x: (cp.doors[0].ox + 0.5) * TILE, y: (cp.doors[0].oy + 0.5) * TILE, buildingId: cp.id };
      } else if (type === 'boss_arena' && world.bossArena) p = { x: world.bossArena.x, y: world.bossArena.y, buildingId: world.bossArena.buildingId };
      if (!p) p = outdoorPoint(30 * TILE);
      const poi = { id: 'poi' + (++ctx.poiSeq), type, x: p.x, y: p.y, radius: 64, buildingId: p.buildingId || null, used: false, timer: 0 };
      world.pois.push(poi);
      return poi;
    };
    for (const m of missionDefs) {
      for (const o of [...(m.objectives || []), ...(m.optional || [])]) {
        if (o.type === 'investigate') {
          if (!world.pois.some(p => p.type === o.target)) addPoi(o.target);
        } else if (o.type === 'retrieve') {
          const id = o.target;
          if (world.floorLoot.some(f => f.inst && f.inst.id === id) || world.containers.some(c => c.preset.some(i => i.id === id))) continue;
          const count = Math.max(1, o.count || 1);
          if (id === 'mis_supply_package' || !WG_RETRIEVE_HOSTS[id]) {
            const poi = world.pois.find(p => p.type === 'supply_drop') || addPoi('supply_drop');
            for (let k = 0; k < count; k++) {
              const inst = wg_makeItem(id, 1);
              if (inst) world.floorLoot.push({ uid: 'fl' + world.floorLoot.length, inst, x: poi.x + mrng.float(-14, 14), y: poi.y + mrng.float(-14, 14) });
            }
          } else {
            for (let k = 0; k < count; k++) putInContainer(id, 1, WG_RETRIEVE_HOSTS[id], 1);
          }
        } else if (o.type === 'find_key') {
          if (!world.containers.some(c => c.preset.some(i => i.id === o.target))) putInContainer(o.target, 1, ['security', 'hq', 'office', 'checkpoint', 'armory', 'workshop', 'garage', 'apartment'], 2);
        }
      }
    }
    // keys for key-extractions
    for (const e of world.extractions) {
      if (e.kind !== 'key' || !e.requires) continue;
      if (world.containers.some(c => c.preset.some(i => i.id === e.requires))) continue;
      putInContainer(e.requires, 1, null, 2);
    }
    // lab key card for the locked hall
    if (world.buildings.some(b => b.locked) && !world.containers.some(c => c.preset.some(i => i.id === 'key_lab_card'))) {
      putInContainer('key_lab_card', 1, ['security'], 1) || putInContainer('key_lab_card', 1, ['lab', 'office', 'medical'], 2);
    }
    // fuel cans for fuel extractions (one guaranteed)
    for (const e of world.extractions) {
      if (e.kind === 'fuel' && e.requires && !world.containers.some(c => c.preset.some(i => i.id === e.requires))) putInContainer(e.requires, 1, ['garage', 'workshop', 'factory', 'warehouse', 'storage'], 1);
    }
  }
}


// ===== 08_world_layouts.js =====
// 08_world_layouts.js — the four map layouts (SPEC §9.1): wgLayoutCity, wgLayoutCompound, wgLayoutIndustrial, wgLayoutCampus.
// Each receives g = {world, rng, map, missionDefs}, paints ground/roads/fences/rails/toxic pools into world tiles
// (raw writes via world.put) and returns {blocks:[{tx,ty,w,h,zone,i,j}], roads:[{tx,ty,w,h,dir}], yards:[...],
// bossArena:{tx,ty,w,h}|null, margin, special:{...}}.
// Shared helper: wgl_grid builds a road grid with blocks between road bands.
// Dependencies: 00_util.js, 08_world.js (T). Runtime only; no DOM.

function wgl_fill(world, x, y, w, h, t) {
  for (let ty = y; ty < y + h; ty++) for (let tx = x; tx < x + w; tx++) world.put(tx, ty, t);
}

// Splits [start, end) into alternating road bands and blocks; returns band start positions.
function wgl_bands(rng, start, end, band, bmin, bmax) {
  const total = end - start;
  const avg = (bmin + bmax) / 2;
  let n = Math.max(2, Math.floor((total - band) / (avg + band)));
  let avail = total - band * (n + 1);
  while (n > 2 && avail / n < bmin) { n--; avail = total - band * (n + 1); }
  const sizes = [];
  const base = Math.floor(avail / n);
  for (let i = 0; i < n; i++) sizes.push(base);
  let rest = avail - base * n;
  for (let i = 0; rest > 0; i = (i + 1) % n, rest--) sizes[i]++;
  // jitter pairwise, preserving the sum and the bounds
  for (let i = 0; i + 1 < n; i++) {
    const d = rng.int(-3, 3);
    if (sizes[i] + d >= bmin && sizes[i + 1] - d >= bmin && sizes[i] + d <= bmax + 4 && sizes[i + 1] - d <= bmax + 4) {
      sizes[i] += d; sizes[i + 1] -= d;
    }
  }
  const bands = [];
  let cur = start;
  for (let i = 0; i < n; i++) { bands.push(cur); cur += band + sizes[i]; }
  bands.push(cur);
  return { bands, sizes };
}

// Generic grid: opt = {margin, roadW, sidewalk, roadTile, lineTile, blockMin, blockMax, blockTile(i,j)}.
function wgl_grid(g, opt) {
  const { world } = g;
  const W = world.w, H = world.h;
  const m = opt.margin;
  const sw = opt.sidewalk ? 1 : 0;
  const band = opt.roadW + sw * 2;
  const bx = wgl_bands(g.rng, m, W - m, band, opt.blockMin, opt.blockMax);
  const by = wgl_bands(g.rng, m, H - m, band, opt.blockMin, opt.blockMax);
  const roads = [];
  const blocks = [];
  const lastX = bx.bands[bx.bands.length - 1] + band, lastY = by.bands[by.bands.length - 1] + band;
  // blocks
  for (let j = 0; j < by.sizes.length; j++) {
    for (let i = 0; i < bx.sizes.length; i++) {
      const b = { tx: bx.bands[i] + band, ty: by.bands[j] + band, w: bx.sizes[i], h: by.sizes[j], zone: null, i, j };
      blocks.push(b);
      wgl_fill(world, b.tx, b.ty, b.w, b.h, opt.blockTile ? opt.blockTile(i, j) : T.GROUND);
    }
  }
  // vertical road bands
  for (const x of bx.bands) {
    const r = { tx: x + sw, ty: m, w: opt.roadW, h: lastY - m, dir: 'v' };
    roads.push(r);
    if (sw) { wgl_fill(world, x, m, 1, r.h, T.SIDEWALK); wgl_fill(world, x + band - 1, m, 1, r.h, T.SIDEWALK); }
    wgl_fill(world, r.tx, r.ty, r.w, r.h, opt.roadTile);
  }
  for (const y of by.bands) {
    const r = { tx: m, ty: y + sw, w: lastX - m, h: opt.roadW, dir: 'h' };
    roads.push(r);
    if (sw) { wgl_fill(world, m, y, r.w, 1, T.SIDEWALK); wgl_fill(world, m, y + band - 1, r.w, 1, T.SIDEWALK); }
    wgl_fill(world, r.tx, r.ty, r.w, r.h, opt.roadTile);
  }
  // re-paint intersections as plain road and sidewalks crossing as road
  for (const x of bx.bands) for (const y of by.bands) wgl_fill(world, x, y, band, band, opt.roadTile);
  // dashed centre lines
  if (opt.lineTile && opt.roadW % 2 === 1) {
    const c = (opt.roadW - 1) / 2;
    for (const r of roads) {
      if (r.dir === 'v') {
        for (let y = r.ty; y < r.ty + r.h; y++) {
          if (y % 4 < 2 && !wgl_inBands(y, by.bands, band)) world.put(r.tx + c, y, opt.lineTile);
        }
      } else {
        for (let x = r.tx; x < r.tx + r.w; x++) {
          if (x % 4 < 2 && !wgl_inBands(x, bx.bands, band)) world.put(x, r.ty + c, opt.lineTile);
        }
      }
    }
  }
  return { roads, blocks, bands: { x: bx.bands, y: by.bands, band } };
}

function wgl_inBands(v, bands, band) {
  for (const b of bands) if (v >= b && v < b + band) return true;
  return false;
}

function wgl_base(g, groundTile, borderTile) {
  const { world } = g;
  const W = world.w, H = world.h;
  wgl_fill(world, 0, 0, W, H, T.VOID);
  wgl_fill(world, 2, 2, W - 4, H - 4, borderTile);
  wgl_fill(world, 3, 3, W - 6, H - 6, groundTile);
}

function wgl_blob(world, rng, cx, cy, r, tile, onlyOn) {
  for (let y = cy - r - 1; y <= cy + r + 1; y++) {
    for (let x = cx - r - 1; x <= cx + r + 1; x++) {
      const d = Math.hypot(x - cx, y - cy) + rng.float(-0.6, 0.6);
      if (d <= r && (!onlyOn || onlyOn.includes(world.tile(x, y)))) world.put(x, y, tile);
    }
  }
}

function wgLayoutCity(g) {
  const { world, rng } = g;
  const margin = 8;
  wgl_base(g, T.GRASS, T.FENCE);
  // margin band: mostly ground with grass patches
  wgl_fill(world, 3, 3, world.w - 6, world.h - 6, T.GROUND);
  const grid = wgl_grid(g, { margin, roadW: 3, sidewalk: true, roadTile: T.ROAD, lineTile: T.ROAD_LINE, blockMin: 14, blockMax: 20,
    blockTile: () => T.GRASS });
  const cx = world.w / 2, cy = world.h / 2;
  const maxD = Math.hypot(cx, cy);
  const inner = grid.blocks.filter(b => b.i > 0 && b.j > 0 && b.i < Math.max(...grid.blocks.map(q => q.i)) && b.j < Math.max(...grid.blocks.map(q => q.j)));
  const plaza = rng.pick(inner.length ? inner : grid.blocks);
  const yards = [];
  for (const b of grid.blocks) {
    const d = Math.hypot(b.tx + b.w / 2 - cx, b.ty + b.h / 2 - cy) / maxD;
    if (b === plaza) {
      b.zone = 'plaza';
      wgl_fill(world, b.tx, b.ty, b.w, b.h, T.SIDEWALK);
      wgl_fill(world, b.tx + 2, b.ty + 2, b.w - 4, b.h - 4, T.GRASS);
      // cross paths and a fountain
      const mx = b.tx + (b.w >> 1), my = b.ty + (b.h >> 1);
      wgl_fill(world, mx - 1, b.ty, 2, b.h, T.SIDEWALK);
      wgl_fill(world, b.tx, my - 1, b.w, 2, T.SIDEWALK);
      wgl_fill(world, mx - 2, my - 2, 4, 4, T.SIDEWALK);
      wgl_fill(world, mx - 1, my - 1, 2, 2, T.WATER);
      yards.push({ tx: b.tx, ty: b.ty, w: b.w, h: b.h, kind: 'plaza' });
    } else {
      b.zone = d < 0.36 ? 'commercial' : 'residential';
      if (b.zone === 'commercial') wgl_fill(world, b.tx, b.ty, b.w, b.h, T.GROUND);
    }
  }
  // ensure at least two commercial blocks (supermarket + pharmacy need them)
  const commercial = grid.blocks.filter(b => b.zone === 'commercial');
  if (commercial.length < 3) {
    const sorted = grid.blocks.filter(b => b.zone === 'residential')
      .sort((a, b) => Math.hypot(a.tx - cx, a.ty - cy) - Math.hypot(b.tx - cx, b.ty - cy));
    for (let k = 0; k < 3 - commercial.length && k < sorted.length; k++) { sorted[k].zone = 'commercial'; wgl_fill(world, sorted[k].tx, sorted[k].ty, sorted[k].w, sorted[k].h, T.GROUND); }
  }
  // rubble patches on roads (collapsed facades)
  for (let k = 0; k < 18; k++) {
    const r = rng.pick(grid.roads);
    const x = r.tx + rng.int(0, Math.max(0, r.w - 1)), y = r.ty + rng.int(0, Math.max(0, r.h - 1));
    wgl_blob(world, rng, x, y, rng.int(1, 2), T.RUBBLE, [T.ROAD, T.ROAD_LINE, T.SIDEWALK]);
  }
  return { blocks: grid.blocks.filter(b => b.zone !== 'plaza'), roads: grid.roads, yards, bossArena: null, margin, bands: grid.bands, special: { plaza } };
}

function wgLayoutCompound(g) {
  const { world, rng } = g;
  const margin = 9;
  wgl_base(g, T.GROUND, T.FENCE);
  const grid = wgl_grid(g, { margin, roadW: 4, sidewalk: false, roadTile: T.ROAD, lineTile: null, blockMin: 16, blockMax: 22,
    blockTile: () => T.GRAVEL });
  const W = world.w, H = world.h;
  // inner perimeter fence one tile outside the first road band, with four gates
  const f0 = margin - 2, f1x = W - margin + 1, f1y = H - margin + 1;
  for (let x = f0; x <= f1x; x++) { world.put(x, f0, T.FENCE); world.put(x, f1y, T.FENCE); }
  for (let y = f0; y <= f1y; y++) { world.put(f0, y, T.FENCE); world.put(f1x, y, T.FENCE); }
  const gates = [];
  const gx = grid.bands.x[Math.floor(grid.bands.x.length / 2)], gy = grid.bands.y[Math.floor(grid.bands.y.length / 2)];
  const gateW = 4;
  for (let k = 0; k < gateW; k++) {
    world.put(gx + k, f0, T.GRAVEL); world.put(gx + k, f1y, T.GRAVEL);
    world.put(f0, gy + k, T.GRAVEL); world.put(f1x, gy + k, T.GRAVEL);
  }
  gates.push({ tx: gx, ty: f0, dir: 'n' }, { tx: gx, ty: f1y, dir: 's' }, { tx: f0, ty: gy, dir: 'w' }, { tx: f1x, ty: gy, dir: 'e' });
  // roads leading from gates to the outer ground
  for (let k = 0; k < gateW; k++) {
    for (let y = 3; y < f0; y++) world.put(gx + k, y, T.ROAD);
    for (let y = f1y + 1; y < H - 3; y++) world.put(gx + k, y, T.ROAD);
    for (let x = 3; x < f0; x++) world.put(x, gy + k, T.ROAD);
    for (let x = f1x + 1; x < W - 3; x++) world.put(x, gy + k, T.ROAD);
  }
  // parade ground in the most central block
  const cx = W / 2, cy = H / 2;
  const sorted = grid.blocks.slice().sort((a, b) => Math.hypot(a.tx + a.w / 2 - cx, a.ty + a.h / 2 - cy) - Math.hypot(b.tx + b.w / 2 - cx, b.ty + b.h / 2 - cy));
  const parade = sorted[0];
  const yards = [];
  for (const b of grid.blocks) b.zone = b === parade ? 'parade' : 'military';
  wgl_fill(world, parade.tx, parade.ty, parade.w, parade.h, T.GRAVEL);
  wgl_fill(world, parade.tx + 2, parade.ty + 2, parade.w - 4, parade.h - 4, T.ROAD);
  yards.push({ tx: parade.tx, ty: parade.ty, w: parade.w, h: parade.h, kind: 'parade' });
  // a few blocks get partial fences (secured zones) with an opening
  for (const b of grid.blocks) {
    if (b === parade || !rng.chance(0.3)) continue;
    const open = rng.int(b.tx + 3, b.tx + b.w - 5);
    for (let x = b.tx; x < b.tx + b.w; x++) if (x < open || x > open + 2) { world.put(x, b.ty, T.FENCE); world.put(x, b.ty + b.h - 1, T.FENCE); }
    b.fenced = true;
    b.ty += 1; b.h -= 2;
  }
  return { blocks: grid.blocks.filter(b => b.zone !== 'parade'), roads: grid.roads, yards, bossArena: null, margin, bands: grid.bands,
    special: { gates, parade, fence: { x0: f0, y0: f0, x1: f1x, y1: f1y } } };
}

function wgLayoutIndustrial(g) {
  const { world, rng, map } = g;
  const margin = 9;
  wgl_base(g, T.GRAVEL, T.FENCE);
  const grid = wgl_grid(g, { margin, roadW: 4, sidewalk: false, roadTile: T.ROAD, lineTile: null, blockMin: 22, blockMax: 30,
    blockTile: () => T.GRAVEL });
  const W = world.w, H = world.h;
  // rail line along the south margin
  const railY = H - 6;
  wgl_fill(world, 3, railY - 1, W - 6, 3, T.GRAVEL);
  world.rails.push({ tx: 3, ty: railY, w: W - 6, h: 1, dir: 'h' });
  const yards = [];
  const blocks = grid.blocks;
  for (const b of blocks) b.zone = 'industrial';
  // one or two blocks become tank farms / dump yards
  const yardCount = Math.max(1, Math.round(blocks.length / 8));
  const shuffled = rng.shuffle(blocks.slice());
  for (let k = 0; k < yardCount && k < shuffled.length; k++) {
    const b = shuffled[k];
    b.zone = 'yard';
    yards.push({ tx: b.tx, ty: b.ty, w: b.w, h: b.h, kind: 'tankfarm' });
  }
  // toxic pools inside yards / margins
  const pools = [];
  const nPools = Number.isFinite(map && map.toxicZones) ? map.toxicZones : 4;
  for (let k = 0; k < nPools; k++) {
    const src = yards.length && k < yards.length * 2 ? yards[k % yards.length] : rng.pick(blocks);
    const r = rng.int(2, 4);
    const x = src.tx + rng.int(r + 1, Math.max(r + 1, src.w - r - 2)), y = src.ty + rng.int(r + 1, Math.max(r + 1, src.h - r - 2));
    pools.push({ tx: x, ty: y, r });
  }
  // mud/rubble patches on the gravel
  for (let k = 0; k < 24; k++) {
    const b = rng.pick(blocks);
    wgl_blob(world, rng, b.tx + rng.int(0, b.w - 1), b.ty + rng.int(0, b.h - 1), rng.int(1, 2), T.RUBBLE, [T.GRAVEL]);
  }
  return { blocks: blocks.filter(b => b.zone !== 'yard'), roads: grid.roads, yards, bossArena: null, margin, bands: grid.bands,
    special: { pools, railY } };
}

function wgLayoutCampus(g) {
  const { world, rng } = g;
  const margin = 9;
  wgl_base(g, T.GRASS, T.WALL);
  const grid = wgl_grid(g, { margin, roadW: 2, sidewalk: true, roadTile: T.ROAD, lineTile: null, blockMin: 19, blockMax: 25,
    blockTile: () => T.GRASS });
  const blocks = grid.blocks;
  const nx = Math.max(...blocks.map(b => b.i)) + 1, ny = Math.max(...blocks.map(b => b.j)) + 1;
  // quad: the most central block becomes a lawn with cross paths
  const cx = world.w / 2, cy = world.h / 2;
  const quad = blocks.slice().sort((a, b) => Math.hypot(a.tx + a.w / 2 - cx, a.ty + a.h / 2 - cy) - Math.hypot(b.tx + b.w / 2 - cx, b.ty + b.h / 2 - cy))[0];
  quad.zone = 'quad';
  const yards = [{ tx: quad.tx, ty: quad.ty, w: quad.w, h: quad.h, kind: 'quad' }];
  const mx = quad.tx + (quad.w >> 1), my = quad.ty + (quad.h >> 1);
  wgl_fill(world, mx - 1, quad.ty, 2, quad.h, T.SIDEWALK);
  wgl_fill(world, quad.tx, my - 1, quad.w, 2, T.SIDEWALK);
  for (let a = 0; a < Math.PI * 2; a += 0.05) world.put(Math.round(mx + Math.cos(a) * 5), Math.round(my + Math.sin(a) * 5), T.SIDEWALK);
  // boss arena: merge the two blocks of a corner row (pick the corner farthest from the quad)
  const corners = [
    { i: nx - 2, j: ny - 1 }, { i: 0, j: ny - 1 }, { i: nx - 2, j: 0 }, { i: 0, j: 0 },
  ];
  const corner = rng.pick(corners);
  const a = blocks.find(b => b.i === corner.i && b.j === corner.j);
  const bb = blocks.find(b => b.i === corner.i + 1 && b.j === corner.j);
  let bossArena = null;
  if (a && bb && a !== quad && bb !== quad) {
    bossArena = { tx: a.tx, ty: a.ty, w: bb.tx + bb.w - a.tx, h: Math.min(a.h, bb.h) };
    a.zone = 'arena'; bb.zone = 'arena';
    wgl_fill(world, bossArena.tx, bossArena.ty, bossArena.w, bossArena.h, T.GRAVEL);
  }
  for (const b of blocks) if (!b.zone) b.zone = 'lab';
  // sparse rubble: signs of the outbreak
  for (let k = 0; k < 10; k++) {
    const r = rng.pick(grid.roads);
    wgl_blob(world, rng, r.tx + rng.int(0, r.w - 1), r.ty + rng.int(0, r.h - 1), 1, T.RUBBLE, [T.ROAD, T.SIDEWALK]);
  }
  return { blocks: blocks.filter(b => b.zone === 'lab'), roads: grid.roads, yards, bossArena, margin, bands: grid.bands, special: { quad } };
}


// ===== 08_world.js =====
// 08_world.js — tile codes, tile predicates, class World and the reachability BFS (SPEC §9, §9.1).
// Public API: T, tileBlocksMove, tileBlocksSight, tileBlocksBullets, tileSpeedMul, class World, wgReachability.
// Decisions: containers stand on walkable FLOOR tiles (they are interactive objects, not obstacles), so they
//   can never cut a room in two. World keeps a per-tile building index (buildingGrid) for O(1) buildingAt().
// Dependencies: 00_util.js (TILE, dist2), 03_data_maps.js (MAPS, read at runtime).

const T = {
  VOID: 0, GROUND: 1, ROAD: 2, FLOOR: 3, WALL: 4, DOOR_CLOSED: 5, DOOR_OPEN: 6, WINDOW: 7, WATER: 8,
  RUBBLE: 9, GRASS: 10, TOXIC: 11, FENCE: 12, BARRICADE: 13, PROP_SOLID: 14, PROP_LOW: 15,
  ROAD_LINE: 16, SIDEWALK: 17, DOOR_LOCKED: 18, GRAVEL: 19,
};

const WD_MOVE = new Uint8Array(32);
const WD_SIGHT = new Uint8Array(32);
const WD_BULLET = new Uint8Array(32);
const WD_SPEED = new Float32Array(32).fill(1);
for (const t of [T.VOID, T.WALL, T.DOOR_CLOSED, T.DOOR_LOCKED, T.WINDOW, T.WATER, T.FENCE, T.BARRICADE, T.PROP_SOLID, T.PROP_LOW]) WD_MOVE[t] = 1;
for (const t of [T.VOID, T.WALL, T.DOOR_CLOSED, T.DOOR_LOCKED, T.BARRICADE, T.PROP_SOLID]) { WD_SIGHT[t] = 1; WD_BULLET[t] = 1; }
WD_SPEED[T.RUBBLE] = 0.6; WD_SPEED[T.TOXIC] = 0.6;

function tileBlocksMove(t) { return WD_MOVE[t] === 1; }
function tileBlocksSight(t) { return WD_SIGHT[t] === 1; }
function tileBlocksBullets(t) { return WD_BULLET[t] === 1; }
function tileSpeedMul(t) { return WD_SPEED[t] || 1; }
function tileIsDoor(t) { return t === T.DOOR_CLOSED || t === T.DOOR_OPEN || t === T.DOOR_LOCKED; }

class World {
  constructor(mapId, seed, w, h) {
    this.mapId = mapId;
    this.map = (typeof MAPS !== 'undefined' && MAPS[mapId]) || null;
    this.seed = seed;
    this.w = w | 0; this.h = h | 0;
    this.tiles = new Uint8Array(this.w * this.h);
    this.tileVariant = new Uint8Array(this.w * this.h);
    this.buildingGrid = new Int16Array(this.w * this.h).fill(-1);
    this.buildings = [];
    this.props = [];
    this.containers = [];
    this.floorLoot = [];
    this.playerSpawn = { x: 0, y: 0 };
    this.zombieSpawns = [];
    this.extractions = [];
    this.pois = [];
    this.lights = [];
    this.toxicZones = [];
    this.bossArena = null;
    this.roads = [];
    this.rails = [];
    this.version = 0;
    this.dirtyChunks = new Set();
  }
  get pixelW() { return this.w * TILE; }
  get pixelH() { return this.h * TILE; }
  inBounds(tx, ty) { return tx >= 0 && ty >= 0 && tx < this.w && ty < this.h; }
  tile(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= this.w || ty >= this.h) return T.VOID;
    return this.tiles[ty * this.w + tx];
  }
  setTile(tx, ty, code) {
    if (tx < 0 || ty < 0 || tx >= this.w || ty >= this.h) return;
    const i = ty * this.w + tx;
    if (this.tiles[i] === code) return;
    this.tiles[i] = code;
    this.version++;
    this.dirtyChunks.add((tx >> 4) + ',' + (ty >> 4));
  }
  // Raw write without versioning (generator only).
  put(tx, ty, code) { if (tx >= 0 && ty >= 0 && tx < this.w && ty < this.h) this.tiles[ty * this.w + tx] = code; }
  blocksMove(tx, ty) { return WD_MOVE[this.tile(tx, ty)] === 1; }
  blocksSight(tx, ty) { return WD_SIGHT[this.tile(tx, ty)] === 1; }
  blocksBullets(tx, ty) { return WD_BULLET[this.tile(tx, ty)] === 1; }
  speedMul(tx, ty) { return WD_SPEED[this.tile(tx, ty)] || 1; }
  isWalkable(tx, ty) { return WD_MOVE[this.tile(tx, ty)] !== 1; }
  buildingIndexAtTile(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= this.w || ty >= this.h) return -1;
    return this.buildingGrid[ty * this.w + tx];
  }
  buildingAt(x, y) {
    const i = this.buildingIndexAtTile(Math.floor(x / TILE), Math.floor(y / TILE));
    return i >= 0 ? this.buildings[i] || null : null;
  }
  isIndoor(x, y) {
    const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
    return this.tile(tx, ty) === T.FLOOR || this.buildingIndexAtTile(tx, ty) >= 0;
  }
  indexBuilding(b, idx) {
    for (let y = b.ty; y < b.ty + b.h; y++) for (let x = b.tx; x < b.tx + b.w; x++) {
      if (this.inBounds(x, y)) this.buildingGrid[y * this.w + x] = idx;
    }
  }
  containerAt(x, y, r) {
    let best = null, bd = r * r;
    for (const c of this.containers) {
      const d = dist2(x, y, c.x, c.y);
      if (d <= bd) { bd = d; best = c; }
    }
    return best;
  }
  serializeDoors() {
    const out = [];
    for (let i = 0; i < this.tiles.length; i++) if (this.tiles[i] === T.DOOR_OPEN) out.push(i);
    return out;
  }
}

// BFS over walkable tiles; closed and locked doors count as walkable (SPEC §9 item 10).
function wgReachability(world, fromTx, fromTy) {
  const w = world.w, h = world.h, n = w * h;
  const seen = new Uint8Array(n);
  if (fromTx < 0 || fromTy < 0 || fromTx >= w || fromTy >= h) return seen;
  const queue = new Int32Array(n);
  let head = 0, tail = 0;
  const start = fromTy * w + fromTx;
  seen[start] = 1; queue[tail++] = start;
  const tiles = world.tiles;
  while (head < tail) {
    const i = queue[head++];
    const x = i % w, y = (i - x) / w;
    for (let k = 0; k < 4; k++) {
      const nx = k === 0 ? x + 1 : k === 1 ? x - 1 : x;
      const ny = k === 2 ? y + 1 : k === 3 ? y - 1 : y;
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const j = ny * w + nx;
      if (seen[j]) continue;
      const t = tiles[j];
      if (WD_MOVE[t] === 1 && t !== T.DOOR_CLOSED && t !== T.DOOR_LOCKED) continue;
      seen[j] = 1; queue[tail++] = j;
    }
  }
  return seen;
}


// ===== 09_collision.js =====
// 09_collision.js — Physics (tile collision, raycasts), SpatialHash, Nav (flow field + A*) (SPEC §10).
// Decisions: the flow field uses integer costs orth 2 / diag 3 (≈ √2), ×2 on RUBBLE/TOXIC, ×4 on closed doors;
//   locked doors are impassable for navigation (zombies never open them, so routing through them would
//   strand zombies). dirAt() steers toward the centre of the next tile (smoother than the raw direction).
// Dependencies: 00_util.js, 08_world.js (T, tile predicates).

const NAV_DX = [1, -1, 0, 0, 1, 1, -1, -1];
const NAV_DY = [0, 0, 1, -1, 1, -1, 1, -1];

class Physics {
  static _circleBlocked(world, x, y, r) {
    const x0 = Math.floor((x - r) / TILE), x1 = Math.floor((x + r) / TILE);
    const y0 = Math.floor((y - r) / TILE), y1 = Math.floor((y + r) / TILE);
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        if (!world.blocksMove(tx, ty)) continue;
        if (circleRectOverlap(x, y, r, tx * TILE, ty * TILE, TILE, TILE)) return true;
      }
    }
    return false;
  }

  static moveCircle(world, x, y, r, dx, dy) {
    if (!world || !Number.isFinite(dx) || !Number.isFinite(dy)) return { x, y, collided: false };
    const dmax = Math.max(Math.abs(dx), Math.abs(dy));
    const steps = Math.min(8, Math.max(1, Math.ceil(dmax / Math.max(2, r * 0.45))));
    const sx = dx / steps, sy = dy / steps;
    let collided = false;
    for (let i = 0; i < steps; i++) {
      if (sx !== 0) {
        const nx = x + sx;
        if (!Physics._circleBlocked(world, nx, y, r)) x = nx;
        else {
          collided = true;
          // Approach the wall in two halving steps to minimise the visible gap.
          let part = sx * 0.5;
          for (let k = 0; k < 2; k++) {
            if (!Physics._circleBlocked(world, x + part, y, r)) x += part;
            part *= 0.5;
          }
        }
      }
      if (sy !== 0) {
        const ny = y + sy;
        if (!Physics._circleBlocked(world, x, ny, r)) y = ny;
        else {
          collided = true;
          let part = sy * 0.5;
          for (let k = 0; k < 2; k++) {
            if (!Physics._circleBlocked(world, x, y + part, r)) y += part;
            part *= 0.5;
          }
        }
      }
    }
    return { x, y, collided };
  }

  // Amanatides–Woo grid traversal. Ignores the start tile.
  static raycastTiles(world, x0, y0, x1, y1, blockFn = tileBlocksBullets) {
    const dx = x1 - x0, dy = y1 - y0;
    const len = Math.hypot(dx, dy);
    let tx = Math.floor(x0 / TILE), ty = Math.floor(y0 / TILE);
    const ex = Math.floor(x1 / TILE), ey = Math.floor(y1 / TILE);
    if (len < 1e-6) return { hit: false, x: x1, y: y1, tx: ex, ty: ey, dist: 0, tile: world.tile(ex, ey) };
    const stepX = dx > 0 ? 1 : -1, stepY = dy > 0 ? 1 : -1;
    const tDeltaX = dx !== 0 ? Math.abs(TILE / dx) : Infinity;
    const tDeltaY = dy !== 0 ? Math.abs(TILE / dy) : Infinity;
    let tMaxX = dx !== 0 ? ((stepX > 0 ? (tx + 1) * TILE - x0 : x0 - tx * TILE) / Math.abs(dx)) : Infinity;
    let tMaxY = dy !== 0 ? ((stepY > 0 ? (ty + 1) * TILE - y0 : y0 - ty * TILE) / Math.abs(dy)) : Infinity;
    let guard = 0;
    while ((tx !== ex || ty !== ey) && guard++ < 512) {
      let t;
      if (tMaxX < tMaxY) { t = tMaxX; tMaxX += tDeltaX; tx += stepX; }
      else { t = tMaxY; tMaxY += tDeltaY; ty += stepY; }
      if (t > 1) break;
      const tile = world.tile(tx, ty);
      if (blockFn(tile)) {
        const hx = x0 + dx * t, hy = y0 + dy * t;
        return { hit: true, x: hx, y: hy, tx, ty, dist: len * t, tile };
      }
    }
    return { hit: false, x: x1, y: y1, tx: ex, ty: ey, dist: len, tile: world.tile(ex, ey) };
  }

  static lineOfSight(world, x0, y0, x1, y1) {
    if (!world) return false;
    return !Physics.raycastTiles(world, x0, y0, x1, y1, tileBlocksSight).hit;
  }

  static circleHit(ax, ay, ar, bx, by, br) {
    const r = ar + br;
    return dist2(ax, ay, bx, by) <= r * r;
  }

  static segmentCircle(x0, y0, x1, y1, cx, cy, r) {
    const dx = x1 - x0, dy = y1 - y0;
    const fx = x0 - cx, fy = y0 - cy;
    const a = dx * dx + dy * dy;
    const c = fx * fx + fy * fy - r * r;
    if (c <= 0) return 0;
    if (a < 1e-9) return -1;
    const b = 2 * (fx * dx + fy * dy);
    const disc = b * b - 4 * a * c;
    if (disc < 0) return -1;
    const sq = Math.sqrt(disc);
    const t = (-b - sq) / (2 * a);
    if (t >= 0 && t <= 1) return t;
    return -1;
  }

  static resolveCircles(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const r = (a.radius || 0) + (b.radius || 0);
    const d2 = dx * dx + dy * dy;
    if (d2 >= r * r) return false;
    let d = Math.sqrt(d2);
    let nx, ny;
    if (d < 1e-4) { nx = 1; ny = 0; d = 0; } else { nx = dx / d; ny = dy / d; }
    const push = (r - d) * 0.5;
    a.x -= nx * push; a.y -= ny * push;
    b.x += nx * push; b.y += ny * push;
    return true;
  }
}

class SpatialHash {
  constructor(cellSize = 96) {
    this.cell = cellSize;
    this.buckets = new Map();
    this.used = [];
  }
  _key(cx, cy) { return (cx + 1024) * 4096 + (cy + 1024); }
  clear() {
    for (const b of this.used) b.length = 0;
    this.used.length = 0;
  }
  insert(e) {
    if (!e) return;
    const cx = Math.floor(e.x / this.cell), cy = Math.floor(e.y / this.cell);
    const k = this._key(cx, cy);
    let b = this.buckets.get(k);
    if (!b) { b = []; this.buckets.set(k, b); }
    if (b.length === 0) this.used.push(b);
    b.push(e);
    e._hashKey = k;
  }
  remove(e) {
    if (!e || e._hashKey === undefined) return;
    const b = this.buckets.get(e._hashKey);
    if (b) { const i = b.indexOf(e); if (i >= 0) b.splice(i, 1); }
    e._hashKey = undefined;
  }
  update(e) {
    const k = this._key(Math.floor(e.x / this.cell), Math.floor(e.y / this.cell));
    if (k !== e._hashKey) { this.remove(e); this.insert(e); }
  }
  queryRect(x, y, w, h, out) {
    const res = out || [];
    const cx0 = Math.floor(x / this.cell), cx1 = Math.floor((x + w) / this.cell);
    const cy0 = Math.floor(y / this.cell), cy1 = Math.floor((y + h) / this.cell);
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      const b = this.buckets.get(this._key(cx, cy));
      if (b) for (let i = 0; i < b.length; i++) res.push(b[i]);
    }
    return res;
  }
  query(x, y, r, out) { return this.queryRect(x - r, y - r, r * 2, r * 2, out); }
  forEachNear(x, y, r, fn) {
    const list = this.query(x, y, r);
    for (const e of list) fn(e);
  }
}

class Nav {
  constructor(world) {
    this.world = world;
    const n = world ? world.w * world.h : 1;
    this.dist = new Int32Array(n).fill(-1);
    this.dir = new Uint8Array(n);
    this.touched = new Int32Array(n);
    this.touchedCount = 0;
    this.lastTarget = -1;
    this.gScore = new Float64Array(n);
    this.cameFrom = new Int32Array(n);
    this.stamp = new Uint16Array(n);
    this.closedStamp = new Uint16Array(n);
    this.gen = 0;
    this.heap = new Int32Array(n + 16);
    this.heapF = new Float64Array(n + 16);
    this.heapSize = 0;
    this.buckets = [];
    for (let i = 0; i < 16; i++) this.buckets.push([]);
  }

  _stepCost(t) {
    if (t === T.DOOR_CLOSED) return 4;
    if (t === T.RUBBLE || t === T.TOXIC) return 2;
    return 1;
  }
  _navPassable(t) { return WD_MOVE[t] !== 1 || t === T.DOOR_CLOSED; }

  rebuild(targetX, targetY, maxRadiusTiles = 60) {
    const world = this.world;
    if (!world) return;
    const w = world.w, h = world.h;
    const ttx = clamp(Math.floor(targetX / TILE), 0, w - 1), tty = clamp(Math.floor(targetY / TILE), 0, h - 1);
    const target = tty * w + ttx;
    if (target === this.lastTarget && this.lastVersion === world.version) return;
    this.lastTarget = target; this.lastVersion = world.version;
    // reset only touched cells
    for (let i = 0; i < this.touchedCount; i++) { const c = this.touched[i]; this.dist[c] = -1; this.dir[c] = 0; }
    this.touchedCount = 0;
    const tiles = world.tiles;
    const R = maxRadiusTiles;
    const buckets = this.buckets;
    for (const b of buckets) b.length = 0;
    const NB = buckets.length;
    this.dist[target] = 0;
    this.touched[this.touchedCount++] = target;
    buckets[0].push(target);
    let cur = 0, pending = 1, guard = 0;
    const cap = (2 * R + 1) * (2 * R + 1) * 4;
    while (pending > 0 && guard++ < cap) {
      const bucket = buckets[cur % NB];
      if (bucket.length === 0) { cur++; continue; }
      const i = bucket.pop(); pending--;
      const d = this.dist[i];
      if (d !== cur) continue; // stale entry
      const x = i % w, y = (i - x) / w;
      for (let k = 0; k < 8; k++) {
        const nx = x + NAV_DX[k], ny = y + NAV_DY[k];
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        if (Math.abs(nx - ttx) > R || Math.abs(ny - tty) > R) continue;
        const j = ny * w + nx;
        const t = tiles[j];
        if (!this._navPassable(t)) continue;
        if (k >= 4) { // no corner cutting
          if (!this._navPassable(tiles[y * w + nx]) || !this._navPassable(tiles[ny * w + x])) continue;
          if (tiles[y * w + nx] === T.DOOR_CLOSED || tiles[ny * w + x] === T.DOOR_CLOSED) continue;
        }
        const nd = d + (k >= 4 ? 3 : 2) * this._stepCost(t);
        const old = this.dist[j];
        if (old === -1 || nd < old) {
          if (old === -1) this.touched[this.touchedCount++] = j;
          this.dist[j] = nd;
          this.dir[j] = 0;
          buckets[nd % NB].push(j);
          pending++;
        }
      }
    }
    if (guard >= cap) Log.warn('Nav.rebuild: iteration cap reached');
    // direction pass
    for (let n = 0; n < this.touchedCount; n++) {
      const i = this.touched[n];
      const d = this.dist[i];
      if (d <= 0) continue;
      const x = i % w, y = (i - x) / w;
      let best = -1, bestD = d;
      for (let k = 0; k < 8; k++) {
        const nx = x + NAV_DX[k], ny = y + NAV_DY[k];
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const j = ny * w + nx;
        const dj = this.dist[j];
        if (dj < 0 || dj >= bestD) continue;
        if (k >= 4) {
          if (!this._navPassable(tiles[y * w + nx]) || !this._navPassable(tiles[ny * w + x])) continue;
          if (tiles[y * w + nx] === T.DOOR_CLOSED || tiles[ny * w + x] === T.DOOR_CLOSED) continue;
        }
        bestD = dj; best = k;
      }
      this.dir[i] = best + 1;
    }
  }

  dirAt(x, y) {
    const world = this.world;
    if (!world) return null;
    const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
    if (!world.inBounds(tx, ty)) return null;
    const i = ty * world.w + tx;
    if (this.dist[i] < 0) return null;
    const k = this.dir[i] - 1;
    if (k < 0) return null;
    const cx = (tx + NAV_DX[k] + 0.5) * TILE, cy = (ty + NAV_DY[k] + 0.5) * TILE;
    let dx = cx - x, dy = cy - y;
    let l = Math.hypot(dx, dy);
    if (l < 2) { dx = NAV_DX[k]; dy = NAV_DY[k]; l = Math.hypot(dx, dy); }
    return { dx: dx / l, dy: dy / l };
  }

  distAt(x, y) {
    const world = this.world;
    if (!world) return Infinity;
    const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
    if (!world.inBounds(tx, ty)) return Infinity;
    const d = this.dist[ty * world.w + tx];
    return d < 0 ? Infinity : d;
  }

  _heapPush(i, f) {
    let n = this.heapSize++;
    const H = this.heap, F = this.heapF;
    H[n] = i; F[n] = f;
    while (n > 0) {
      const p = (n - 1) >> 1;
      if (F[p] <= F[n]) break;
      const ti = H[p]; H[p] = H[n]; H[n] = ti;
      const tf = F[p]; F[p] = F[n]; F[n] = tf;
      n = p;
    }
  }
  _heapPop() {
    const H = this.heap, F = this.heapF;
    const top = H[0];
    const last = --this.heapSize;
    if (last > 0) {
      H[0] = H[last]; F[0] = F[last];
      let n = 0;
      for (;;) {
        const l = 2 * n + 1, r = l + 1;
        let m = n;
        if (l < last && F[l] < F[m]) m = l;
        if (r < last && F[r] < F[m]) m = r;
        if (m === n) break;
        const ti = H[m]; H[m] = H[n]; H[n] = ti;
        const tf = F[m]; F[m] = F[n]; F[n] = tf;
        n = m;
      }
    }
    return top;
  }

  findPath(x0, y0, x1, y1, maxNodes = 4000) {
    const world = this.world;
    if (!world) return null;
    const w = world.w, h = world.h;
    const sx = Math.floor(x0 / TILE), sy = Math.floor(y0 / TILE);
    const gx = Math.floor(x1 / TILE), gy = Math.floor(y1 / TILE);
    if (!world.inBounds(sx, sy) || !world.inBounds(gx, gy)) return null;
    const tiles = world.tiles;
    const goal = gy * w + gx;
    if (!this._navPassable(tiles[goal]) && tiles[goal] !== T.DOOR_LOCKED) return null;
    this.gen = (this.gen + 1) & 0xffff;
    if (this.gen === 0) { this.stamp.fill(0); this.closedStamp.fill(0); this.gen = 1; }
    const gen = this.gen;
    const start = sy * w + sx;
    this.heapSize = 0;
    this.stamp[start] = gen; this.gScore[start] = 0; this.cameFrom[start] = -1;
    const hfn = (x, y) => { const dx = Math.abs(x - gx), dy = Math.abs(y - gy); return (dx + dy) + (1.4142 - 2) * Math.min(dx, dy); };
    this._heapPush(start, hfn(sx, sy));
    let expanded = 0;
    while (this.heapSize > 0) {
      const i = this._heapPop();
      if (this.closedStamp[i] === gen) continue;
      this.closedStamp[i] = gen;
      if (i === goal) {
        const out = [];
        let c = i, guard = 0;
        while (c !== start && c >= 0 && guard++ < 100000) {
          const cx = c % w, cy = (c - cx) / w;
          out.push({ x: (cx + 0.5) * TILE, y: (cy + 0.5) * TILE });
          c = this.cameFrom[c];
        }
        out.reverse();
        return out;
      }
      if (++expanded > maxNodes) return null;
      const x = i % w, y = (i - x) / w;
      const g = this.gScore[i];
      for (let k = 0; k < 8; k++) {
        const nx = x + NAV_DX[k], ny = y + NAV_DY[k];
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const j = ny * w + nx;
        const t = tiles[j];
        if (!this._navPassable(t) && !(j === goal && t === T.DOOR_LOCKED)) continue;
        if (k >= 4) {
          if (WD_MOVE[tiles[y * w + nx]] === 1 || WD_MOVE[tiles[ny * w + x]] === 1) continue;
        }
        const step = (k >= 4 ? 1.4142 : 1) * (t === T.DOOR_CLOSED ? 3 : (t === T.RUBBLE || t === T.TOXIC) ? 2 : 1);
        const ng = g + step;
        if (this.stamp[j] !== gen || ng < this.gScore[j]) {
          this.stamp[j] = gen; this.gScore[j] = ng; this.cameFrom[j] = i;
          this._heapPush(j, ng + hfn(nx, ny));
        }
      }
    }
    return null;
  }

  randomWalkable(rng, nearX, nearY, radiusTiles) {
    const world = this.world;
    if (!world || !rng) return null;
    const cx = Math.floor(nearX / TILE), cy = Math.floor(nearY / TILE);
    for (let i = 0; i < 20; i++) {
      const tx = cx + rng.int(-radiusTiles, radiusTiles), ty = cy + rng.int(-radiusTiles, radiusTiles);
      if (world.isWalkable(tx, ty)) return { x: (tx + 0.5) * TILE, y: (ty + 0.5) * TILE };
    }
    return null;
  }
}


// ===== 10_items_inventory.js =====
// 10_items_inventory.js — Items (instances, stats text, serialization), Inventory (grid slots), Equipment (SPEC §11).
// Decisions: Items.describe returns German tooltip lines; Inventory.sort keeps stacks merged; Equipment.protection()
//   reports {body, head} protection of non-broken armor (Player combines them, §14).
// Dependencies: 00_util.js, 01_data_items.js (ITEMS, RARITY, CATEGORY_NAMES), all at runtime.

const INV_CAT_ORDER = ['weapon', 'grenade', 'ammo', 'armor', 'backpack', 'medical', 'food', 'water', 'key', 'mission', 'collectible', 'electronics', 'tool', 'material'];

class Items {
  static def(instOrId) {
    if (!instOrId || typeof ITEMS === 'undefined') return null;
    const id = typeof instOrId === 'string' ? instOrId : instOrId.id;
    return (id && ITEMS[id]) || null;
  }
  static create(id, count = 1) {
    const def = Items.def(id);
    if (!def) { Log.warn('Items.create: unknown item id', id); return null; }
    const stack = Math.max(1, def.stack || 1);
    const n = clamp(Math.floor(Number(count) || 1), 1, stack);
    const inst = { uid: Uid.next(), id: def.id, count: n };
    if (def.durabilityMax) inst.durability = def.durabilityMax;
    if (def.weapon && def.weapon.class !== 'melee' && def.weapon.ammo) {
      inst.mag = def.weapon.magSize || 0;
      inst.ammoId = Items.standardAmmoFor(def.weapon.ammo);
    }
    return inst;
  }
  static clone(inst) {
    if (!inst) return null;
    const c = { uid: Uid.next(), id: inst.id, count: inst.count };
    if (inst.durability !== undefined) c.durability = inst.durability;
    if (inst.mag !== undefined) c.mag = inst.mag;
    if (inst.ammoId !== undefined) c.ammoId = inst.ammoId;
    if (inst.raidFound) c.raidFound = true;
    return c;
  }
  static canStack(a, b) {
    if (!a || !b || a.id !== b.id) return false;
    const def = Items.def(a);
    if (!def || (def.stack || 1) <= 1) return false;
    return a.durability === undefined && b.durability === undefined;
  }
  static stackMax(inst) { const d = Items.def(inst); return d ? Math.max(1, d.stack || 1) : 1; }
  static weight(inst) { const d = Items.def(inst); return d ? (d.weight || 0) * (inst.count || 1) : 0; }
  static value(inst) {
    const d = Items.def(inst);
    if (!d) return 0;
    let v = (d.value || 0) * (inst.count || 1);
    if (inst.durability !== undefined && d.durabilityMax) v *= 0.4 + 0.6 * clamp(inst.durability / d.durabilityMax, 0, 1);
    return v;
  }
  static rarity(inst) { const d = Items.def(inst); return (d && typeof RARITY !== 'undefined' && RARITY[d.rarity]) || (typeof RARITY !== 'undefined' ? RARITY.common : { id: 'common', color: '#9aa4ad', name: 'Gewöhnlich', order: 0 }); }
  static isWeapon(inst) { const d = Items.def(inst); return !!(d && d.weapon); }
  static isArmor(inst) { const d = Items.def(inst); return !!(d && d.armor); }
  static isUsable(inst) { const d = Items.def(inst); return !!(d && (d.medical || d.food || d.water)); }
  static isAmmo(inst) { const d = Items.def(inst); return !!(d && d.ammo); }
  static isGrenade(inst) { const d = Items.def(inst); return !!(d && (d.grenade || d.cat === 'grenade')); }
  static standardAmmoFor(caliber) {
    if (!caliber || typeof ITEMS === 'undefined') return null;
    let fallback = null;
    for (const d of Object.values(ITEMS)) {
      if (!d.ammo || d.ammo.caliber !== caliber) continue;
      if (d.ammo.label === 'Standard') return d.id;
      if (!fallback) fallback = d.id;
    }
    return fallback;
  }
  static weaponClassName(cls) {
    return { pistol: 'Pistole', smg: 'Maschinenpistole', rifle: 'Sturmgewehr', shotgun: 'Schrotflinte', sniper: 'Präzisionsgewehr', lmg: 'Leichtes MG', melee: 'Nahkampfwaffe' }[cls] || cls;
  }
  static describe(inst) {
    const d = Items.def(inst);
    if (!d) return [];
    const L = [];
    const pct = v => Math.round(v * 100) + ' %';
    const num = v => String(Math.round(v * 10) / 10).replace('.', ',');
    if (d.weapon) {
      const w = d.weapon;
      L.push('Typ: ' + Items.weaponClassName(w.class));
      if (w.class === 'melee') {
        L.push('Schaden: ' + w.damage);
        L.push('Reichweite: ' + Math.round((w.meleeRange || 60) / TILE * 10) / 10 + ' m');
        L.push('Schlagzeit: ' + num(w.swingTime || 0.5) + ' s');
