      const R = Math.min(W, H) * 0.42;
      for (const hd of se.hitDirs) {
        ctx.strokeStyle = 'rgba(255,40,40,' + clamp(hd.ttl / 0.8, 0, 1).toFixed(3) + ')';
        ctx.lineWidth = 8;
        ctx.beginPath(); ctx.arc(sp.x, sp.y, R, hd.angle - 0.44, hd.angle + 0.44); ctx.stroke();
      }
    }
    // hit marker
    if (se.hitMarker > 0) {
      const m = this.game.input ? this.game.input.mouse : { x: W / 2, y: H / 2 };
      const cx = this.game.input && this.game.input.touchMode && p ? cam.worldToScreen(p.x + Math.cos(p.angle) * 120, p.y + Math.sin(p.angle) * 120).x : m.x;
      const cy = this.game.input && this.game.input.touchMode && p ? cam.worldToScreen(p.x + Math.cos(p.angle) * 120, p.y + Math.sin(p.angle) * 120).y : m.y;
      ctx.strokeStyle = 'rgba(255,255,255,' + clamp(se.hitMarker / 0.12, 0, 1).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { ctx.moveTo(cx + dx * 5, cy + dy * 5); ctx.lineTo(cx + dx * 11, cy + dy * 11); }
      ctx.stroke();
    }
    // flashbang
    if (se.flash > 0.01) { ctx.fillStyle = 'rgba(255,255,255,' + clamp(se.flash, 0, 1).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
    ctx.restore();
  }

  _drawArrows(ctx, raid, cam, t) {
    const p = raid.player;
    if (!p) return;
    const W = this.w, H = this.h, m = 34;
    const targets = [];
    for (const e of raid.extraction.points) if (e.active && e.state !== 'done') targets.push({ x: e.x, y: e.y, col: '#59ff9c', label: e.name });
    for (const mt of this._missionTargets(raid)) targets.push({ x: mt.x, y: mt.y, col: '#ffd14a', label: mt.label });
    ctx.save();
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    for (const tg of targets) {
      const s = cam.worldToScreen(tg.x, tg.y);
      if (s.x > m && s.y > m && s.x < W - m && s.y < H - m) continue;
      const cx = W / 2, cy = H / 2;
      const a = Math.atan2(s.y - cy, s.x - cx);
      const kx = (W / 2 - m) / Math.max(0.001, Math.abs(Math.cos(a))), ky = (H / 2 - m) / Math.max(0.001, Math.abs(Math.sin(a)));
      const k = Math.min(kx, ky);
      const ax = cx + Math.cos(a) * k, ay = cy + Math.sin(a) * k;
      ctx.save();
      ctx.translate(ax, ay); ctx.rotate(a);
      ctx.fillStyle = tg.col; ctx.globalAlpha = 0.85 + 0.15 * Math.sin(t * 4);
      ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-6, -8); ctx.lineTo(-6, 8); ctx.closePath(); ctx.fill();
      ctx.restore();
      const dm = Math.round(dist(p.x, p.y, tg.x, tg.y) / TILE);
      ctx.font = '600 11px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = tg.col;
      ctx.fillText(dm + ' m', ax - Math.cos(a) * 22, ay - Math.sin(a) * 22 + 4);
    }
    ctx.restore();
  }

  _drawDebug(ctx, raid) {
    ctx.save();
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(8, this.h - 96, 220, 88);
    ctx.fillStyle = '#9fe870'; ctx.font = '12px ui-monospace, Consolas, monospace'; ctx.textAlign = 'left';
    const g = this.game;
    const lines = [
      'FPS ' + (g.fps || 0).toFixed(0) + '  Draw ' + this.drawCalls,
      'Zombies ' + raid.zombies.aliveCount() + '/' + raid.zombies.zombies.length,
      'Partikel ' + raid.fx.particles.length + '  Projektile ' + raid.weapons.projectiles.length,
      'Chunks ' + this.chunks.size + '  Lichter ' + raid.world.lights.length,
      'Seed ' + raid.seed + '  ' + formatHour(raid.hour),
    ];
    lines.forEach((l, i) => ctx.fillText(l, 16, this.h - 78 + i * 15));
    ctx.restore();
  }

  // ---------------- maps ----------------
  _tileMapColor(world, map, tx, ty) {
    const t = world.tile(tx, ty);
    const pal = (map && map.palette) || {};
    if (world.buildingIndexAtTile(tx, ty) >= 0) return t === T.FLOOR || tileIsDoor(t) ? '#5a5650' : '#8a847a';
    switch (t) {
      case T.VOID: return '#050607';
      case T.ROAD: case T.ROAD_LINE: return '#24272a';
      case T.SIDEWALK: return '#4a4d50';
      case T.GRASS: return pal.grass || '#2f4a2c';
      case T.WATER: return pal.water || '#1f3340';
      case T.TOXIC: return '#4f8a1d';
      case T.FENCE: return '#6a6e72';
      case T.PROP_SOLID: case T.PROP_LOW: case T.BARRICADE: return '#3c3a36';
      case T.GRAVEL: return pal.gravel || '#4d4a44';
      case T.RUBBLE: return '#4a4744';
      case T.WALL: return '#7a746a';
      default: return pal.ground || '#3a3d3f';
    }
  }

  _mapImage(world, map) {
    const c = this._canvas(world.w, world.h);
    const g = c.getContext('2d');
    const img = g.createImageData(world.w, world.h);
    const cache = new Map();
    for (let ty = 0; ty < world.h; ty++) for (let tx = 0; tx < world.w; tx++) {
      const col = this._tileMapColor(world, map, tx, ty);
      let rgb = cache.get(col);
      if (!rgb) {
        const n = parseInt(col.slice(1), 16);
        rgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        cache.set(col, rgb);
      }
      const i = (ty * world.w + tx) * 4;
      img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return c;
  }

  renderMinimap(raid, canvasEl, size = 180) {
    if (!raid || !raid.world || !canvasEl) return;
    const w = raid.world;
    if (!this.miniCache || this.miniCache.world !== w || this.miniCache.version !== w.version) {
      this.miniCache = { world: w, version: w.version, img: this._mapImage(w, raid.map) };
    }
    const dpr = Math.min(2, this.dpr || 1);
    const px = Math.round(size * dpr);
    if (canvasEl.width !== px) { canvasEl.width = px; canvasEl.height = px; }
    const g = canvasEl.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.imageSmoothingEnabled = false;
    const p = raid.player;
    const span = 64; // tiles
    const scale = size / span;
    const cx = p.x / TILE, cy = p.y / TILE;
    g.fillStyle = '#050607'; g.fillRect(0, 0, size, size);
    g.drawImage(this.miniCache.img, cx - span / 2, cy - span / 2, span, span, 0, 0, size, size);
    const toM = (x, y) => ({ x: (x / TILE - cx) * scale + size / 2, y: (y / TILE - cy) * scale + size / 2 });
    // noise markers
    for (const n of raid.noiseMarkers) {
      const m = toM(n.x, n.y);
      g.strokeStyle = 'rgba(255,200,80,' + clamp(n.ttl, 0, 1) * 0.6 + ')'; g.lineWidth = 1;
      g.beginPath(); g.arc(m.x, m.y, (1.2 - n.ttl) * 30 + 3, 0, Math.PI * 2); g.stroke();
    }
    for (const z of raid.zombies.zombies) {
      if (z.dead || dist(z.x, z.y, p.x, p.y) > 320) continue;
      if (z.visibleAlpha !== undefined && z.visibleAlpha < 0.5) continue;
      const m = toM(z.x, z.y);
      g.fillStyle = z.id === 'boss' ? '#ff3a3a' : '#e5484d'; g.fillRect(m.x - 1.5, m.y - 1.5, 3, 3);
    }
    for (const mt of this._missionTargets(raid)) { const m = toM(mt.x, mt.y); this._miniIcon(g, m, size, '#ffd14a'); }
    for (const e of raid.extraction.points) { const m = toM(e.x, e.y); this._miniIcon(g, m, size, e.active && e.state !== 'done' ? '#59ff9c' : '#8a8f94', true); }
    // player arrow
    g.save(); g.translate(size / 2, size / 2); g.rotate(p.angle);
    g.fillStyle = '#ffffff'; g.beginPath(); g.moveTo(7, 0); g.lineTo(-4, -4.5); g.lineTo(-2, 0); g.lineTo(-4, 4.5); g.closePath(); g.fill();
    g.restore();
    g.strokeStyle = 'rgba(255,255,255,0.15)'; g.strokeRect(0.5, 0.5, size - 1, size - 1);
  }

  _miniIcon(g, m, size, col, square) {
    const x = clamp(m.x, 4, size - 4), y = clamp(m.y, 4, size - 4);
    g.fillStyle = col;
    if (square) g.fillRect(x - 3.5, y - 3.5, 7, 7);
    else { g.beginPath(); g.arc(x, y, 3.5, 0, Math.PI * 2); g.fill(); }
    if (x !== m.x || y !== m.y) { g.strokeStyle = col; g.lineWidth = 1; g.strokeRect(x - 5, y - 5, 10, 10); }
  }

  renderFullMap(raid, canvasEl) {
    if (!raid || !raid.world || !canvasEl) return;
    const w = raid.world;
    const rect = canvasEl.getBoundingClientRect ? canvasEl.getBoundingClientRect() : { width: 600, height: 600 };
    const size = Math.max(200, Math.floor(Math.min(rect.width || 600, rect.height || 600)));
    const dpr = Math.min(2, this.dpr || 1);
    canvasEl.width = Math.round(size * dpr); canvasEl.height = Math.round(size * dpr);
    const g = canvasEl.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!this.fullCache || this.fullCache.world !== w || this.fullCache.version !== w.version) this.fullCache = { world: w, version: w.version, img: this._mapImage(w, raid.map) };
    const scale = size / Math.max(w.w, w.h);
    g.fillStyle = '#050607'; g.fillRect(0, 0, size, size);
    g.imageSmoothingEnabled = false;
    g.drawImage(this.fullCache.img, 0, 0, w.w * scale, w.h * scale);
    const toM = (x, y) => ({ x: x / TILE * scale, y: y / TILE * scale });
    g.font = '600 10px "Segoe UI", system-ui, sans-serif'; g.textAlign = 'center';
    for (const b of w.buildings) {
      if (b.w * b.h < 80 && !b.locked) continue;
      const m = toM((b.tx + b.w / 2) * TILE, (b.ty + b.h / 2) * TILE);
      g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillText(b.name, m.x + 1, m.y + 1);
      g.fillStyle = b.locked ? '#ff8080' : 'rgba(230,230,220,0.85)'; g.fillText(b.name, m.x, m.y);
    }
    for (const mt of this._missionTargets(raid)) {
      const m = toM(mt.x, mt.y);
      g.fillStyle = '#ffd14a'; g.beginPath(); g.arc(m.x, m.y, 5, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#ffe9a0'; g.fillText(mt.label, m.x, m.y - 9);
    }
    const showWindows = (this.game.profileMgr && this.game.profileMgr.profile && this.game.profileMgr.profile.upgrades.radio >= 1);
    g.font = 'bold 11px "Segoe UI", system-ui, sans-serif';
    for (const e of raid.extraction.points) {
      const m = toM(e.x, e.y);
      const col = e.active && e.state !== 'done' ? '#59ff9c' : e.state === 'locked' ? '#e5484d' : '#b0b5ba';
      g.strokeStyle = col; g.lineWidth = 2; g.beginPath(); g.arc(m.x, m.y, Math.max(5, e.radius / TILE * scale), 0, Math.PI * 2); g.stroke();
      g.fillStyle = col; g.fillRect(m.x - 3, m.y - 3, 6, 6);
      let label = e.name;
      if (!e.active && e.lockReason) label += ' – ' + e.lockReason;
      if (e.kind === 'timed' && showWindows && e.window) label += ' (' + formatTime(e.window[0]) + '–' + formatTime(e.window[1]) + ')';
      g.fillStyle = 'rgba(0,0,0,0.7)'; g.fillText(label, m.x + 1, m.y - 11);
      g.fillStyle = col; g.fillText(label, m.x, m.y - 12);
    }
    if (w.bossArena) { const m = toM(w.bossArena.x, w.bossArena.y); g.fillStyle = '#ff3a3a'; g.font = 'bold 14px sans-serif'; g.fillText('☠', m.x, m.y + 5); }
    const p = raid.player;
    if (p) {
      const m = toM(p.x, p.y);
      g.save(); g.translate(m.x, m.y); g.rotate(p.angle);
      g.fillStyle = '#ffffff'; g.beginPath(); g.moveTo(9, 0); g.lineTo(-5, -6); g.lineTo(-2, 0); g.lineTo(-5, 6); g.closePath(); g.fill();
      g.restore();
      g.strokeStyle = 'rgba(255,255,255,0.4)'; g.beginPath(); g.arc(m.x, m.y, 12 + Math.sin(this.t * 4) * 2, 0, Math.PI * 2); g.stroke();
    }
  }

  renderMenuBackground(t) {
    const ctx = this.ctx;
    if (!ctx) return;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    const W = this.w, H = this.h;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0b1014'); g.addColorStop(0.6, '#121a1f'); g.addColorStop(1, '#1d1712');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // distant ruined skyline
    ctx.fillStyle = '#0a0d10';
    const base = H * 0.72;
    for (let i = 0; i < 26; i++) {
      const x = (i * 97 + 13) % (W + 120) - 60, bw = 40 + (i * 37) % 70, bh = 60 + (i * 53) % 180;
      ctx.fillRect(x, base - bh, bw, bh + H);
      if (i % 4 === 0) { ctx.fillRect(x + bw * 0.3, base - bh - 18, 6, 18); }
    }
    // glow of fires on the horizon
    const fg = ctx.createRadialGradient(W * 0.7, base, 0, W * 0.7, base, W * 0.5);
    fg.addColorStop(0, 'rgba(255,110,40,0.18)'); fg.addColorStop(1, 'rgba(255,110,40,0)');
    ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H);
    // drifting ash
    if (!this.menuDust) { this.menuDust = []; for (let i = 0; i < 70; i++) this.menuDust.push({ x: Math.random(), y: Math.random(), s: 0.5 + Math.random() * 1.8, v: 0.01 + Math.random() * 0.03 }); }
    ctx.fillStyle = 'rgba(220,210,200,0.45)';
    for (const d of this.menuDust) {
      const x = ((d.x + t * d.v * 0.6) % 1) * W, y = ((d.y + t * d.v) % 1) * H;
      ctx.fillRect(x, y, d.s, d.s);
    }
    this._ensureSprites();
    ctx.globalAlpha = 0.18;
    const ox = (t * 12) % 900;
    for (let x = -ox; x < W; x += 900) ctx.drawImage(this.fogSprite, x, H * 0.45, 900, 600);
    ctx.globalAlpha = 1;
  }
}

function uib_pm(ui) { return ui.game.profileMgr; }
function uib_save(ui) { const pm = uib_pm(ui); if (pm.profile) ui.game.save.save(pm.serialize()); }

function uib_header(ui, title, subtitle) {
  const pm = uib_pm(ui);
  const p = pm.profile;
  const h = uiEl('header', 'screen-header');
  const left = uiEl('div', 'row');
  left.appendChild(uiBtn('← Zurück', 'back', null, { small: true }));
  left.appendChild(uiEl('div', 'screen-title', '<h2>' + uiEsc(title) + '</h2>' + (subtitle ? '<div class="muted">' + uiEsc(subtitle) + '</div>' : '')));
  h.appendChild(left);
  if (p) h.appendChild(uiEl('div', 'header-stats', '<span class="chip credits">' + formatCredits(p.credits) + '</span><span class="chip">Stufe ' + pm.level() + '</span>'));
  return h;
}

function uib_costHtml(ui, cost) {
  const pm = uib_pm(ui);
  const parts = [];
  if (cost.credits) parts.push('<span class="' + (pm.profile.credits >= cost.credits ? '' : 'danger') + '">' + formatCredits(cost.credits) + '</span>');
  for (const it of cost.items || []) {
    const have = pm.stash.count(it.id);
    const d = Items.def(it.id);
    parts.push('<span class="' + (have >= it.count ? '' : 'danger') + '">' + uiEsc(d ? d.name : it.id) + ' ' + have + '/' + it.count + '</span>');
  }
  return parts.join(' · ');
}

function uib_upgradeCard(ui, area, title) {
  const pm = uib_pm(ui);
  const lvl = pm._up(area);
  const card = uiEl('div', 'panel upgrade-card');
  card.appendChild(uiEl('div', 'panel-title', uiEsc(title || PM_AREA_NAMES[area]) + ' <span class="stars">' + '★'.repeat(lvl) + '☆'.repeat(3 - lvl) + '</span>'));
  const cur = lvl > 0 ? upgradeInfo(area, lvl) : null;
  if (cur) card.appendChild(uiEl('p', 'muted', 'Aktiv: ' + uiEsc(cur.desc)));
  if (lvl >= 3) { card.appendChild(uiEl('p', 'good', 'Maximale Stufe erreicht.')); return card; }
  const next = upgradeInfo(area, lvl + 1);
  if (!next) return card;
  card.appendChild(uiEl('p', '', '<b>' + uiEsc(next.name) + '</b> – ' + uiEsc(next.desc)));
  card.appendChild(uiEl('p', 'cost', 'Kosten: ' + uib_costHtml(ui, next.cost || {})));
  const c = pm.canUpgrade(area);
  card.appendChild(uiBtn('Ausbauen', 'upgrade', () => {
    const r = pm.upgrade(area);
    if (r.ok) { ui.toast(next.name + ' gebaut', 'success'); uib_save(ui); } else ui.toast(r.reason, 'warning');
    ui.refresh();
  }, { primary: true, disabled: !c.ok, reason: c.reason }));
  if (!c.ok) card.appendChild(uiEl('div', 'muted small', uiEsc(c.reason)));
  return card;
}

function uib_recipes(ui, station) {
  const pm = uib_pm(ui);
  const wrap = uiEl('div', 'panel');

  if (!rows.length) list.appendChild(uiEl('div', 'muted', 'Keine Rezepte an dieser Station.'));
  for (const { recipe, unlocked } of rows) {
    const out = Items.def(recipe.output.id);
    const item = uiEl('div', 'list-item recipe' + (unlocked ? '' : ' locked'));
    const inputs = recipe.inputs.map(i => { const have = pm.stash.count(i.id); const d = Items.def(i.id); return '<span class="' + (have >= i.count ? '' : 'danger') + '">' + uiEsc(d ? d.name : i.id) + ' ' + have + '/' + i.count + '</span>'; }).join(', ');
    item.appendChild(uiEl('div', 'grow', '<div><b>' + uiEsc(recipe.name) + '</b> → <span class="rarity-' + (out ? out.rarity : 'common') + '">' + uiEsc(out ? out.name : recipe.output.id) + '</span>' + (recipe.output.count > 1 ? ' ×' + recipe.output.count : '') + '</div><div class="small muted">' + inputs + (unlocked ? '' : ' · <span class="warn">Ausbaustufe ' + recipe.requiresLevel + ' nötig</span>') + '</div>'));

// Item actions in the base (stash screen / trader sell side). ctx: {stash, loadout, secure, equipment}
function uib_actions(ui, sel) {
  const pm = uib_pm(ui);
  const p = pm.profile;
  const inst = uig_selInst(sel);
  if (!inst || !p) return [];
  const d = Items.def(inst);
  const A = [];
  const done = (r, okMsg) => { if (r === false || (r && r.ok === false)) ui.toast((r && r.reason) || 'Nicht möglich', 'warning'); else if (okMsg) ui.toast(okMsg, 'success', 1500); ui.selected = null; uib_save(ui); ui.refresh(); };
  if (sel.slot) {
    A.push({ label: 'Ablegen ins Lager', action: 'unequip', run: () => done(pm.unequipToStash(sel.slot), null) });
  } else {
    const inv = sel.inv;
    const slot = Equipment.slotFor(inst);
    if (slot) A.push({ label: 'Ausrüsten', action: 'equip', run: () => done(inv === p.stash ? pm.equipFromStash(inst.uid) : pm._equipFrom(inv, inst.uid), null) });
    if (Items.isWeapon(inst) && d.weapon.class !== 'melee' && (d.weapon.class === 'pistol' || d.weapon.class === 'smg')) A.push({ label: 'Als Primärwaffe ausrüsten', action: 'equip', run: () => done(pm._equipFrom(inv, inst.uid, 'primary'), null) });
    if (Items.isUsable(inst)) A.push({ label: 'Benutzen', action: 'use', run: () => { if (inv !== p.stash) { const r = pm.moveLoadoutToStash(inst.uid, 1); if (!r) return done(false); const s = p.stash.all().find(i => i.id === inst.id); return done(s ? pm.useFromStash(s.uid) : false, d.name + ' benutzt'); } done(pm.useFromStash(inst.uid), d.name + ' benutzt'); } });
    if (inst.count > 1) A.push({ label: 'Teilen', action: 'split', run: async () => { const n = await ui.promptNumber('Wie viele abtrennen?', { max: inst.count - 1 }); if (n) done(inv.split(inv.indexOf(inst.uid), n) ? true : { ok: false, reason: 'Kein freier Platz' }); } });
    if (inv !== p.stash) A.push({ label: 'Ins Lager', action: 'to-stash', run: () => done(pm.moveLoadoutToStash(inst.uid), null) });
    if (inv !== p.loadout) A.push({ label: 'In den Rucksack', action: 'to-loadout', run: () => done(inv === p.stash ? pm.moveStashToLoadout(inst.uid) : (() => { const it = inv.remove(inst.uid); const r = p.loadout.add(it); if (r.remaining) inv.add(r.remaining); return !r.remaining; })(), null) });
    if (inv !== p.secure) A.push({ label: 'In sicheren Behälter', action: 'to-secure', run: () => done(pm.moveToSecure(inst.uid, inv === p.loadout), null) });
    if (inv === p.stash) A.push({ label: 'Verkaufen (' + formatCredits(pm.sellPrice(inst)) + ')', action: 'sell', run: async () => { if (Items.rarity(inst).order >= 2 && !(await ui.confirm(d.name + ' für ' + formatCredits(pm.sellPrice(inst)) + ' verkaufen?'))) return; done(pm.sell(inst.uid), 'Verkauft'); } });
    A.push({ label: 'Vernichten', action: 'drop', danger: true, run: async () => { if (await ui.confirm(d.name + ' unwiderruflich vernichten?', { danger: true, ok: 'Vernichten' })) done(inv.remove(inst.uid) ? true : false, 'Vernichtet'); } });
  }
  const rc = pm.repairCost(inst);
  if (rc > 0) A.push({ label: 'Reparieren (' + formatCredits(rc) + ')', action: 'repair', disabled: p.credits < rc, reason: 'Nicht genug Credits', run: () => done(pm.repair(inst.uid), 'Repariert') });
  return A;
}

function uib_actionBar(ui, sel) {
  const bar = uiEl('div', 'action-bar row wrap');
  for (const a of uib_actions(ui, sel)) bar.appendChild(uiBtn(uiEsc(a.label), a.action, a.run, { small: true, danger: a.danger, disabled: a.disabled, reason: a.reason }));
  return bar;
}

function uib_baseMoves(ui) {
  const pm = uib_pm(ui);
  return {
    onMove: (fromInv, fromIdx, toInv, toIdx) => {
      const ok = fromInv === toInv ? fromInv.move(fromIdx, toIdx) : fromInv.transfer(fromIdx, toInv, toIdx);
      return ok;
    },
    onEquip: (fromInv, fromIdx, slot) => {
      const inst = fromInv.items[fromIdx];
      if (!inst) return false;
      const r = pm._equipFrom(fromInv, inst.uid, slot);
      if (!r.ok) ui.toast(r.reason || 'Passt nicht in diesen Platz', 'warning');
      return r.ok;
    },
    onUnequip: (slot, toInv, toIdx) => {
      const p = pm.profile;
      const inst = p.equipment.get(slot);
      if (!inst) return false;
      if (toInv.items[toIdx]) { if (!toInv.canAdd(inst)) return false; p.equipment.unequip(slot); toInv.add(inst); }
      else { p.equipment.unequip(slot); toInv.items[toIdx] = inst; }
      if (slot === 'backpack') pm._fixLoadoutSlots();
      return true;
    },
    onEquipSwap: (a, b) => {
      const e = pm.profile.equipment;
      const ia = e[a], ib = e[b];
      if ((ia && !Equipment.accepts(b, ia)) || (ib && !Equipment.accepts(a, ib))) return false;
      e[a] = ib || null; e[b] = ia || null;
      return true;
    },
    actions: (sel) => uib_actions(ui, sel),
  };
}

// ======================= radio =======================
function uib_missionCard(ui, def, mode, reason) {
  const pm = uib_pm(ui);
  const p = pm.profile;
  const ms = ui.game.missions;
  const card = uiEl('div', 'panel mission-card' + (mode === 'locked' ? ' locked' : ''));
  const map = MAPS[def.mapId];
  card.appendChild(uiEl('div', 'mission-head', '<b>' + uiEsc(def.title) + '</b><span class="muted small">' + uiEsc(map ? map.name : def.mapId) + ' · ' + uiSkulls(def.difficulty || 1) + (def.repeatable ? ' · wiederholbar' : '') + '</span>'));
  card.appendChild(uiEl('p', 'small', uiEsc(def.desc)));
  const prog = mode === 'active' ? ms.progressOf(p, def.id) : null;
  const objs = uiEl('ul', 'objectives');
  const all = [...(def.objectives || []).map(o => ({ o, opt: false })), ...(def.optional || []).map(o => ({ o, opt: true }))];
  for (const { o, opt } of all) {
    const st = prog ? prog.objectives.find(x => x.def.id === o.id) : null;
    const li = uiEl('li', (st && st.done ? 'done' : '') + (opt ? ' optional' : ''));
    li.innerHTML = (st && st.done ? '✓ ' : opt ? '◇ ' : '• ') + uiEsc(o.text) + ((o.count || 1) > 1 && st ? ' <span class="muted">(' + st.progress + '/' + o.count + ')</span>' : '') + (opt ? ' <span class="muted small">(optional)</span>' : '');
    if (mode === 'active' && o.type === 'collect' && !(st && st.done)) {
      const can = ms.canHandIn(p, def.id, o.id);
      li.appendChild(uiBtn('Abgeben', 'hand-in', () => {
        const r = ms.handIn(p, def.id, o.id);
        if (r.ok) { ui.toast('Abgegeben: ' + o.text, 'success'); uib_save(ui); } else ui.toast(r.reason, 'warning');
        ui.refresh();
      }, { small: true, disabled: !can, reason: 'Benötigt ' + (o.count || 1) + '× ' + ((Items.def(o.target) || {}).name || o.target) + ' im Lager (vorhanden: ' + pm.stash.count(o.target) + ')' }));
    }
    objs.appendChild(li);
  }
  card.appendChild(objs);
  const r = def.rewards || {};
  const items = (r.items || []).map(i => ((Items.def(i.id) || {}).name || i.id) + (i.count > 1 ? ' ×' + i.count : '')).join(', ');
  card.appendChild(uiEl('div', 'small reward', 'Belohnung: <b>' + formatCredits(r.credits || 0) + '</b> · ' + (r.xp || 0) + ' EP' + (items ? ' · ' + uiEsc(items) : '') + (def.optionalRewards && (def.optionalRewards.credits || def.optionalRewards.xp) ? ' <span class="muted">(+' + formatCredits(def.optionalRewards.credits || 0) + ', +' + (def.optionalRewards.xp || 0) + ' EP für Nebenziele)</span>' : '')));
  if (mode !== 'completed') card.appendChild(uiEl('div', 'small muted fail', 'Fehlschlag: ' + uiEsc(def.failText || MISSION_FAIL_TEXT)));
  const row = uiEl('div', 'row');
  if (mode === 'available') {
    const full = ms.active(p).length >= ms.maxActive(p);
    row.appendChild(uiBtn('Annehmen', 'accept-mission', () => {
      const res = ms.accept(p, def.id);
      if (res.ok) { ui.toast('Auftrag angenommen: ' + def.title, 'success'); uib_save(ui); } else ui.toast(res.reason, 'warning');
      ui.refresh();
    }, { primary: true, small: true, disabled: full, reason: 'Maximal ' + ms.maxActive(p) + ' aktive Aufträge – Funkstation ausbauen' }));
  } else if (mode === 'active') {
    row.appendChild(uiBtn('Abbrechen', 'abandon-mission', async () => {
      if (!(await ui.confirm('Auftrag „' + def.title + '“ abbrechen? Der Fortschritt geht verloren.', { danger: true, ok: 'Abbrechen' }))) return;
      ms.abandon(p, def.id); uib_save(ui); ui.refresh();
    }, { small: true, danger: true }));
    row.appendChild(uiBtn('Einsatz planen', 'plan-raid', () => { ui.missionMap = def.mapId; ui.showScreen('missionSelect'); }, { small: true }));
  } else if (mode === 'locked') {
    row.appendChild(uiEl('span', 'warn small', uiEsc(reason || 'Gesperrt')));
  }
  card.appendChild(row);
  return card;
}

function uiScreenTrader(ui, root) {
  let filter = 'all';
  const render = () => {
    const pm = uib_pm(ui);
    const p = pm.profile;
    root.innerHTML = '';
    if (!p) return;
    root.appendChild(uib_header(ui, 'Händler „Krähe“', 'Neue Ware nach jedem Einsatz. Verkaufspreise steigen mit der Händler-Ausbaustufe.'));
    const cols = uiEl('div', 'columns');
    const left = uiEl('div', 'col');
    const buy = uiEl('div', 'panel');
    buy.appendChild(uiEl('div', 'panel-title', 'Kaufen'));
    const tabs = uiEl('div', 'tabs small');
    for (const [id, label] of [['all', 'Alles'], ['ammo', 'Munition'], ['medical', 'Medizin'], ['weapon', 'Waffen'], ['armor', 'Rüstung'], ['other', 'Sonstiges']]) {
      tabs.appendChild(uiBtn(label, 'filter-' + id, () => { filter = id; render(); }, { cls: 'tab' + (filter === id ? ' active' : ''), small: true }));
    }
    buy.appendChild(tabs);
    const table = uiEl('div', 'list trader-list');
    p.trader.stock.forEach((line, idx) => {
      const d = Items.def(line.id);
      if (!d) return;
      const cat = d.cat;
      if (filter === 'ammo' && cat !== 'ammo') return;
      if (filter === 'medical' && cat !== 'medical') return;
      if (filter === 'weapon' && cat !== 'weapon' && cat !== 'grenade') return;
      if (filter === 'armor' && cat !== 'armor' && cat !== 'backpack') return;
      if (filter === 'other' && ['ammo', 'medical', 'weapon', 'grenade', 'armor', 'backpack'].includes(cat)) return;
      const row = uiEl('div', 'list-item' + (line.count <= 0 ? ' locked' : ''));
      const info = uiEl('div', 'grow', '<span class="rarity-' + d.rarity + '">' + uiEsc(d.name) + '</span> <span class="muted small">' + uiEsc(CATEGORY_NAMES[cat] || cat) + ' · Vorrat ' + line.count + '</span><div class="small">' + formatCredits(line.price) + (d.stack > 1 ? ' / Stück' : '') + '</div>');
      info.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') uiTooltip(ui, Items.create(d.id, 1), info); });
      info.addEventListener('pointerleave', () => ui.hideTooltip());
      row.appendChild(info);
      const amounts = d.stack > 1 ? (d.ammo ? [10, 30] : [1, 5]) : [1];
      for (const n of amounts) {
        const k = Math.min(n, line.count);
        const cost = line.price * k;
        row.appendChild(uiBtn('×' + n + ' ' + formatCredits(line.price * n), 'buy', () => {
          const r = pm.buy(idx, n);

          ui.refresh();
        }, { small: true, disabled: line.count <= 0 || p.credits < cost || k <= 0, reason: line.count <= 0 ? 'Ausverkauft' : 'Nicht genug Credits' }));
      }
      table.appendChild(row);
    });
    buy.appendChild(table);
    left.appendChild(buy);
    const right = uiEl('div', 'col');
    const sellMoves = Object.assign({}, uib_baseMoves(ui), { actions: (sel) => uib_actions(ui, sel).filter(a => a.action === 'sell' || a.action === 'split') });
    right.appendChild(uiBuildGrid(ui, p.stash, Object.assign({ title: 'Verkaufen (aus dem Lager)', columns: 7 }, sellMoves)));
    const inst = uig_selInst(ui.selected);
    const sp = uiEl('div', 'panel');
    if (inst && ui.selected.inv === p.stash) {
      const d = Items.def(inst);
      sp.appendChild(uiEl('div', '', uiItemName(inst) + (inst.count > 1 ? ' ×' + inst.count : '') + ' – Wert ' + formatCredits(Items.value(inst))));

      if (inst.count > 1) row.appendChild(uiBtn('1 verkaufen (' + formatCredits(pm.sellPrice(inst, 1)) + ')', 'sell', () => { const r = pm.sell(inst.uid, 1); if (r.ok) { ui.toast('+' + formatCredits(r.credits), 'success', 1200); uib_save(ui); } ui.refresh(); }, { small: true }));
      row.appendChild(uiBtn('Alle verkaufen (' + formatCredits(pm.sellPrice(inst)) + ')', 'sell', async () => {
        if (Items.rarity(inst).order >= 2 && !(await ui.confirm(d.name + ' für ' + formatCredits(pm.sellPrice(inst)) + ' verkaufen?'))) return;
        const r = pm.sell(inst.uid); if (r.ok) { ui.toast('+' + formatCredits(r.credits), 'success', 1200); ui.selected = null; uib_save(ui); } ui.refresh();

      sp.appendChild(row);

// ===== 23_ui_grid.js =====
// 23_ui_grid.js — inventory widgets (SPEC §24.1): uiBuildGrid, uiEquipmentPanel, uiTooltip, uiContextMenu, drag & drop.
// Interaction: click selects, clicking a second cell moves/merges/swaps (touch friendly); pointer drag & drop between
// grids and equipment slots; Shift+click splits a stack in half; right click / long press opens the context menu.
// Move rules are supplied by the screen: opts.onMove(fromInv, fromIdx, toInv, toIdx), opts.onEquip(fromInv, fromIdx, slot),
// opts.onUnequip(slot, toInv, toIdx), opts.actions(sel) -> [{label, action, run, disabled, reason}].
// Dependencies: 23_ui.js helpers, 10_items_inventory.js.

const UIG_GLYPH = { weapon: '⌖', ammo: '⁞', medical: '✚', food: '◉', water: '💧', material: '▤', electronics: 'ϟ', tool: '⚒', armor: '⛨',
  backpack: '▣', key: '⚿', mission: '★', collectible: '◆', grenade: '●' };
const UIG_DRAG = { active: null };

function uig_short(name) {
  const s = String(name || '');
  return s.length > 14 ? s.slice(0, 13) + '…' : s;
}

function uig_cellHtml(inst) {
  if (!inst) return '';
  const d = Items.def(inst);
  if (!d) return '<span class="slot-name">?</span>';
  let html = '<span class="slot-glyph cat-' + d.cat + '">' + (UIG_GLYPH[d.cat] || '•') + '</span><span class="slot-name">' + uiEsc(uig_short(d.name)) + '</span>';
  if (inst.count > 1) html += '<span class="count">' + inst.count + '</span>';
  if (inst.durability !== undefined && d.durabilityMax) {
    const pct = clamp(inst.durability / d.durabilityMax, 0, 1);
    html += '<span class="dur"><span style="transform:scaleX(' + pct.toFixed(3) + ')" class="' + (pct < 0.3 ? 'low' : '') + '"></span></span>';
  }
  if (inst.mag !== undefined && d.weapon && d.weapon.class !== 'melee') html += '<span class="mag">' + inst.mag + '/' + d.weapon.magSize + '</span>';
  if (inst.raidFound) html += '<span class="found" title="Im Einsatz gefunden">●</span>';
  return html;
}

function uig_isSel(ui, inv, idx) { const s = ui.selected; return !!s && s.inv === inv && s.idx === idx; }

function uig_dispatch(ui, src, dst) {
  if (!src || !dst) return false;
  const o = dst.opts || {};
  let ok = false;
  try {
    if (src.slot && dst.slot) {
      if (src.slot === dst.slot) return false;
      ok = o.onEquipSwap ? !!o.onEquipSwap(src.slot, dst.slot) : false;
    } else if (src.slot && dst.inv) ok = o.onUnequip ? !!o.onUnequip(src.slot, dst.inv, dst.idx) : false;
    else if (src.inv && dst.slot) ok = o.onEquip ? !!o.onEquip(src.inv, src.idx, dst.slot) : false;
    else if (src.inv && dst.inv) {
      if (src.inv === dst.inv && src.idx === dst.idx) return false;
      if (o.onMove) ok = !!o.onMove(src.inv, src.idx, dst.inv, dst.idx);
      else ok = src.inv === dst.inv ? src.inv.move(src.idx, dst.idx) : src.inv.transfer(src.idx, dst.inv, dst.idx);
    }
  } catch (e) { Log.error('Inventory move failed: ' + (e && e.message)); }
  const a = ui.game.audio;
  if (a) a.play(ok ? 'pickup' : 'ui_error', { volume: 0.4 });
  ui.selected = null;
  ui.hideTooltip();
  ui.refresh();
  return ok;
}

function uig_selInst(sel) {
  if (!sel) return null;
  if (sel.slot) return sel.equipment ? sel.equipment[sel.slot] : null;
  if (sel.inv) return sel.inv.items ? sel.inv.items[sel.idx] || null : null;
  return null;
}

function uig_bindCell(ui, cell, getRef, getInst, opts) {
  let down = null, longT = null;
  const clearLong = () => { if (longT) { clearTimeout(longT); longT = null; } };
  cell.addEventListener('pointerdown', (e) => {
    if (e.button === 2) return;
    const inst = getInst();
    down = { x: e.clientX, y: e.clientY, id: e.pointerId, moved: false, type: e.pointerType };
    if (inst && opts.draggable !== false && !opts.readonly) {
      try { cell.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    }
    if (e.pointerType !== 'mouse' && inst) {
      longT = setTimeout(() => { longT = null; if (down && !down.moved) { down.long = true; uig_openCtx(ui, getRef(), opts, e.clientX, e.clientY); } }, 520);
    }
  });
  cell.addEventListener('pointermove', (e) => {
    if (!down || down.id !== e.pointerId) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (!down.moved && Math.hypot(dx, dy) > 7 && getInst() && !opts.readonly && opts.draggable !== false) {
      down.moved = true; clearLong();
      const g = uiEl('div', 'drag-ghost slot ' + (getInst() ? 'rarity-' + (Items.def(getInst()) || {}).rarity : ''), uig_cellHtml(getInst()));
      document.body.appendChild(g);
      UIG_DRAG.active = { ghost: g, src: getRef() };
      ui.hideTooltip();
    }
    if (down.moved && UIG_DRAG.active) {
      UIG_DRAG.active.ghost.style.transform = 'translate(' + (e.clientX - 30) + 'px,' + (e.clientY - 30) + 'px)';
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const tgt = el && el.closest ? el.closest('.slot') : null;
      document.querySelectorAll('.slot.drag-over').forEach(n => { if (n !== tgt) n.classList.remove('drag-over'); });
      if (tgt && tgt._ref) tgt.classList.add('drag-over');
    }
  });
  const finish = (e) => {
    clearLong();
    if (!down || down.id !== e.pointerId) return;
    const wasDrag = down.moved, wasLong = down.long;
    down = null;
    if (wasDrag && UIG_DRAG.active) {
      const d = UIG_DRAG.active;
      UIG_DRAG.active = null;
      d.ghost.remove();
      document.querySelectorAll('.slot.drag-over').forEach(n => n.classList.remove('drag-over'));
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const tgt = el && el.closest ? el.closest('.slot') : null;
      if (tgt && tgt._ref) uig_dispatch(ui, d.src, tgt._ref());
      return;
    }
    if (wasLong || e.type === 'pointercancel') return;
    // click
    const ref = getRef();
    const inst = getInst();
    if (e.shiftKey && ref.inv && inst && inst.count > 1 && typeof ref.inv.split === 'function' && !opts.readonly) {
      if (ref.inv.split(ref.idx, Math.floor(inst.count / 2))) { ui.refresh(); } else ui.toast('Kein freier Platz zum Teilen', 'warning');
      return;
    }
    const sel = ui.selected;
    if (sel && !(sel.inv === ref.inv && sel.idx === ref.idx && sel.slot === ref.slot) && uig_selInst(sel)) {
      uig_dispatch(ui, sel, ref);
      return;
    }
    if (sel && sel.inv === ref.inv && sel.idx === ref.idx && sel.slot === ref.slot) ui.selected = null;
    else ui.selected = inst ? Object.assign({}, ref) : null;
    if (opts.onSelect) opts.onSelect(ui.selected);
    ui.refresh();
  };
  cell.addEventListener('pointerup', finish);
  cell.addEventListener('pointercancel', (e) => { clearLong(); if (UIG_DRAG.active) { UIG_DRAG.active.ghost.remove(); UIG_DRAG.active = null; } down = null; void e; });
  cell.addEventListener('contextmenu', (e) => { e.preventDefault(); if (getInst()) uig_openCtx(ui, getRef(), opts, e.clientX, e.clientY); });
  cell.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse' && getInst() && !UIG_DRAG.active) uiTooltip(ui, getInst(), cell); });
  cell.addEventListener('pointerleave', () => ui.hideTooltip());
}

function uig_openCtx(ui, ref, opts, x, y) {
  if (!opts.actions) return;
  ui.selected = Object.assign({}, ref);
  const items = opts.actions(ui.selected) || [];
  if (!items.length) return;
  ui.refresh();
  uiContextMenu(ui, items, x, y);
}

function uiBuildGrid(ui, inventory, opts = {}) {
  const wrap = uiEl('div', 'grid-wrap' + (opts.cls ? ' ' + opts.cls : ''));
  if (opts.title) {
    const head = uiEl('div', 'grid-head');
    head.appendChild(uiEl('span', 'panel-title', uiEsc(opts.title)));
    if (opts.info) head.appendChild(uiEl('span', 'muted grid-info', opts.info));
    if (opts.headerButtons) for (const b of opts.headerButtons) head.appendChild(b);
    wrap.appendChild(head);
  }
  const grid = uiEl('div', 'grid');
  if (opts.columns) grid.style.setProperty('--cols', opts.columns);
  wrap.appendChild(grid);
  const slots = inventory ? inventory.slots : 0;
  for (let i = 0; i < slots; i++) {
    const inst = inventory.items[i] || null;
    const d = inst ? Items.def(inst) : null;
    const cell = uiEl('div', 'slot' + (inst ? ' filled rarity-' + (d ? d.rarity : 'common') : '') + (uig_isSel(ui, inventory, i) ? ' sel' : '') + (opts.highlightCat && d && d.cat === opts.highlightCat ? ' hl' : ''));
    cell.innerHTML = uig_cellHtml(inst);
    const ref = () => ({ inv: inventory, idx: i, opts });
    cell._ref = ref;
    uig_bindCell(ui, cell, ref, () => inventory.items[i] || null, opts);
    grid.appendChild(cell);
  }
  return wrap;
}

function uiEquipmentPanel(ui, equipment, opts = {}) {
  const wrap = uiEl('div', 'equip-panel');
  if (opts.title !== false) wrap.appendChild(uiEl('div', 'panel-title', uiEsc(opts.title || 'Ausrüstung')));

  wrap.appendChild(grid);
  for (const slot of EQUIP_SLOTS) {

    const d = inst ? Items.def(inst) : null;
    const cell = uiEl('div', 'slot equip-slot equip-' + slot + (inst ? ' filled rarity-' + (d ? d.rarity : 'common') : '') + (ui.selected && ui.selected.slot === slot && ui.selected.equipment === equipment ? ' sel' : ''));
    cell.innerHTML = '<span class="equip-label">' + uiEsc(EQUIP_SLOT_NAMES[slot]) + '</span>' + uig_cellHtml(inst);
    const ref = () => ({ slot, equipment, opts });
    cell._ref = ref;
    uig_bindCell(ui, cell, ref, () => (equipment ? equipment[slot] : null), opts);
    grid.appendChild(cell);
  }
  return wrap;
}

function uiTooltip(ui, inst, anchorEl) {
  ui.hideTooltip();
  const d = Items.def(inst);
  if (!d || !anchorEl) return;
  const rar = Items.rarity(inst);
  const tip = uiEl('div', 'tooltip');
  let html = '<div class="tt-name rarity-' + d.rarity + '">' + uiEsc(d.name) + (inst.count > 1 ? ' ×' + inst.count : '') + '</div>';
  html += '<div class="tt-sub muted">' + uiEsc(CATEGORY_NAMES[d.cat] || d.cat) + ' · ' + uiEsc(rar.name) + '</div>';
  html += '<div class="tt-row"><span>Gewicht</span><span>' + formatWeight(Items.weight(inst)) + '</span></div>';
  html += '<div class="tt-row"><span>Wert</span><span>' + formatCredits(Items.value(inst)) + '</span></div>';
  if (inst.durability !== undefined && d.durabilityMax) {
    const pct = clamp(inst.durability / d.durabilityMax, 0, 1);
    html += '<div class="tt-dur"><span style="transform:scaleX(' + pct.toFixed(3) + ')"></span></div>';
  }
  const lines = Items.describe(inst);
  if (lines.length) html += '<ul class="tt-stats">' + lines.map(l => '<li>' + uiEsc(l) + '</li>').join('') + '</ul>';
  html += '<div class="tt-desc">' + uiEsc(d.desc || '') + '</div>';
  if (inst.raidFound) html += '<div class="tt-found">Im Einsatz gefunden</div>';
  tip.innerHTML = html;
  document.body.appendChild(tip);
  const r = anchorEl.getBoundingClientRect();
  const tw = tip.offsetWidth || 240, th = tip.offsetHeight || 160;
  let x = r.right + 8, y = r.top;
  if (x + tw > window.innerWidth - 8) x = r.left - tw - 8;
  if (x < 8) x = 8;
  if (y + th > window.innerHeight - 8) y = window.innerHeight - th - 8;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
  ui.tooltipEl = tip;
}

function uiContextMenu(ui, items, x, y) {
  ui.closeContextMenu();
  ui.hideTooltip();
  const m = uiEl('div', 'ctxmenu');
  for (const it of items) {
    const b = uiBtn(uiEsc(it.label), it.action || null, () => { ui.closeContextMenu(); if (it.run) it.run(); }, { disabled: !!it.disabled, reason: it.reason, cls: 'ctx-item' + (it.danger ? ' btn-danger' : '') });
    m.appendChild(b);
  }
  document.body.appendChild(m);
  const w = m.offsetWidth || 180, h = m.offsetHeight || 200;
  m.style.left = clamp(x, 6, window.innerWidth - w - 6) + 'px';
  m.style.top = clamp(y, 6, window.innerHeight - h - 6) + 'px';
  ui.ctxMenu = m;
  return m;
}


// ===== 23_ui_raid.js =====
// 23_ui_raid.js — raid screens (SPEC §24.1): inventory, loot, map, pause, result, death.
// The simulation keeps running behind inventory/loot/map (only pause stops it), so refresh() is cheap and the
// screens re-render on a short interval to reflect changes (stacks, mags, timer).
// Dependencies: 23_ui.js, 23_ui_grid.js, RaidManager container API at runtime.

function uir_raid(ui) { return ui.game.raid; }

function uir_head(title, sub) {
  const h = uiEl('header', 'screen-header');
  h.appendChild(uiEl('div', 'screen-title', '<h2>' + uiEsc(title) + '</h2>' + (sub ? '<div class="muted small">' + sub + '</div>' : '')));
  h.appendChild(uiBtn('Schließen ✕', 'close', null, { small: true }));
  return h;
}

function uir_actions(ui, sel) {
  const raid = uir_raid(ui);
  if (!raid || !raid.player) return [];
  const p = raid.player;
  const inst = uig_selInst(sel);
  if (!inst) return [];
  const d = Items.def(inst);
  const A = [];
  const after = () => { ui.selected = null; ui.refresh(); };
  if (sel.slot) {
    A.push({ label: 'Ablegen in den Rucksack', action: 'unequip', run: () => {
      if (!p.inventory.canAdd(inst)) { ui.toast('Kein Platz im Rucksack', 'warning'); return; }
      const it = p.equipment.unequip(sel.slot);
      if (raid.weapons) raid.weapons.cancelReload(it);
      p.inventory.add(it);
      if (sel.slot === 'backpack') { const over = p.inventory.setSlots(p.equipment.backpackSlots()); for (const o of over) raid.dropItem(o, p.x, p.y); }
      if (p.activeSlot <= 2 && !p.weaponInst) p.switchSlot(Math.max(0, p.equipment.weaponSlots().findIndex(Boolean)), true);
      after();
    } });
  } else {
    const inv = sel.inv;
    const slot = Equipment.slotFor(inst);
    if (slot && typeof inv.remove === 'function') A.push({ label: 'Ausrüsten', action: 'equip', run: () => { uir_equip(ui, inv, inv.indexOf(inst.uid), slot); after(); } });
    if (Items.isUsable(inst) && typeof inv.remove === 'function') A.push({ label: 'Benutzen', action: 'use', run: () => { p.useItem(inst); ui.closeScreen(); } });
    if (inst.count > 1 && typeof inv.split === 'function') A.push({ label: 'Teilen', action: 'split', run: async () => { const n = await ui.promptNumber('Wie viele abtrennen?', { max: inst.count - 1 }); if (n && !inv.split(inv.indexOf(inst.uid), n)) ui.toast('Kein freier Platz', 'warning'); after(); } });
    if (inv === p.inventory) A.push({ label: 'In sicheren Behälter', action: 'to-secure', run: () => { const it = inv.remove(inst.uid); const r = p.secure.add(it); if (r.remaining) { inv.add(r.remaining); ui.toast('Sicherer Behälter voll', 'warning'); } after(); } });
    if (inv === p.secure) A.push({ label: 'In den Rucksack', action: 'to-loadout', run: () => { const it = inv.remove(inst.uid); const r = p.inventory.add(it); if (r.remaining) { inv.add(r.remaining); ui.toast('Rucksack voll', 'warning'); } after(); } });
    if (typeof inv.remove === 'function') A.push({ label: 'Ablegen (X)', action: 'drop', run: () => { ui.selected = sel; ui.dropSelected(); } });
  }
  void d;
  return A;
}

function uir_equip(ui, inv, idx, slot) {
  const raid = uir_raid(ui);
  const p = raid.player;
  const inst = inv.items[idx];
  if (!inst || !Equipment.accepts(slot, inst)) { ui.toast('Passt nicht in diesen Platz', 'warning'); return false; }
  inv.items[idx] = null;
  const r = p.equipment.equip(inst, slot);
  if (r.replaced) {
    if (raid.weapons) raid.weapons.cancelReload(r.replaced);
    const back = inv.add(r.replaced);
    if (back.remaining) { const b2 = p.inventory.add(back.remaining); if (b2.remaining) raid.dropItem(b2.remaining, p.x, p.y); }
  }
  if (slot === 'backpack') { const over = p.inventory.setSlots(p.equipment.backpackSlots()); for (const o of over) raid.dropItem(o, p.x, p.y); }
  if (['primary', 'secondary', 'melee'].includes(slot)) p.switchSlot(['primary', 'secondary', 'melee'].indexOf(slot), true);
  const a = ui.game.audio; if (a) a.play('pickup', { volume: 0.5 });
  return true;
}

function uir_moves(ui, container) {
  const raid = uir_raid(ui);
  return {
    onMove: (fromInv, fromIdx, toInv, toIdx) => {
      const p = raid.player;
      if (container && fromInv._container) {
        // container -> player inventory
        const c = fromInv._container;
        const inst = c.items[fromIdx];
        if (!inst) return false;
        if (toInv.items && toInv.items[toIdx] === null && toInv !== p.inventory && toInv !== p.secure) return false;
        if (toInv === p.secure) {
          // take into the secure container directly
          const r = p.secure.add(Object.assign(inst, { raidFound: true }));
          if (!r.remaining) { c.items[fromIdx] = null; raid.events.emit('itemPicked', { inst, source: 'container' }); p.stats.lootValue += Items.value(inst); return true; }
          c.items[fromIdx] = r.remaining; return false;
        }
        const r = raid.takeFromContainer(c, fromIdx);
        if (r.remaining) ui.toast('Inventar voll', 'warning');
        return (r.taken || 0) > 0;
      }
      if (container && toInv._container) {
        const inst = fromInv.items[fromIdx];
        if (!inst) return false;
        const it = fromInv.remove(inst.uid);
        if (!raid.putIntoContainer(toInv._container, it)) { fromInv.add(it); ui.toast('Behälter voll', 'warning'); return false; }
        return true;
      }
      return fromInv === toInv ? fromInv.move(fromIdx, toIdx) : fromInv.transfer(fromIdx, toInv, toIdx);
    },
    onEquip: (fromInv, fromIdx, slot) => {
      if (fromInv._container) {
        const c = fromInv._container;
        const r = raid.takeFromContainer(c, fromIdx);
        if (!(r.taken > 0)) return false;
        const p = raid.player;
        const idx = p.inventory.items.findIndex(i => i && Equipment.accepts(slot, i));
        return idx >= 0 ? uir_equip(ui, p.inventory, idx, slot) : true;
      }
      return uir_equip(ui, fromInv, fromIdx, slot);
    },
    onUnequip: (slot, toInv, toIdx) => {
      const p = raid.player;
      if (toInv._container) return false;
      const inst = p.equipment.get(slot);
      if (!inst) return false;
      if (toInv.items[toIdx] && !toInv.canAdd(inst)) return false;
      p.equipment.unequip(slot);
      if (raid.weapons) raid.weapons.cancelReload(inst);
      if (toInv.items[toIdx]) toInv.add(inst); else toInv.items[toIdx] = inst;
      if (slot === 'backpack') { const over = p.inventory.setSlots(p.equipment.backpackSlots()); for (const o of over) raid.dropItem(o, p.x, p.y); }
      if (p.activeSlot <= 2 && !p.weaponInst) p.switchSlot(Math.max(0, p.equipment.weaponSlots().findIndex(Boolean)), true);
      return true;
    },
    onEquipSwap: (a, b) => {
      const e = raid.player.equipment;
      const ia = e[a], ib = e[b];
      if ((ia && !Equipment.accepts(b, ia)) || (ib && !Equipment.accepts(a, ib))) return false;
      e[a] = ib || null; e[b] = ia || null;
      return true;
    },
    actions: (sel) => uir_actions(ui, sel),
  };
}

function uir_detail(ui) {
  const inst = uig_selInst(ui.selected);
  const box = uiEl('div', 'panel detail');
  if (!inst) { box.appendChild(uiEl('div', 'muted small', 'Gegenstand wählen für Details. Ziehen oder zwei Felder antippen zum Verschieben. Achtung: Die Zeit läuft weiter!')); return box; }
  const d = Items.def(inst);
  box.appendChild(uiEl('div', 'detail-name rarity-' + d.rarity, uiEsc(d.name) + (inst.count > 1 ? ' ×' + inst.count : '')));
  box.appendChild(uiEl('div', 'muted small', uiEsc(CATEGORY_NAMES[d.cat] || d.cat) + ' · ' + formatWeight(Items.weight(inst)) + ' · ' + formatCredits(Items.value(inst))));
  const lines = Items.describe(inst);
  if (lines.length) box.appendChild(uiEl('ul', 'tt-stats', lines.map(l => '<li>' + uiEsc(l) + '</li>').join('')));
  box.appendChild(uiEl('div', 'tt-desc small', uiEsc(d.desc || '')));
  const bar = uiEl('div', 'action-bar row wrap');
  for (const a of uir_actions(ui, ui.selected)) bar.appendChild(uiBtn(uiEsc(a.label), a.action, a.run, { small: true }));
  box.appendChild(bar);
  return box;
}

function uir_playerPanel(ui, moves) {
  const raid = uir_raid(ui);
  const p = raid.player;
  const col = uiEl('div', 'col');
  col.appendChild(uiEquipmentPanel(ui, p.equipment, Object.assign({ title: 'Ausrüstung' }, moves)));
  const w = p.totalWeight(), lim = p.carryLimit();
  col.appendChild(uiBuildGrid(ui, p.inventory, Object.assign({ title: 'Rucksack', info: formatWeight(w) + ' / ' + formatWeight(lim), columns: 6,
    headerButtons: [uiBtn('Sortieren', 'sort', () => { p.inventory.sort(); ui.selected = null; ui.refresh(); }, { small: true })] }, moves)));
  col.appendChild(uiBar(w / lim, w > lim ? 'bar-danger' : 'bar-weight', 'Gewicht ' + formatWeight(w) + ' / ' + formatWeight(lim) + (w > lim ? ' – überladen!' : '')));
  col.appendChild(uiBuildGrid(ui, p.secure, Object.assign({ title: 'Sicherer Behälter', info: 'bleibt beim Tod erhalten', columns: 6 }, moves)));
  return col;
}

function uiScreenInventory(ui, root) {
  let timer = null;
  const render = () => {
    const raid = uir_raid(ui);
    root.innerHTML = '';
    if (!raid || !raid.player) return;
    const moves = uir_moves(ui, null);
    root.appendChild(uir_head('Inventar', 'Die Zeit läuft weiter – sichere die Umgebung, bevor du sortierst.'));
    const cols = uiEl('div', 'columns');
    cols.appendChild(uir_playerPanel(ui, moves));
    const right = uiEl('div', 'col');
    right.appendChild(uir_detail(ui));
    const p = raid.player;
    const st = uiEl('div', 'panel small');
    st.innerHTML = '<div class="panel-title">Zustand</div>' +
      '<div>Gesundheit ' + Math.ceil(p.hp) + ' / ' + Math.round(p.hpMax) + (p.bleeding ? ' · <span class="danger">Blutung</span>' : '') + (p.toxic > 0 ? ' · <span class="toxic">Vergiftet</span>' : '') + '</div>' +
      '<div>Nahrung ' + Math.round(p.hunger) + ' · Wasser ' + Math.round(p.thirst) + ' · Ausdauer ' + Math.round(p.stamina) + '</div>' +
      '<div class="muted">Beutewert bisher: ' + formatCredits(p.stats.lootValue) + ' · Kills: ' + p.stats.kills + '</div>';
    right.appendChild(st);
    cols.appendChild(right);
    root.appendChild(cols);
  };
  render();
  timer = setInterval(() => { if (!UIG_DRAG.active && !ui.ctxMenu && !ui._modalOpen) render(); }, 1500);
  return { refresh: render, destroy() { clearInterval(timer); ui.hideTooltip(); } };
}

function uiScreenLoot(ui, root, data) {
  const c = data && data.container;
  let timer = null;
  const render = () => {
    const raid = uir_raid(ui);
    root.innerHTML = '';
    if (!raid || !raid.player || !c) return;
    if (!Array.isArray(c.items)) c.items = [];
    const adapter = { slots: Math.max(8, Math.min(12, c.items.length + 4)), items: [], _container: c };
    for (let i = 0; i < adapter.slots; i++) adapter.items.push(c.items[i] || null);
    adapter.canAdd = () => c.items.filter(Boolean).length < 12;
    adapter.get = (i) => c.items[i] || null;
    adapter.indexOf = (uid) => c.items.findIndex(x => x && x.uid === uid);
    const moves = uir_moves(ui, c);
    const name = (typeof CONTAINER_NAMES !== 'undefined' && CONTAINER_NAMES[c.type]) || 'Behälter';
    const b = c.buildingId ? raid.world.buildings.find(x => x.id === c.buildingId) : null;
    root.appendChild(uir_head(name + ' durchsuchen', b ? uiEsc(b.name) : 'Im Freien'));
    const cols = uiEl('div', 'columns');
    const left = uiEl('div', 'col');
    const empty = !c.items.some(Boolean);
    left.appendChild(uiBuildGrid(ui, adapter, Object.assign({ title: name, info: empty ? 'leer' : c.items.filter(Boolean).length + ' Gegenstände', columns: 4, cls: 'loot-grid' }, moves)));
    const row = uiEl('div', 'row');
    row.appendChild(uiBtn('Alles nehmen', 'take-all', () => { raid.takeAll(c); ui.selected = null; render(); }, { primary: true, disabled: empty, reason: 'Leer' }));
    row.appendChild(uiBtn('Schließen', 'close', null));
    left.appendChild(row);
    left.appendChild(uir_detail(ui));
    cols.appendChild(left);
    cols.appendChild(uir_playerPanel(ui, moves));
    root.appendChild(cols);
  };
  render();
  timer = setInterval(() => {
    const raid = uir_raid(ui);
    // close automatically when the player walked away
    if (raid && raid.player && c && dist(raid.player.x, raid.player.y, c.x, c.y) > 110) { ui.showScreen(null); return; }
    if (!UIG_DRAG.active && !ui.ctxMenu && !ui._modalOpen) render();
  }, 1500);
  return { refresh: render, destroy() { clearInterval(timer); ui.hideTooltip(); } };
}

function uiScreenMap(ui, root) {
  let canvas = null, timer = null;
  const render = () => {
    const raid = uir_raid(ui);
    root.innerHTML = '';
    if (!raid) return;
    root.appendChild(uir_head('Karte – ' + uiEsc(raid.map.name), 'Einsatzzeit ' + formatTime(raid.time) + ' · noch ' + formatTime(raid.timeLimit - raid.time) + ' · ' + formatHour(raid.hour) + ' Uhr'));
    const cols = uiEl('div', 'columns map-layout');
    const left = uiEl('div', 'col map-col');
    canvas = uiEl('canvas', 'fullmap');
    left.appendChild(canvas);
    cols.appendChild(left);
    const right = uiEl('div', 'col');
    const legend = uiEl('div', 'panel small legend');
    legend.innerHTML = '<div class="panel-title">Legende</div>' +
      '<div><span class="lg lg-player"></span>Du</div><div><span class="lg lg-ex-on"></span>Extraktion offen</div><div><span class="lg lg-ex-off"></span>Extraktion gesperrt</div>' +
      '<div><span class="lg lg-mission"></span>Auftragsziel</div><div><span class="lg lg-building"></span>Gebäude</div><div><span class="lg lg-road"></span>Straße</div>';
    right.appendChild(legend);
    const ex = uiEl('div', 'panel small');
    ex.innerHTML = '<div class="panel-title">Extraktionen</div>' + raid.extraction.points.map(e => {
      const d = Math.round(dist(raid.player.x, raid.player.y, e.x, e.y) / TILE);
      return '<div class="list-item"><span class="' + (e.active ? 'good' : 'muted') + '">⬢ ' + uiEsc(e.name) + '</span><span class="muted"> ' + d + ' m · ' + uiEsc(e.active ? 'offen' : e.lockReason || 'gesperrt') + '</span></div>';
    }).join('');
    right.appendChild(ex);
    const lines = ui.game.missions.hudLines(raid);
    right.appendChild(uiEl('div', 'panel small', '<div class="panel-title">Ziele</div>' + (lines.length ? lines.map(l => '<div class="' + (l.done ? 'good' : '') + '">' + (l.done ? '✓' : l.optional ? '◇' : '•') + ' ' + uiEsc(l.text) + '</div>').join('') : '<div class="muted">Kein Auftrag aktiv.</div>')));
    cols.appendChild(right);
    root.appendChild(cols);
    requestAnimationFrame(() => { if (canvas && canvas.isConnected) ui.game.renderer.renderFullMap(raid, canvas); });
  };
  render();
  timer = setInterval(() => { const raid = uir_raid(ui); if (raid && canvas && canvas.isConnected) ui.game.renderer.renderFullMap(raid, canvas); }, 500);
  return { refresh: render, destroy() { clearInterval(timer); } };
}

function uiScreenPause(ui, root) {
  const raid = uir_raid(ui);
  root.innerHTML = '';
  const box = uiEl('div', 'panel pause-box');
  box.appendChild(uiEl('h2', '', 'Pause'));
  if (raid) {
    box.appendChild(uiEl('div', 'muted', uiEsc(raid.map.name) + ' · Einsatzzeit ' + formatTime(raid.time) + ' · noch ' + formatTime(raid.timeLimit - raid.time)));
    const lines = ui.game.missions.hudLines(raid);
    if (lines.length) box.appendChild(uiEl('div', 'small', lines.map(l => '<div class="' + (l.done ? 'good' : '') + '">' + (l.done ? '✓' : '•') + ' ' + uiEsc(l.text) + '</div>').join('')));
  }
  const col = uiEl('div', 'menu-buttons');
  col.appendChild(uiBtn('Fortsetzen', 'resume', () => ui.game.resumeRaid(), { primary: true }));
  col.appendChild(uiBtn('Karte', 'open-map', () => { ui.game.paused = false; ui.openMap(); }));
  col.appendChild(uiBtn('Einstellungen', 'settings', () => ui.showScreen('settings')));
  col.appendChild(uiBtn('Steuerung', 'credits', () => ui.showScreen('credits')));
  col.appendChild(uiBtn('Einsatz abbrechen', 'abort-raid', () => ui.game.abortRaid(), { danger: true }));
  box.appendChild(col);
  root.appendChild(box);

}

function uir_itemList(list, empty) {
  if (!list || !list.length) return '<div class="muted small">' + uiEsc(empty) + '</div>';
  return '<div class="item-list">' + list.map(e => {
    const inst = e.inst || e;
    const d = Items.def(inst);
    if (!d) return '';
    return '<span class="item-chip rarity-' + d.rarity + '">' + uiEsc(d.name) + (inst.count > 1 ? ' ×' + inst.count : '') + (e.credits ? ' <span class="muted">(' + formatCredits(e.credits) + ')</span>' : '') + '</span>';
  }).join('') + '</div>';
}

function uir_statsBlock(r) {
  const rows = [['Dauer', formatTime(r.durationSec)], ['Kills', r.kills], ['Treffsicherheit', Math.round((r.accuracy || 0) * 100) + ' % (' + r.shotsHit + '/' + r.shotsFired + ')'],
    ['Schaden erlitten', r.damageTaken], ['Behälter durchsucht', r.containersOpened], ['Strecke', r.distance + ' m'], ['Beutewert', formatCredits(r.lootValue || 0)], ['Seed', r.seed]];
  return '<div class="stats-grid">' + rows.map(([k, v]) => '<div class="muted">' + uiEsc(k) + '</div><div>' + uiEsc(v) + '</div>').join('') + '</div>';
}

function uir_xpBlock(ui, r) {
  const pm = ui.game.profileMgr;
  const prog = pm.xpProgress();
  const box = uiEl('div', 'panel');
  box.appendChild(uiEl('div', 'panel-title', 'Erfahrung +' + (r.xpGained || 0) + ' EP' + (r.leveledUp ? ' <span class="good">– Stufe ' + r.levelAfter + ' erreicht!</span>' : '')));
  box.appendChild(uiBar(prog.pct, 'bar-xp', 'Stufe ' + pm.level() + ' · ' + Math.round(prog.cur) + ' / ' + prog.next));
  if (r.creditsGained) box.appendChild(uiEl('div', 'small', 'Credits: +' + formatCredits(r.creditsGained)));
  if (r.achievements && r.achievements.length) box.appendChild(uiEl('div', 'small good', 'Neue Erfolge: ' + r.achievements.map(id => uiEsc((ACHIEVEMENTS.find(a => a.id === id) || {}).name || id)).join(', ')));
  return box;
}

function uiScreenResult(ui, root, data) {
  const r = (data && data.result) || (ui.game.raid && ui.game.raid.result);
