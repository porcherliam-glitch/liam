      } else {
        L.push('Schaden: ' + w.damage + ((w.pellets || 1) > 1 ? ' × ' + w.pellets : ''));
        L.push('Feuerrate: ' + num(w.fireRate) + ' /s' + (w.auto ? ' (Automatik)' : ' (Einzelfeuer)'));
        L.push('DPS: ' + Math.round(w.damage * (w.pellets || 1) * w.fireRate));
        L.push('Magazin: ' + w.magSize + ' · Nachladen ' + num(w.reloadTime) + ' s');
        L.push('Reichweite: ' + Math.round(w.range / TILE) + ' m · Streuung ' + num(w.spread * 57.3) + '°');
        L.push('Rückstoß: ' + pct(w.recoil || 0) + ' · Lautstärke: ' + Math.round(w.noise / TILE) + ' m');
        if (typeof AMMO_CALIBERS !== 'undefined' && AMMO_CALIBERS[w.ammo]) L.push('Munition: ' + AMMO_CALIBERS[w.ammo]);
        if (inst && inst.mag !== undefined) {
          const ad = Items.def(inst.ammoId);
          L.push('Geladen: ' + inst.mag + (ad ? ' × ' + ad.name : ''));
        }
      }
      L.push('Durchschlag: ' + (w.penetration || 1));
    }
    if (d.ammo) {
      const a = d.ammo;
      if (typeof AMMO_CALIBERS !== 'undefined') L.push('Kaliber: ' + (AMMO_CALIBERS[a.caliber] || a.caliber));
      L.push('Art: ' + a.label);
      L.push('Schaden ×' + num(a.dmgMul || 1) + ' · Durchschlag ×' + num(a.penMul || 1) + ' · Lärm ×' + num(a.noiseMul || 1));
    }
    if (d.medical) {
      const m = d.medical;
      if (m.heal) L.push('Heilt sofort ' + m.heal + ' LP');
      if (m.overTime) L.push('Heilt ' + m.overTime + ' LP über ' + (m.duration || 20) + ' s');
      if (m.stopBleed) L.push('Stoppt Blutungen');
      if (m.cureToxic) L.push('Heilt Vergiftungen');
      if (m.stamina) L.push('Füllt Ausdauer auf' + (m.speed || d.id === 'med_adrenaline' ? ', +Tempo' : ''));
      L.push('Anwendung: ' + num(m.useTime || 2) + ' s');
    }
    if (d.food) L.push('Sättigung +' + d.food.hunger + ' · ' + num(d.food.useTime || 2) + ' s');
    if (d.water) L.push('Durst +' + d.water.thirst + ' · ' + num(d.water.useTime || 1.5) + ' s');
    if (d.armor) {
      L.push((d.armor.slot === 'head' ? 'Kopfschutz' : 'Körperschutz') + ': ' + pct(d.armor.protection));
      if (d.armor.speedMul && d.armor.speedMul < 1) L.push('Tempo: −' + pct(1 - d.armor.speedMul));
    }
    if (d.backpack) L.push('Plätze: ' + d.backpack.slots + ' · Traglast +' + d.backpack.weightBonus + ' kg');
    if (d.grenade) {
      const g = d.grenade;
      const kind = { frag: 'Splitter', molotov: 'Brand', flash: 'Blendung' }[g.kind] || g.kind;
      L.push('Art: ' + kind + ' · Radius ' + Math.round(g.radius / TILE) + ' m');
      if (g.damage) L.push('Schaden: ' + g.damage);
      L.push('Zünder: ' + num(g.fuse || 0) + ' s');
    }
    if (d.key) L.push('Öffnet: ' + (d.key.label || d.key.unlocks));
    if (inst && inst.durability !== undefined && d.durabilityMax) L.push('Zustand: ' + Math.round(inst.durability / d.durabilityMax * 100) + ' %');
    return L;
  }
  static serialize(inst) {
    if (!inst) return null;
    const o = { uid: inst.uid, id: inst.id, count: inst.count };
    if (inst.durability !== undefined) o.durability = inst.durability;
    if (inst.mag !== undefined) o.mag = inst.mag;
    if (inst.ammoId !== undefined) o.ammoId = inst.ammoId;
    return o;
  }
  static deserialize(obj) {
    if (!obj || typeof obj !== 'object') return null;
    const d = Items.def(obj.id);
    if (!d) return null;
    const inst = { uid: typeof obj.uid === 'string' && obj.uid ? obj.uid : Uid.next(), id: d.id, count: clamp(Math.floor(Number(obj.count) || 1), 1, Math.max(1, d.stack || 1)) };
    if (d.durabilityMax) inst.durability = clamp(Number.isFinite(obj.durability) ? obj.durability : d.durabilityMax, 0, d.durabilityMax);
    if (d.weapon && d.weapon.class !== 'melee' && d.weapon.ammo) {
      inst.mag = clamp(Math.floor(Number.isFinite(obj.mag) ? obj.mag : 0), 0, d.weapon.magSize || 0);
      const ad = Items.def(obj.ammoId);
      inst.ammoId = ad && ad.ammo && ad.ammo.caliber === d.weapon.ammo ? ad.id : Items.standardAmmoFor(d.weapon.ammo);
    }
    return inst;
  }
}

class Inventory {
  constructor(slots) {
    this.slots = Math.max(0, Math.floor(Number(slots) || 0));
    this.items = new Array(this.slots).fill(null);
  }
  setSlots(n) {
    n = Math.max(0, Math.floor(Number(n) || 0));
    const overflow = [];
    if (n < this.slots) {
      // compact first so as few items as possible overflow
      const all = this.all();
      this.items = new Array(n).fill(null);
      this.slots = n;
      for (const it of all) { const r = this.add(it); if (r.remaining) overflow.push(r.remaining); }
    } else {
      while (this.items.length < n) this.items.push(null);
      this.slots = n;
    }
    return overflow;
  }
  canAdd(inst) {
    if (!inst) return false;
    let need = inst.count || 1;
    const max = Items.stackMax(inst);
    for (const it of this.items) {
      if (!it) { need -= max; }
      else if (Items.canStack(it, inst)) need -= (max - it.count);
      if (need <= 0) return true;
    }
    return need <= 0;
  }
  add(inst) {
    if (!inst) return { ok: false, remaining: null };
    const max = Items.stackMax(inst);
    if (!inst.count || inst.count < 1) inst.count = 1;
    // merge into existing stacks
    for (let i = 0; i < this.slots && inst.count > 0; i++) {
      const it = this.items[i];
      if (it && it !== inst && Items.canStack(it, inst) && it.count < max) {
        const mv = Math.min(max - it.count, inst.count);
        it.count += mv; inst.count -= mv;
        if (inst.raidFound) it.raidFound = true;
      }
    }
    // empty slots
    for (let i = 0; i < this.slots && inst.count > 0; i++) {
      if (this.items[i]) continue;
      if (inst.count <= max) { this.items[i] = inst; return { ok: true, remaining: null }; }
      const part = Items.clone(inst);
      part.count = max; inst.count -= max;
      this.items[i] = part;
    }
    if (inst.count <= 0) return { ok: true, remaining: null };
    return { ok: false, remaining: inst };
  }
  addMany(list) {
    const rem = [];
    for (const inst of list || []) { const r = this.add(inst); if (r.remaining) rem.push(r.remaining); }
    return rem;
  }
  remove(uid, count = Infinity) {
    const i = this.indexOf(uid);
    if (i < 0) return null;
    const it = this.items[i];
    if (count >= it.count) { this.items[i] = null; return it; }
    const n = Math.max(1, Math.floor(count));

    part.count = n; it.count -= n;

  removeById(id, count) {

      it.count -= take; need -= take; removed += take;

  }
  count(id) { let n = 0; for (const it of this.items) if (it && it.id === id) n += it.count; return n; }
  has(id, count = 1) { return this.count(id) >= count; }

  move(from, to) {
    if (from === to || from < 0 || to < 0 || from >= this.slots || to >= this.slots) return false;
    const a = this.items[from], b = this.items[to];
    if (!a) return false;
    if (b && Items.canStack(a, b)) {
      const max = Items.stackMax(b);
      const mv = Math.min(a.count, max - b.count);
      if (mv <= 0) { this.items[from] = b; this.items[to] = a; return true; }
      b.count += mv; a.count -= mv;
      if (a.count <= 0) this.items[from] = null;
      return true;
    }
    this.items[from] = b; this.items[to] = a;
    return true;
  }
  transfer(idx, other, toIdx = -1) {
    if (!other || idx < 0 || idx >= this.slots) return false;
    const a = this.items[idx];
    if (!a) return false;
    if (other === this) return toIdx >= 0 ? this.move(idx, toIdx) : false;
    if (toIdx < 0) {
      const before = a.count;
      this.items[idx] = null;
      const r = other.add(a);
      if (r.remaining) { this.items[idx] = r.remaining; return r.remaining.count < before; }
      return true;
    }
    if (toIdx >= other.slots) return false;
    const b = other.items[toIdx];
    if (!b) { other.items[toIdx] = a; this.items[idx] = null; return true; }
    if (Items.canStack(a, b)) {
      const max = Items.stackMax(b);
      const mv = Math.min(a.count, max - b.count);
      if (mv <= 0) return false;
      b.count += mv; a.count -= mv;
      if (a.count <= 0) this.items[idx] = null;

  split(idx, count) {
    const it = this.items[idx];

    if (free < 0) return false;

  }
  sort() {
    const all = this.all();
    // merge stacks
    const merged = [];
    for (const it of all) {
      const tgt = merged.find(m => Items.canStack(m, it) && m.count < Items.stackMax(m));
      if (tgt) {

        tgt.count += mv; it.count -= mv;
        if (it.count > 0) merged.push(it);

    merged.sort((a, b) => {
      const da = Items.def(a), db = Items.def(b);
      const ca = INV_CAT_ORDER.indexOf(da ? da.cat : ''), cb = INV_CAT_ORDER.indexOf(db ? db.cat : '');
      if (ca !== cb) return ca - cb;
      const ra = Items.rarity(a).order || 0, rb = Items.rarity(b).order || 0;
      if (ra !== rb) return rb - ra;
      return String(da ? da.name : '').localeCompare(String(db ? db.name : ''), 'de');

  }
  all() { return this.items.filter(Boolean); }
  freeSlots() { let n = 0; for (const it of this.items) if (!it) n++; return n; }
  isFull() { return this.freeSlots() === 0; }
  weight() { let w = 0; for (const it of this.items) if (it) w += Items.weight(it); return w; }
  totalValue() { let v = 0; for (const it of this.items) if (it) v += Items.value(it); return v; }
  clear() { this.items = new Array(this.slots).fill(null); }
  serialize() { return { slots: this.slots, items: this.items.map(it => (it ? Items.serialize(it) : null)) }; }
  static deserialize(obj, fallbackSlots) {
    const fb = Math.max(0, Math.floor(Number(fallbackSlots) || 0));
    if (!obj || typeof obj !== 'object') return new Inventory(fb);
    const slots = Number.isFinite(obj.slots) && obj.slots >= 0 && obj.slots <= 400 ? Math.floor(obj.slots) : fb;
    const inv = new Inventory(slots);
    const list = Array.isArray(obj.items) ? obj.items : [];
    const overflow = [];
    for (let i = 0; i < list.length; i++) {
      const inst = Items.deserialize(list[i]);
      if (!inst) continue;
      if (i < slots && !inv.items[i]) inv.items[i] = inst; else overflow.push(inst);
    }
    for (const it of overflow) inv.add(it);
    return inv;
  }
}

const EQUIP_SLOTS = ['primary', 'secondary', 'melee', 'grenade', 'armorBody', 'armorHead', 'backpack'];
const EQUIP_SLOT_NAMES = { primary: 'Primärwaffe', secondary: 'Sekundärwaffe', melee: 'Nahkampf', grenade: 'Granate', armorBody: 'Weste', armorHead: 'Helm', backpack: 'Rucksack' };

class Equipment {
  constructor() {
    for (const s of EQUIP_SLOTS) this[s] = null;
  }
  static slotFor(inst) {
    const d = Items.def(inst);
    if (!d) return null;
    if (d.weapon) {
      const c = d.weapon.class;
      if (c === 'melee') return 'melee';
      if (c === 'pistol' || c === 'smg') return 'secondary';
      return 'primary';
    }
    if (d.grenade || d.cat === 'grenade') return 'grenade';
    if (d.armor) return d.armor.slot === 'head' ? 'armorHead' : 'armorBody';
    if (d.backpack) return 'backpack';
    return null;
  }
  static accepts(slot, inst) {
    const d = Items.def(inst);
    if (!d) return false;
    const natural = Equipment.slotFor(inst);
    if (slot === natural) return true;
    if (slot === 'primary' && natural === 'secondary') return true;   // pistols/SMGs may go into primary
    return false;
  }
  canEquip(inst) { return !!Equipment.slotFor(inst); }
  equip(inst, slot = Equipment.slotFor(inst)) {
    if (!inst || !slot || !EQUIP_SLOTS.includes(slot) || !Equipment.accepts(slot, inst)) return { ok: false, replaced: null };
    const replaced = this[slot] || null;
    this[slot] = inst;
    return { ok: true, replaced };
  }
  unequip(slot) {
    if (!EQUIP_SLOTS.includes(slot)) return null;
    const it = this[slot] || null;
    this[slot] = null;
    return it;
  }
  get(slot) { return EQUIP_SLOTS.includes(slot) ? this[slot] || null : null; }
  slotOf(uid) { for (const s of EQUIP_SLOTS) if (this[s] && this[s].uid === uid) return s; return null; }
  weaponSlots() { return [this.primary, this.secondary, this.melee]; }
  all() { return EQUIP_SLOTS.map(s => this[s]).filter(Boolean); }
  weight() { let w = 0; for (const s of EQUIP_SLOTS) if (this[s]) w += Items.weight(this[s]); return w; }
  protection() {
    const p = (inst) => {
      if (!inst || inst.durability === undefined || inst.durability <= 0) return 0;
      const d = Items.def(inst);
      return d && d.armor ? d.armor.protection || 0 : 0;
    };
    return { body: p(this.armorBody), head: p(this.armorHead) };
  }
  speedMul() {
    let m = 1;
    for (const s of ['armorBody', 'armorHead']) { const d = Items.def(this[s]); if (d && d.armor && d.armor.speedMul) m *= d.armor.speedMul; }
    return m;
  }
  carryBonus() { const d = Items.def(this.backpack); return d && d.backpack ? d.backpack.weightBonus || 0 : 0; }
  backpackSlots() { const d = Items.def(this.backpack); return d && d.backpack ? d.backpack.slots || 6 : 6; }
  serialize() { const o = {}; for (const s of EQUIP_SLOTS) o[s] = this[s] ? Items.serialize(this[s]) : null; return o; }
  static deserialize(obj) {
    const e = new Equipment();
    if (!obj || typeof obj !== 'object') return e;
    for (const s of EQUIP_SLOTS) {
      const inst = Items.deserialize(obj[s]);
      if (inst && Equipment.accepts(s, inst)) e[s] = inst;
    }
    return e;
  }
}


// ===== 11_loot.js =====
// 11_loot.js — LootSystem: rarity weighting by tier, container rolls, zombie drops, floor loot (SPEC §12).
// Decisions: map bias multiplies table entry weights (military: ammo/armor/weapon ×1.5, research: medical/electronics ×1.5,
//   industrial: material/tool/electronics ×1.4); container.preset items (mission items, keys) are appended after rolling.
// Dependencies: 00_util.js, 01/02/04 data, 10_items_inventory.js.

const LOOT_MAP_BIAS = {
  military: { ammo: 1.5, armor: 1.5, weapon: 1.4, grenade: 1.5 },
  research: { medical: 1.5, electronics: 1.5, collectible: 1.2 },
  industrial: { material: 1.4, tool: 1.4, electronics: 1.3 },
  city: { food: 1.3, water: 1.3, collectible: 1.2 },
};
const LOOT_T1 = [70, 25, 5, 0, 0];
const LOOT_T5 = [20, 30, 30, 15, 5];
const LOOT_RARITIES = ['common', 'uncommon', 'rare', 'epic', 'legendary'];

class LootSystem {
  constructor(raid) {
    this.raid = raid || null;
    const base = raid && raid.rng && typeof raid.rng.fork === 'function' ? raid.rng : new RNG(1234);
    this.rng = base.fork('loot');
    this.mapId = raid && (raid.mapId || (raid.map && raid.map.id)) || null;
  }

  rarityWeights(tier) {
    const t = clamp(((Number(tier) || 1) - 1) / 4, 0, 1);
    const out = {};
    LOOT_RARITIES.forEach((r, i) => { out[r] = lerp(LOOT_T1[i], LOOT_T5[i], t); });
    return out;
  }

  _rollable(def) { return def && def.cat !== 'key' && def.cat !== 'mission'; }

  pickByCategory(cat, tier) {
    if (typeof ITEMS === 'undefined') return null;
    const rw = this.rarityWeights(tier);
    const list = [];
    for (const d of Object.values(ITEMS)) {
      if (d.cat !== cat || !this._rollable(d)) continue;
      let w = rw[d.rarity] || 0;
      // weapon tiers: prefer weapons within reach of the area tier
      if (d.weapon && d.weapon.tier) w *= d.weapon.tier <= (tier || 1) + 1 ? 1 : 0.25;
      if (w > 0) list.push({ d, w });
    }
    const pick = this.rng.weighted(list);
    return pick ? pick.d : null;
  }

  _instFor(def, countRange, tier) {
    let count = 1;
    if ((def.stack || 1) > 1) {
      if (Array.isArray(countRange)) count = this.rng.int(countRange[0] || 1, countRange[1] || countRange[0] || 1);
      else if (def.ammo) count = this.rng.int(5, 30);
      else count = 1;
      count = clamp(count, 1, def.stack);
    }
    const inst = Items.create(def.id, count);
    if (!inst) return null;
    if (def.durabilityMax) inst.durability = Math.round(this.rng.float(35, 95) / 100 * def.durabilityMax);
    if (def.weapon && inst.mag !== undefined) inst.mag = this.rng.int(0, def.weapon.magSize || 0);
    inst.raidFound = true;
    return inst;
  }

  _rollTable(table, tier, rolls) {
    const out = [];
    if (!table || !Array.isArray(table.entries)) return out;
    const bias = LOOT_MAP_BIAS[this.mapId] || {};
    const rw = this.rarityWeights(tier);
    const entries = table.entries.filter(e => !e.minTier || e.minTier <= tier).map(e => {
      let w = Number(e.w) || 0;
      let cat = e.cat;
      if (e.id) {
        const d = Items.def(e.id);
        if (!this._rollable(d)) return null;
        cat = d.cat;
        // single items still follow the rarity curve of the area
        w *= 0.35 + (rw[d.rarity] || 0) / 50;
      }
      w *= bias[cat] || 1;
      return { e, w };
    }).filter(x => x && x.w > 0);
    for (let i = 0; i < rolls; i++) {
      const pick = this.rng.weighted(entries);
      if (!pick) break;
      const e = pick.e;
      const def = e.id ? Items.def(e.id) : this.pickByCategory(e.cat, tier);
      if (!this._rollable(def)) continue;
      const inst = this._instFor(def, e.count, tier);
      if (inst) out.push(inst);
    }
    return out;
  }

  _merge(list) {
    const out = [];
    for (const inst of list) {
      const tgt = out.find(o => Items.canStack(o, inst) && o.count < Items.stackMax(o));
      if (tgt) {
        const mv = Math.min(inst.count, Items.stackMax(tgt) - tgt.count);
        tgt.count += mv; inst.count -= mv;
        if (inst.count > 0) out.push(inst);
      } else out.push(inst);
    }
    return out;
  }

  rollContainer(container, world) {
    if (!container) return [];
    if (Array.isArray(container.items)) return container.items;
    const tables = typeof LOOT_TABLES !== 'undefined' ? LOOT_TABLES : {};
    const table = tables[container.type] || tables.crate || null;
    const tier = clamp(container.tier || 1, 1, 5);
    let items = [];
    if (table && !this.rng.chance(0.1)) {
      const r = Array.isArray(table.rolls) ? table.rolls : [1, 3];
      const rolls = this.rng.int(r[0], r[1]) + (tier >= 4 ? 1 : 0);
      items = this._rollTable(table, tier, rolls);
    }
    items = this._merge(items);
    for (const p of container.preset || []) { if (p) { p.raidFound = true; items.push(p); } }
    container.preset = [];
    container.items = items.slice(0, 12);
    return container.items;
  }

  rollZombieDrop(zombie) {
    const type = zombie && zombie.type;
    if (!type) return [];
    if (type.id === 'boss') {
      const out = [];
      const n = this.rng.int(3, 5);
      const table = (typeof LOOT_TABLES !== 'undefined' && (LOOT_TABLES.safe || LOOT_TABLES.military_crate)) || null;
      out.push(...this._rollTable(table, 5, n));
      return this._merge(out);
    }
    if (!this.rng.chance(type.lootChance ?? 0.25)) return [];
    const tier = clamp(type.tier || 1, 1, 5);
    const drops = Array.isArray(type.dropTable) && type.dropTable.length ? { entries: type.dropTable } : (typeof LOOT_TABLES !== 'undefined' ? LOOT_TABLES.zombie : null);
    return this._rollTable(drops, tier, type.tier >= 3 ? 2 : 1);
  }

  rollFloorLoot(tier) {
    const table = typeof LOOT_TABLES !== 'undefined' ? LOOT_TABLES.floor : null;
    const r = this._rollTable(table, clamp(tier || 1, 1, 5), 1);
    return r[0] || null;
  }
}


// ===== 12_weapons.js =====
// 12_weapons.js — WeaponSystem: firing, spread/bloom, projectiles with tile raycasts and zombie hits, penetration,
// melee, reloading, grenades (frag / molotov / flash) (SPEC §13).
// Decisions: holding the trigger re-fires semi-automatic guns at their fire rate × 0.8 (twin-stick convention);
//   misfires return reason 'misfire'; shotgun slugs ('Flintenlaufgeschoss') fire one projectile with pellets × 0.55 damage.
//   Active reloads are tracked in this.reloads (inst.rt holds only numbers/booleans).
// Dependencies: 00_util.js, 08_world.js, 09_collision.js, 10_items_inventory.js; raid subsystems at runtime.

class WeaponSystem {
  constructor(raid) {
    this.raid = raid;
    this.rng = raid && raid.rng && raid.rng.fork ? raid.rng.fork('weapons') : new RNG(7);
    this.projectiles = [];
    this.reloads = [];
    this._cands = [];
  }
  get grenades() { return this.raid ? this.raid.grenades : []; }

  static rt(inst) {
    if (!inst.rt) inst.rt = { cooldown: 0, reloading: false, reloadTimer: 0, bloom: 0, held: 0 };
    return inst.rt;
  }

  tryFire(inst, shooter, aimAngle, isPlayer = true, semiHeld = false) {
    const def = Items.def(inst);
    const w = def && def.weapon;
    if (!w) return { fired: false, reason: null };
    if (w.class === 'melee') return { fired: false, reason: 'melee' };
    const rt = WeaponSystem.rt(inst);
    if (rt.reloading) return { fired: false, reason: 'reloading' };
    if (rt.cooldown > 0) return { fired: false, reason: 'cooldown' };
    const raid = this.raid;
    const audio = raid && raid.game && raid.game.audio;
    if ((inst.mag || 0) <= 0) {
      rt.cooldown = 0.35;
      if (audio) audio.play('empty_click', { x: shooter.x, y: shooter.y });
      return { fired: false, reason: 'empty' };
    }
    if (inst.durability !== undefined && inst.durability < 15 && this.rng.chance(0.1)) {
      rt.cooldown = 0.45;
      if (audio) audio.play('empty_click', { x: shooter.x, y: shooter.y });
      if (isPlayer && raid && raid.game && raid.game.ui) raid.game.ui.toast('Ladehemmung!', 'warning', 1200);
      return { fired: false, reason: 'misfire' };
    }
    const ammo = Items.def(inst.ammoId);
    const a = (ammo && ammo.ammo) || { dmgMul: 1, penMul: 1, noiseMul: 1, label: 'Standard' };
    rt.cooldown = (1 / Math.max(0.1, w.fireRate)) * (!w.auto && semiHeld ? 1.25 : 1);
    inst.mag--;
    if (inst.durability !== undefined) inst.durability = Math.max(0, inst.durability - 0.15);
    const sm = typeof shooter.spreadMul === 'function' ? shooter.spreadMul() : 1;
    const slug = a.label === 'Flintenlaufgeschoss';
    const pellets = slug ? 1 : Math.max(1, w.pellets || 1);
    let spread = (w.spread || 0.03) * sm * (1 + rt.bloom) * (slug ? 0.35 : 1);
    const durMul = inst.durability !== undefined && inst.durability < 30 ? 0.9 : 1;
    const dmg = w.damage * (a.dmgMul || 1) * durMul * (slug ? (w.pellets || 1) * 0.55 : 1);
    const pen = clamp(Math.round((w.penetration || 1) * (a.penMul || 1)), 1, 3);
    const speed = w.class === 'sniper' ? 2200 : 1400;
    const mx = shooter.x + Math.cos(aimAngle) * 20, my = shooter.y + Math.sin(aimAngle) * 20;
    // never spawn a bullet inside a wall (shooting point-blank at a wall)
    const muzzle = raid && raid.world ? Physics.raycastTiles(raid.world, shooter.x, shooter.y, mx, my) : { hit: false, x: mx, y: my };
    for (let i = 0; i < pellets; i++) {
      const ang = aimAngle + (this.rng.next() + this.rng.next() - 1) * spread;
      if (this.projectiles.length >= 400) this.projectiles.shift();
      const p = {
        x: muzzle.hit ? shooter.x : mx, y: muzzle.hit ? shooter.y : my,
        vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, dirX: Math.cos(ang), dirY: Math.sin(ang),
        dmg, pen, range: w.range || 700, traveled: 0, ownerIsPlayer: isPlayer, ttl: 2, trail: 0, cls: w.class,
        hitCounted: false, shooter,
      };
      this.projectiles.push(p);
    }
    rt.bloom = Math.min(2.2, rt.bloom + (w.recoil || 0.2) * 0.5);
    if (raid) {
      if (raid.fx) { raid.fx.muzzleFlash(mx, my, aimAngle, w.class === 'shotgun' || w.class === 'lmg' ? 1.3 : 1); raid.fx.casing(shooter.x, shooter.y, aimAngle); }
      if (isPlayer && raid.game && raid.game.camera) raid.game.camera.addShake((w.recoil || 0.2) * 6);
      if (audio) audio.play('shot_' + (w.class === 'lmg' ? 'lmg' : w.class), { x: shooter.x, y: shooter.y });
      if (raid.emitNoise) raid.emitNoise(shooter.x, shooter.y, (w.noise || 600) * (a.noiseMul || 1), 'shot');
    }
    if (shooter.stats) shooter.stats.shotsFired++;
    if (isPlayer && inst.mag === 0 && audio) audio.play('empty_click', { x: shooter.x, y: shooter.y, volume: 0.4 });
    return { fired: true, reason: null };
  }

  ammoInInventory(inst, inventory) {
    const def = Items.def(inst);
    if (!def || !def.weapon || !def.weapon.ammo || !inventory) return 0;
    let n = 0;
    for (const it of inventory.all()) {
      const d = Items.def(it);
      if (d && d.ammo && d.ammo.caliber === def.weapon.ammo) n += it.count;
    }
    return n;
  }

  reserveText(inst, inventory) {
    const def = Items.def(inst);
    if (!def || !def.weapon) return '';
    if (def.weapon.class === 'melee') return '—';
    return (inst.mag || 0) + ' / ' + this.ammoInInventory(inst, inventory);
  }

  _chooseAmmo(inst, inventory) {
    const def = Items.def(inst);
    const cal = def.weapon.ammo;
    const counts = new Map();
    for (const it of inventory.all()) {
      const d = Items.def(it);
      if (d && d.ammo && d.ammo.caliber === cal) counts.set(it.id, (counts.get(it.id) || 0) + it.count);
    }
    if (inst.ammoId && counts.get(inst.ammoId) > 0) return inst.ammoId;
    let best = null, bn = 0;
    for (const [id, n] of counts) if (n > bn) { bn = n; best = id; }
    return best;
  }

  startReload(inst, inventory) {
    const def = Items.def(inst);
    if (!def || !def.weapon || def.weapon.class === 'melee' || !inventory) return { ok: false, reason: null };
    const rt = WeaponSystem.rt(inst);
    if (rt.reloading) return { ok: false, reason: 'reloading' };
    const audio = this.raid && this.raid.game && this.raid.game.audio;
    const ammoId = this._chooseAmmo(inst, inventory);
    const fullOfSame = (inst.mag || 0) >= (def.weapon.magSize || 0) && (!ammoId || ammoId === inst.ammoId);
    if (fullOfSame) return { ok: false, reason: 'full' };
    if (!ammoId) {
      if (audio) audio.play('empty_click');
      return { ok: false, reason: 'no_ammo' };
    }
    rt.reloading = true;
    rt.reloadTimer = def.weapon.reloadTime || 2;
    this.reloads = this.reloads.filter(r => r.inst !== inst);
    this.reloads.push({ inst, inventory, ammoId });
    if (audio) audio.play('reload_start', this.raid && this.raid.player ? { x: this.raid.player.x, y: this.raid.player.y } : {});
    return { ok: true, reason: null };
  }

  cancelReload(inst) {
    if (!inst) return;
    const rt = WeaponSystem.rt(inst);
    rt.reloading = false; rt.reloadTimer = 0;
    this.reloads = this.reloads.filter(r => r.inst !== inst);
  }

  finishReload(inst, inventory, ammoIdArg) {
    const def = Items.def(inst);
    const rt = WeaponSystem.rt(inst);
    rt.reloading = false; rt.reloadTimer = 0;
    if (!def || !def.weapon || !inventory) return;
    const ammoId = ammoIdArg && inventory.count(ammoIdArg) > 0 ? ammoIdArg : this._chooseAmmo(inst, inventory);
    if (!ammoId) return;
    if (ammoId !== inst.ammoId && (inst.mag || 0) > 0 && inst.ammoId) {
      const back = Items.create(inst.ammoId, inst.mag);
      if (back) {
        const r = inventory.add(back);
        if (r.remaining && this.raid && this.raid.player && this.raid.dropItem) this.raid.dropItem(r.remaining, this.raid.player.x, this.raid.player.y);
      }
      inst.mag = 0;
    }
    const need = (def.weapon.magSize || 0) - (inst.mag || 0);
    const take = Math.min(need, inventory.count(ammoId));
    if (take <= 0) return;
    inst.mag = (inst.mag || 0) + take;
    inventory.removeById(ammoId, take);
    inst.ammoId = ammoId;
  }

  melee(inst, shooter, aimAngle) {
    const def = Items.def(inst);
    const w = def && def.weapon;
    if (!w) return { hit: 0 };
    const rt = WeaponSystem.rt(inst);
    if (rt.cooldown > 0) return { hit: 0 };
    rt.cooldown = w.swingTime || 0.5;
    const raid = this.raid;
    const audio = raid && raid.game && raid.game.audio;
    if (audio) audio.play('melee_swing', { x: shooter.x, y: shooter.y });
    if (shooter) shooter.meleeAnim = 1;
    const range = w.meleeRange || 60, arc = w.meleeArc || 1.6;
    let dmgMul = 1;
    if (inst.durability !== undefined) dmgMul = inst.durability <= 0 ? 0.4 : inst.durability < 15 ? 0.6 : 1;
    let hit = 0;
    const zs = raid && raid.zombies ? raid.zombies.inRadius(shooter.x, shooter.y, range + 40) : [];
    for (const z of zs) {
      const d = dist(shooter.x, shooter.y, z.x, z.y);
      if (d > range + z.radius) continue;
      const a = angleTo(shooter.x, shooter.y, z.x, z.y);
      if (Math.abs(angleDiff(aimAngle, a)) > arc / 2 && d > z.radius + 6) continue;
      if (raid.world && !Physics.lineOfSight(raid.world, shooter.x, shooter.y, z.x, z.y)) continue;
      const r = raid.zombies.damage(z, w.damage * dmgMul, { pen: 2, dirX: Math.cos(a), dirY: Math.sin(a), source: 'melee' });
      // knock the target back a little
      if (!z.dead && z.type && z.type.id !== 'brute' && z.type.id !== 'boss' && raid.world) {
        const m = Physics.moveCircle(raid.world, z.x, z.y, z.radius, Math.cos(a) * 18, Math.sin(a) * 18);
        z.x = m.x; z.y = m.y;
      }
      if (raid.fx) raid.fx.blood(z.x, z.y, a, 1.2);
      if (shooter.stats) shooter.stats.damageDealt += r.dealt || 0;
      hit++;
      if (inst.durability !== undefined) inst.durability = Math.max(0, inst.durability - 0.6);
    }
    if (hit) {
      if (audio) audio.play('melee_hit', { x: shooter.x, y: shooter.y });
      if (raid && raid.fx) raid.fx.hitMarker();
      if (raid && raid.game && raid.game.camera) raid.game.camera.addShake(2);
    }
    if (raid && raid.emitNoise) raid.emitNoise(shooter.x, shooter.y, 60, 'step');
    return { hit };
  }

  throwGrenade(inst, from, aimAngle, power = 1) {
    const def = Items.def(inst);
    if (!def || !inst || inst.count < 1) return false;
    const g = def.grenade || { damage: 120, radius: 140, fuse: 2.2, noise: 1000, kind: 'frag' };
    inst.count--;
    const speed = 420 * clamp(power, 0.3, 1.5);
    const raid = this.raid;
    raid.grenades.push({
      x: from.x + Math.cos(aimAngle) * 14, y: from.y + Math.sin(aimAngle) * 14, vx: Math.cos(aimAngle) * speed, vy: Math.sin(aimAngle) * speed,
      z: 8, vz: 230, fuse: g.kind === 'molotov' ? 4 : (g.fuse || 2.2), def, g, inst, kind: g.kind || 'frag', rot: 0, bounced: false,
    });
    const audio = raid && raid.game && raid.game.audio;
    if (audio) audio.play('grenade_throw', { x: from.x, y: from.y });
    return true;
  }

  update(dt) {
    const raid = this.raid;
    if (!raid) return;
    // reloads
    for (let i = this.reloads.length - 1; i >= 0; i--) {
      const r = this.reloads[i];
      const rt = WeaponSystem.rt(r.inst);
      if (!rt.reloading) { this.reloads.splice(i, 1); continue; }
      rt.reloadTimer -= dt;
      if (rt.reloadTimer <= 0) {
        this.reloads.splice(i, 1);
        this.finishReload(r.inst, r.inventory, r.ammoId);
        const audio = raid.game && raid.game.audio;
        if (audio) audio.play('reload_end', raid.player ? { x: raid.player.x, y: raid.player.y } : {});
      }
    }
    // cooldown and bloom of the player's weapons
    const p = raid.player;
    if (p && p.equipment) {
      for (const inst of [p.equipment.primary, p.equipment.secondary, p.equipment.melee]) {
        if (!inst || !inst.rt) continue;
        inst.rt.cooldown = Math.max(0, inst.rt.cooldown - dt);
        inst.rt.bloom = Math.max(0, inst.rt.bloom - 2 * dt);
      }
    }
    this._updateProjectiles(dt);
    this._updateGrenades(dt);
  }

  _falloff(p) {
    const R = p.range;
    if (p.traveled <= 0.6 * R) return 1;
    return lerp(1, 0.5, clamp((p.traveled - 0.6 * R) / (0.4 * R), 0, 1));
  }

  _updateProjectiles(dt) {
    const raid = this.raid, world = raid.world;
    const list = this.projectiles;
    for (let i = list.length - 1; i >= 0; i--) {
      const p = list[i];
      p.ttl -= dt;
      let x1 = p.x + p.vx * dt, y1 = p.y + p.vy * dt;
      let segLen = Math.hypot(x1 - p.x, y1 - p.y);
      let dead = false;
      if (p.traveled + segLen > p.range) {
        const rem = Math.max(0, p.range - p.traveled);
        x1 = p.x + p.dirX * rem; y1 = p.y + p.dirY * rem; segLen = rem;
        dead = true;
      }
      const ray = world ? Physics.raycastTiles(world, p.x, p.y, x1, y1) : { hit: false, x: x1, y: y1 };
      const ex = ray.x, ey = ray.y;
      // zombie hits along the clipped segment
      let hitAny = false;
      if (raid.hash && raid.zombies) {
        const minx = Math.min(p.x, ex), miny = Math.min(p.y, ey);
        this._cands.length = 0;
        raid.hash.queryRect(minx - 24, miny - 24, Math.abs(ex - p.x) + 48, Math.abs(ey - p.y) + 48, this._cands);
        const hits = [];
        for (const z of this._cands) {
          if (z.dead) continue;
          const t = Physics.segmentCircle(p.x, p.y, ex, ey, z.x, z.y, z.radius);
          if (t >= 0) hits.push({ z, t });
        }
        if (hits.length) {
          hits.sort((a, b) => a.t - b.t);
          let mul = 1;
          const n = Math.min(hits.length, p.pen);
          for (let k = 0; k < n; k++) {
            const { z, t } = hits[k];
            const hx = p.x + (ex - p.x) * t, hy = p.y + (ey - p.y) * t;
            p.traveled += segLen * t;
            const dmg = p.dmg * this._falloff(p) * mul;
            const r = raid.zombies.damage(z, dmg, { pen: p.pen, dirX: p.dirX, dirY: p.dirY, source: 'bullet' });
            if (raid.fx) {
              raid.fx.blood(hx, hy, Math.atan2(p.dirY, p.dirX), 0.8);
              if (p.ownerIsPlayer) { raid.fx.hitMarker(); raid.fx.floatingText(hx, hy - 10, Math.round(r.dealt || dmg), r.killed ? '#ff6b6b' : '#ffe08a'); }
            }
            if (p.ownerIsPlayer && p.shooter && p.shooter.stats) {
              if (!p.hitCounted) { p.shooter.stats.shotsHit++; p.hitCounted = true; }
              p.shooter.stats.damageDealt += r.dealt || 0;
            }
            const audio = raid.game && raid.game.audio;
            if (audio && k === 0) audio.play('zombie_hit', { x: hx, y: hy, volume: 0.6 });
            mul *= 0.6;
          }
          hitAny = true;
        }
      }
      if (hitAny) { list.splice(i, 1); continue; }
      if (ray.hit) {
        if (raid.fx) raid.fx.impact(ray.x, ray.y, Math.atan2(p.dirY, p.dirX), ray.tile);
        list.splice(i, 1);
        continue;
      }
      p.traveled += segLen;
      p.x = x1; p.y = y1;
      p.trail = Math.min(p.trail + segLen, 60);
      if (dead || p.ttl <= 0) list.splice(i, 1);
    }
  }

  _updateGrenades(dt) {
    const raid = this.raid, world = raid.world;
    const gs = raid.grenades;
    for (let i = gs.length - 1; i >= 0; i--) {
      const g = gs[i];
      g.fuse -= dt;
      g.rot += dt * 10;
      // vertical arc
      g.vz -= 650 * dt;
      g.z += g.vz * dt;
      let landed = false;
      if (g.z <= 0) {
        g.z = 0;
        if (Math.abs(g.vz) > 60) { g.vz = -g.vz * 0.35; landed = true; } else g.vz = 0;
        g.vx *= 0.55; g.vy *= 0.55;
      }
      // horizontal movement with wall bounces
      const nx = g.x + g.vx * dt, ny = g.y + g.vy * dt;
      if (world) {
        if (world.blocksBullets(Math.floor(nx / TILE), Math.floor(g.y / TILE))) g.vx = -g.vx * 0.5; else g.x = nx;
        if (world.blocksBullets(Math.floor(g.x / TILE), Math.floor(ny / TILE))) g.vy = -g.vy * 0.5; else g.y = ny;
      } else { g.x = nx; g.y = ny; }
      if (g.z === 0) { const k = Math.exp(-4 * dt); g.vx *= k; g.vy *= k; }
      if ((g.kind === 'molotov' && (landed || g.z === 0 && g.vz === 0)) || g.fuse <= 0) {
        gs.splice(i, 1);
        this._explode(g);
      }
    }
  }

  _explode(g) {
    const raid = this.raid;
    const audio = raid.game && raid.game.audio;
    const R = g.g.radius || 140;
    if (g.kind === 'molotov') {
      raid.addHazard({ kind: 'fire', x: g.x, y: g.y, r: R * 0.6, duration: 9 });
      if (audio) audio.play('fire', { x: g.x, y: g.y });
      if (raid.fx) raid.fx.explosion(g.x, g.y, R * 0.4);
      raid.emitNoise(g.x, g.y, g.g.noise || 500, 'explosion');
      // instant burn for zombies inside
      for (const z of raid.zombies.inRadius(g.x, g.y, R * 0.6)) raid.zombies.damage(z, 25, { pen: 3, source: 'fire' });
      return;
    }
    if (g.kind === 'flash') {
      if (audio) audio.play('explosion', { x: g.x, y: g.y, volume: 0.6, pitch: 1.6 });
      if (raid.fx) { raid.fx.lightFlashes.push({ x: g.x, y: g.y, r: R * 4, ttl: 0.35, color: '#ffffff' }); }
      for (const z of raid.zombies.inRadius(g.x, g.y, R * 1.4)) {
        if (raid.world && !Physics.lineOfSight(raid.world, g.x, g.y, z.x, z.y)) continue;
        z.state = 'stunned'; z.stunTimer = 3.5; z.windupTimer = 0; z.attackAnim = 0;
      }
      const p = raid.player;
      if (p && dist(p.x, p.y, g.x, g.y) < R * 1.5 && Physics.lineOfSight(raid.world, g.x, g.y, p.x, p.y) && raid.fx) {
        const facing = Math.abs(angleDiff(p.angle, angleTo(p.x, p.y, g.x, g.y))) < 1.4;
        raid.fx.flash(facing ? 1 : 0.5);
      }
      raid.emitNoise(g.x, g.y, g.g.noise || 900, 'explosion');
      return;
    }
    // frag
    if (audio) audio.play('explosion', { x: g.x, y: g.y });
    if (raid.fx) raid.fx.explosion(g.x, g.y, R);
    if (raid.game && raid.game.camera && raid.player) {
      const d = dist(raid.player.x, raid.player.y, g.x, g.y);
      raid.game.camera.addShake(clamp(18 - d / 40, 2, 18));
    }
    const dmg = g.g.damage || 120;
    for (const z of raid.zombies.inRadius(g.x, g.y, R)) {
      if (raid.world && !Physics.lineOfSight(raid.world, g.x, g.y, z.x, z.y)) continue;
      const d = dist(g.x, g.y, z.x, z.y);
      const f = clamp(1 - d / R, 0.2, 1);
      const a = angleTo(g.x, g.y, z.x, z.y);
      const r = raid.zombies.damage(z, dmg * f, { pen: 3, dirX: Math.cos(a), dirY: Math.sin(a), source: 'explosion' });
      if (raid.player && raid.player.stats) raid.player.stats.damageDealt += r.dealt || 0;
    }
    const p = raid.player;
    if (p && !p.dead) {
      const d = dist(p.x, p.y, g.x, g.y);
      if (d < R && Physics.lineOfSight(raid.world, g.x, g.y, p.x, p.y)) {
        p.takeDamage(dmg * clamp(1 - d / R, 0.15, 1) * 0.7, { source: 'Explosion', from: { x: g.x, y: g.y }, bleedChance: 0.4 });
      }
    }
    raid.emitNoise(g.x, g.y, g.g.noise || 1100, 'explosion');
  }
}


// ===== 13_player.js =====
// 13_player.js — Player: movement, stamina, survival stats, status effects, armor, weapon slots, item use (SPEC §14).
// Decisions: crouch is a toggle (C / touch C); sprint is held (Shift) or toggled (touch). Holding fire repeats
//   semi-auto weapons (WeaponSystem decides the rate). Item use is channelled; firing or switching cancels it.
// Dependencies: 00_util.js, 04 data (CARRY_BASE), 09_collision.js, 10_items_inventory.js, 12_weapons.js (runtime).

class Player {
  constructor(raid, loadout = {}) {
    this.raid = raid;
    this.uid = 'player';
    this.x = 0; this.y = 0; this.angle = 0; this.radius = 12;
    this.equipment = loadout.equipment || new Equipment();
    this.inventory = loadout.inventory || new Inventory(this.equipment.backpackSlots());
    this.secure = loadout.secure || new Inventory(1);
    this.hpMax = Number.isFinite(loadout.hpMax) ? loadout.hpMax : 100;
    this.hp = clamp(Number.isFinite(loadout.hp) ? loadout.hp : this.hpMax, 1, this.hpMax);
    this.stamina = 100; this.staminaMax = 100;
    this.hunger = clamp(Number.isFinite(loadout.hunger) ? loadout.hunger : 100, 0, 100);
    this.thirst = clamp(Number.isFinite(loadout.thirst) ? loadout.thirst : 100, 0, 100);
    this.bleeding = false; this.bleedTimer = 0;
    this.toxic = 0;
    this.effects = [];
    this.crouching = false; this.sprinting = false; this.moving = false;
    this.flashlightOn = true;
    this.dead = false; this.god = false;
    const ws = this.equipment.weaponSlots();
    this.activeSlot = Math.max(0, ws.findIndex(Boolean));
    this.using = null;
    this.interactTarget = null;
    this.holdProgress = 0;
    this.causeOfDeath = null;
    this.stats = { shotsFired: 0, shotsHit: 0, kills: 0, killsByType: {}, damageDealt: 0, damageTaken: 0, lootValue: 0, containersOpened: 0, distance: 0 };
    this.staminaDelay = 0;
    this.stepTimer = 0;
    this.legPhase = 0;
    this.meleeAnim = 0;
    this.knock = null;
    this.hurtTimer = 0;
    this.lastFire = false;
    this.grenadeCooldown = 0;
    this.lowWarned = { hunger: false, thirst: false };
  }

  get weaponInst() {
    if (this.activeSlot >= 0 && this.activeSlot <= 2) return this.equipment.weaponSlots()[this.activeSlot] || null;
    return null;
  }
  get game() { return this.raid && this.raid.game; }
  _audio(name, opts) { const a = this.game && this.game.audio; if (a) a.play(name, opts || { x: this.x, y: this.y }); }
  _toast(text, kind = 'info', ms) { const ui = this.game && this.game.ui; if (ui) ui.toast(text, kind, ms); }

  effectiveHpMax() { return Math.max(20, this.hpMax - (this.thirst < 25 ? 20 : 0)); }
  hasEffect(id) { return this.effects.some(e => e.id === id); }

  carryLimit() {
    const pm = this.game && this.game.profileMgr;
    const def = pm && pm.profile && pm.profile.upgrades ? pm.profile.upgrades.defense || 0 : 0;
    return (typeof CARRY_BASE !== 'undefined' ? CARRY_BASE : 30) + this.equipment.carryBonus() + 5 * def;
  }
  totalWeight() { return this.inventory.weight() + this.equipment.weight() + this.secure.weight(); }
  weightSpeedMul() {
    const r = this.totalWeight() / Math.max(1, this.carryLimit());
    if (r <= 0.7) return 1;
    if (r <= 1) return lerp(1, 0.8, (r - 0.7) / 0.3);
    return 0.55;
  }
  overweight() { return this.totalWeight() > this.carryLimit(); }
  spreadMul() {
    let m = this.crouching ? 0.6 : this.sprinting ? 2.0 : this.moving ? 1.4 : 1.0;
    for (const e of this.effects) if (e.spreadMul) m *= e.spreadMul;
    return m;
  }
  noiseRadius() {
    if (!this.moving) return 0;
    return this.crouching ? 45 : this.sprinting ? 260 : 130;
  }
  screenPos() {
    const cam = this.game && this.game.camera;
    return cam ? cam.worldToScreen(this.x, this.y) : { x: 0, y: 0 };
  }

  update(dt, input) {
    if (this.dead) return;
    const raid = this.raid;
    const world = raid && raid.world;
    this.hurtTimer = Math.max(0, this.hurtTimer - dt);
    this.meleeAnim = Math.max(0, this.meleeAnim - dt * 4);
    this.grenadeCooldown = Math.max(0, this.grenadeCooldown - dt);

    // ---- effects ----
    let speedMul = 1;
    for (let i = this.effects.length - 1; i >= 0; i--) {
      const e = this.effects[i];
      e.timer -= dt;
      if (e.speedMul) speedMul *= e.speedMul;
      if (e.hps) this.heal(e.hps * dt, true);
      if (e.timer <= 0) this.effects.splice(i, 1);
    }

    // ---- movement ----
    const ax = input ? input.moveAxis() : { x: 0, y: 0 };
    if (input && input.pressed('crouch')) { this.crouching = !this.crouching; }
    const wantSprint = input ? input.isDown('sprint') : false;
    const mag = Math.hypot(ax.x, ax.y);
    this.moving = mag > 0.05;
    const canSprint = wantSprint && this.moving && this.stamina > 1 && !this.overweight() && !this.crouching && !this.using;
    this.sprinting = canSprint;
    let speed = this.crouching ? 85 : canSprint ? 250 : 150;
    speed *= this.weightSpeedMul() * speedMul * this.equipment.speedMul();
    if (this.using) speed *= 0.55;
    if (world) speed *= world.speedMul(Math.floor(this.x / TILE), Math.floor(this.y / TILE));
    let dx = ax.x * speed * dt, dy = ax.y * speed * dt;
    if (this.knock) {
      const k = this.knock;
      const f = Math.min(dt, k.t);
      dx += k.vx * f; dy += k.vy * f;
      k.t -= dt;
      if (k.t <= 0) this.knock = null;
    }
    if (dx !== 0 || dy !== 0) {
      const ox = this.x, oy = this.y;
      if (world) {
        const r = Physics.moveCircle(world, this.x, this.y, this.radius, dx, dy);
        this.x = r.x; this.y = r.y;
      } else { this.x += dx; this.y += dy; }
      const moved = Math.hypot(this.x - ox, this.y - oy);
      this.stats.distance += moved;
      this.legPhase += moved * 0.12;
    }
    // stamina
    if (this.sprinting) { this.stamina = Math.max(0, this.stamina - 22 * dt); this.staminaDelay = 1; }
    else {
      this.staminaDelay = Math.max(0, this.staminaDelay - dt);
      if (this.staminaDelay <= 0) this.stamina = Math.min(this.staminaMax, this.stamina + 18 * dt * (this.hunger < 25 ? 0.5 : 1));
    }
    // footsteps
    if (this.moving) {
      this.stepTimer -= dt;
      if (this.stepTimer <= 0) {
        this.stepTimer = this.sprinting ? 0.3 : 0.38;
        const nr = this.noiseRadius();
        if (raid && raid.emitNoise && nr > 0) raid.emitNoise(this.x, this.y, nr, 'step');
        if (!this.crouching) this._audio(this.sprinting ? 'footstep_run' : 'footstep', { x: this.x, y: this.y, volume: 0.5 });
        if (this.sprinting && raid && raid.fx) raid.fx.footDust(this.x, this.y + 6);
      }
    } else this.stepTimer = 0.1;

    // ---- aim ----
    if (input) {
      const sp = this.screenPos();
      const a = input.aimAngleFrom(sp.x, sp.y);
      if (Number.isFinite(a)) this.angle = a;
    }

    // ---- slots / actions ----
    if (input) {
      for (let i = 0; i < 5; i++) if (input.pressed('slot' + (i + 1))) this.switchSlot(i);
      if (input.pressed('flashlight')) { this.flashlightOn = !this.flashlightOn; this._audio('flashlight', { volume: 0.5 }); }
      if (input.pressed('reload')) this.reload();
      if (input.pressed('quickMed')) this.quickMed();
      if (input.pressed('grenade')) this.throwGrenade();
      const fire = input.wantsFire();
      const edge = fire && !this.lastFire;
      if (fire) this._fire(edge);
      this.lastFire = fire;
    }

    // ---- item use channel ----
    if (this.using) {
      this.using.timer -= dt;
      if (this.using.timer <= 0) this._finishUse();
    }

    // ---- interaction ----
    if (raid && raid.findInteractable) this.interactTarget = raid.findInteractable(this.x, this.y);
    if (input && input.pressed('interact') && this.interactTarget && raid.interact) raid.interact(this.interactTarget);

    // ---- survival ----
    this.hunger = Math.max(0, this.hunger - (2.0 / 60) * dt);
    this.thirst = Math.max(0, this.thirst - (3.0 / 60) * dt);
    if (this.hunger < 25 && !this.lowWarned.hunger) { this.lowWarned.hunger = true; this._toast('Du hast Hunger – iss etwas.', 'warning'); }
    if (this.thirst < 25 && !this.lowWarned.thirst) { this.lowWarned.thirst = true; this._toast('Du hast Durst – trink etwas.', 'warning'); }
    if (this.hunger > 30) this.lowWarned.hunger = false;
    if (this.thirst > 30) this.lowWarned.thirst = false;
    const cap = this.effectiveHpMax();
    if (this.hp > cap) this.hp = cap;
    if (this.hunger <= 0 || this.thirst <= 0) this._drain(0.5 * dt, this.thirst <= 0 ? 'Verdurstet' : 'Verhungert');
    if (this.bleeding) {
      this.bleedTimer += dt;
      this._drain(1.5 * dt, 'Verblutet');
      if (this.bleedTimer >= 45) { this.bleeding = false; this.bleedTimer = 0; }
      this.bleedFx = (this.bleedFx || 0) + dt;
      if (raid && raid.fx && this.bleedFx > 0.5) { this.bleedFx = 0; raid.fx.blood(this.x, this.y, this.angle + Math.PI, 0.3); }
    }
    if (this.toxic > 0) {
      this.toxic = Math.max(0, this.toxic - dt);
      this._drain(2 * dt, 'Vergiftung');
    }
  }

  _drain(amount, cause) {
    if (this.god || this.dead) return;
    this.hp -= amount;
    if (this.hp <= 0) { this.hp = 0; this.causeOfDeath = cause; this.die(); }
  }

  _fire(edge) {
    const raid = this.raid;
    if (!raid || !raid.weapons) return;
    if (this.activeSlot === 3) { if (edge) this.throwGrenade(); return; }
    if (this.activeSlot === 4) { if (edge) this.quickMed(); return; }
    const inst = this.weaponInst;
    if (!inst) return;
    if (this.using) { this._toast('Anwendung abgebrochen', 'info', 1000); this.using = null; }
    const def = Items.def(inst);
    if (def && def.weapon && def.weapon.class === 'melee') {
      raid.weapons.melee(inst, this, this.angle);
      return;
    }
    const r = raid.weapons.tryFire(inst, this, this.angle, true, !edge);
    if (r.reason === 'empty' && edge) {
      // auto-reload when trying to fire an empty gun
      const rr = raid.weapons.startReload(inst, this.inventory);
      if (!rr.ok && rr.reason === 'no_ammo') this._toast('Keine passende Munition', 'warning', 1500);
    }
  }

  reload() {
    const inst = this.weaponInst;
    if (!inst || !this.raid || !this.raid.weapons) return;
    if (this.using) this.using = null;
    const r = this.raid.weapons.startReload(inst, this.inventory);
    if (!r.ok && r.reason === 'no_ammo') this._toast('Keine passende Munition', 'warning', 1500);
  }

  throwGrenade() {
    const g = this.equipment.grenade;
    if (!g || g.count < 1 || this.grenadeCooldown > 0 || !this.raid || !this.raid.weapons) {
      if (!g) this._toast('Keine Granate ausgerüstet', 'info', 1200);
      return false;
    }
    this.grenadeCooldown = 0.8;
    const ok = this.raid.weapons.throwGrenade(g, this, this.angle, 1);
    if (ok && g.count <= 0) {
      this.equipment.grenade = null;
      if (this.activeSlot === 3) this.switchSlot(Math.max(0, this.equipment.weaponSlots().findIndex(Boolean)), true);
    }
    return ok;
  }

  quickMed() {
    const m = this.bestMedical();
    if (!m) { this._toast('Keine passende Medizin', 'info', 1200); return; }
    this.useItem(m);
  }

  switchSlot(idx, silent = false) {
    idx = Math.floor(idx);
    if (idx < 0 || idx > 4) return;
    let ok = false;
    if (idx <= 2) ok = !!this.equipment.weaponSlots()[idx];
    else if (idx === 3) ok = !!this.equipment.grenade;
    else ok = !!this.bestMedical();
    if (!ok) {
      if (!silent) { this._audio('ui_error', {}); this._toast('Leer', 'info', 900); }
      return;
    }
    if (idx === this.activeSlot) return;
    const cur = this.weaponInst;
    if (cur && this.raid && this.raid.weapons) this.raid.weapons.cancelReload(cur);
    this.activeSlot = idx;
    this.using = null;
    if (!silent) this._audio('ui_click', { volume: 0.4 });
  }

  bestMedical() {
    const items = [...this.inventory.all(), ...this.secure.all()].filter(i => { const d = Items.def(i); return d && d.medical; });
    if (!items.length) return null;
    if (this.bleeding) {
      const stop = items.filter(i => Items.def(i).medical.stopBleed).sort((a, b) => (Items.def(a).medical.useTime || 2) - (Items.def(b).medical.useTime || 2));
      if (stop.length) return stop[0];
    }
    if (this.toxic > 0) {
      const anti = items.find(i => Items.def(i).medical.cureToxic);
      if (anti) return anti;
    }
    const missing = this.effectiveHpMax() - this.hp;
    if (missing <= 1) return null;
    const heal = items.filter(i => { const m = Items.def(i).medical; return (m.heal || 0) + (m.overTime || 0) > 0; });
    if (!heal.length) return null;
    // smallest kit that covers the missing hp, else the biggest
    heal.sort((a, b) => { const ma = Items.def(a).medical, mb = Items.def(b).medical; return ((ma.heal || 0) + (ma.overTime || 0)) - ((mb.heal || 0) + (mb.overTime || 0)); });
    const enough = heal.find(i => { const m = Items.def(i).medical; return (m.heal || 0) + (m.overTime || 0) >= missing; });
    return enough || heal[heal.length - 1];
  }

  useItem(inst) {
    const d = Items.def(inst);
    if (!d || this.dead) return false;
    const spec = d.medical || d.food || d.water;
    if (!spec) return false;
    const t = spec.useTime || (d.medical ? 2 : 1.5);
    this.using = { inst, timer: t, total: t, name: d.name };
    this._audio(d.medical ? 'heal' : 'eat', { volume: 0.5 });
    return true;
  }

  _finishUse() {
    const u = this.using;
    this.using = null;
    if (!u) return;
    const d = Items.def(u.inst);
    if (!d) return;
    // consume one from wherever the item lives
    let src = null;
    if (this.inventory.indexOf(u.inst.uid) >= 0) src = this.inventory;
    else if (this.secure.indexOf(u.inst.uid) >= 0) src = this.secure;
    if (!src) return;
    src.remove(u.inst.uid, 1);
    if (d.medical) {
      const m = d.medical;
      if (m.heal) this.heal(m.heal);
      if (m.overTime) this.applyEffect({ id: 'regen', timer: m.duration || 20, hps: m.overTime / (m.duration || 20), label: 'Schmerzmittel' });
      if (m.stopBleed) this.cureBleeding();
      if (m.cureToxic) this.cureToxic();
      if (m.stamina) { this.stamina = this.staminaMax; this.applyEffect({ id: 'adrenaline', timer: 20, speedMul: 1.2, label: 'Adrenalin' }); }
      if (d.id === 'med_splint') this.effects = this.effects.filter(e => e.id !== 'fracture');
      this._audio('heal', { volume: 0.6 });
    }
    if (d.food) { this.hunger = clamp(this.hunger + (d.food.hunger || 0), 0, 100); this._audio('eat', { volume: 0.6 }); }
    if (d.water) { this.thirst = clamp(this.thirst + (d.water.thirst || 0), 0, 100); this._audio('eat', { volume: 0.6 }); }
    this._toast(d.name + ' benutzt', 'success', 1200);
    if (this.activeSlot === 4 && !this.bestMedical()) this.switchSlot(Math.max(0, this.equipment.weaponSlots().findIndex(Boolean)), true);
  }

  heal(amount, silent = false) {
    if (this.dead || !(amount > 0)) return;
    const before = this.hp;
    this.hp = Math.min(this.effectiveHpMax(), this.hp + amount);
    if (!silent && this.raid && this.raid.fx && this.hp > before) this.raid.fx.floatingText(this.x, this.y - 20, '+' + Math.round(this.hp - before), '#6cff8a', true);
  }
  applyEffect(effect) {
    if (!effect || !effect.id) return;
    const ex = this.effects.find(e => e.id === effect.id);
    if (ex) Object.assign(ex, effect); else this.effects.push(Object.assign({}, effect));
  }
  cureBleeding() { this.bleeding = false; this.bleedTimer = 0; }
  cureToxic() { this.toxic = 0; }

  takeDamage(amount, opts = {}) {
    if (this.dead || this.god || !(amount > 0)) return 0;
    const raid = this.raid;
    const raw = amount;
    const prot = this.equipment.protection();
    const p = clamp(prot.body * 0.75 + prot.head * 0.25, 0, 0.85);
    let dealt = raw * (1 - p);
    if (this.equipment.armorBody && this.equipment.armorBody.durability !== undefined) this.equipment.armorBody.durability = Math.max(0, this.equipment.armorBody.durability - raw * 0.5);
    if (this.equipment.armorHead && this.equipment.armorHead.durability !== undefined) this.equipment.armorHead.durability = Math.max(0, this.equipment.armorHead.durability - raw * 0.2);
    this.hp -= dealt;
    this.hurtTimer = 0.25;
    this.stats.damageTaken += dealt;
    if (opts.bleedChance && raid && raid.rng && raid.rng.chance(opts.bleedChance * (1 - p * 0.6))) {
      if (!this.bleeding) this._toast('Du blutest! (Q oder Verband)', 'danger', 2000);
      this.bleeding = true; this.bleedTimer = 0;
    }
    if (opts.toxic) this.toxic = Math.max(this.toxic, opts.toxic);
    if (this.using && dealt > 8) { this.using = null; }
    if (raid) {
      if (raid.fx) {
        raid.fx.damageFlash(clamp(dealt / 30, 0.25, 1));
        if (opts.from) raid.fx.hitDirection(angleTo(this.x, this.y, opts.from.x, opts.from.y));
        raid.fx.blood(this.x, this.y, opts.from ? angleTo(opts.from.x, opts.from.y, this.x, this.y) : 0, 0.6);
      }
      if (raid.game && raid.game.camera) raid.game.camera.addShake(clamp(dealt / 4, 2, 10));
      this._audio('player_hurt', { volume: 0.8 });
      if (raid.events) raid.events.emit('playerHit', { amount: dealt });
    }
    if (this.hp <= 0) {
      this.hp = 0;
      const src = opts.source || 'Unbekannt';
      this.causeOfDeath = ['Vergiftung', 'Feuer', 'Verblutet', 'Explosion', 'Verhungert', 'Verdurstet'].includes(src) ? src : 'Getötet von: ' + src;
      this.die();
    }
    return dealt;
  }

  die() {
    if (this.dead) return;
    this.dead = true;
    this.hp = 0;
    if (!this.causeOfDeath) this.causeOfDeath = 'Unbekannt';
    if (this.raid && this.raid.onPlayerDeath) this.raid.onPlayerDeath();
  }

  serializeState() {
    return { equipment: this.equipment.serialize(), inventory: this.inventory.serialize(), secure: this.secure.serialize(), hp: this.hp };
  }
}


// ===== 14_zombies.js =====
// 14_zombies.js — ZombieAI: spawning, perception (sight/hearing), state machine, flow-field chase, budgeted A*,
// separation, door bashing, attacks with windup/cooldown, special types, boss phases, spawn director (SPEC §15).
// Decisions: separation applies its push through Physics.moveCircle (never pushes a zombie into a wall);
//   far zombies (> 1500 px) get a cheap 0.5 s update that only follows flow field / straight lines;
//   noise does not wake lurking stalkers except screams and explosions.
// Dependencies: 00_util.js, 02_data_zombies.js, 08_world.js, 09_collision.js; raid subsystems at runtime.

const ZAI_ACTIVE_RADIUS = 1500;
const ZAI_BLEED = { walker: 0.15, runner: 0.2, brute: 0.5, screamer: 0.1, toxic: 0.15, armored: 0.25, stalker: 0.35, boss: 0.5 };

class ZombieAI {
  constructor(raid) {
    this.raid = raid;
    const base = raid && raid.rng && raid.rng.fork ? raid.rng : new RNG(99);
    this.rng = base.fork('ai');
    this.directorRng = base.fork('director');
    this.zombies = [];
    this.directorEnabled = true;
    this.pathBudget = 1;
    this.boss = null;
    this.directorTimer = 8;
    this._near = [];
    this.seq = 0;
    this.screamWarned = false;
  }

  get maxAlive() {
    const m = this.raid && this.raid.map && this.raid.map.zombies;
    return (m && Number.isFinite(m.maxAlive)) ? m.maxAlive : 90;
  }
  get player() { return this.raid && this.raid.player; }
  get world() { return this.raid && this.raid.world; }
  _audio(name, opts) { const a = this.raid && this.raid.game && this.raid.game.audio; if (a) a.play(name, opts); }

  alive() { return this.zombies.filter(z => !z.dead); }
  aliveCount() { let n = 0; for (const z of this.zombies) if (!z.dead) n++; return n; }
  nearest(x, y, r) {
    let best = null, bd = r * r;
    for (const z of this.zombies) { if (z.dead) continue; const d = dist2(x, y, z.x, z.y); if (d <= bd) { bd = d; best = z; } }
    return best;
  }
  inRadius(x, y, r) {
    const out = [];
    for (const z of this.zombies) { if (z.dead) continue; const rr = r + z.radius; if (dist2(x, y, z.x, z.y) <= rr * rr) out.push(z); }
    return out;
  }

  spawn(typeId, x, y, groupId = null) {
    const type = typeof ZOMBIE_TYPES !== 'undefined' ? ZOMBIE_TYPES[typeId] : null;
    if (!type || !Number.isFinite(x) || !Number.isFinite(y)) return null;
    if (typeId !== 'boss' && this.aliveCount() >= this.maxAlive) return null;
    const rng = this.rng;
    const hpMul = (this.raid && this.raid.map && this.raid.map.difficulty >= 3 && typeId !== 'boss') ? 1.1 : 1;
    const z = {
      uid: 'z' + (++this.seq), type, id: typeId, x, y, angle: rng.float(-Math.PI, Math.PI), radius: type.radius || 13,
      hp: Math.round((type.hp || 60) * hpMul), hpMax: Math.round((type.hp || 60) * hpMul), speed: (type.speed || 55) * rng.float(0.9, 1.1), damage: type.damage || 10,
      state: type.lurk ? 'lurk' : 'idle', target: null, lastSeen: null, alert: 0, attackTimer: 0, windupTimer: 0, cooldown: 0,
      path: null, pathIdx: 0, pathTimer: rng.float(0, 2), wanderTimer: rng.float(1, 5), groupId, stagger: 0, dead: false, deathTimer: 0,
      flash: 0, phase: 0, abilityTimer: 0, abilityTimers: { slam: 4, charge: 7, summon: 12 }, ability: null, lurking: !!type.lurk,
      visibleAlpha: type.lurk ? (type.alpha || 0.35) : 1, doorTimer: 0, legPhase: rng.float(0, 6), hitThisAttack: false,
      senseTimer: rng.float(0, 0.15), attackAnim: 0, lastX: x, lastY: y, stuckTimer: 0, farTimer: rng.float(0, 0.5),
      screamTimer: type.screamCooldown ? rng.float(1.5, 4) : 0, investigateTime: 0, lookTimer: 0, lostTimer: 0, stunTimer: 0,
      growlTimer: rng.float(2, 9), pathMode: 0, moveX: 0, moveY: 0,
    };
    if (typeId === 'boss') this.boss = z;
    this.zombies.push(z);
    return z;
  }

  spawnInitial(world) {
    const w = world || this.world;
    if (!w) return;
    w.zombieSpawns.forEach((s, i) => {
      const gid = 'g' + i;
      for (let k = 0; k < (s.types || []).length; k++) {
        const t = s.types[k];
        let px = s.x, py = s.y;
        for (let tries = 0; tries < 8; tries++) {
          const ox = s.x + this.rng.float(-40, 40), oy = s.y + this.rng.float(-40, 40);
          if (w.isWalkable(Math.floor(ox / TILE), Math.floor(oy / TILE))) { px = ox; py = oy; break; }
        }
        this.spawn(t, px, py, gid);
      }
    });
  }

  spawnNearPlayer(typeId, minDist = 500, maxDist = 900, count = 1, groupId = Uid.next()) {
    const p = this.player, w = this.world;
    const out = [];
    if (!p || !w) return out;
    const nav = this.raid.nav;
    for (let n = 0; n < count; n++) {
      if (this.aliveCount() >= this.maxAlive) break;
      let spot = null, lastWalk = null;
      for (let k = 0; k < 12 && !spot; k++) {
        const a = this.rng.float(0, Math.PI * 2), d = this.rng.float(minDist, maxDist);
        let x = p.x + Math.cos(a) * d, y = p.y + Math.sin(a) * d;
        if (!w.isWalkable(Math.floor(x / TILE), Math.floor(y / TILE))) {
          const r = nav ? nav.randomWalkable(this.rng, x, y, 2) : null;
          if (!r) continue;
          x = r.x; y = r.y;
        }
        if (x < 3 * TILE || y < 3 * TILE || x > w.pixelW - 3 * TILE || y > w.pixelH - 3 * TILE) continue;
        lastWalk = { x, y };
        if (!Physics.lineOfSight(w, p.x, p.y, x, y)) spot = { x, y };
      }
      if (!spot) spot = lastWalk;
      if (!spot) continue;
      const z = this.spawn(typeId, spot.x, spot.y, groupId);
      if (z) {
        z.state = 'investigate'; z.target = { x: p.x, y: p.y }; z.alert = 0.7; z.investigateTime = 0;
        out.push(z);
      }
    }
    return out;
  }

  onNoise(x, y, radius, kind, strength = 1) {
    const w = this.world, p = this.player;
    if (!w || !(radius > 0)) return;
    const srcIndoor = w.isIndoor(x, y);
    const srcB = w.buildingAt(x, y);
    for (const z of this.zombies) {
      if (z.dead || z.state === 'stunned') continue;
      let r = radius * (z.type.hearingMult || 1) * strength;
      if (srcIndoor && w.buildingAt(z.x, z.y) !== srcB) r *= 0.6;
      const d2v = dist2(x, y, z.x, z.y);
      if (d2v > r * r) continue;
      if (z.lurking && kind !== 'scream' && kind !== 'explosion') continue;
      if (z.lurking) z.lurking = false;
      const nearPlayer = p && dist(x, y, p.x, p.y) < 80;
      const tgt = nearPlayer ? { x: p.x, y: p.y } : { x, y };
      if (z.state === 'chase' || z.state === 'attack' || z.state === 'ability') {
        if (!z.seesPlayer) z.lastSeen = { x: tgt.x, y: tgt.y, t: this.raid.time || 0 };
        continue;
      }
      if (kind === 'scream' || z.alert > 0.5) {
        z.state = 'chase'; z.alert = 1; z.lastSeen = { x: tgt.x, y: tgt.y, t: this.raid.time || 0 }; z.lostTimer = 0;
      } else {
        const d = Math.sqrt(d2v);
        const spread = Math.min(120, d * 0.15);
        z.state = 'investigate';
        z.target = { x: tgt.x + this.rng.float(-spread, spread), y: tgt.y + this.rng.float(-spread, spread) };
        z.investigateTime = 0; z.lookTimer = 0; z.path = null; z.pathTimer = 0;
        z.alert = Math.max(z.alert, 0.6);
      }
    }
  }

  alertGroup(z) {
    if (!z || !z.groupId) return;
    for (const o of this.zombies) {
      if (o === z || o.dead || o.groupId !== z.groupId) continue;
      if (o.state !== 'idle' && o.state !== 'wander') continue;
      if (dist2(o.x, o.y, z.x, z.y) > 320 * 320) continue;
      o.state = 'investigate';
      o.target = z.lastSeen ? { x: z.lastSeen.x, y: z.lastSeen.y } : { x: z.x, y: z.y };
      o.alert = Math.max(o.alert, 0.6);
      o.investigateTime = 0; o.path = null; o.pathTimer = 0;
    }
  }

  damage(z, amount, opts = {}) {
    if (!z || z.dead || !(amount > 0)) return { killed: false, dealt: 0 };
    let red = 0;
    if (z.type.armor && z.type.armorArc && Number.isFinite(opts.dirX) && Number.isFinite(opts.dirY)) {
      const from = Math.atan2(-opts.dirY, -opts.dirX);
      if (Math.abs(angleDiff(z.angle, from)) < z.type.armorArc / 2) {
        const pen = opts.pen || 1;
        red = pen >= 3 ? 0 : pen === 2 ? z.type.armor * 0.5 : z.type.armor;
        if (red > 0 && this.raid && this.raid.fx && opts.source === 'bullet') this.raid.fx.impact(z.x - opts.dirX * z.radius, z.y - opts.dirY * z.radius, Math.atan2(opts.dirY, opts.dirX), T.FENCE);
      }
    } else if (z.type.armor && !z.type.armorArc) red = z.type.armor * ((opts.pen || 1) >= 3 ? 0 : (opts.pen || 1) === 2 ? 0.5 : 1);
    const dealt = Math.min(z.hp, amount * (1 - red));
    z.hp -= dealt;
    z.flash = 0.12;
    if (dealt >= z.hpMax * 0.25 && z.id !== 'brute' && z.id !== 'boss') {
      z.stagger = 0.35; z.windupTimer = 0; z.attackAnim = 0;
    }
    const p = this.player;
    if (z.lurking) z.lurking = false;
    if (p && z.state !== 'chase' && z.state !== 'attack' && z.state !== 'ability') {
      z.state = 'chase'; z.alert = 1; z.lastSeen = { x: p.x, y: p.y, t: this.raid.time || 0 }; z.lostTimer = 0;
      this.alertGroup(z);
    }
    if (z.hp <= 0) { this.kill(z, opts); return { killed: true, dealt }; }
    return { killed: false, dealt };
  }

  kill(z, opts = {}) {
    if (!z || z.dead) return;
    z.dead = true; z.hp = 0; z.state = 'dead'; z.deathTimer = 0; z.attackAnim = 0; z.windupTimer = 0;
    if (opts.silent) return;
    const raid = this.raid;
    if (raid.loot) {
      for (const inst of raid.loot.rollZombieDrop(z)) raid.dropItem(inst, z.x, z.y);
    }
    const p = this.player;
    if (p && p.stats) {
      p.stats.kills++;
      p.stats.killsByType[z.id] = (p.stats.killsByType[z.id] || 0) + 1;
    }
    raid.addXp(z.type.xp || 10);
    if (raid.fx) { raid.fx.blood(z.x, z.y, z.angle + Math.PI, 2); raid.fx.floatingText(z.x, z.y - 24, '+' + (z.type.xp || 10) + ' EP', '#9fe870', true); }
    this._audio(z.id === 'boss' ? 'boss_roar' : 'zombie_die', { x: z.x, y: z.y });
    if (z.id === 'toxic') {
      raid.addHazard({ kind: 'toxic', x: z.x, y: z.y, r: (z.type.toxicRadius || 70) * 1.3, duration: z.type.toxicDuration || 8 });
      if (raid.fx) raid.fx.toxicCloud(z.x, z.y, (z.type.toxicRadius || 70) * 1.3);
      this._audio('toxic', { x: z.x, y: z.y });
    }
    if (raid.events) raid.events.emit('kill', { zombie: z });
    if (z.id === 'boss') {
      raid.flags.bossKilled = true;
      if (raid.events) raid.events.emit('bossDead', { zombie: z });
      if (raid.game && raid.game.ui) raid.game.ui.toast('Der Wirt ist tot!', 'success', 4000);
      if (raid.game && raid.game.camera) raid.game.camera.addShake(14);
    }
  }

  // ---------------- per-frame ----------------
  update(dt) {
    const raid = this.raid, p = this.player, w = this.world;
    if (!raid || !w) return;
    this.pathBudget = 1;
    for (let i = this.zombies.length - 1; i >= 0; i--) {
      const z = this.zombies[i];
      if (z.dead) {
        z.deathTimer += dt;
        if (z.deathTimer >= (z.id === 'boss' ? 60 : 25)) {
          this.zombies.splice(i, 1);
          if (this.boss === z) this.boss = null;
        }
      }
    }
    for (const z of this.zombies) {
      if (z.dead) continue;
      z.flash = Math.max(0, z.flash - dt);
      const d = p ? dist(z.x, z.y, p.x, p.y) : Infinity;
      if (d > ZAI_ACTIVE_RADIUS) { this._farUpdate(z, dt); continue; }
      this._update(z, dt, d);
    }
    if (this.boss && !this.boss.dead && raid.events) {
      const b = this.boss;
      raid.events.emit('boss', { hp: b.hp, hpMax: b.hpMax, phase: b.phase, name: b.type.name || 'Boss', near: p ? dist(b.x, b.y, p.x, p.y) < 900 : false });
    }
    this._director(dt);
  }

  _director(dt) {
    if (!this.directorEnabled || !this.player || this.player.dead) return;
    this.directorTimer -= dt;
    if (this.directorTimer > 0) return;
    this.directorTimer = 8;
    const p = this.player;
    let near = 0;
    for (const z of this.zombies) if (!z.dead && dist2(z.x, z.y, p.x, p.y) < 1200 * 1200) near++;
    if (near >= 4 || this.aliveCount() >= this.maxAlive) return;
    const weights = Object.entries((this.raid.map && this.raid.map.zombies && this.raid.map.zombies.weights) || { walker: 1 })
      .filter(([t]) => t !== 'boss' && ZOMBIE_TYPES[t]).map(([id, w]) => ({ id, w }));
    const pick = this.directorRng.weighted(weights) || { id: 'walker' };
    const z = this.spawnNearPlayer(pick.id, 700, 1100, this.directorRng.int(2, 4));
    for (const q of z) { q.state = 'wander'; q.alert = 0; }
  }

  _farUpdate(z, dt) {
    z.farTimer += dt;
    if (z.farTimer < 0.5) return;
    const fdt = z.farTimer;
    z.farTimer = 0;
    z.attackAnim = 0; z.windupTimer = 0;
    let tx = null, ty = null, spd = z.speed * 0.5;
    if ((z.state === 'chase' || z.state === 'investigate') && (z.lastSeen || z.target)) {
      const t = z.state === 'chase' ? z.lastSeen : z.target;
      tx = t.x; ty = t.y; spd = z.speed * 0.8;
      if (dist(z.x, z.y, tx, ty) < 24) { z.state = 'wander'; z.alert = 0; }
    } else {
      z.wanderTimer -= fdt;
      if (z.wanderTimer <= 0) {
        z.wanderTimer = this.rng.float(3, 8);
        const r = this.raid.nav ? this.raid.nav.randomWalkable(this.rng, z.x, z.y, 5) : null;
        z.target = r; z.state = r ? 'wander' : 'idle';
      }
      if (z.target) { tx = z.target.x; ty = z.target.y; }
    }
    if (tx === null) return;
    const dx = tx - z.x, dy = ty - z.y, l = Math.hypot(dx, dy);
    if (l < 2) return;
    const step = Math.min(l, spd * fdt);
    const m = Physics.moveCircle(this.world, z.x, z.y, z.radius, dx / l * step, dy / l * step);
    z.x = m.x; z.y = m.y;
    z.angle = Math.atan2(dy, dx);
  }

  _sense(z, d) {
    const p = this.player, raid = this.raid;
    if (!p || p.dead) { z.seesPlayer = false; return; }
    let lf = 1 - 0.45 * (raid.darknessAt ? raid.darknessAt(z.x, z.y) : 0);
    if (p.flashlightOn) lf = Math.max(lf, 0.9);
    const range = (z.type.sightRange || 380) * lf * (p.crouching ? 0.65 : 1);
    const close = d < 56;
    const sees = (d <= range || close) && Physics.lineOfSight(this.world, z.x, z.y, p.x, p.y);
    z.seesPlayer = sees;
    if (!sees) return;
    z.lastSeen = { x: p.x, y: p.y, t: raid.time || 0 };
    z.lostTimer = 0;
    if (z.lurking) {
      if (d > (z.type.ambushRange || 220)) return;
      z.lurking = false;
    }
    if (z.state !== 'chase' && z.state !== 'attack' && z.state !== 'ability') {
      z.state = 'chase'; z.alert = 1; z.path = null;
      this.alertGroup(z);
      this._audio(z.id === 'boss' ? 'boss_roar' : 'zombie_alert', { x: z.x, y: z.y, volume: 0.8 });
    }
  }

  _update(z, dt, d) {
    const raid = this.raid, p = this.player, w = this.world;
    const type = z.type;
    // timers
    z.legPhase += 0; // advanced by movement
    if (z.growlTimer > 0) z.growlTimer -= dt;
    else {
      z.growlTimer = this.rng.float(4, 10);
      if (d < 700) this._audio('zombie_growl', { x: z.x, y: z.y, volume: z.id === 'brute' || z.id === 'boss' ? 1 : 0.7, pitch: z.id === 'runner' ? 1.25 : z.id === 'brute' ? 0.7 : 1 });
    }
    if (z.state === 'stunned') {
      z.stunTimer -= dt;
      z.attackAnim = 0;
      if (z.stunTimer <= 0) { z.state = z.lastSeen ? 'chase' : 'idle'; }
      return;
    }
    // perception (staggered 0.15 s)
    z.senseTimer -= dt;
    if (z.senseTimer <= 0) { z.senseTimer += 0.15; this._sense(z, d); }
    // stalker visibility
    if (type.lurk) {
      const inCone = p && p.flashlightOn && d < 380 && Math.abs(angleDiff(p.angle, angleTo(p.x, p.y, z.x, z.y))) < 0.55;
      const target = inCone || d < 90 ? 1 : (z.state === 'lurk' || z.lurking ? (type.alpha || 0.35) : 0.55);
      z.visibleAlpha += (target - z.visibleAlpha) * Math.min(1, dt * 6);
      if (z.lurking && p && d <= (type.ambushRange || 220) && Physics.lineOfSight(w, z.x, z.y, p.x, p.y)) {
        z.lurking = false; z.state = 'chase'; z.alert = 1; z.lastSeen = { x: p.x, y: p.y, t: raid.time || 0 };
        this._audio('zombie_alert', { x: z.x, y: z.y, pitch: 1.3 });
      }
    }
    if (z.stagger > 0) { z.stagger -= dt; z.attackAnim = Math.max(0, z.attackAnim - dt * 4); this._separate(z); return; }
    // boss phases
    if (z.id === 'boss') this._bossPhase(z);
    // screamer
    if (type.screamCooldown && (z.state === 'chase' || z.state === 'attack')) {
      z.screamTimer -= dt;
      if (z.screamTimer <= 0 && d < 1000) {
        z.screamTimer = type.screamCooldown;
        this._audio('screamer', { x: z.x, y: z.y });
        raid.emitNoise(z.x, z.y, type.screamRadius || 1000, 'scream');
        const s = type.summon || [2, 4];
        this.spawnNearPlayer('walker', 500, 900, this.rng.int(s[0], s[1]));
        z.attackAnim = 1;
        if (raid.game && raid.game.ui && !this.screamWarned) { this.screamWarned = true; raid.game.ui.toast('Ein Schreier ruft Verstärkung!', 'warning'); }
      }
    }
    let mvx = 0, mvy = 0, spd = 0;
    const reach = z.radius + (p ? p.radius : 12) + (type.attackRange || 10);
    switch (z.state) {
      case 'lurk':
        break;
      case 'idle':
        z.wanderTimer -= dt;
        z.attackAnim = Math.max(0, z.attackAnim - dt * 2);
        if (z.wanderTimer <= 0) { z.wanderTimer = this.rng.float(2, 6); if (!this.rng.chance(0.4)) { z.state = 'wander'; z.target = null; z.path = null; } }
        break;
      case 'wander': {
        z.wanderTimer -= dt;
        if (!z.target || z.wanderTimer <= 0) {
          z.wanderTimer = this.rng.float(2, 6);
          if (this.rng.chance(0.4)) { z.state = 'idle'; break; }
          let near = null;
          if (z.alert === 0 && z.groupId) {
            for (const o of this.zombies) if (o !== z && !o.dead && o.groupId === z.groupId && dist2(o.x, o.y, z.x, z.y) < 200 * 200) { near = o; break; }
          }
          z.target = near ? { x: near.x + this.rng.float(-96, 96), y: near.y + this.rng.float(-96, 96) } : (raid.nav ? raid.nav.randomWalkable(this.rng, z.x, z.y, 6) : null);
          z.path = null; z.pathTimer = 0;
          if (!z.target) { z.state = 'idle'; break; }
        }
        const v = this._steerTo(z, z.target, dt);
        if (v) { mvx = v.x; mvy = v.y; spd = z.speed * 0.5; } else { z.target = null; }
        break;
      }
      case 'investigate': {
        z.investigateTime += dt;
        if (!z.target || z.investigateTime > 10) { z.state = 'wander'; z.alert = Math.max(0, z.alert - 0.3); z.target = null; break; }
        if (dist(z.x, z.y, z.target.x, z.target.y) < 24) {
          z.lookTimer += dt;
          z.angle += Math.sin(z.lookTimer * 2.2) * dt * 1.6;
          if (z.lookTimer > 3) { z.state = 'wander'; z.alert = 0.3; z.target = null; }
          break;
        }
        const v = this._steerTo(z, z.target, dt);
        if (v) { mvx = v.x; mvy = v.y; spd = z.speed * 0.8; }
        break;
      }
      case 'chase': {
        if (!p || p.dead) { z.state = 'wander'; break; }
        if (!z.seesPlayer) {
          z.lostTimer += dt;
          if (z.lostTimer > 6) {
            z.state = 'investigate'; z.target = z.lastSeen ? { x: z.lastSeen.x, y: z.lastSeen.y } : null;
            z.investigateTime = 0; z.lookTimer = 0; z.path = null; break;
          }
        }
        if (d <= reach && z.seesPlayer !== false) { z.state = 'attack'; z.cooldown = Math.min(z.cooldown, 0.05); break; }
        if (z.id === 'boss' && this._bossAbilities(z, d, dt)) break;
        const v = this._chaseDir(z, d, dt);
        if (v) { mvx = v.x; mvy = v.y; spd = z.speed * (z.id === 'boss' ? this._bossSpeedMul(z) : 1); }
        // stuck detection
        z.stuckTimer += dt;
        if (z.stuckTimer >= 1.5) {
          if (dist(z.x, z.y, z.lastX, z.lastY) < 4 && this.pathBudget > 0 && raid.nav) {
            this.pathBudget--;
            const goal = z.seesPlayer ? p : (z.lastSeen || p);
            z.path = raid.nav.findPath(z.x, z.y, goal.x, goal.y);
            z.pathIdx = 0; z.pathMode = 2;
          }
          z.stuckTimer = 0; z.lastX = z.x; z.lastY = z.y;
        }
        break;
      }
      case 'attack': {
        if (!p || p.dead) { z.state = 'wander'; break; }
        z.angle = lerpAngle(z.angle, angleTo(z.x, z.y, p.x, p.y), Math.min(1, dt * 10));
        if (z.windupTimer > 0) {
          z.windupTimer -= dt;
          z.attackAnim = clamp(1 - z.windupTimer / Math.max(0.05, type.windup || 0.45), 0, 1);
          if (z.windupTimer <= 0) {
            z.windupTimer = 0;
            if (d <= reach * 1.3) this._hit(z, d);
            z.attackAnim = 1;
            z.cooldown = type.attackCooldown || 1.2;
          }
          break;
        }
        if (z.cooldown > 0) {
          z.cooldown -= dt;
          z.attackAnim = clamp(z.cooldown / (type.attackCooldown || 1.2), 0, 1) * 0.8;
          // keep pressing toward the player during the recovery
          if (d > reach * 0.8) { const v = this._chaseDir(z, d, dt); if (v) { mvx = v.x; mvy = v.y; spd = z.speed * 0.6; } }
          if (d > reach * 1.6 && z.cooldown <= 0) z.state = 'chase';
          break;
        }
        if (d <= reach) { z.windupTimer = type.windup || 0.45; z.hitThisAttack = false; }
        else { z.state = 'chase'; }
        break;
      }
      case 'ability':
        this._bossAbilityUpdate(z, d, dt);
        break;
      default:
        z.state = 'idle';
    }
    if (spd > 0 && (mvx !== 0 || mvy !== 0)) this._move(z, mvx, mvy, spd, dt);
    else z.doorTimer = 0;
    this._separate(z);
    // never overlap the player
    if (p && !p.dead) {
      const min = z.radius + p.radius;
      const dd = dist(z.x, z.y, p.x, p.y);
      if (dd < min && dd > 0.01) {
        const m = Physics.moveCircle(w, z.x, z.y, z.radius, (z.x - p.x) / dd * (min - dd), (z.y - p.y) / dd * (min - dd));
        z.x = m.x; z.y = m.y;
      }
    }
  }

  _steerTo(z, target, dt) {
    const raid = this.raid;
    if (!target) return null;
    const dx = target.x - z.x, dy = target.y - z.y;
    const l = Math.hypot(dx, dy);
    if (l < 8) return null;
    // follow a path if we have one
    z.pathTimer -= dt;
    if (z.path && z.pathIdx < z.path.length) {
      const wp = z.path[z.pathIdx];
      const wx = wp.x - z.x, wy = wp.y - z.y, wl = Math.hypot(wx, wy);
      if (wl < 10) { z.pathIdx++; return this._steerTo(z, target, 0); }
      return { x: wx / wl, y: wy / wl };
    }
    const los = Physics.lineOfSight(this.world, z.x, z.y, target.x, target.y);
    if (!los && z.pathTimer <= 0 && this.pathBudget > 0 && raid.nav) {
      this.pathBudget--;
      z.pathTimer = 2;
      z.path = raid.nav.findPath(z.x, z.y, target.x, target.y);
      z.pathIdx = 0;
      if (!z.path) return { x: dx / l, y: dy / l };
      return this._steerTo(z, target, 0);
    }
    return { x: dx / l, y: dy / l };
  }

  _chaseDir(z, d, dt) {
    const p = this.player, raid = this.raid;
    if (z.pathMode > 0 && z.path && z.pathIdx < z.path.length) {
      z.pathMode -= dt;
      const wp = z.path[z.pathIdx];
      const wx = wp.x - z.x, wy = wp.y - z.y, wl = Math.hypot(wx, wy);
      if (wl < 10) z.pathIdx++;
      if (wl > 0.01) return { x: wx / wl, y: wy / wl };
    }
    if (z.seesPlayer && d <= 48) {
      return { x: (p.x - z.x) / Math.max(1, d), y: (p.y - z.y) / Math.max(1, d) };
    }
    const fd = raid.nav ? raid.nav.dirAt(z.x, z.y) : null;
    if (fd && d > 48) {
      if (z.seesPlayer) {
        // blend with direct steering for smoother pursuit in the open
        const dx = (p.x - z.x) / d, dy = (p.y - z.y) / d;
        const bx = fd.dx * 0.6 + dx * 0.4, by = fd.dy * 0.6 + dy * 0.4, bl = Math.hypot(bx, by) || 1;
        return { x: bx / bl, y: by / bl };
      }
      return { x: fd.dx, y: fd.dy };
    }
    const t = z.seesPlayer ? p : (z.lastSeen || p);
    const dx = t.x - z.x, dy = t.y - z.y, l = Math.hypot(dx, dy);
    if (l < 4) return null;
    return { x: dx / l, y: dy / l };
  }

  _move(z, dx, dy, spd, dt) {
    const w = this.world, raid = this.raid;
    const tileMul = w.speedMul(Math.floor(z.x / TILE), Math.floor(z.y / TILE));
    const step = spd * tileMul * dt;
    // door bashing
    const px = z.x + dx * (z.radius + 6), py = z.y + dy * (z.radius + 6);
    const ptx = Math.floor(px / TILE), pty = Math.floor(py / TILE);
    if (w.tile(ptx, pty) === T.DOOR_CLOSED) {
      z.doorTimer += dt;
      z.attackAnim = 0.5 + 0.5 * Math.sin(z.doorTimer * 12);
      if (z.doorTimer >= (z.id === 'brute' || z.id === 'boss' ? 0.3 : 1.2)) {
        z.doorTimer = 0;
        if (raid.toggleDoor) raid.toggleDoor(ptx, pty, true);
      }
    } else z.doorTimer = 0;
    const ox = z.x, oy = z.y;
    const m = Physics.moveCircle(w, z.x, z.y, z.radius, dx * step, dy * step);
    z.x = m.x; z.y = m.y;
    const moved = Math.hypot(z.x - ox, z.y - oy);
