    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return { ok: false, profile: null, repaired, error: 'Kein gültiger Spielstand' };
    if (typeof obj.version !== 'number' || !Number.isFinite(obj.version)) return { ok: false, profile: null, repaired, error: 'Versionsangabe fehlt' };
    if (obj.version > SAVE_VERSION) return { ok: false, profile: null, repaired, error: 'Spielstand stammt aus einer neueren Version' };
    let src = obj;
    // accept a live profile (instances) as well
    const plainify = (v) => (v && typeof v.serialize === 'function' ? v.serialize() : v);
    src = Object.assign({}, src, { stash: plainify(src.stash), loadout: plainify(src.loadout), secure: plainify(src.secure), equipment: plainify(src.equipment) });
    try { src = JSON.parse(JSON.stringify(src)); } catch (e) { return { ok: false, profile: null, repaired, error: 'Spielstand nicht lesbar' }; }
    if (src.version < SAVE_VERSION) { ProfileManager.migrate(src); repaired.push('Spielstand auf Version ' + SAVE_VERSION + ' aktualisiert'); }
    const num = (v, d, name, min = -Infinity, max = Infinity) => {
      if (typeof v === 'number' && Number.isFinite(v)) return clamp(v, min, max);
      repaired.push(name + ' zurückgesetzt');
      return d;
    };
    const out = { version: SAVE_VERSION };
    out.createdAt = num(src.createdAt, 0, 'Erstellungsdatum');
    out.name = typeof src.name === 'string' && src.name.length < 40 ? src.name : 'Überlebender';
    out.credits = Math.round(num(src.credits, START_CREDITS, 'Credits', 0, 1e9));
    out.xp = Math.round(num(src.xp, 0, 'Erfahrung', 0, 1e9));
    out.level = Progression.levelFromXp(out.xp);
    out.upgrades = {};
    const up = src.upgrades && typeof src.upgrades === 'object' ? src.upgrades : (repaired.push('Ausbaustufen zurückgesetzt'), {});
    for (const a of PM_UPGRADE_AREAS) out.upgrades[a] = Math.round(clamp(Number.isFinite(up[a]) ? up[a] : 0, 0, 3));
    const hpMax = 100 + 10 * out.upgrades.medbay;
    out.hp = num(src.hp, hpMax, 'Lebenspunkte', 1, hpMax);
    out.hunger = num(src.hunger, 100, 'Hunger', 0, 100);
    out.thirst = num(src.thirst, 100, 'Durst', 0, 100);
    const invCheck = (v, slots, name) => {
      if (!v || typeof v !== 'object') { repaired.push(name + ' war beschädigt und wurde geleert'); return new Inventory(slots).serialize(); }
      const before = Array.isArray(v.items) ? v.items.filter(Boolean).length : 0;
      const inv = Inventory.deserialize(v, slots);
      if (inv.slots < slots) inv.setSlots(slots);
      const after = inv.all().length;
      if (after < before) repaired.push(name + ': ' + (before - after) + ' unbekannte Gegenstände entfernt');
      return inv.serialize();
    };
    out.stash = invCheck(src.stash, STASH_SLOTS_BASE + 12 * out.upgrades.stash, 'Lager');
    let eq;
    if (!src.equipment || typeof src.equipment !== 'object') { repaired.push('Ausrüstung zurückgesetzt'); eq = new Equipment(); }
    else eq = Equipment.deserialize(src.equipment);
    out.equipment = eq.serialize();
    out.loadout = invCheck(src.loadout, eq.backpackSlots(), 'Rucksack');
    out.secure = invCheck(src.secure, SECURE_SLOTS_BASE + out.upgrades.defense, 'Sicherer Behälter');
    const maps = Array.isArray(src.unlockedMaps) ? src.unlockedMaps.filter(id => typeof MAPS !== 'undefined' && MAPS[id]) : [];
    out.unlockedMaps = maps.length ? maps : ['city'];
    const ms = src.missions && typeof src.missions === 'object' ? src.missions : (repaired.push('Aufträge zurückgesetzt'), {});
    const okId = id => typeof id === 'string' && typeof MISSION_BY_ID !== 'undefined' && !!MISSION_BY_ID[id];
    out.missions = {
      active: Array.isArray(ms.active) ? ms.active.filter(okId) : [],
      completed: Array.isArray(ms.completed) ? ms.completed.filter(okId) : [],
      progress: {},
    };
    if (ms.progress && typeof ms.progress === 'object') {
      for (const [id, pr] of Object.entries(ms.progress)) {
        if (!okId(id) || !pr || typeof pr !== 'object') continue;
        out.missions.progress[id] = {};
        for (const [k, v] of Object.entries(pr)) if (Number.isFinite(v)) out.missions.progress[id][k] = v;
      }
    }
    const tr = src.trader && typeof src.trader === 'object' ? src.trader : {};
    out.trader = {
      stock: Array.isArray(tr.stock) ? tr.stock.filter(l => l && typeof ITEMS !== 'undefined' && ITEMS[l.id] && Number.isFinite(l.price) && Number.isFinite(l.count)).map(l => ({ id: l.id, price: Math.max(1, Math.round(l.price)), count: Math.max(0, Math.round(l.count)) })) : [],
      restocks: Number.isFinite(tr.restocks) ? tr.restocks : 0,
    };
    const st = src.stats && typeof src.stats === 'object' ? src.stats : (repaired.push('Statistiken zurückgesetzt'), {});
    out.stats = deepClone(PM_STATS_DEFAULT);
    for (const k of Object.keys(PM_STATS_DEFAULT)) {
      if (k === 'killsByType') { if (st.killsByType && typeof st.killsByType === 'object') for (const [t, v] of Object.entries(st.killsByType)) if (Number.isFinite(v)) out.stats.killsByType[t] = v; }
      else if (k === 'achievements') { if (Array.isArray(st.achievements)) out.stats.achievements = st.achievements.filter(a => typeof a === 'string'); }
      else if (Number.isFinite(st[k])) out.stats[k] = st[k];
    }
    const rip = src.raidInProgress;
    out.raidInProgress = rip && typeof rip === 'object' && typeof rip.mapId === 'string' ? { mapId: rip.mapId, missionIds: Array.isArray(rip.missionIds) ? rip.missionIds.filter(okId) : [], seed: Number.isFinite(rip.seed) ? rip.seed : 0, startedAt: Number.isFinite(rip.startedAt) ? rip.startedAt : 0 } : null;
    out.lastSaved = Number.isFinite(src.lastSaved) ? src.lastSaved : null;
    return { ok: true, profile: out, repaired };
  }
}


// ===== 19_progression.js =====
// 19_progression.js — Progression helpers (levels, map unlocks, ranks) and achievements (SPEC §20).
// Dependencies: 00_util.js, 03_data_maps.js (MAPS, MAP_ORDER), 04_data_meta.js (xpForLevel, levelFromXp, MAX_LEVEL).

const MAP_UNLOCKS = { city: 1, industrial: 3, military: 5, research: 8 };

class Progression {
  static levelFromXp(xp) { return typeof levelFromXp === 'function' ? levelFromXp(xp) : 1; }
  static xpForLevel(l) { return typeof xpForLevel === 'function' ? xpForLevel(l) : 0; }
  static progress(xp) {
    const level = Progression.levelFromXp(xp);
    const max = typeof MAX_LEVEL !== 'undefined' ? MAX_LEVEL : 30;
    const base = Progression.xpForLevel(level);
    const nextTotal = level >= max ? base : Progression.xpForLevel(level + 1);
    const cur = Math.max(0, (xp || 0) - base);
    const next = Math.max(1, nextTotal - base);
    return { level, cur, next, pct: level >= max ? 1 : clamp(cur / next, 0, 1) };
  }
  static unlockedMapsFor(level, radioLevel) {
    const order = typeof MAP_ORDER !== 'undefined' ? MAP_ORDER : Object.keys(MAP_UNLOCKS);
    return order.filter(id => {
      const m = typeof MAPS !== 'undefined' ? MAPS[id] : null;
      const unlock = m && Number.isFinite(m.unlockLevel) ? m.unlockLevel : (MAP_UNLOCKS[id] || 1);
      const radio = m && Number.isFinite(m.radioUnlock) ? m.radioUnlock : 0;
      return level >= unlock || (radio > 0 && (radioLevel || 0) >= radio);
    });
  }
  static rankTitle(level) {
    const ranks = [[1, 'Rekrut'], [3, 'Plünderer'], [5, 'Späher'], [8, 'Überlebender'], [11, 'Veteran'], [15, 'Jäger'], [19, 'Kommandant'], [24, 'Legende der Zone']];
    let t = ranks[0][1];
    for (const [l, name] of ranks) if (level >= l) t = name;
    return t;
  }
}

const ACHIEVEMENTS = [
  { id: 'first_extract', name: 'Lebend raus', desc: 'Schließe deine erste Extraktion ab.', check: p => (p.stats.extractions || 0) >= 1 },
  { id: 'extract_10', name: 'Routinier', desc: 'Extrahiere zehnmal erfolgreich.', check: p => (p.stats.extractions || 0) >= 10 },
  { id: 'kills_50', name: 'Säuberung', desc: 'Erledige insgesamt 50 Zombies.', check: p => (p.stats.kills || 0) >= 50 },
  { id: 'kills_500', name: 'Schlächter', desc: 'Erledige insgesamt 500 Zombies.', check: p => (p.stats.kills || 0) >= 500 },
  { id: 'boss', name: 'Wirtswechsel', desc: 'Besiege den Wirt in der Forschungsanlage.', check: p => ((p.stats.killsByType || {}).boss || 0) >= 1 },
  { id: 'rich', name: 'Gut betucht', desc: 'Besitze 20.000 CR auf einmal.', check: p => (p.credits || 0) >= 20000 },
  { id: 'loot_big', name: 'Großer Fang', desc: 'Extrahiere Beute im Wert von 5.000 CR in einem Einsatz.', check: p => (p.stats.bestRaidValue || 0) >= 5000 },
  { id: 'missions_5', name: 'Zuverlässig', desc: 'Schließe fünf Aufträge ab.', check: p => (p.stats.missionsCompleted || 0) >= 5 },
  { id: 'missions_20', name: 'Funkstimme', desc: 'Schließe zwanzig Aufträge ab.', check: p => (p.stats.missionsCompleted || 0) >= 20 },
  { id: 'crafter', name: 'Tüftler', desc: 'Stelle zehn Gegenstände her.', check: p => (p.stats.itemsCrafted || 0) >= 10 },
  { id: 'builder', name: 'Bauherr', desc: 'Kaufe fünf Basisverbesserungen.', check: p => (p.stats.upgradesBought || 0) >= 5 },
  { id: 'all_maps', name: 'Kartograf', desc: 'Schalte alle vier Gebiete frei.', check: p => Array.isArray(p.unlockedMaps) && p.unlockedMaps.length >= 4 },
  { id: 'level_10', name: 'Erfahren', desc: 'Erreiche Stufe 10.', check: p => (p.level || 1) >= 10 },
  { id: 'sharpshooter', name: 'Scharfschütze', desc: 'Erreiche über 500 Schüsse eine Trefferquote von 60 %.', check: p => (p.stats.shotsFired || 0) >= 500 && (p.stats.shotsHit || 0) / Math.max(1, p.stats.shotsFired) >= 0.6 },
  { id: 'scavenger', name: 'Aasgeier', desc: 'Durchsuche 200 Behälter.', check: p => (p.stats.containersOpened || 0) >= 200 },
];

function evaluateAchievements(profile) {
  if (!profile || !profile.stats) return [];
  if (!Array.isArray(profile.stats.achievements)) profile.stats.achievements = [];
  const have = new Set(profile.stats.achievements);
  const fresh = [];
  for (const a of ACHIEVEMENTS) {
    let ok = false;
    try { ok = !!a.check(profile); } catch (e) { ok = false; }
    if (ok && !have.has(a.id)) { profile.stats.achievements.push(a.id); fresh.push(a.id); }
  }
  return fresh;
}


// ===== 20_save.js =====
// 20_save.js — SaveSystem: versioned localStorage saves with backup, validation on load, settings, export/import,
// raid-in-progress marker (SPEC §21). Every localStorage access is wrapped in try/catch; corruption → Log.warn.
// Dependencies: 00_util.js, 18_profile.js (ProfileManager.validate, DEFAULT_SETTINGS).

class SaveSystem {
  constructor(game) { this.game = game || null; }
  static get KEY() { return 'deadzone_save_v1'; }
  static get SETTINGS_KEY() { return 'deadzone_settings_v1'; }
  static get BACKUP_KEY() { return 'deadzone_save_backup'; }

  _ls() {
    try { return typeof localStorage !== 'undefined' ? localStorage : null; } catch (e) { return null; }
  }
  available() {
    try {
      const ls = this._ls();
      if (!ls) return false;
      ls.setItem('deadzone_probe', '1');
      ls.removeItem('deadzone_probe');
      return true;
    } catch (e) { return false; }
  }
  _get(key) { try { const ls = this._ls(); return ls ? ls.getItem(key) : null; } catch (e) { return null; } }
  _set(key, v) { try { const ls = this._ls(); if (!ls) return false; ls.setItem(key, v); return true; } catch (e) { Log.warn('Speichern fehlgeschlagen:', e && e.message); return false; } }
  _del(key) { try { const ls = this._ls(); if (ls) ls.removeItem(key); } catch (e) { /* ignore */ } }

  hasSave() {
    const raw = this._get(SaveSystem.KEY);
    if (!raw) return false;
    try { const o = JSON.parse(raw); return !!o && typeof o === 'object'; } catch (e) { return false; }
  }

  _plain(profile) {
    if (!profile) return null;
    const pl = (v) => (v && typeof v.serialize === 'function' ? v.serialize() : v);
    const out = Object.assign({}, profile, { stash: pl(profile.stash), loadout: pl(profile.loadout), secure: pl(profile.secure), equipment: pl(profile.equipment) });
    return JSON.parse(JSON.stringify(out));
  }

  save(profile) {
    if (!profile) return false;
    let plain;
    try { plain = this._plain(profile); } catch (e) { Log.warn('Spielstand konnte nicht serialisiert werden'); return false; }
    plain.lastSaved = Date.now();
    if (profile && typeof profile === 'object' && !Array.isArray(profile)) { try { profile.lastSaved = plain.lastSaved; } catch (e) { /* ignore */ } }
    const prev = this._get(SaveSystem.KEY);
    if (prev) {
      try {
        const o = JSON.parse(prev);
        if (o && ProfileManager.validate(o.profile).ok) this._set(SaveSystem.BACKUP_KEY, prev);
      } catch (e) { /* previous save corrupt: keep the old backup */ }
    }
    return this._set(SaveSystem.KEY, JSON.stringify({ version: SAVE_VERSION, savedAt: plain.lastSaved, profile: plain }));
  }

  _tryParse(raw) {
    if (!raw) return { ok: false, error: 'Kein Spielstand vorhanden' };
    let o;
    try { o = JSON.parse(raw); } catch (e) { return { ok: false, error: 'Spielstand beschädigt' }; }
    if (!o || typeof o !== 'object') return { ok: false, error: 'Spielstand beschädigt' };
    const p = o.profile && typeof o.profile === 'object' ? o.profile : o;
    const v = ProfileManager.validate(p);
    if (!v.ok) return { ok: false, error: v.error || 'Spielstand ungültig' };
    return { ok: true, profile: v.profile, repaired: v.repaired };
  }

  load() {
    const main = this._tryParse(this._get(SaveSystem.KEY));
    if (main.ok) return { ok: true, profile: main.profile, repaired: main.repaired || [], error: null };
    if (this._get(SaveSystem.KEY)) Log.warn('Spielstand beschädigt, versuche Sicherung:', main.error);
    const bak = this._tryParse(this._get(SaveSystem.BACKUP_KEY));
    if (bak.ok) return { ok: true, profile: bak.profile, repaired: ['Spielstand war beschädigt – Sicherung geladen', ...(bak.repaired || [])], error: null };
    return { ok: false, profile: null, repaired: [], error: main.error || 'Kein Spielstand' };
  }

  reset() { this._del(SaveSystem.KEY); this._del(SaveSystem.BACKUP_KEY); }

  saveSettings(settings) {
    try { return this._set(SaveSystem.SETTINGS_KEY, JSON.stringify(settings || {})); } catch (e) { return false; }
  }
  loadSettings() {
    const out = Object.assign({}, DEFAULT_SETTINGS);
    const raw = this._get(SaveSystem.SETTINGS_KEY);
    if (!raw) return out;
    try {
      const o = JSON.parse(raw);
      if (o && typeof o === 'object') {
        for (const k of Object.keys(DEFAULT_SETTINGS)) if (o[k] !== undefined && typeof o[k] === typeof DEFAULT_SETTINGS[k]) out[k] = o[k];
        for (const k of ['master', 'sfx', 'music']) out[k] = clamp(Number(out[k]) || 0, 0, 1);
        if (!['auto', 'on', 'off'].includes(out.touchControls)) out.touchControls = 'auto';
        if (!['low', 'medium', 'high'].includes(out.quality)) out.quality = 'high';
      }
    } catch (e) { Log.warn('Einstellungen beschädigt – Standardwerte'); }
    return out;
  }

  exportString() {
    const raw = this._get(SaveSystem.KEY);
    if (!raw) return null;
    try { return btoa(unescape(encodeURIComponent(raw))); } catch (e) { return null; }
  }
  importString(str) {
    if (typeof str !== 'string' || !str.trim()) return { ok: false, error: 'Kein Text eingefügt' };
    let raw;
    try { raw = decodeURIComponent(escape(atob(str.trim()))); } catch (e) { return { ok: false, error: 'Text ist kein gültiger Export' }; }
    const t = this._tryParse(raw);
    if (!t.ok) return { ok: false, error: t.error };
    const prev = this._get(SaveSystem.KEY);
    if (prev) this._set(SaveSystem.BACKUP_KEY, prev);
    this._set(SaveSystem.KEY, JSON.stringify({ version: SAVE_VERSION, savedAt: Date.now(), profile: t.profile }));
    return { ok: true, error: null };
  }

  markRaidStart(profile, info) {
    if (!profile) return false;
    profile.raidInProgress = { mapId: info.mapId, missionIds: (info.missionIds || []).slice(), seed: info.seed, startedAt: info.startedAt || Date.now() };
    return this.save(profile);
  }
  clearRaid(profile) { if (profile) profile.raidInProgress = null; }
}


// ===== 21_fx.js =====
// 21_fx.js — FX: pooled particles, decals, floating texts, screen effects, light flashes (SPEC §22).
// Particle shape (read by rdDrawParticle): {type:'spark'|'smoke'|'blood'|'dust'|'fire'|'toxic'|'casing'|'debris'|'flash',
//   x, y, vx, vy, life, maxLife, size, color, gravity, drag, rot, vr, alpha}. Decal: {type:'blood'|'scorch'|'toxic', x, y, r, rot, alpha, color}.
// Text: {x, y, text, color, life, maxLife, vy}. Math.random is allowed here (visual only, SPEC §0).
// Dependencies: 00_util.js.

class FX {
  constructor(raid) {
    this.raid = raid || null;
    this.particles = [];
    this.pool = [];
    this.decals = [];
    this.texts = [];
    this.lightFlashes = [];
    this.screenEffects = { hitMarker: 0, damage: 0, flash: 0, hitDirs: [] };
    this.hitMarkerTimer = 0;
  }
  get settings() { return (this.raid && this.raid.game && this.raid.game.settings) || {}; }
  get cap() { const q = this.settings.quality; return q === 'low' ? 250 : q === 'medium' ? 450 : 700; }

  _p(type, x, y, vx, vy, life, size, color, gravity = 0, drag = 0) {
    if (this.particles.length >= this.cap) {
      // drop the oldest particle (index 0) — swap with last for O(1)
      const old = this.particles[0];
      this.particles[0] = this.particles[this.particles.length - 1];
      this.particles.pop();
      this.pool.push(old);
    }
    const p = this.pool.pop() || {};
    p.type = type; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = life; p.maxLife = life; p.size = size; p.color = color;
    p.gravity = gravity; p.drag = drag; p.rot = Math.random() * Math.PI * 2; p.vr = (Math.random() - 0.5) * 8; p.alpha = 1;
    this.particles.push(p);
    return p;
  }
  _decal(type, x, y, r, color, alpha = 0.8) {
    if (this.decals.length >= 250) this.decals.shift();
    this.decals.push({ type, x, y, r, rot: Math.random() * Math.PI * 2, alpha, color, seed: Math.random() });
  }

  update(dt) {
    const ps = this.particles;
    for (let i = ps.length - 1; i >= 0; i--) {
      const p = ps[i];
      p.life -= dt;
      if (p.life <= 0) { ps[i] = ps[ps.length - 1]; ps.pop(); this.pool.push(p); continue; }
      if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
      p.vy += p.gravity * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
      if (p.type === 'smoke' || p.type === 'toxic') p.size += dt * 14;
    }
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i];
      t.life -= dt; t.y += t.vy * dt; t.vy *= Math.exp(-2 * dt);
      if (t.life <= 0) this.texts.splice(i, 1);
    }
    for (let i = this.lightFlashes.length - 1; i >= 0; i--) {
      const l = this.lightFlashes[i];
      l.ttl -= dt;
      if (l.ttl <= 0) this.lightFlashes.splice(i, 1);
    }
    for (const d of this.decals) if (d.type === 'toxic') d.alpha -= dt * 0.05;
    if (this.decals.length && this.decals[0].alpha <= 0) this.decals = this.decals.filter(d => d.alpha > 0);
    const se = this.screenEffects;
    this.hitMarkerTimer = Math.max(0, this.hitMarkerTimer - dt);
    se.hitMarker = this.hitMarkerTimer;
    se.damage = Math.max(0, se.damage - dt * 1.4);
    se.flash = Math.max(0, se.flash - dt * 0.45);
    for (let i = se.hitDirs.length - 1; i >= 0; i--) { se.hitDirs[i].ttl -= dt; if (se.hitDirs[i].ttl <= 0) se.hitDirs.splice(i, 1); }
  }

  muzzleFlash(x, y, angle, scale = 1) {
    for (let i = 0; i < 4; i++) {
      const a = angle + (Math.random() - 0.5) * 0.5, s = 200 + Math.random() * 260;
      this._p('spark', x, y, Math.cos(a) * s, Math.sin(a) * s, 0.06 + Math.random() * 0.05, 2 * scale, '#ffd27a', 0, 6);
    }
    this._p('flash', x, y, 0, 0, 0.05, 14 * scale, '#fff1b8');
    this._p('smoke', x + Math.cos(angle) * 6, y + Math.sin(angle) * 6, Math.cos(angle) * 30, Math.sin(angle) * 30, 0.5, 4, 'rgba(180,180,180,0.35)', 0, 2);
    this.lightFlashes.push({ x, y, r: 130 * scale, ttl: 0.05, color: '#ffcf70' });
  }
  impact(x, y, angle, tile) {
    const metal = tile === T.FENCE || tile === T.PROP_SOLID;
    const wood = tile === T.DOOR_CLOSED || tile === T.DOOR_LOCKED || tile === T.BARRICADE;
    const back = angle + Math.PI;
    const n = metal ? 6 : 4;
    for (let i = 0; i < n; i++) {
      const a = back + (Math.random() - 0.5) * 1.6, s = 80 + Math.random() * 180;
      if (metal) this._p('spark', x, y, Math.cos(a) * s, Math.sin(a) * s, 0.15 + Math.random() * 0.15, 1.6, '#ffe39a', 0, 4);
      else this._p('debris', x, y, Math.cos(a) * s * 0.6, Math.sin(a) * s * 0.6, 0.3 + Math.random() * 0.3, 2, wood ? '#7a5a36' : '#8a8580', 0, 5);
    }
    this._p('dust', x, y, Math.cos(back) * 20, Math.sin(back) * 20, 0.45, 5, 'rgba(150,140,130,0.35)', 0, 2);
  }
  blood(x, y, angle, amount = 1) {
    const n = Math.round(5 * amount);
    for (let i = 0; i < n; i++) {
      const a = angle + (Math.random() - 0.5) * 1.2, s = 40 + Math.random() * 160;
      this._p('blood', x, y, Math.cos(a) * s, Math.sin(a) * s, 0.25 + Math.random() * 0.35, 1.5 + Math.random() * 2, Math.random() < 0.5 ? '#7a0f12' : '#5d1a10', 0, 6);
    }
    if (Math.random() < 0.6 * amount) this._decal('blood', x + Math.cos(angle) * 10, y + Math.sin(angle) * 10, 5 + Math.random() * 8 * amount, '#4a0c0e', 0.75);
  }
  explosion(x, y, radius) {
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * radius * 2.5;
      this._p('fire', x, y, Math.cos(a) * s, Math.sin(a) * s, 0.25 + Math.random() * 0.35, 4 + Math.random() * 6, Math.random() < 0.5 ? '#ffb347' : '#ff6a2a', 0, 4);
    }
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, s = 20 + Math.random() * 80;
      this._p('smoke', x, y, Math.cos(a) * s, Math.sin(a) * s, 1.2 + Math.random(), 8 + Math.random() * 8, 'rgba(60,60,60,0.5)', -10, 1.5);
    }
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2, s = 150 + Math.random() * 250;
      this._p('debris', x, y, Math.cos(a) * s, Math.sin(a) * s, 0.5 + Math.random() * 0.4, 2, '#555', 0, 3);
    }
    this._p('flash', x, y, 0, 0, 0.12, radius * 0.9, '#fff3c4');
    this._decal('scorch', x, y, radius * 0.45, '#111', 0.7);
    this.lightFlashes.push({ x, y, r: radius * 3, ttl: 0.18, color: '#ffb347' });
  }
  smoke(x, y) { this._p('smoke', x, y, (Math.random() - 0.5) * 20, -10 - Math.random() * 20, 1.5, 6, 'rgba(90,90,90,0.4)', -5, 1); }
  fire(x, y, r) {
    for (let i = 0; i < 2; i++) {
      const a = Math.random() * Math.PI * 2, d = Math.random() * r;
      this._p('fire', x + Math.cos(a) * d, y + Math.sin(a) * d, (Math.random() - 0.5) * 20, -30 - Math.random() * 40, 0.4 + Math.random() * 0.4, 3 + Math.random() * 4, Math.random() < 0.5 ? '#ff9a2a' : '#ffcf4a', -20, 1);
    }
    if (Math.random() < 0.15) this.smoke(x + (Math.random() - 0.5) * r, y + (Math.random() - 0.5) * r);
  }
  toxicCloud(x, y, r) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2, d = Math.random() * r * 0.8;
      this._p('toxic', x + Math.cos(a) * d, y + Math.sin(a) * d, (Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15, 1.6 + Math.random(), 8 + Math.random() * 8, 'rgba(120,220,70,0.28)', 0, 1);
    }
    this._decal('toxic', x, y, r * 0.8, '#3d6b1d', 0.45);
  }
  casing(x, y, angle) {
    const a = angle + Math.PI / 2 + (Math.random() - 0.5) * 0.6, s = 60 + Math.random() * 60;
    this._p('casing', x, y, Math.cos(a) * s, Math.sin(a) * s, 0.5, 1.6, '#c9a24a', 0, 5);
  }
  footDust(x, y) { this._p('dust', x, y, (Math.random() - 0.5) * 20, (Math.random() - 0.5) * 20, 0.4, 3, 'rgba(140,130,120,0.25)', 0, 3); }
  floatingText(x, y, text, color = '#fff', force = false) {
    if (!force && this.settings.damageNumbers === false && /^\d+$/.test(String(text))) return;
    if (this.texts.length >= 40) this.texts.shift();
    this.texts.push({ x: x + (Math.random() - 0.5) * 10, y, text: String(text), color, life: 0.9, maxLife: 0.9, vy: -60 });
  }
  hitMarker() { this.hitMarkerTimer = 0.12; this.screenEffects.hitMarker = 0.12; }
  damageFlash(strength) { this.screenEffects.damage = clamp(Math.max(this.screenEffects.damage, strength), 0, 1); }
  hitDirection(angle) {
    if (!Number.isFinite(angle)) return;
    const d = this.screenEffects.hitDirs;
    d.push({ angle, ttl: 0.8 });
    if (d.length > 6) d.shift();
  }
  flash(strength) { this.screenEffects.flash = clamp(Math.max(this.screenEffects.flash, strength), 0, 1); }
}


// ===== 22_renderer_entities.js =====
// 22_renderer_entities.js — hoisted entity draw functions (SPEC §23.1). The ctx is already in world space.
// rdDrawZombie, rdDrawPlayer, rdDrawProp, rdDrawContainer, rdDrawFloorLoot, rdDrawProjectile, rdDrawGrenade,
// rdDrawHazard, rdDrawParticle. Each draws one entity with at most one save/restore.
// Dependencies: 00_util.js, 01/02 data (read at runtime). Math.random is allowed here (visual only).

const RDE_ZCOL = {
  walker: { body: '#5f7a4c', skin: '#8fa36d', dark: '#3d4f31' },
  runner: { body: '#7d8a6a', skin: '#b6bf98', dark: '#4e5741' },
  brute: { body: '#4a3f36', skin: '#7b6a58', dark: '#2c241e' },
  screamer: { body: '#6b5a72', skin: '#a596ab', dark: '#3f3444' },
  toxic: { body: '#4f7a25', skin: '#9bd34a', dark: '#2d4a12' },
  armored: { body: '#4d5257', skin: '#7f8a73', dark: '#2a2e31' },
  stalker: { body: '#2f3438', skin: '#626b70', dark: '#16191b' },
  boss: { body: '#5a2a24', skin: '#9a5a48', dark: '#2e1210' },
};
const RDE_CATCOL = { weapon: '#d9d9d9', ammo: '#d4b34a', medical: '#e5484d', food: '#c9893a', water: '#4aa3df', material: '#9a8a70', electronics: '#5ad1c8',
  tool: '#c47a3a', armor: '#7f9aa8', backpack: '#8a7a55', key: '#ffd34a', mission: '#ffb12b', collectible: '#d08bff', grenade: '#7fb24a' };

function rde_circle(ctx, x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function rde_ellipse(ctx, x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function rde_rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else { ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); }
}

function rdDrawZombie(ctx, z, raid, t) {
  const col = RDE_ZCOL[z.id] || RDE_ZCOL.walker;
  const s = (z.type && z.type.size) || 1;
  const R = z.radius || 13;
  ctx.save();
  if (z.dead) {
    const fade = clamp((25 - z.deathTimer) / 3, 0, 1) * (z.id === 'boss' ? 1 : 1);
    ctx.globalAlpha = 0.85 * fade;
    ctx.translate(z.x, z.y);
    ctx.rotate(z.angle + 1.2);
    rde_ellipse(ctx, 0, 0, R * 1.2, R * 0.7, col.dark);
    rde_circle(ctx, R * 0.9, 0, R * 0.45, col.skin);
    rde_ellipse(ctx, -R * 0.2, R * 0.5, R * 0.8, R * 0.25, 'rgba(70,10,12,0.8)');
    ctx.restore();
    return;
  }
  const alpha = z.visibleAlpha !== undefined ? z.visibleAlpha : 1;
  ctx.globalAlpha = alpha;
  // attack telegraph offset toward the player
  const p = raid && raid.player;
  let ox = 0, oy = 0;
  if (p && (z.state === 'attack' || z.state === 'ability') && z.attackAnim > 0) {
    const a = Math.atan2(p.y - z.y, p.x - z.x);
    const off = Math.sin(z.attackAnim * Math.PI) * 6;
    ox = Math.cos(a) * off; oy = Math.sin(a) * off;
  }
  let pulse = 1;
  if (z.id === 'brute' && z.attackAnim > 0.95 && z.cooldown > 0) pulse = 1.2;
  ctx.translate(z.x + ox, z.y + oy);
  // shadow
  rde_ellipse(ctx, 3, 4, R * 1.05, R * 0.8, 'rgba(0,0,0,0.28)');
  if (z.id === 'toxic') { ctx.globalAlpha = alpha * (0.25 + 0.1 * Math.sin(t * 4)); rde_circle(ctx, 0, 0, R * 2.2, '#7dff5a'); ctx.globalAlpha = alpha; }
  if (z.id === 'boss') { ctx.globalAlpha = alpha * 0.25; rde_circle(ctx, 0, 0, R * 1.6, z.phase >= 2 ? '#ff5a2a' : z.phase === 1 ? '#ff9a2a' : '#a02020'); ctx.globalAlpha = alpha; }
  ctx.rotate(z.angle);
  ctx.scale(pulse, pulse);
  const lean = z.id === 'runner' ? 4 : z.id === 'stalker' ? 3 : 0;
  // legs
  const lp = Math.sin(z.legPhase || 0);
  const legW = R * 0.32, legL = R * 0.55;
  rde_ellipse(ctx, -R * 0.15 + lp * legL * 0.6, -R * 0.38, legL * 0.6, legW, col.dark);
  rde_ellipse(ctx, -R * 0.15 - lp * legL * 0.6, R * 0.38, legL * 0.6, legW, col.dark);
  // arms (extend during attack)
  const reach = lerp(6, 18, clamp(z.attackAnim || 0, 0, 1)) * s;
  const armY = z.id === 'brute' ? R * 0.95 : R * 0.6;
  ctx.strokeStyle = col.skin; ctx.lineCap = 'round'; ctx.lineWidth = Math.max(3, R * 0.3);
  ctx.beginPath();
  if (z.id === 'screamer' && z.attackAnim > 0.5) { ctx.moveTo(0, -armY); ctx.lineTo(-4, -armY - reach); ctx.moveTo(0, armY); ctx.lineTo(-4, armY + reach); }
  else { ctx.moveTo(0, -armY); ctx.lineTo(R * 0.4 + reach, -armY * 0.7); ctx.moveTo(0, armY); ctx.lineTo(R * 0.4 + reach, armY * 0.7); }
  ctx.stroke();
  // body
  const bw = z.id === 'brute' ? R * 0.9 : z.id === 'runner' || z.id === 'stalker' ? R * 0.7 : R * 0.82;
  const bh = z.id === 'brute' ? R * 1.25 : R;
  rde_ellipse(ctx, 0, 0, bw, bh, col.body);
  if (z.id === 'armored') {
    ctx.fillStyle = '#8a9298';
    rde_rrect(ctx, R * 0.15, -bh * 0.8, R * 0.55, bh * 1.6, 3); ctx.fill();
    ctx.strokeStyle = '#2a2e31'; ctx.lineWidth = 1; ctx.stroke();
  }
  if (z.id === 'toxic') { for (let i = 0; i < 4; i++) rde_circle(ctx, -R * 0.3 + i * 4, (i % 2 ? -1 : 1) * R * 0.35, 2.2, '#c6ff6a'); }
  if (z.id === 'boss') { for (let i = 0; i < 5; i++) rde_circle(ctx, -R * 0.4 + (i % 3) * R * 0.3, (i - 2) * R * 0.3, R * 0.16, col.skin); }
  // head
  const hr = z.id === 'brute' ? R * 0.42 : z.id === 'boss' ? R * 0.45 : R * 0.5;
  const hx = R * 0.35 + lean;
  rde_circle(ctx, hx, 0, hr, col.skin);
  if (z.id === 'armored') { ctx.beginPath(); ctx.arc(hx - 1, 0, hr * 1.05, Math.PI * 0.5, Math.PI * 1.5); ctx.fillStyle = '#5c6268'; ctx.fill(); }
  if (z.id === 'screamer') rde_circle(ctx, hx + hr * 0.45, 0, hr * 0.45 + (z.attackAnim || 0) * 2, '#1a0d10');
  // eyes
  ctx.fillStyle = z.id === 'stalker' ? '#ff3b3b' : z.id === 'toxic' ? '#e9ff7a' : '#d9c9a0';
  ctx.fillRect(hx + hr * 0.35, -hr * 0.45, 2, 2); ctx.fillRect(hx + hr * 0.35, hr * 0.3, 2, 2);
  // red telegraph outline during the last 40 % of the windup
  if ((z.state === 'attack' && z.windupTimer > 0 && z.attackAnim > 0.6) || (z.state === 'ability' && z.attackAnim > 0.4)) {
    ctx.strokeStyle = 'rgba(255,40,40,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, bw + 3, bh + 3, 0, 0, Math.PI * 2); ctx.stroke();
  }
  // hit flash
  if (z.flash > 0) { ctx.globalAlpha = alpha * clamp(z.flash / 0.12, 0, 1) * 0.8; rde_ellipse(ctx, 0, 0, bw + 1, bh + 1, '#ffffff'); rde_circle(ctx, hx, 0, hr + 1, '#ffffff'); }
  ctx.rotate(-z.angle);
  ctx.globalAlpha = alpha;
  // health bar
  if (z.hp < z.hpMax && z.id !== 'boss' && alpha > 0.5) {
    const w = Math.max(20, R * 2), y = -R - 10;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(-w / 2, y, w, 4);
    ctx.fillStyle = z.hp / z.hpMax > 0.5 ? '#9be36a' : z.hp / z.hpMax > 0.25 ? '#f0b429' : '#e5484d';
    ctx.fillRect(-w / 2, y, w * clamp(z.hp / z.hpMax, 0, 1), 4);
  }
  if (z.state === 'stunned') { ctx.fillStyle = '#ffe680'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('✦', Math.sin(t * 6) * 6, -R - 14); }
  ctx.restore();
}

function rdDrawPlayer(ctx, p, raid, t) {
  if (!p) return;
  const R = p.radius || 12;
  const sc = p.crouching ? 0.86 : 1;
  ctx.save();
  ctx.translate(p.x, p.y);
  rde_ellipse(ctx, 3, 4, R * 1.05 * sc, R * 0.85 * sc, 'rgba(0,0,0,0.3)');
  ctx.rotate(p.angle);
  ctx.scale(sc, sc);
  const lp = p.moving ? Math.sin(p.legPhase || 0) : 0;
  rde_ellipse(ctx, -2 + lp * 5, -R * 0.4, 6, 3.4, '#2b3326');
  rde_ellipse(ctx, -2 - lp * 5, R * 0.4, 6, 3.4, '#2b3326');
  // backpack
  const eq = p.equipment;
  if (eq && eq.backpack) { ctx.fillStyle = '#5a4d34'; rde_rrect(ctx, -R - 3, -R * 0.65, 8, R * 1.3, 3); ctx.fill(); }
  // weapon
  const inst = p.weaponInst;
  const d = inst ? Items.def(inst) : null;
  const cls = d && d.weapon ? d.weapon.class : null;
  const len = { pistol: 14, smg: 18, rifle: 26, shotgun: 24, sniper: 32, lmg: 28, melee: 18 }[cls] || 0;
  if (p.activeSlot === 3) { rde_circle(ctx, R * 0.9, R * 0.4, 4, '#4f6b2a'); }
  else if (p.activeSlot === 4) { ctx.fillStyle = '#e8e8e8'; ctx.fillRect(R * 0.6, R * 0.1, 8, 7); ctx.fillStyle = '#e5484d'; ctx.fillRect(R * 0.6 + 3, R * 0.1 + 1, 2, 5); ctx.fillRect(R * 0.6 + 1.5, R * 0.1 + 2.5, 5, 2); }
  else if (cls === 'melee') {
    const swing = (p.meleeAnim || 0);
    ctx.save();
    ctx.rotate(-0.9 + swing * 1.8);
    ctx.strokeStyle = '#b8b8b8'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(R * 0.6, R * 0.3); ctx.lineTo(R * 0.6 + len, R * 0.3); ctx.stroke();
    ctx.restore();
    if (swing > 0.1) { ctx.strokeStyle = 'rgba(255,255,255,' + (swing * 0.5) + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, R + len, -0.8, 0.8); ctx.stroke(); }
  } else if (len) {
    ctx.fillStyle = '#1d1f21';
    ctx.fillRect(R * 0.3, -2.5, len, 5);
    ctx.fillStyle = cls === 'sniper' ? '#3a3f2a' : cls === 'shotgun' ? '#5a3f26' : '#2e3236';
    ctx.fillRect(R * 0.3, -3, len * 0.45, 6);
  }
  // arms
  ctx.strokeStyle = '#c9a07a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -R * 0.65); ctx.lineTo(R * 0.75, -3); ctx.moveTo(0, R * 0.65); ctx.lineTo(R * 0.9, 2); ctx.stroke();
  // torso (vest colour when armored)
  const vest = eq && eq.armorBody;
  rde_ellipse(ctx, 0, 0, R * 0.78, R, vest ? '#4a5a3a' : '#3f4d36');
  if (vest) { ctx.fillStyle = vest.durability > 0 ? '#5f6f4a' : '#5a3a3a'; rde_rrect(ctx, -R * 0.45, -R * 0.75, R * 0.9, R * 1.5, 4); ctx.fill(); }
  // shoulder pads
  rde_circle(ctx, 0, -R * 0.8, 3.5, '#2f3a28'); rde_circle(ctx, 0, R * 0.8, 3.5, '#2f3a28');
  // head / helmet
  const helm = eq && eq.armorHead;
  rde_circle(ctx, 2, 0, 6.5, '#d2a882');
  if (helm) { ctx.beginPath(); ctx.arc(1, 0, 7.2, Math.PI * 0.35, Math.PI * 1.65); ctx.fillStyle = '#3b4a33'; ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(0, 0, 6.6, Math.PI * 0.55, Math.PI * 1.45); ctx.fillStyle = '#3a2a1e'; ctx.fill(); }
  // flashlight lens
  if (p.flashlightOn && len && cls !== 'melee') { ctx.globalAlpha = 0.9; rde_circle(ctx, R * 0.3 + len, 0, 2.2, '#fff8d0'); ctx.globalAlpha = 1; }
  if (p.hurtTimer > 0) { ctx.globalAlpha = p.hurtTimer * 2; rde_ellipse(ctx, 0, 0, R * 0.9, R * 1.05, '#ff3030'); ctx.globalAlpha = 1; }
  ctx.restore();
  // channel ring for item use
  if (p.using) {
    const f = 1 - p.using.timer / Math.max(0.01, p.using.total);
    ctx.save();
    ctx.strokeStyle = 'rgba(120,255,140,0.9)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, R + 8, -Math.PI / 2, -Math.PI / 2 + f * Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

function rdDrawProp(ctx, prop, palette) {
  const x = prop.tx * TILE, y = prop.ty * TILE, w = prop.w * TILE, h = prop.h * TILE;
  const cx = x + w / 2, cy = y + h / 2;
  ctx.save();
  switch (prop.type) {
    case 'car': case 'truck': {
      const col = prop.color || '#555';
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; rde_rrect(ctx, x + 5, y + 6, w - 6, h - 6, 8); ctx.fill();
      ctx.fillStyle = col; rde_rrect(ctx, x + 3, y + 3, w - 6, h - 6, 8); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
      const vertical = h > w;
      ctx.fillStyle = 'rgba(140,175,200,0.55)';
      if (vertical) {
        ctx.fillRect(x + 8, y + h * 0.22, w - 16, h * 0.16);
        ctx.fillRect(x + 8, y + h * 0.66, w - 16, h * 0.12);
        ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x + 8, y + h * 0.4, w - 16, h * 0.24);
      } else {
        ctx.fillRect(x + w * 0.62, y + 8, w * 0.16, h - 16);
        ctx.fillRect(x + w * 0.22, y + 8, w * 0.12, h - 16);
        ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x + w * 0.36, y + 8, w * 0.24, h - 16);
      }
      if (prop.type === 'truck') { ctx.fillStyle = 'rgba(0,0,0,0.2)'; if (vertical) ctx.fillRect(x + 5, y + h * 0.35, w - 10, h * 0.6); else ctx.fillRect(x + w * 0.05, y + 5, w * 0.6, h - 10); }
      break;
    }
    case 'tree': {
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(cx + 6, cy + 7, 20, 0, Math.PI * 2); ctx.fill();
      const g = palette && palette.grass ? palette.grass : '#2f4a2c';
      rde_circle(ctx, cx, cy, 19, '#1d2e1b');
      rde_circle(ctx, cx - 4, cy - 3, 15, g);
      rde_circle(ctx, cx + 5, cy + 4, 11, '#3d5c36');
      rde_circle(ctx, cx - 6, cy + 5, 7, '#2a4126');
      break;
    }
    case 'dumpster':
      ctx.fillStyle = '#1f3a30'; rde_rrect(ctx, x + 2, y + 3, w - 4, h - 6, 3); ctx.fill();
      ctx.fillStyle = '#2f5144'; ctx.fillRect(x + 4, y + 5, w - 8, h - 12);
      ctx.strokeStyle = '#13241d'; ctx.beginPath(); ctx.moveTo(x + w / 2, y + 4); ctx.lineTo(x + w / 2, y + h - 4); ctx.stroke();
      break;
    case 'bench':
      ctx.fillStyle = '#4a3828'; ctx.fillRect(x + 3, y + 9, w - 6, h - 18);
      ctx.fillStyle = '#6b5236'; for (let i = 0; i < 3; i++) ctx.fillRect(x + 3, y + 10 + i * 4, w - 6, 2);
      break;
    case 'barrel':
      rde_circle(ctx, cx + 2, cy + 3, 12, 'rgba(0,0,0,0.3)');
      rde_circle(ctx, cx, cy, 12, prop.color || '#7a3b22');
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI * 2); ctx.stroke();
      break;
    case 'crate': case 'pallet':
      ctx.fillStyle = prop.type === 'pallet' ? '#8a6c44' : '#7a5f3a'; ctx.fillRect(x + 4, y + 4, w - 8, h - 8);
      ctx.strokeStyle = '#4e3b22'; ctx.lineWidth = 2; ctx.strokeRect(x + 4, y + 4, w - 8, h - 8);
      ctx.beginPath(); ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + w - 4, y + h - 4); ctx.moveTo(x + w - 4, y + 4); ctx.lineTo(x + 4, y + h - 4); ctx.stroke();
      break;
    case 'barricade':
      ctx.fillStyle = '#5a4630';
      for (let i = 0; i < Math.max(w, h) / 10; i++) {
        if (w >= h) ctx.fillRect(x + i * 10, y + 6 + (i % 2) * 4, 9, h - 12);
        else ctx.fillRect(x + 6 + (i % 2) * 4, y + i * 10, w - 12, 9);
      }
      ctx.strokeStyle = '#c9a23a'; ctx.lineWidth = 3; ctx.beginPath();
      if (w >= h) { ctx.moveTo(x, cy - 4); ctx.lineTo(x + w, cy + 4); } else { ctx.moveTo(cx - 4, y); ctx.lineTo(cx + 4, y + h); }
      ctx.stroke();
      break;
    case 'sandbag':
      ctx.fillStyle = '#7d6e4c';
      for (let i = 0; i < Math.max(prop.w, prop.h) * 2; i++) {
        const bx = w >= h ? x + i * 16 + 8 : cx, by = w >= h ? cy : y + i * 16 + 8;
        rde_ellipse(ctx, bx, by, w >= h ? 9 : 12, w >= h ? 12 : 9, i % 2 ? '#8a7a55' : '#706245');
      }
      break;
    case 'tank':
      rde_circle(ctx, cx + 4, cy + 5, w / 2 - 2, 'rgba(0,0,0,0.35)');
      rde_circle(ctx, cx, cy, w / 2 - 3, '#5d6266');
      rde_circle(ctx, cx, cy, w / 2 - 10, '#6e7478');
      ctx.strokeStyle = '#3d4144'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, w / 2 - 6, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#c9a23a'; ctx.fillRect(cx - 10, cy - 2, 20, 4);
      break;
    case 'pipe':
      ctx.fillStyle = '#6a5c4e'; if (w >= h) ctx.fillRect(x, cy - 6, w, 12); else ctx.fillRect(cx - 6, y, 12, h);
      ctx.fillStyle = '#857463'; if (w >= h) ctx.fillRect(x, cy - 6, w, 4); else ctx.fillRect(cx - 6, y, 4, h);
      break;
    case 'tower':
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x + 6, y + 8, w, h);
      ctx.fillStyle = '#4a4232'; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
      ctx.strokeStyle = '#2a251c'; ctx.lineWidth = 2; ctx.strokeRect(x + 6, y + 6, w - 12, h - 12);
      ctx.beginPath(); ctx.moveTo(x + 2, y + 2); ctx.lineTo(x + w - 2, y + h - 2); ctx.moveTo(x + w - 2, y + 2); ctx.lineTo(x + 2, y + h - 2); ctx.stroke();
      break;
    case 'antenna':
      ctx.strokeStyle = '#9aa0a6'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx - 10, cy + 10); ctx.lineTo(cx, cy - 12); ctx.lineTo(cx + 10, cy + 10); ctx.moveTo(cx - 6, cy); ctx.lineTo(cx + 6, cy); ctx.stroke();
      rde_circle(ctx, cx, cy - 12, 2.5, '#ff4040');
      break;
    case 'generator': {
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x - 2, y + 2, w + 6, h + 4);
      ctx.fillStyle = '#9a7a22'; rde_rrect(ctx, x - 4, y - 2, w + 8, h + 4, 3); ctx.fill();
      ctx.fillStyle = '#3a3a3a'; ctx.fillRect(x, y + 4, w, h - 8);
      ctx.fillStyle = prop.running ? '#59ff9c' : '#ff4040'; ctx.fillRect(x + w - 8, y + 6, 4, 4);
      break;
    }
    case 'pillar':
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x + 4, y + 5, w, h);
      ctx.fillStyle = prop.color || '#5b6066'; ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
      ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(x + 1, y + 1, w - 2, 5);
      break;
    case 'lamp':
      rde_circle(ctx, cx, cy, 4, '#3a3a3a');
      rde_circle(ctx, cx, cy, 2.2, prop.extraction ? '#59ff9c' : '#fff1c4');
      break;
    default:
      ctx.fillStyle = prop.color || '#666'; ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
  }
  ctx.restore();
}

function rdDrawContainer(ctx, c, t) {
  const x = c.tx * TILE, y = c.ty * TILE;
  const op = c.opened;
  const empty = op && Array.isArray(c.items) && !c.items.some(Boolean);
  ctx.save();
  ctx.globalAlpha = empty ? 0.55 : 1;
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x + 6, y + 7, 22, 22);
  switch (c.type) {
    case 'crate':
      ctx.fillStyle = op ? '#5d4a2e' : '#8a6a3c'; ctx.fillRect(x + 4, y + 4, 24, 24);
      ctx.strokeStyle = '#4a3820'; ctx.lineWidth = 2; ctx.strokeRect(x + 4, y + 4, 24, 24);
      if (op) { ctx.fillStyle = '#2a2116'; ctx.fillRect(x + 7, y + 7, 18, 18); } else { ctx.beginPath(); ctx.moveTo(x + 4, y + 16); ctx.lineTo(x + 28, y + 16); ctx.stroke(); }
      break;
    case 'military_crate':
      ctx.fillStyle = op ? '#3e4a2c' : '#566a3a'; ctx.fillRect(x + 2, y + 6, 28, 20);
      ctx.fillStyle = '#c9c39a'; if (!op) { ctx.font = 'bold 7px monospace'; ctx.fillText('MIL', x + 9, y + 19); }
      else { ctx.fillStyle = '#1e2416'; ctx.fillRect(x + 5, y + 9, 22, 14); }
      break;
    case 'locker':
      ctx.fillStyle = op ? '#4a5560' : '#68757f'; ctx.fillRect(x + 7, y + 3, 18, 26);
      ctx.strokeStyle = '#2f363c'; ctx.strokeRect(x + 7, y + 3, 18, 26);
      ctx.fillStyle = '#2f363c'; for (let i = 0; i < 3; i++) ctx.fillRect(x + 10, y + 6 + i * 3, 12, 1);
      break;
    case 'fridge':
      ctx.fillStyle = op ? '#a8adb0' : '#d6dadc'; ctx.fillRect(x + 6, y + 3, 20, 26);
      ctx.fillStyle = '#6b7073'; ctx.fillRect(x + 6, y + 13, 20, 1); ctx.fillRect(x + 22, y + 6, 2, 5);
      break;
    case 'desk':
      ctx.fillStyle = op ? '#4e3a28' : '#6b4f34'; ctx.fillRect(x + 2, y + 7, 28, 18);
      ctx.fillStyle = '#d8d0b8'; ctx.fillRect(x + 6, y + 10, 8, 6);
      ctx.fillStyle = '#222'; ctx.fillRect(x + 18, y + 10, 8, 6);
      break;
    case 'medcabinet':
      ctx.fillStyle = op ? '#b8bcbf' : '#eceff1'; ctx.fillRect(x + 5, y + 4, 22, 24);
      ctx.fillStyle = '#e5484d'; ctx.fillRect(x + 14, y + 8, 4, 14); ctx.fillRect(x + 9, y + 13, 14, 4);
      break;
    case 'safe':
      ctx.fillStyle = op ? '#2c2f33' : '#45494e'; ctx.fillRect(x + 5, y + 5, 22, 22);
      ctx.strokeStyle = '#8a8f94'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x + 16, y + 16, 5, 0, Math.PI * 2); ctx.stroke();
      break;
    case 'toolbox':
      ctx.fillStyle = op ? '#8a2a22' : '#c0392b'; ctx.fillRect(x + 4, y + 10, 24, 14);
      ctx.fillStyle = '#333'; ctx.fillRect(x + 12, y + 7, 8, 3);
      break;
    case 'weapon_rack':
      ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x + 2, y + 6, 28, 20);
      ctx.strokeStyle = op ? '#555' : '#9a9a9a'; ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(x + 6 + i * 7, y + 8); ctx.lineTo(x + 6 + i * 7, y + 24); ctx.stroke(); }
      break;
    case 'server_rack':
      ctx.fillStyle = '#151719'; ctx.fillRect(x + 6, y + 2, 20, 28);
      for (let i = 0; i < 5; i++) { ctx.fillStyle = (Math.floor(t * 3 + i) % 3 === 0) ? '#59ff9c' : '#1f6b3a'; ctx.fillRect(x + 9, y + 5 + i * 5, 3, 2); }
      break;
    case 'lab_cabinet':
      ctx.fillStyle = op ? '#9fb4c0' : '#d0e2ea'; ctx.fillRect(x + 4, y + 4, 24, 24);
      ctx.fillStyle = 'rgba(80,160,220,0.5)'; ctx.fillRect(x + 7, y + 7, 18, 8);
      ctx.fillStyle = '#5ad1c8'; ctx.fillRect(x + 8, y + 18, 4, 6); ctx.fillStyle = '#d08bff'; ctx.fillRect(x + 14, y + 18, 4, 6);
      break;
    case 'body': {
      ctx.globalAlpha = empty ? 0.5 : 0.95;
      ctx.translate(x + 16, y + 16); ctx.rotate(((c.tx * 7 + c.ty * 3) % 6) * 0.9);
      rde_ellipse(ctx, 0, 0, 12, 6, '#3a3328');
      rde_circle(ctx, 11, 0, 4.5, '#8a7a66');
      rde_ellipse(ctx, -4, 5, 9, 4, 'rgba(70,10,12,0.75)');
      break;
    }
    default:
      ctx.fillStyle = '#777'; ctx.fillRect(x + 6, y + 6, 20, 20);
  }
  ctx.restore();
  // unopened glint
  if (!op && c.type !== 'body') {
    const a = 0.25 + 0.25 * Math.sin(t * 3 + c.tx);
    ctx.fillStyle = 'rgba(255,240,180,' + a.toFixed(3) + ')';
    ctx.fillRect(x + 24, y + 4, 3, 3);
  }
}

function rdDrawFloorLoot(ctx, fl, t) {
  const inst = fl.inst;
  const d = Items.def(inst);
  const rar = Items.rarity(inst);
  const col = rar.color || '#aaa';
  const pulse = 0.5 + 0.5 * Math.sin(t * 3 + fl.x * 0.01);
  ctx.save();
  ctx.translate(fl.x, fl.y);
  ctx.globalAlpha = 0.25 + 0.2 * pulse;
  rde_circle(ctx, 0, 0, 13 + (rar.order || 0) * 2, col);
  ctx.globalAlpha = 1;
  ctx.rotate(Math.PI / 4);
  ctx.fillStyle = '#15191c'; ctx.fillRect(-6.5, -6.5, 13, 13);
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.strokeRect(-6.5, -6.5, 13, 13);
  ctx.rotate(-Math.PI / 4);
  rde_circle(ctx, 0, 0, 3, RDE_CATCOL[d ? d.cat : ''] || '#ccc');
  ctx.restore();
}

function rdDrawProjectile(ctx, pr) {
  const len = Math.min(pr.trail || 0, pr.cls === 'sniper' ? 70 : 36);
  if (len <= 1) return;
  const x0 = pr.x - pr.dirX * len, y0 = pr.y - pr.dirY * len;
  const g = ctx.createLinearGradient(x0, y0, pr.x, pr.y);
  g.addColorStop(0, 'rgba(255,220,140,0)');
  g.addColorStop(1, pr.cls === 'sniper' ? 'rgba(255,255,230,1)' : 'rgba(255,215,120,0.95)');
  ctx.strokeStyle = g;
  ctx.lineWidth = pr.cls === 'sniper' ? 2.4 : pr.cls === 'shotgun' ? 1.2 : 1.8;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(pr.x, pr.y); ctx.stroke();
}

function rdDrawGrenade(ctx, g) {
  ctx.save();
  rde_ellipse(ctx, g.x + 2, g.y + 3, 5, 3.5, 'rgba(0,0,0,0.35)');
  ctx.translate(g.x, g.y - (g.z || 0) * 0.35);
  ctx.rotate(g.rot || 0);
  const col = g.kind === 'molotov' ? '#7a4a1a' : g.kind === 'flash' ? '#9aa0a6' : '#4f6b2a';
  rde_circle(ctx, 0, 0, 5, col);
  if (g.kind === 'molotov') { rde_circle(ctx, 5, 0, 2.5, (Math.floor((g.fuse || 0) * 10) % 2) ? '#ffb347' : '#ff6a2a'); }
  else if (Math.floor((g.fuse || 0) * 6) % 2 === 0) rde_circle(ctx, 0, 0, 2, '#ff4040');
  ctx.restore();
}

function rdDrawHazard(ctx, h, t) {
  const life = clamp(1 - h.timer / Math.max(0.01, h.duration), 0, 1);
  ctx.save();
  if (h.kind === 'toxic') {
    const g = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, h.r);
    g.addColorStop(0, 'rgba(140,240,60,' + (0.35 * life + 0.05).toFixed(3) + ')');
    g.addColorStop(0.7, 'rgba(90,180,40,' + (0.2 * life).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(60,120,20,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r * (0.95 + 0.05 * Math.sin(t * 3)), 0, Math.PI * 2); ctx.fill();
  } else {
    const g = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, h.r);
    g.addColorStop(0, 'rgba(255,190,80,' + (0.45 * life).toFixed(3) + ')');
    g.addColorStop(0.6, 'rgba(255,90,30,' + (0.25 * life).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(120,30,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function rdDrawParticle(ctx, p) {
  const a = clamp(p.life / Math.max(0.001, p.maxLife), 0, 1);
  switch (p.type) {
    case 'spark':
      ctx.globalAlpha = a;
      ctx.strokeStyle = p.color; ctx.lineWidth = p.size;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.025, p.y - p.vy * 0.025); ctx.stroke();
      break;
    case 'flash': {
      ctx.globalAlpha = a;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
      g.addColorStop(0, p.color); g.addColorStop(1, 'rgba(255,200,120,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case 'casing': case 'debris':
      ctx.globalAlpha = Math.min(1, a * 2);
      ctx.fillStyle = p.color;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size, -p.size * 0.5, p.size * 2, p.size); ctx.restore();
      break;
    case 'fire':
      ctx.globalAlpha = a * 0.9;
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, Math.PI * 2); ctx.fill();
      break;
    default:
      ctx.globalAlpha = p.type === 'smoke' || p.type === 'toxic' || p.type === 'dust' ? a * 0.8 : a;
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}


// ===== 22_renderer.js =====
// 22_renderer.js — Renderer: DPR-aware canvas, chunk-cached tiles, entity pipeline, roofs, lighting overlay with
// flashlight cone, fog, screen effects, off-screen arrows, minimap, full map, menu background (SPEC §23).
// Decisions: one cached white radial sprite (scaled) cuts all lights out of the darkness; coloured light glows are
//   added with 'lighter' under the overlay; the minimap shows a 64×64-tile window around the player.
// Dependencies: 00_util.js, 08_world.js (T), 17_raid.js (darknessForHour), 22_renderer_entities.js. DOM: canvas only.

const RD_CHUNK = 16;

class Renderer {
  constructor(game, canvas) {
    this.game = game;
    this.canvas = canvas || null;
    this.ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
    this.dpr = 1;
    this.w = 1280; this.h = 720;
    this.chunks = new Map();
    this.cachedWorld = null;
    this.frame = 0;
    this.t = 0;
    this.overlay = null;
    this.lightSprite = null;
    this.coneSprite = null;
    this.fogSprite = null;
    this.miniCache = null;
    this.fullCache = null;
    this.fps = 0;
    this.drawCalls = 0;
    this.menuDust = null;
  }

  get settings() { return (this.game && this.game.settings) || {}; }

  resize() {
    if (!this.canvas || typeof window === 'undefined') return;
    const w = Math.max(320, window.innerWidth || 1280), h = Math.max(240, window.innerHeight || 720);
    const q = this.settings.quality;
    const cap = q === 'high' ? 2 : q === 'medium' ? 1.5 : 1;
    this.dpr = Math.min(window.devicePixelRatio || 1, cap);
    this.w = w; this.h = h;
    this.canvas.width = Math.round(w * this.dpr);
    this.canvas.height = Math.round(h * this.dpr);
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
    if (this.game && this.game.camera) this.game.camera.resize(w, h);
    this.overlay = null;
  }

  invalidateChunks() {
    this.chunks.clear();
    this.miniCache = null;
    this.fullCache = null;
  }

  _canvas(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
    return c;
  }

  // ---------------- tiles ----------------
  _tileColors(world, map) {
    const pal = (map && map.palette) || {};
    return {
      ground: pal.ground || '#3a3d3f', road: pal.road || '#2b2d30', line: pal.roadLine || '#8a7f3f', grass: pal.grass || '#2f4a2c',
      floor: pal.floor || '#4a4440', water: pal.water || '#1f3340', wallA: pal.wallA || '#6b6259', gravel: pal.gravel || '#4d4a44',
      sidewalk: pal.sidewalk || '#55585a', toxic: pal.toxic || '#2f4d16',
    };
  }

  _shade(hex, f) {
    // f in [-1,1]: darken/lighten a #rrggbb colour
    if (typeof hex !== 'string' || hex[0] !== '#' || hex.length < 7) return hex;
    const n = parseInt(hex.slice(1, 7), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    if (f >= 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
    else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
    return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
  }

  _baseUnder(world, tx, ty) {
    for (let k = 0; k < 4; k++) {
      const t = world.tile(tx + NAV_DX[k], ty + NAV_DY[k]);
      if (t !== T.PROP_SOLID && t !== T.PROP_LOW && t !== T.WALL && t !== T.WINDOW && t !== T.VOID && t !== T.BARRICADE && t !== T.FENCE && !tileIsDoor(t)) return t === T.ROAD_LINE ? T.ROAD : t;
    }
    return T.GROUND;
  }

  _drawTile(ctx, world, C, tx, ty, px, py, override) {
    let t = override !== undefined ? override : world.tile(tx, ty);
    const v = world.tileVariant[ty * world.w + tx] || 0;
    const S = TILE;
    const bi = world.buildingIndexAtTile(tx, ty);
    const b = bi >= 0 ? world.buildings[bi] : null;
    if (t === T.PROP_SOLID || t === T.PROP_LOW || t === T.BARRICADE) t = b ? T.FLOOR : this._baseUnder(world, tx, ty);
    const dots = (col, n, size) => { ctx.fillStyle = col; for (let i = 0; i < n; i++) { const h = (tx * 73856093 ^ ty * 19349663 ^ i * 83492791) >>> 0; ctx.fillRect(px + (h % 29) + 1, py + ((h >> 5) % 29) + 1, size, size); } };
    switch (t) {
      case T.VOID: ctx.fillStyle = '#07090b'; ctx.fillRect(px, py, S, S); break;
      case T.GROUND: ctx.fillStyle = this._shade(C.ground, (v - 1.5) * 0.012); ctx.fillRect(px, py, S, S); dots('rgba(0,0,0,0.12)', 4, 2); dots('rgba(255,255,255,0.04)', 2, 1); break;
      case T.GRASS: ctx.fillStyle = this._shade(C.grass, (v - 1.5) * 0.014); ctx.fillRect(px, py, S, S); dots('rgba(120,170,90,0.18)', 6, 1); dots('rgba(0,0,0,0.15)', 3, 2); break;
      case T.GRAVEL: ctx.fillStyle = this._shade(C.gravel, (v - 1.5) * 0.014); ctx.fillRect(px, py, S, S); dots('rgba(200,190,170,0.12)', 8, 1); dots('rgba(0,0,0,0.18)', 5, 2); break;
      case T.ROAD: case T.ROAD_LINE:
        ctx.fillStyle = this._shade(C.road, (v - 1.5) * 0.008); ctx.fillRect(px, py, S, S); dots('rgba(255,255,255,0.03)', 3, 1);
        if (t === T.ROAD_LINE) {
          ctx.fillStyle = C.line;
          const vert = world.tile(tx, ty - 1) === T.ROAD_LINE || world.tile(tx, ty + 1) === T.ROAD_LINE || (world.tile(tx - 1, ty) !== T.ROAD_LINE && world.tile(tx + 1, ty) !== T.ROAD_LINE && world.tile(tx, ty - 1) === T.ROAD);
          if (vert) ctx.fillRect(px + S / 2 - 2, py + 2, 4, S - 4); else ctx.fillRect(px + 2, py + S / 2 - 2, S - 4, 4);
        }
        break;
      case T.SIDEWALK: ctx.fillStyle = this._shade(C.sidewalk, (v - 1.5) * 0.01); ctx.fillRect(px, py, S, S); ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1; ctx.strokeRect(px + 0.5, py + 0.5, S - 1, S - 1); break;
      case T.FLOOR: {
        const fc = b ? b.floorColor : C.floor;
        ctx.fillStyle = this._shade(fc, (v - 1.5) * 0.012); ctx.fillRect(px, py, S, S);
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        if (b && (b.type === 'house' || b.type === 'apartment' || b.type === 'office')) { for (let i = 0; i < 4; i++) ctx.fillRect(px, py + i * 8 + 7, S, 1); }
        else { ctx.fillRect(px + S - 1, py, 1, S); ctx.fillRect(px, py + S - 1, S, 1); }
        // ambient occlusion next to walls
        const wallN = tileBlocksSight(world.tile(tx, ty - 1)) || world.tile(tx, ty - 1) === T.WINDOW;
        const wallW = tileBlocksSight(world.tile(tx - 1, ty)) || world.tile(tx - 1, ty) === T.WINDOW;
        if (wallN) { ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(px, py, S, 6); }
        if (wallW) { ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(px, py, 5, S); }
        break;
      }
      case T.WALL: case T.WINDOW: {
        const wc = b ? b.wallColor : C.wallA;
        ctx.fillStyle = this._shade(wc, -0.25); ctx.fillRect(px, py, S, S);
        const above = world.tile(tx, ty - 1), below = world.tile(tx, ty + 1);
        const isW = (q) => q === T.WALL || q === T.WINDOW || tileIsDoor(q);
        ctx.fillStyle = this._shade(wc, 0.12); ctx.fillRect(px, py, S, isW(above) ? S - 6 : S - 8);
        ctx.fillStyle = 'rgba(255,255,255,0.08)'; if (!isW(above)) ctx.fillRect(px, py, S, 3);
        if (!isW(below)) { ctx.fillStyle = this._shade(wc, -0.45); ctx.fillRect(px, py + S - 6, S, 6); }
        if (t === T.WINDOW) {
          ctx.fillStyle = 'rgba(150,200,230,0.65)';
          const horiz = isW(world.tile(tx - 1, ty)) || isW(world.tile(tx + 1, ty));
          if (horiz) ctx.fillRect(px + 3, py + S / 2 - 3, S - 6, 6); else ctx.fillRect(px + S / 2 - 3, py + 3, 6, S - 6);
          ctx.fillStyle = 'rgba(255,255,255,0.35)'; if (horiz) ctx.fillRect(px + 5, py + S / 2 - 2, 6, 1); else ctx.fillRect(px + S / 2 - 2, py + 5, 1, 6);
        } else { ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fillRect(px + (v * 7) % 24, py + 6, 6, 3); }
        break;
      }
      case T.DOOR_CLOSED: case T.DOOR_OPEN: case T.DOOR_LOCKED: {
        ctx.fillStyle = b ? b.floorColor : C.floor; ctx.fillRect(px, py, S, S);
        const isW = (q) => q === T.WALL || q === T.WINDOW;
        const horiz = isW(world.tile(tx - 1, ty)) || isW(world.tile(tx + 1, ty));
        if (t === T.DOOR_OPEN) {
          ctx.fillStyle = '#6b4a2a';
          if (horiz) ctx.fillRect(px, py, 5, S); else ctx.fillRect(px, py, S, 5);
        } else {
          ctx.fillStyle = t === T.DOOR_LOCKED ? '#5a2020' : '#7a5530';
          if (horiz) ctx.fillRect(px, py + S / 2 - 5, S, 10); else ctx.fillRect(px + S / 2 - 5, py, 10, S);
          ctx.fillStyle = t === T.DOOR_LOCKED ? '#ff4a3a' : '#c9a23a';
          if (horiz) ctx.fillRect(px + S - 9, py + S / 2 - 1, 3, 3); else ctx.fillRect(px + S / 2 - 1, py + S - 9, 3, 3);
        }
        break;
      }
      case T.WATER: ctx.fillStyle = C.water; ctx.fillRect(px, py, S, S); ctx.fillStyle = 'rgba(160,200,230,0.12)'; ctx.fillRect(px + 4 + v * 3, py + 10, 10, 2); ctx.fillRect(px + 14, py + 22 - v * 2, 8, 2); break;
      case T.RUBBLE: ctx.fillStyle = this._shade(C.ground, -0.1); ctx.fillRect(px, py, S, S); dots('#6d6a64', 6, 3); dots('#3a3836', 5, 2); break;
      case T.TOXIC: ctx.fillStyle = C.toxic; ctx.fillRect(px, py, S, S); dots('rgba(170,255,90,0.25)', 5, 2); break;
      case T.FENCE: {
        const base = this._baseUnder(world, tx, ty);
        this._drawTile(ctx, world, C, tx, ty, px, py, base === T.FENCE ? T.GROUND : base);
        ctx.strokeStyle = 'rgba(170,175,180,0.75)'; ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = -S; i < S; i += 6) { ctx.moveTo(px + i, py); ctx.lineTo(px + i + S, py + S); ctx.moveTo(px + i + S, py); ctx.lineTo(px + i, py + S); }
        ctx.stroke();
        ctx.fillStyle = '#5a5f63'; ctx.fillRect(px + S / 2 - 2, py + S / 2 - 2, 4, 4);
        break;
      }
      default: ctx.fillStyle = C.ground; ctx.fillRect(px, py, S, S);
    }
  }

  _buildChunk(world, map, cx, cy) {
    const scale = Math.min(this.dpr, this.settings.quality === 'high' ? 2 : 1);
    const size = TILE * RD_CHUNK;
    let entry = this.chunks.get(cx + ',' + cy);
    if (!entry) {
      entry = { canvas: this._canvas(size * scale, size * scale), scale, last: 0 };
      this.chunks.set(cx + ',' + cy, entry);
    }
    const c = entry.canvas;
    const ctx = c.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    const C = this._tileColors(world, map);
    for (let y = 0; y < RD_CHUNK; y++) for (let x = 0; x < RD_CHUNK; x++) {
      const tx = cx * RD_CHUNK + x, ty = cy * RD_CHUNK + y;
      this._drawTile(ctx, world, C, tx, ty, x * TILE, y * TILE);
    }
    // rails (industrial)
    for (const r of world.rails || []) {
      const x0 = r.tx * TILE - cx * size, y0 = r.ty * TILE - cy * size;
      if (y0 > size + TILE || y0 + TILE < -TILE || x0 > size || x0 + r.w * TILE < 0) continue;
      ctx.fillStyle = '#4a3828';
      for (let i = 0; i < r.w * 2; i++) ctx.fillRect(x0 + i * 16 + 2, y0 - 6, 6, TILE + 12);
      ctx.fillStyle = '#9aa0a6';
      ctx.fillRect(x0, y0 + 4, r.w * TILE, 3); ctx.fillRect(x0, y0 + TILE - 7, r.w * TILE, 3);
    }
    entry.built = true;
    world.dirtyChunks.delete(cx + ',' + cy);
  }

  _drawChunks(ctx, raid, vb) {
    const world = raid.world;
    if (this.cachedWorld !== world) { this.invalidateChunks(); this.cachedWorld = world; }
    const size = TILE * RD_CHUNK;
    const cx0 = Math.max(0, Math.floor(vb.x / size)), cy0 = Math.max(0, Math.floor(vb.y / size));
    const cx1 = Math.min(Math.ceil(world.w / RD_CHUNK) - 1, Math.floor((vb.x + vb.w) / size));
    const cy1 = Math.min(Math.ceil(world.h / RD_CHUNK) - 1, Math.floor((vb.y + vb.h) / size));
    let built = 0;
    const pal = (raid.map && raid.map.palette) || {};
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      const key = cx + ',' + cy;
      let e = this.chunks.get(key);
      const dirty = world.dirtyChunks.has(key);
      if ((!e || dirty) && built < 2) { this._buildChunk(world, raid.map, cx, cy); built++; e = this.chunks.get(key); }
      if (e && e.built) {
        e.last = this.frame;
        ctx.drawImage(e.canvas, cx * size, cy * size, size, size);
      } else {
        ctx.fillStyle = pal.ground || '#333';
        ctx.fillRect(cx * size, cy * size, size, size);
      }
      this.drawCalls++;
    }
    // LRU eviction
    if (this.chunks.size > 40) {
      const arr = Array.from(this.chunks.entries()).sort((a, b) => a[1].last - b[1].last);
      for (let i = 0; i < arr.length - 40; i++) this.chunks.delete(arr[i][0]);
    }
  }

  // ---------------- sprites ----------------
  _ensureSprites() {
    if (!this.lightSprite) {
      const c = this._canvas(256, 256), g = c.getContext('2d');
      const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
      gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.45, 'rgba(255,255,255,0.7)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
      this.lightSprite = c;
    }
    if (!this.coneSprite) {
      const R = 400, c = this._canvas(R, R), g = c.getContext('2d');
      const half = Math.PI / 6;
      const gr = g.createRadialGradient(0, R / 2, 10, 0, R / 2, R);
      gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.6, 'rgba(255,255,255,0.75)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr;
      g.beginPath(); g.moveTo(0, R / 2); g.arc(0, R / 2, R, -half, half); g.closePath(); g.fill();
      // soften the edges
      g.globalCompositeOperation = 'destination-out';
      g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 18;
      g.beginPath(); g.moveTo(0, R / 2); g.lineTo(Math.cos(-half) * R, R / 2 + Math.sin(-half) * R); g.moveTo(0, R / 2); g.lineTo(Math.cos(half) * R, R / 2 + Math.sin(half) * R); g.stroke();
      this.coneSprite = c;
    }
    if (!this.fogSprite) {
      const c = this._canvas(512, 512), g = c.getContext('2d');
      for (let i = 0; i < 26; i++) {
        const x = Math.random() * 512, y = Math.random() * 512, r = 60 + Math.random() * 120;
        const gr = g.createRadialGradient(x, y, 0, x, y, r);
        gr.addColorStop(0, 'rgba(150,160,170,0.16)'); gr.addColorStop(1, 'rgba(150,160,170,0)');
        g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
      }
      this.fogSprite = c;
    }
  }

  _inView(vb, x, y, r = 64) { return x > vb.x - r && y > vb.y - r && x < vb.x + vb.w + r && y < vb.y + vb.h + r; }

  // ---------------- main render ----------------
  render(raid, dt) {
    const ctx = this.ctx;
    if (!ctx) return;
    this.frame++;
    this.t += dt || 0.016;
    this.drawCalls = 0;
    if (!raid || !raid.world) { this.renderMenuBackground(this.t); return; }
    const cam = this.game.camera;
    const world = raid.world, p = raid.player;
    const map = raid.map || {};
    const pal = map.palette || {};
    const t = this.t;
    this._ensureSprites();
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.fillStyle = '#07090b';
    ctx.fillRect(0, 0, this.w, this.h);
    ctx.save();
    ctx.translate(this.w / 2 + cam.shakeX, this.h / 2 + cam.shakeY);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-cam.x, -cam.y);
    const vb = cam.viewBounds();
    // 1. tiles
    this._drawChunks(ctx, raid, vb);
    // toxic glow (dynamic)
    const tx0 = Math.max(0, Math.floor(vb.x / TILE)), ty0 = Math.max(0, Math.floor(vb.y / TILE));
    const tx1 = Math.min(world.w - 1, Math.ceil((vb.x + vb.w) / TILE)), ty1 = Math.min(world.h - 1, Math.ceil((vb.y + vb.h) / TILE));
    const glow = 0.12 + 0.08 * Math.sin(t * 2.5);
    ctx.fillStyle = 'rgba(140,255,70,' + glow.toFixed(3) + ')';
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) if (world.tiles[ty * world.w + tx] === T.TOXIC) ctx.fillRect(tx * TILE, ty * TILE, TILE, TILE);
    // 2. decals, extraction pads, loot, containers, props
    for (const d of raid.fx.decals) {
      if (!this._inView(vb, d.x, d.y, d.r)) continue;
      ctx.globalAlpha = Math.max(0, d.alpha);
      ctx.fillStyle = d.color;
      ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r * (0.6 + d.seed * 0.4), d.rot, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    this._drawExtractions(ctx, raid, vb, t);
    this._drawPois(ctx, raid, vb, t);
    for (const c of world.containers) if (this._inView(vb, c.x, c.y)) rdDrawContainer(ctx, c, t);
    for (const fl of world.floorLoot) if (this._inView(vb, fl.x, fl.y)) rdDrawFloorLoot(ctx, fl, t);
    for (const pr of world.props) {
      const px = (pr.tx + pr.w / 2) * TILE, py = (pr.ty + pr.h / 2) * TILE;
      if (!this._inView(vb, px, py, Math.max(pr.w, pr.h) * TILE)) continue;
      if (pr.type === 'generator') pr.running = !!raid.flags.generatorOn;
      rdDrawProp(ctx, pr, pal);
    }
    // 3. hazards, grenades, zombies, player, projectiles, particles
    for (const h of raid.hazards) if (this._inView(vb, h.x, h.y, h.r)) rdDrawHazard(ctx, h, t);
    for (const z of raid.zombies.zombies) if (z.dead && this._inView(vb, z.x, z.y)) rdDrawZombie(ctx, z, raid, t);
    for (const z of raid.zombies.zombies) if (!z.dead && this._inView(vb, z.x, z.y, 80)) rdDrawZombie(ctx, z, raid, t);
    if (p && !p.dead) rdDrawPlayer(ctx, p, raid, t);
    for (const g of raid.grenades) rdDrawGrenade(ctx, g);
    for (const pr of raid.weapons.projectiles) if (this._inView(vb, pr.x, pr.y)) rdDrawProjectile(ctx, pr);
    for (const pa of raid.fx.particles) if (this._inView(vb, pa.x, pa.y, 20)) rdDrawParticle(ctx, pa);
    // 4. roofs
    const inside = p ? world.buildingAt(p.x, p.y) : null;
    this._drawRoofs(ctx, raid, vb, inside, cam.zoom);
    // coloured light glow (additive, under the darkness)
    this._drawGlows(ctx, raid, vb, t);
    // interaction ring
    if (p && p.interactTarget && !p.dead) {
      const it = p.interactTarget;
      ctx.strokeStyle = 'rgba(255,240,180,' + (0.5 + 0.3 * Math.sin(t * 6)).toFixed(3) + ')';
      ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.arc(it.x, it.y, it.kind === 'extraction' ? 30 : 20, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    // floating texts
    ctx.textAlign = 'center';
    for (const tx of raid.fx.texts) {
      ctx.globalAlpha = clamp(tx.life / tx.maxLife, 0, 1);
      ctx.font = 'bold 13px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillText(tx.text, tx.x + 1, tx.y + 1);
      ctx.fillStyle = tx.color; ctx.fillText(tx.text, tx.x, tx.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    // 5. fog (under the darkness so nights stay dark)
    if (pal.fog && this.settings.quality !== 'low') this._drawFog(ctx, pal.fog, t, cam);
    // 6. lighting
    this._drawLighting(ctx, raid, cam, vb, inside);
    // 7. screen effects
    this._drawScreenFx(ctx, raid, cam, t);
    this._drawArrows(ctx, raid, cam, t);
    if (this.settings.showFps) this._drawDebug(ctx, raid);
  }

  _drawExtractions(ctx, raid, vb, t) {
    for (const e of raid.extraction.points) {
      if (!this._inView(vb, e.x, e.y, 120)) continue;
      const active = e.active && e.state !== 'done';
      const col = active ? '89,255,156' : e.state === 'locked' ? '229,72,77' : '150,155,160';
      ctx.fillStyle = 'rgba(' + col + ',0.08)';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(' + col + ',0.85)'; ctx.lineWidth = 2;
      ctx.setLineDash([10, 8]); ctx.lineDashOffset = -t * 20;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      if (e.state === 'extracting' && e.duration) {
        ctx.strokeStyle = 'rgba(89,255,156,1)'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.radius - 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(e.progress / e.duration, 0, 1)); ctx.stroke();
      }
      ctx.font = 'bold 12px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(e.name, e.x + 1, e.y - e.radius - 7);
      ctx.fillStyle = 'rgba(' + col + ',1)'; ctx.fillText(e.name, e.x, e.y - e.radius - 8);
      if (!active && e.lockReason) { ctx.font = '11px "Segoe UI", system-ui, sans-serif'; ctx.fillStyle = 'rgba(220,220,220,0.85)'; ctx.fillText(e.lockReason, e.x, e.y - e.radius + 8); }
      // landing pad marking
      ctx.strokeStyle = 'rgba(' + col + ',0.35)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(e.x - 14, e.y - 14); ctx.lineTo(e.x + 14, e.y + 14); ctx.moveTo(e.x + 14, e.y - 14); ctx.lineTo(e.x - 14, e.y + 14); ctx.stroke();
    }
  }

  _missionTargets(raid) {
    // world positions for unfinished mission objectives with a known location
    const out = [];
    const w = raid.world;
    for (const st of raid.missionStates || []) {
      for (const o of [...st.objectives, ...st.optional]) {
        if (o.done) continue;
        const d = o.def;
        if (d.type === 'investigate') for (const poi of w.pois) { if (poi.type === d.target && !poi.used) out.push({ x: poi.x, y: poi.y, label: (MS_POI_NAMES[poi.type] || poi.type) }); }
        else if (d.type === 'generator') for (const poi of w.pois) { if (poi.type === 'generator' && !raid.flags.generatorOn) out.push({ x: poi.x, y: poi.y, label: 'Generator' }); }
        else if (d.type === 'kill_boss' && w.bossArena) out.push({ x: w.bossArena.x, y: w.bossArena.y, label: 'Boss' });
        else if (d.type === 'extract_at') { const e = w.extractions.find(x => x.id === d.target); if (e) out.push({ x: e.x, y: e.y, label: e.name }); }
        else if (d.type === 'retrieve') {
          const fl = w.floorLoot.find(f => f.inst && f.inst.id === d.target);
          if (fl) out.push({ x: fl.x, y: fl.y, label: (Items.def(d.target) || {}).name || 'Ziel' });
          else { const c = w.containers.find(c => (c.preset || []).some(i => i.id === d.target) || (Array.isArray(c.items) && c.items.some(i => i && i.id === d.target))); if (c) { const b = w.buildings.find(bb => bb.id === c.buildingId); out.push({ x: b ? (b.tx + b.w / 2) * TILE : c.x, y: b ? (b.ty + b.h / 2) * TILE : c.y, label: (Items.def(d.target) || {}).name || 'Ziel', area: true }); } }
        }
      }
    }
    return out;
  }

  _drawPois(ctx, raid, vb, t) {
    for (const m of this._missionTargets(raid)) {
      if (!this._inView(vb, m.x, m.y, 80)) continue;
      const r = m.area ? 90 : 26 + Math.sin(t * 3) * 3;
      ctx.strokeStyle = 'rgba(255,209,74,0.8)'; ctx.lineWidth = 2;
      ctx.setLineDash(m.area ? [6, 10] : []);
      ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,209,74,0.95)';
      ctx.beginPath(); ctx.moveTo(m.x, m.y - r - 4); ctx.lineTo(m.x - 6, m.y - r - 14); ctx.lineTo(m.x + 6, m.y - r - 14); ctx.closePath(); ctx.fill();
    }
  }

  _drawRoofs(ctx, raid, vb, inside, zoom) {
    const w = raid.world;
    const p = raid.player;
    for (const b of w.buildings) {
      const x = b.tx * TILE, y = b.ty * TILE, bw = b.w * TILE, bh = b.h * TILE;
      if (x > vb.x + vb.w || y > vb.y + vb.h || x + bw < vb.x || y + bh < vb.y) continue;
      if (b === inside) continue;
      // near the building the roof fades slightly so doors stay readable
      let alpha = 1;
      if (p) {
        const dx = Math.max(x - p.x, 0, p.x - (x + bw)), dy = Math.max(y - p.y, 0, p.y - (y + bh));
        const d = Math.hypot(dx, dy);
        if (d < 40) alpha = 0.82 + d / 40 * 0.18;
      }
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(x + 6, y + 8, bw, bh);
      ctx.fillStyle = b.roofColor;
      ctx.fillRect(x - 2, y - 4, bw + 4, bh + 4);
      ctx.fillStyle = this._shade(b.roofColor, -0.18);
      if (bw >= bh) { ctx.fillRect(x - 2, y - 4 + bh / 2, bw + 4, bh / 2 + 4); }
      else { ctx.fillRect(x - 2 + bw / 2, y - 4, bw / 2 + 4, bh + 4); }
      ctx.strokeStyle = this._shade(b.roofColor, -0.4); ctx.lineWidth = 2;
      ctx.strokeRect(x - 2, y - 4, bw + 4, bh + 4);
      ctx.strokeStyle = this._shade(b.roofColor, 0.15); ctx.lineWidth = 2;
      ctx.beginPath();
      if (bw >= bh) { ctx.moveTo(x + 4, y - 4 + bh / 2); ctx.lineTo(x + bw - 4, y - 4 + bh / 2); }
      else { ctx.moveTo(x - 2 + bw / 2, y + 2); ctx.lineTo(x - 2 + bw / 2, y + bh - 8); }
      ctx.stroke();
      // roof details: vents / AC units
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      if (b.w >= 8) ctx.fillRect(x + bw * 0.2, y + bh * 0.2, 14, 10);
      if (b.locked) { ctx.fillStyle = 'rgba(229,72,77,0.55)'; ctx.fillRect(x + bw / 2 - 18, y + bh / 2 - 18, 36, 36); }
      if (zoom >= 0.9 && b.w >= 8) {
        ctx.font = '600 11px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillText(b.name, x + bw / 2 + 1, y + bh / 2 + 5);
        ctx.fillStyle = 'rgba(235,235,225,0.7)'; ctx.fillText(b.name, x + bw / 2, y + bh / 2 + 4);
      }
    }
    ctx.globalAlpha = 1;
  }

  _visibleLights(raid, vb) {
    const w = raid.world;
    const out = [];
    const size = TILE * RD_CHUNK;
    if (w.lightBuckets) {
      const cx0 = Math.floor((vb.x - 200) / size), cy0 = Math.floor((vb.y - 200) / size);
      const cx1 = Math.floor((vb.x + vb.w + 200) / size), cy1 = Math.floor((vb.y + vb.h + 200) / size);
      for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
        const b = w.lightBuckets.get(cx + ',' + cy);
        if (b) for (const l of b) out.push(l);
      }
    } else out.push(...w.lights);
    const cxm = vb.x + vb.w / 2, cym = vb.y + vb.h / 2;
    if (out.length > 24) out.sort((a, b) => dist2(a.x, a.y, cxm, cym) - dist2(b.x, b.y, cxm, cym));
    return out.slice(0, 24);
  }

  _flicker(l) {
    if (!l.flicker) return 1;
    const s = Math.sin(this.t * 13 + l.x * 0.07) * Math.sin(this.t * 7.3 + l.y * 0.05);
    return s > 0.85 ? 0.25 : 0.85 + 0.15 * s;
  }

  _drawGlows(ctx, raid, vb, t) {
    if (raid.darkness < 0.2) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const sp = this.lightSprite;
    for (const l of this._visibleLights(raid, vb)) {
      if (l.indoor && !raid.flags.generatorOn && raid.map && raid.map.layout === 'campus') continue;
      const r = l.radius * 0.8;
      ctx.globalAlpha = 0.16 * this._flicker(l) * clamp(raid.darkness * 1.4, 0, 1);
      if (l.color) { ctx.fillStyle = l.color; }
      // tint by drawing the sprite then colouring via a filled circle (cheap: coloured circle with soft sprite alpha)
      const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, r);
      g.addColorStop(0, l.color || '#ffd79a'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(l.x, l.y, r, 0, Math.PI * 2); ctx.fill();
    }
    for (const h of raid.hazards) {
      if (h.kind !== 'fire') continue;
      ctx.globalAlpha = 0.35;
      ctx.drawImage(sp, h.x - h.r * 2, h.y - h.r * 2, h.r * 4, h.r * 4);
    }
    ctx.restore();
    void sp; void t;
  }

  _drawLighting(ctx, raid, cam, vb, inside) {
    const d = clamp(raid.darkness, 0, 0.92);
    const indoorDark = !!inside;
    if (d < 0.05 && !indoorDark) return;
    const q = this.settings.quality;
    const s = q === 'high' ? 0.5 : 0.33;
    const W = Math.ceil(this.w * s), H = Math.ceil(this.h * s);
    if (!this.overlay || this.overlay.width !== W || this.overlay.height !== H) this.overlay = this._canvas(W, H);
    const o = this.overlay.getContext('2d');
    o.setTransform(1, 0, 0, 1, 0, 0);
    o.globalCompositeOperation = 'source-over';
    o.clearRect(0, 0, W, H);
    const hr = raid.hour;
    const dusk = (hr >= 17 && hr < 20) || (hr >= 5 && hr < 8);
    o.fillStyle = dusk ? 'rgba(40,22,10,' + d.toFixed(3) + ')' : 'rgba(5,8,14,' + d.toFixed(3) + ')';
    o.fillRect(0, 0, W, H);
    // world transform for the overlay
    o.setTransform(s * cam.zoom, 0, 0, s * cam.zoom, s * (this.w / 2 + cam.shakeX - cam.x * cam.zoom), s * (this.h / 2 + cam.shakeY - cam.y * cam.zoom));
    // indoor darkness
    o.fillStyle = 'rgba(0,0,0,0.35)';
    for (const b of raid.world.buildings) {
      const x = b.tx * TILE, y = b.ty * TILE;
      if (x > vb.x + vb.w || y > vb.y + vb.h || x + b.w * TILE < vb.x || y + b.h * TILE < vb.y) continue;
      if (b !== inside) continue; // roofs already hide other interiors
      o.fillRect(x, y, b.w * TILE, b.h * TILE);
    }
    o.globalCompositeOperation = 'destination-out';
    const sp = this.lightSprite;
    const p = raid.player;
    const cut = (x, y, r, a) => { o.globalAlpha = clamp(a, 0, 1); o.drawImage(sp, x - r, y - r, r * 2, r * 2); };
    if (p && !p.dead) cut(p.x, p.y, 95, 0.55);
    for (const l of this._visibleLights(raid, vb)) {
      let a = this._flicker(l);
      if (l.indoor && raid.map && raid.map.layout === 'campus' && !raid.flags.generatorOn) a *= 0.3;
      cut(l.x, l.y, l.radius, a * 0.95);
    }
    for (const f of raid.fx.lightFlashes) cut(f.x, f.y, f.r, clamp(f.ttl * 8, 0, 1));
    for (const h of raid.hazards) if (h.kind === 'fire') cut(h.x, h.y, h.r * 2.2, 0.9);
    for (const e of raid.extraction.points) if (e.active && e.state !== 'done') cut(e.x, e.y, 120, 0.6);
    if (p && !p.dead && p.flashlightOn) {
      o.save();
      o.translate(p.x, p.y);
      o.rotate(p.angle);
      o.globalAlpha = 1;
      o.drawImage(this.coneSprite, 0, -200, 400, 400);
      o.drawImage(this.coneSprite, 0, -200, 400, 400);
      o.restore();
    }
    o.globalAlpha = 1;
    o.globalCompositeOperation = 'source-over';
    ctx.save();
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(this.overlay, 0, 0, this.w, this.h);
    ctx.restore();
  }

  _drawFog(ctx, fog, t, cam) {
    ctx.save();
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.globalAlpha = 0.22;
    const sp = this.fogSprite;
    const size = 900;
    for (let i = 0; i < 2; i++) {
      const ox = ((-cam.x * (0.3 + i * 0.1) + t * (8 + i * 5)) % size + size) % size - size;
      const oy = ((-cam.y * (0.3 + i * 0.1) + t * (3 + i * 2)) % size + size) % size - size;
      for (let x = ox; x < this.w; x += size) for (let y = oy; y < this.h; y += size) ctx.drawImage(sp, x, y, size, size);
    }
    ctx.globalCompositeOperation = 'source-atop';
    ctx.restore();
    void fog;
  }

  _drawScreenFx(ctx, raid, cam, t) {
    const se = raid.fx.screenEffects;
    const W = this.w, H = this.h;
    ctx.save();
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    const p = raid.player;
    // low hp pulse + damage vignette
    const low = p && !p.dead && p.hp < p.hpMax * 0.3 ? (0.25 + 0.15 * Math.sin(t * 5)) : 0;
    const dmg = Math.max(se.damage * 0.8, low);
    if (dmg > 0.01) {
      const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
      g.addColorStop(0, 'rgba(160,0,0,0)'); g.addColorStop(1, 'rgba(160,0,0,' + dmg.toFixed(3) + ')');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    // toxic tint
    if (p && p.toxic > 0) { ctx.fillStyle = 'rgba(90,200,40,' + (0.08 + 0.04 * Math.sin(t * 3)).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
    // hit direction arcs
    if (p) {
      const sp = cam.worldToScreen(p.x, p.y);
