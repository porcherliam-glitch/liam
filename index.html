<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0d10">
<title>DEAD ZONE: EXTRACTION</title>
<style>
/* DEAD ZONE: EXTRACTION — style.css (SPEC §24.2). Dark tactical look, responsive down to 800×360 landscape. */
:root {
  --bg: #0a0d10; --panel: #12181d; --panel2: #1a2229; --border: #2a3640; --text: #dfe6ec; --muted: #8a98a6;
  --accent: #7fb24a; --warn: #f0b429; --danger: #e5484d; --info: #4aa3df;
  --r-common: #9aa4ad; --r-uncommon: #4fbf5a; --r-rare: #3f9dff; --r-epic: #b86bff; --r-legendary: #ffb12b;
  --font: "Segoe UI", Roboto, system-ui, -apple-system, sans-serif; --mono: ui-monospace, Consolas, "SF Mono", monospace;
  --slot: 60px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; }
body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #07090b; touch-action: none; user-select: none; -webkit-user-select: none; cursor: none; }
.noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: 0.02em; }
p { margin: 6px 0; line-height: 1.45; }
kbd { font-family: var(--mono); background: var(--panel2); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a3640; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }

/* ---------- text helpers ---------- */
.muted { color: var(--muted); }
.small { font-size: 12px; }
.warn { color: var(--warn); }
.danger { color: var(--danger); }
.good { color: var(--accent); }
.toxic { color: #9be36a; }
.grow { flex: 1 1 auto; min-width: 0; }
.center { justify-content: center; }
.rarity-common { color: var(--r-common); } .rarity-uncommon { color: var(--r-uncommon); } .rarity-rare { color: var(--r-rare); }
.rarity-epic { color: var(--r-epic); } .rarity-legendary { color: var(--r-legendary); }
.stars { color: var(--warn); font-size: 12px; letter-spacing: 1px; }
.skull { color: #3a4550; font-size: 12px; } .skull.on { color: var(--danger); }

/* ---------- layout ---------- */
#ui { position: fixed; inset: 0; z-index: 20; overflow-y: auto; overflow-x: hidden; background: radial-gradient(ellipse at top, rgba(18,26,32,0.78), rgba(6,9,12,0.92)); -webkit-overflow-scrolling: touch; }
#ui.overlay { background: rgba(6, 9, 12, 0.74); }
.screen { max-width: 1200px; margin: 0 auto; padding: 16px 16px 40px; animation: fadein 0.15s ease-out; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.columns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; margin-top: 12px; }
.panel { background: linear-gradient(180deg, var(--panel), #0f1418); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; box-shadow: 0 4px 18px rgba(0,0,0,0.35); }
.panel-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: #b9c6cf; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.screen-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.screen-header .row { min-width: 0; }
.screen-title h2 { font-size: 22px; }
.header-stats { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--border); font-family: var(--mono); font-size: 13px; }
.chip.credits { color: var(--warn); border-color: rgba(240,180,41,0.4); }
.chip.warn { color: var(--warn); border-color: rgba(240,180,41,0.5); }

/* ---------- buttons ---------- */
.btn { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 9px 14px; cursor: pointer; transition: background 0.12s, border-color 0.12s, transform 0.06s; min-height: 38px; text-align: center; touch-action: manipulation; }
.btn:hover { background: #22303a; border-color: #3a4b58; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.btn:disabled, .btn[disabled] { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn-primary { background: linear-gradient(180deg, #6f9f3e, #557c2d); border-color: #86b955; color: #0b1006; font-weight: 700; }
.btn-primary:hover { background: linear-gradient(180deg, #7fb24a, #628f35); }
.btn-danger { background: linear-gradient(180deg, #8c2b2e, #6b1f22); border-color: #b2393d; color: #ffe9e9; }
.btn-danger:hover { background: linear-gradient(180deg, #a53337, #7c2427); }
.btn-small { padding: 5px 10px; min-height: 30px; font-size: 12px; }
.btn-big { font-size: 18px; padding: 14px 28px; min-height: 52px; letter-spacing: 0.04em; }

/* ---------- main menu ---------- */
.menu-main { min-height: calc(100vh - 60px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.title { font-size: clamp(36px, 7vw, 72px); font-weight: 900; letter-spacing: 0.08em; color: #e8ede5; text-shadow: 0 0 30px rgba(127,178,74,0.25), 0 3px 0 #000; line-height: 1; }
.title span { display: block; font-size: 0.42em; letter-spacing: 0.55em; color: var(--accent); margin-top: 8px; }
.tagline { color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; font-size: 13px; }
.menu-buttons { display: flex; flex-direction: column; gap: 10px; width: min(320px, 90vw); margin-top: 10px; }
.menu-buttons .btn { font-size: 16px; padding: 12px; }
.version { margin-top: 16px; font-size: 12px; }

/* ---------- base hub ---------- */
.base-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.base-title h2 { font-size: 24px; }
.base-stats { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.base-stat { display: flex; flex-direction: column; gap: 3px; min-width: 150px; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin: 16px 0; }
.card { display: grid; grid-template-columns: 48px 1fr; grid-template-rows: auto auto auto; gap: 2px 10px; text-align: left; padding: 14px; min-height: 92px; background: linear-gradient(160deg, #18212a, #10161b); }
.card:hover { border-color: var(--accent); background: linear-gradient(160deg, #1d2a33, #121a20); }
.card-icon { grid-row: 1 / span 3; font-size: 30px; display: flex; align-items: center; justify-content: center; color: var(--accent); background: rgba(127,178,74,0.08); border-radius: 8px; }
.card-title { font-weight: 700; font-size: 15px; }
.card-sub { font-size: 12px; }
.card-warn { font-size: 12px; }
.base-plan { justify-content: center; margin: 8px 0 16px; }
.base-foot { justify-content: center; }

/* ---------- bars ---------- */
.bar { position: relative; height: 10px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
.bar-fill { position: absolute; inset: 0; transform-origin: left center; background: var(--accent); transition: transform 0.08s linear; }
.bar-label { position: relative; z-index: 1; font-size: 10px; line-height: 10px; padding-left: 6px; color: #fff; text-shadow: 0 1px 2px #000; white-space: nowrap; }
.panel .bar, .col > .bar { height: 16px; margin: 4px 0; }
.panel .bar .bar-label, .col > .bar .bar-label { line-height: 16px; font-size: 11px; }
.bar-hp .bar-fill { background: linear-gradient(90deg, #a7262b, #e5484d); }
.bar-stam .bar-fill { background: linear-gradient(90deg, #b88a1c, #f0c14b); }
.bar-xp .bar-fill { background: linear-gradient(90deg, #3a7fc0, #4aa3df); }
.bar-weight .bar-fill { background: linear-gradient(90deg, #5e7f3a, #7fb24a); }
.bar-danger .bar-fill { background: linear-gradient(90deg, #a7262b, #e5484d); }
.bar-dur .bar-fill { background: linear-gradient(90deg, #6c8a3a, #9bc95a); }
.bar-food .bar-fill { background: linear-gradient(90deg, #8a5a22, #c9893a); }
.bar-water .bar-fill { background: linear-gradient(90deg, #26608a, #4aa3df); }

/* ---------- inventory grids ---------- */
.grid-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
.grid-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.grid-head .panel-title { margin: 0; }
.grid-info { font-family: var(--mono); font-size: 12px; margin-right: auto; }
.grid { display: grid; grid-template-columns: repeat(var(--cols, 6), var(--slot)); gap: 4px; }
.slot { position: relative; width: var(--slot); height: var(--slot); background: linear-gradient(180deg, #1b242b, #141b20); border: 1px solid #26323b; border-radius: 5px; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; }
.slot:hover { border-color: #3d4e5a; }
.slot.filled { background: linear-gradient(180deg, #212c35, #182027); }
.slot.rarity-common { border-color: rgba(154,164,173,0.45); } .slot.rarity-uncommon { border-color: rgba(79,191,90,0.7); }
.slot.rarity-rare { border-color: rgba(63,157,255,0.8); box-shadow: inset 0 0 10px rgba(63,157,255,0.15); }
.slot.rarity-epic { border-color: rgba(184,107,255,0.85); box-shadow: inset 0 0 12px rgba(184,107,255,0.2); }
.slot.rarity-legendary { border-color: rgba(255,177,43,0.9); box-shadow: inset 0 0 14px rgba(255,177,43,0.25); }
.slot.sel { outline: 2px solid #fff; outline-offset: -2px; background: linear-gradient(180deg, #2b3a45, #1f2a32); }
.slot.drag-over { outline: 2px dashed var(--accent); outline-offset: -3px; }
.slot.hl { box-shadow: inset 0 0 0 2px var(--warn); }
.slot-glyph { font-size: 20px; line-height: 1; color: #c9d2d8; }
.slot-name { font-size: 9px; line-height: 1.1; text-align: center; color: #cfd8de; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.slot .count { position: absolute; right: 3px; bottom: 2px; font-family: var(--mono); font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000; }
.slot .mag { position: absolute; left: 3px; top: 2px; font-family: var(--mono); font-size: 9px; color: #f0d28a; }
.slot .found { position: absolute; right: 3px; top: 1px; font-size: 8px; color: var(--warn); }
.slot .dur { position: absolute; left: 3px; right: 3px; bottom: 2px; height: 3px; background: rgba(0,0,0,0.6); border-radius: 2px; overflow: hidden; }
.slot .dur span { position: absolute; inset: 0; transform-origin: left; background: #8fcf5a; }
.slot .dur span.low { background: var(--danger); }
.cat-weapon { color: #e6e6e6; } .cat-ammo { color: #d4b34a; } .cat-medical { color: #ff6b6f; } .cat-food { color: #d79a4a; } .cat-water { color: #5ab3ef; }
.cat-material { color: #b5a588; } .cat-electronics { color: #5ad1c8; } .cat-tool { color: #d48a4a; } .cat-armor { color: #94b0bd; } .cat-backpack { color: #b09a68; }
.cat-key { color: #ffd34a; } .cat-mission { color: #ffb12b; } .cat-collectible { color: #d08bff; } .cat-grenade { color: #8fca55; }
.equip-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
.equip-grid { display: grid; grid-template-columns: repeat(4, calc(var(--slot) * 1.25)); gap: 6px; }
.equip-slot { width: calc(var(--slot) * 1.25); height: calc(var(--slot) * 1.15); padding-top: 12px; }
.equip-slot .mag { top: auto; bottom: 7px; }
.equip-label { position: absolute; top: 2px; left: 4px; font-size: 8px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.drag-ghost { position: fixed; left: 0; top: 0; z-index: 45; pointer-events: none; opacity: 0.9; transform: translate(-100px,-100px); }
.loot-grid .grid { --slot: 72px; }

/* ---------- tooltip / context menu / detail ---------- */
.tooltip { position: fixed; z-index: 40; width: 260px; background: rgba(12,16,20,0.97); border: 1px solid #3a4b58; border-radius: 8px; padding: 10px 12px; pointer-events: none; box-shadow: 0 8px 30px rgba(0,0,0,0.6); font-size: 12px; }
.tt-name, .detail-name { font-weight: 700; font-size: 15px; }
.tt-sub { margin-bottom: 6px; }
.tt-row { display: flex; justify-content: space-between; font-family: var(--mono); }
.tt-dur { height: 4px; background: rgba(0,0,0,0.6); border-radius: 2px; margin: 4px 0; overflow: hidden; position: relative; }
.tt-dur span { position: absolute; inset: 0; transform-origin: left; background: #8fcf5a; }
.tt-stats { margin: 6px 0; padding-left: 16px; color: #c4cfd6; }
.tt-stats li { margin: 1px 0; }
.tt-desc { color: var(--muted); font-style: italic; }
.tt-found { color: var(--warn); margin-top: 4px; font-size: 11px; }
.ctxmenu { position: fixed; z-index: 41; min-width: 190px; background: rgba(14,19,24,0.98); border: 1px solid #3a4b58; border-radius: 8px; padding: 4px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
.ctx-item { text-align: left; border: none; background: transparent; padding: 8px 10px; min-height: 34px; }
.ctx-item:hover { background: #22303a; }
.detail { min-height: 90px; }
.action-bar { margin-top: 4px; }
.warnings .warn { padding: 2px 0; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; gap: 4px; }
.list-item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); border-radius: 6px; }
.list-item.locked { opacity: 0.5; }
.upgrade-card .cost { font-size: 12px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 10px 0; }
.tab { border-radius: 6px 6px 0 0; border-bottom: 2px solid transparent; background: transparent; }
.tab.active { border-bottom-color: var(--accent); background: var(--panel2); color: #fff; }
.mission-card .mission-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.mission-card.locked { opacity: 0.6; }
.objectives { margin: 6px 0; padding-left: 4px; list-style: none; }
.objectives li { margin: 3px 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.objectives li.done { color: var(--accent); }
.objectives li.optional { color: #c4cfd6; }
.reward { margin: 4px 0; }
.fail { margin: 4px 0 8px; }
.trader-list { max-height: 62vh; overflow-y: auto; padding-right: 4px; }
.map-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.map-card { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; text-align: left; min-height: 100px; background-size: cover; }
.map-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.map-card.locked { opacity: 0.55; }
.map-name { font-weight: 700; font-size: 15px; }
.map-city { background: linear-gradient(135deg, #2a2420, #15181b); } .map-industrial { background: linear-gradient(135deg, #2b2416, #141613); }
.map-military { background: linear-gradient(135deg, #252b1c, #12150f); } .map-research { background: linear-gradient(135deg, #1a2430, #0f141a); }
.seed-input { font: inherit; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; width: 160px; }
.stats-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.achievement { opacity: 0.55; }
.achievement.got { opacity: 1; border-color: rgba(240,180,41,0.4); }
.setting-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04); min-height: 40px; }
.setting-row > span:first-child { min-width: 150px; }
.setting-row input[type=range] { flex: 1; accent-color: var(--accent); }
.setting-row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
select { font: inherit; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
textarea { font-family: var(--mono); font-size: 11px; width: 100%; min-height: 70px; background: #0c1014; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin: 6px 0; resize: vertical; }
.item-list { display: flex; flex-wrap: wrap; gap: 4px; }
.item-chip { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--border); }
.result-head { text-align: center; padding: 22px 12px; border-radius: 10px; margin-bottom: 4px; }
.result-head h1 { font-size: clamp(26px, 5vw, 42px); letter-spacing: 0.06em; }
.good-bg { background: linear-gradient(180deg, rgba(127,178,74,0.25), rgba(127,178,74,0.04)); border: 1px solid rgba(127,178,74,0.4); }
.danger-bg { background: linear-gradient(180deg, rgba(229,72,77,0.28), rgba(229,72,77,0.04)); border: 1px solid rgba(229,72,77,0.45); }
.pause-box { max-width: 420px; margin: 10vh auto 0; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.pause-box .menu-buttons { width: 100%; }
.map-layout { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.fullmap { width: 100%; aspect-ratio: 1 / 1; max-height: 78vh; background: #050607; border: 1px solid var(--border); border-radius: 8px; display: block; }
.legend > div { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
.lg { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.lg-player { background: #fff; border-radius: 50%; } .lg-ex-on { background: #59ff9c; } .lg-ex-off { background: #8a8f94; }
.lg-mission { background: #ffd14a; border-radius: 50%; } .lg-building { background: #8a847a; } .lg-road { background: #24272a; border: 1px solid #444; }

/* ---------- toasts / modal / errors ---------- */
#toasts { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(520px, 92vw); }
.toast { pointer-events: none; background: rgba(14,19,24,0.95); border: 1px solid var(--border); border-left: 4px solid var(--info); padding: 8px 14px; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); font-size: 13px; animation: toastin 0.18s ease-out; display: flex; gap: 8px; }
.toast-success { border-left-color: var(--accent); } .toast-warning { border-left-color: var(--warn); } .toast-danger { border-left-color: var(--danger); }
.toast-count { color: var(--muted); font-family: var(--mono); }
.toast.out { opacity: 0; transform: translateY(-6px); transition: all 0.25s; }
@keyframes toastin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
#modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-box { width: min(440px, 100%); }
.modal-text { font-size: 15px; margin-bottom: 12px; }
.modal-buttons { justify-content: flex-end; margin-top: 10px; }
.range { flex: 1; accent-color: var(--accent); }
.num { width: 80px; font: inherit; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px; }
#errbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; background: #5a1518; color: #fff; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; gap: 8px; }
#errbar button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); border-radius: 4px; cursor: pointer; padding: 2px 8px; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; font-size: 13px; text-shadow: 0 1px 2px rgba(0,0,0,0.9); }
#hud.low-hp::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 80px rgba(200,0,0,0.35); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
.hud-tl { position: absolute; left: 12px; top: 12px; width: 260px; display: flex; flex-direction: column; gap: 5px; }
.hud-bars { background: rgba(8,11,14,0.55); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
.hud-bars .bar-hp { height: 16px; } .hud-bars .bar-hp .bar-label { line-height: 16px; font-size: 11px; font-family: var(--mono); }
.hud-bars .bar-stam { height: 6px; }
.hud-survival { display: flex; gap: 10px; font-family: var(--mono); font-size: 12px; }

<script>
(() => {
'use strict';

// ===== 00_util.js =====
// 00_util.js — constants, RNG, math helpers, EventBus, Log, rarity/category tables.
// Public API: TILE, FIXED_DT, GAME_VERSION, SAVE_VERSION, RNG, hashString, clamp, lerp, dist, dist2,
// angleTo, normAngle, angleDiff, lerpAngle, deepClone, formatTime, formatCredits, formatWeight,
// circleRectOverlap, aabbOverlap, Uid, EventBus, Log, RARITY, CATEGORY_NAMES.
// Dependencies: none.

const TILE = 32;
const FIXED_DT = 1 / 60;
const GAME_VERSION = '1.0.0';
const SAVE_VERSION = 1;

function hashString(str) {
  // FNV-1a 32 bit
  let h = 0x811c9dc5;
  const s = String(str);
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

class RNG {
  constructor(seed) {
    let s;
    if (typeof seed === 'number' && Number.isFinite(seed)) s = seed >>> 0;
    else s = hashString(seed === undefined || seed === null ? 'seed' : String(seed));
    this._seed = s;
    // sfc32 state from the seed via splitmix-ish scrambling
    let a = s ^ 0x9e3779b9, b = (s * 0x85ebca6b) >>> 0, c = (s * 0xc2b2ae35) >>> 0, d = s | 1;
    this.a = a >>> 0; this.b = b >>> 0; this.c = c >>> 0; this.d = d >>> 0;
    for (let i = 0; i < 12; i++) this.next();
  }
  get seed() { return this._seed; }
  next() {
    let a = this.a, b = this.b, c = this.c, d = this.d;
    const t = (((a + b) | 0) + d) | 0;
    d = (d + 1) | 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11);
    c = (c + t) | 0;
    this.a = a >>> 0; this.b = b >>> 0; this.c = c >>> 0; this.d = d >>> 0;
    return (t >>> 0) / 4294967296;
  }
  float(min, max) { return min + (max - min) * this.next(); }
  int(min, max) { return Math.floor(this.next() * (max - min + 1)) + min; }
  chance(p) { return this.next() < p; }
  pick(arr) { return arr && arr.length ? arr[Math.floor(this.next() * arr.length)] : undefined; }
  weighted(arr, weightKey = 'w') {
    if (!arr || !arr.length) return undefined;
    let total = 0;
    for (const e of arr) { const w = Number(e[weightKey]) || 0; if (w > 0) total += w; }
    if (total <= 0) return undefined;
    let r = this.next() * total;
    for (const e of arr) {
      const w = Number(e[weightKey]) || 0;
      if (w <= 0) continue;
      r -= w;
      if (r < 0) return e;
    }
    for (let i = arr.length - 1; i >= 0; i--) if ((Number(arr[i][weightKey]) || 0) > 0) return arr[i];
    return undefined;
  }
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  fork(label) {
    const v = Math.floor(this.next() * 4294967296) >>> 0;
    return new RNG((v ^ hashString(label === undefined ? 'fork' : label)) >>> 0);
  }
}

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function dist(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return Math.sqrt(dx * dx + dy * dy); }
function dist2(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; }
function angleTo(ax, ay, bx, by) { return Math.atan2(by - ay, bx - ax); }
function normAngle(a) {
  a = a % (Math.PI * 2);
  if (a <= -Math.PI) a += Math.PI * 2;
  else if (a > Math.PI) a -= Math.PI * 2;
  return a;
}
function angleDiff(a, b) { return normAngle(b - a); }
function lerpAngle(a, b, t) { return a + angleDiff(a, b) * t; }
function deepClone(obj) { return obj === undefined ? undefined : JSON.parse(JSON.stringify(obj)); }
function formatTime(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? '0' + m : String(m)) + ':' + (s < 10 ? '0' + s : String(s));
}
function formatCredits(n) {
  n = Math.round(Number(n) || 0);
  const neg = n < 0; let s = String(Math.abs(n));
  let out = '';
  while (s.length > 3) { out = '.' + s.slice(-3) + out; s = s.slice(0, -3); }
  return (neg ? '-' : '') + s + out + ' CR';
}
function formatWeight(kg) {
  const v = Math.round((Number(kg) || 0) * 10) / 10;
  return String(v.toFixed(1)).replace('.', ',') + ' kg';
}
function circleRectOverlap(cx, cy, r, rx, ry, rw, rh) {
  const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}
function aabbOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

const Uid = {
  _counter: 0,
  next() {
    this._counter++;
    return 'u' + Date.now().toString(36) + '_' + this._counter.toString(36);
  },
};

class EventBus {
  constructor() { this._map = new Map(); }
  on(name, fn) {
    if (!this._map.has(name)) this._map.set(name, []);
    this._map.get(name).push(fn);
    return () => this.off(name, fn);
  }
  off(name, fn) {
    const list = this._map.get(name);
    if (!list) return;
    const i = list.indexOf(fn);
    if (i >= 0) list.splice(i, 1);
  }
  once(name, fn) {
    const wrap = (data) => { this.off(name, wrap); fn(data); };
    return this.on(name, wrap);
  }
  emit(name, data) {
    const list = this._map.get(name);
    if (!list || !list.length) return;
    for (const fn of list.slice()) {
      try { fn(data); } catch (e) { Log.error('EventBus listener for "' + name + '" failed:', e && e.message ? e.message : e); }
    }
  }
  clear() { this._map.clear(); }
}

const Log = {
  entries: [],
  errors: [],
  _push(level, args) {
    const msg = args.map(a => (typeof a === 'string' ? a : (a && a.message) ? a.message : (() => { try { return JSON.stringify(a); } catch (e) { return String(a); } })())).join(' ');
    this.entries.push({ level, msg, time: Date.now() });
    if (this.entries.length > 300) this.entries.splice(0, this.entries.length - 300);
    return msg;
  },
  info(...a) { this._push('info', a); if (typeof console !== 'undefined') console.log('[DZ]', ...a); },
  warn(...a) { this._push('warn', a); if (typeof console !== 'undefined') console.warn('[DZ]', ...a); },

const ITEM_LIST = Object.values(ITEMS);

function itemsByCat(cat) {
  const out = [];
  for (const def of ITEM_LIST) if (def.cat === cat) out.push(def);
  return out;
}

// Public API:
//   ZOMBIE_TYPES   { walker, runner, brute, screamer, toxic, armored, stalker, boss }
//   ZOMBIE_LIST    Object.values(ZOMBIE_TYPES)
// Dependencies: none at definition time (dropTable item ids refer to ITEMS in 01_data_items.js).
//
// Every type defines every walker key (hp, speed, damage, radius, size, attackRange, attackCooldown,
// windup, sightRange, hearingMult, xp, color, armor, lootChance, tier) plus `id`, `name`, `desc`,
// `dropTable` and its own specials from SPEC §3.
//
// Decisions where the SPEC is silent:
// - `bleedChance` (all types) is passed to player.takeDamage (SPEC §15 Attack); brute 0.5 as specified.
// - `armorArc` is 0 for every type except `armored` (frontal plate); `armor` is only meaningful
//   together with `armorArc > 0`.
// - `dropTable` entries use the LOOT_TABLES entry shape `{id|cat, w, count:[min,max]}`; never keys
//   or mission items. `dropRolls:[min,max]` = number of rolls when the lootChance roll succeeds
//   (default [1,1] when a system ignores it).
// - Boss ability numbers mirror SPEC §15 (slam every 6 s / 120 px / 45 dmg, charge every 9 s at
//   420 px/s for 0.9 s / 50 dmg, summon every 15 s 3 walkers) so systems can read them from data.

// ===== 04_data_meta.js =====
// 04_data_meta.js — missions, upgrades, recipes, trader stock, loot tables, XP and economy constants (SPEC §5).
// Public API:
//   MISSION_FAIL_TEXT, MISSIONS (24: city_01..research_06), MISSION_BY_ID
//   UPGRADES { stash, workshop, medbay, radio, defense, trader } (3 levels each), upgradeInfo(area, level)
//   RECIPES (33), TRADER_STOCK (56 lines), LOOT_TABLES (12 container types + floor + zombie)
//   xpForLevel(level), levelFromXp(xp), MAX_LEVEL, XP_REWARDS, ECONOMY,
//   SECURE_SLOTS_BASE, CARRY_BASE, STASH_SLOTS_BASE, START_CREDITS
// Dependencies: none at definition time (ids refer to ITEMS, ZOMBIE_TYPES, MAPS of files 01–03).
//
// Decisions where the SPEC is silent:
// - Objective ids are 'o1', 'o2', ... for required and 'x1', 'x2', ... for optional objectives
//   (unique within a mission). Objectives with a single target event (find_key, kill_boss,
//   retrieve, investigate, generator, extract_at) use count 1.
// - Mission requiresLevel may be lower than the map's unlockLevel (maps unlocked early via the
//   radio upgrade stay playable); availability still requires the map to be unlocked.
// - Repeatable missions: city_06, industrial_02, military_04.
// - Every mission has its own failText (German).
// - UPGRADES entries additionally carry `effect` with PER-LEVEL increments that apply cumulatively
//   (stashSlots, repairDiscount, recipeTier, hpMax, freeHealing, missionSlots, showWindows,
//   secureSlots, carryKg, insurance, sellBonus, buyDiscount). They mirror the SPEC formulas
//   (§19: secureSlots = base + level, carry +5 kg/level, hpMax +10/level, repair −15 %/level, free
//   healing at medbay 3, mission slots 1 + radio level, trader bonuses from ECONOMY).
// - Recipe station 'armory' (ammo, grenades, blades) is gated by the WORKSHOP upgrade level
//   (the SPEC lists "ammo crafting" under workshop); 'workshop' recipes use the workshop level,
//   'medbay' recipes the medbay level. Recipe output/input value ratios stay below ~2 so that
//   buy → craft → sell can never generate credits.
// - TRADER_STOCK: `stock:[min,max]` is the unit count (ammo: rounds); `basePrice` is omitted
//   (price = ProfileManager.buyPrice(def)). The first line is ammo_9mm.
// - LOOT_TABLES entries: `count` for ammo stays within 5–30 rounds; `cat` entries are resolved by
//   LootSystem.pickByCategory (rarity-weighted by tier). No key or mission items appear anywhere.
// - xpForLevel is not clamped at MAX_LEVEL (so "xp for next level" stays defined at max level);
//   levelFromXp is clamped to 1..MAX_LEVEL.

function upgradeInfo(area, level) {
  const list = UPGRADES[area];
  if (!Array.isArray(list)) return null;
  const l = Math.floor(Number(level));
  if (!Number.isFinite(l) || l < 1 || l > list.length) return null;
  return list[l - 1] || null;
}

// ───────────────────────────── XP and economy ─────────────────────────────
const MAX_LEVEL = 30;

function xpForLevel(level) {
  let l = Math.floor(Number(level));
  if (!Number.isFinite(l) || l < 1) l = 1;
  const n = l - 1;
  return 60 * n * n + 140 * n;
}

function levelFromXp(xp) {
  const v = Number(xp);
  if (!Number.isFinite(v) || v <= 0) return 1;
  let level = 1;
  for (let i = 0; i < MAX_LEVEL && level < MAX_LEVEL; i++) {
    if (v >= xpForLevel(level + 1)) level++;
    else break;
  }
  return level;
}

// ===== 05_audio.js =====
// 05_audio.js — AudioManager: fully synthesized Web Audio sound effects and map ambience.
//
// Public API:
//   const AUDIO_DEFS                   sound definitions (pure data) keyed by sound name (§6)
//   function audioPlayDef(def, opts)   generic layer synthesizer used for every sound
//                                      opts {ctx, out, noise, pitch=1, time, rng} → {end, sources} | null
//   class AudioManager(game)
//     unlock() → boolean               creates/resumes the AudioContext (user gesture)
//     get ready → boolean
//     setVolumes({master, sfx, music}) 0..1 each (partial objects allowed)
//     setListener(x, y)                world position used for attenuation and stereo pan
//     play(name, {x, y, volume=1, pitch=1}) → boolean   spatial when x/y given (falloff 900 px)
//     startAmbient(mapId)              per-map drone + wind loop (city/industrial/military/research), idempotent
//     stopAmbient()
//     update(dt)                       ambient gusts/accents, heartbeat when raid.player.hp < 25
//
// Layer schema (AUDIO_DEFS[name] = { layers:[...], rateLimitMs?, vary? }):
//   { type:'sine'|'square'|'saw'|'tri'|'noise', freq, freqEnd?, glide?, attack, hold?, decay, gain,
//     filter?:{type, freq, q, freqEnd?}, delay?, lfo?:{freq, depth, type?} (osc pitch / noise filter),
//     trem?:{freq, depth} (amplitude 0..1), detune?, drive? (waveshaper), rate? (noise playback rate) }
//   rateLimitMs: minimum gap between two plays of the same name (default 25 ms, shot_* = 0).
//   vary: random pitch spread (±fraction) per play.
//
// Routing: voice → [distance lowpass] → StereoPanner → sfx bus → master → compressor → destination;
//          ambience → ambient bus → music bus → master.
// Rules (§0.2 d): nothing touches window/AudioContext at definition time or in the constructor
// (except binding unlock to window gestures); every method is a no-op while !ready and never throws.
// Dependencies: 00_util.js (clamp, lerp, dist, RNG, Log).

function au_num(v, d) {
  const n = typeof v === 'number' ? v : Number(v);
  return Number.isFinite(n) ? n : d;
}

function au_warn(...args) {
  try { if (typeof Log !== 'undefined' && Log && typeof Log.warn === 'function') Log.warn(...args); } catch (e) { /* ignore */ }
}

// tanh waveshaper curve, cached per (rounded) drive amount.
function au_shaperCurve(amount) {
  const k = Math.round(clamp(au_num(amount, 1), 0.5, 20) * 4) / 4;
  const key = String(k);
  if (AU_CURVES[key]) return AU_CURVES[key];
  const n = 1024;
  const c = new Float32Array(n);
  const norm = Math.tanh(k) || 1;
  for (let i = 0; i < n; i++) {
    const x = (i * 2) / (n - 1) - 1;
    c[i] = Math.tanh(k * x) / norm;
  }
  AU_CURVES[key] = c;
  return c;
}

// Connects an LFO (oscillator → depth gain → param). tEnd null = runs until stopped externally.
function au_lfo(ctx, spec, param, t0, tEnd, sources, scale) {
  if (!spec || !param) return;
  const depth = au_num(spec.depth, 0) * au_num(scale, 1);
  if (depth === 0) return;
  const o = ctx.createOscillator();
  o.type = AU_WAVES[spec.type] || 'sine';
  o.frequency.setValueAtTime(Math.max(0.01, au_num(spec.freq, 1)), t0);
  const g = ctx.createGain();
  g.gain.setValueAtTime(depth, t0);
  o.connect(g);
  g.connect(param);
  o.start(t0);
  if (tEnd !== null && tEnd !== undefined) o.stop(tEnd + 0.05);
  sources.push(o);
}

// Builds and schedules one layer; returns its end time (or t0 when skipped).
function au_playLayer(ctx, out, L, now, pitch, noise, rng, sources) {
  if (!L || typeof L !== 'object') return now;
  const peak = Math.max(0, au_num(L.gain, 0.3));
  if (peak <= 0) return now;
  const t0 = now + Math.max(0, au_num(L.delay, 0));
  const atk = Math.max(0.001, au_num(L.attack, 0.005));
  const hold = Math.max(0, au_num(L.hold, 0));
  const dec = Math.max(0.01, au_num(L.decay, 0.1));
  const tEnd = t0 + atk + hold + dec;
  const isNoise = L.type === 'noise';
  let src;
  if (isNoise) {
    if (!noise) return now;
    src = ctx.createBufferSource();
    src.buffer = noise;
    src.loop = true;
    src.playbackRate.setValueAtTime(clamp(au_num(L.rate, 1) * pitch, 0.05, 8), t0);
  } else {
    src = ctx.createOscillator();
    src.type = AU_WAVES[L.type] || 'sine';
    const f0 = clamp(au_num(L.freq, 440) * pitch, 1, 20000);
    src.frequency.setValueAtTime(f0, t0);
    const fe = au_num(L.freqEnd, 0);
    if (fe > 0) {
      const glide = Math.max(0.005, au_num(L.glide, atk + hold + dec));
      src.frequency.exponentialRampToValueAtTime(clamp(fe * pitch, 1, 20000), t0 + glide);
    }
    if (L.detune) src.detune.setValueAtTime(au_num(L.detune, 0), t0);
    if (L.lfo) au_lfo(ctx, L.lfo, src.frequency, t0, tEnd, sources, pitch);
  }
  let node = src;
  if (L.filter && typeof L.filter === 'object') {
    const F = L.filter;
    const f = ctx.createBiquadFilter();
    f.type = F.type || 'lowpass';
    f.frequency.setValueAtTime(clamp(au_num(F.freq, 1000) * pitch, 20, 20000), t0);
    const ffe = au_num(F.freqEnd, 0);
    if (ffe > 0) f.frequency.exponentialRampToValueAtTime(clamp(ffe * pitch, 20, 20000), tEnd);
    f.Q.setValueAtTime(clamp(au_num(F.q, 1), 0.0001, 40), t0);
    if (isNoise && L.lfo) au_lfo(ctx, L.lfo, f.frequency, t0, tEnd, sources, pitch);
    node.connect(f);
    node = f;
  }
  if (au_num(L.drive, 0) > 0) {
    const ws = ctx.createWaveShaper();
    ws.curve = au_shaperCurve(L.drive);
    node.connect(ws);
    node = ws;
  }
  const env = ctx.createGain();
  env.gain.setValueAtTime(0, t0);
  env.gain.linearRampToValueAtTime(peak, t0 + atk);
  if (hold > 0) env.gain.setValueAtTime(peak, t0 + atk + hold);
  env.gain.exponentialRampToValueAtTime(0.0001, tEnd);
  node.connect(env);
  node = env;
  if (L.trem && typeof L.trem === 'object') {
    const d = clamp(au_num(L.trem.depth, 0), 0, 1);
    if (d > 0) {
      const tg = ctx.createGain();
      tg.gain.setValueAtTime(1 - d / 2, t0);
      au_lfo(ctx, { freq: L.trem.freq, depth: d / 2 }, tg.gain, t0, tEnd, sources, 1);
      node.connect(tg);
      node = tg;
    }
  }
  node.connect(out);
  if (isNoise) {
    const dur = au_num(noise.duration, AU_NOISE_SECONDS);
    const off = rng && typeof rng.next === 'function' ? rng.next() * Math.max(0, dur - 0.05) : 0;
    src.start(t0, off);
  } else {
    src.start(t0);
  }
  src.stop(tEnd + 0.05);
  sources.push(src);
  return tEnd;
}

// Generic synth: plays every layer of `def` into opts.out. Returns {end, sources} or null.
function audioPlayDef(def, opts) {
  const o = opts || {};
  const ctx = o.ctx;
  if (!def || !Array.isArray(def.layers) || !ctx || !o.out) return null;
  const now = au_num(o.time, au_num(ctx.currentTime, 0));
  const pitch = clamp(au_num(o.pitch, 1), 0.05, 8);
  const sources = [];
  let end = now;
  const n = Math.min(def.layers.length, 16);
  for (let i = 0; i < n; i++) {
    const e = au_playLayer(ctx, o.out, def.layers[i], now, pitch, o.noise || null, o.rng || null, sources);
    if (e > end) end = e;
  }
  return { end, sources };
}

class AudioManager {
  constructor(game) {
    this.au_failSeen = new Set();
    this.game = game || null;
    this.au_ctx = null;
    this.au_master = null;
    this.au_sfx = null;
    this.au_music = null;
    this.au_noise = null;
    this.au_vol = { master: 0.8, sfx: 1, music: 0.6 };
    this.au_lx = null;
    this.au_ly = null;
    this.au_voices = [];
    this.au_dying = [];
    this.au_last = new Map();
    this.au_unknown = new Set();
    this.au_amb = null;
    this.au_ambPending = null;
    this.au_hbTimer = 0;
    this.au_noCtxWarned = false;
    this.au_rng = null;
    try { this.au_rng = new RNG(0x0a0d10); } catch (e) { this.au_rng = null; }
    // Bind unlock once to user gestures (only touches window inside the constructor, never at definition time).
    this.au_onGesture = () => { this.unlock(); };
    try {
      if (typeof window !== 'undefined' && window && typeof window.addEventListener === 'function') {
        const evs = ['pointerdown', 'touchend', 'keydown'];
        for (let i = 0; i < evs.length; i++) window.addEventListener(evs[i], this.au_onGesture, { passive: true, capture: true });
      }
    } catch (e) { this.au_fail('constructor', e); }
  }

  get ready() {
    try { return !!this.au_ctx && this.au_ctx.state !== 'closed'; } catch (e) { return false; }
  }

  unlock() {
    try {
      if (this.au_ctx && this.au_ctx.state === 'closed') this.au_teardown();
      if (this.au_ctx) {
        this.au_resume();
        return true;
      }
      const w = typeof window !== 'undefined' ? window : null;
      const Ctor = w ? (w.AudioContext || w.webkitAudioContext) : undefined;
      if (typeof Ctor !== 'function') {
        if (!this.au_noCtxWarned) { this.au_noCtxWarned = true; au_warn('AudioManager: AudioContext unavailable, audio disabled'); }
        return false;
      }
      const ctx = new Ctor();
      try {
        this.au_build(ctx);
      } catch (e) {
        try { if (ctx.close) { const p = ctx.close(); if (p && p.catch) p.catch(() => {}); } } catch (e2) { /* ignore */ }
        this.au_master = this.au_sfx = this.au_music = this.au_noise = null;
        throw e;
      }
      this.au_ctx = ctx;
      this.au_resume();
      if (this.au_ambPending) {
        const id = this.au_ambPending;
        this.au_ambPending = null;
        this.au_startAmbientNow(id);
      }
      return true;
    } catch (e) {
      this.au_fail('unlock', e);
      return false;
    }
  }

  setVolumes(v) {
    try {
      if (!v || typeof v !== 'object') return;
      const keys = ['master', 'sfx', 'music'];
      for (let i = 0; i < keys.length; i++) {
        const k = keys[i];
        if (v[k] === undefined || v[k] === null) continue;
        const n = Number(v[k]);
        if (Number.isFinite(n)) this.au_vol[k] = clamp(n, 0, 1);
      }
      if (!this.ready) return; // values are cached and applied on unlock
      this.au_applyVolumes(false);
    } catch (e) { this.au_fail('setVolumes', e); }
  }

  setListener(x, y) {
    try {
      if (typeof x === 'number' && typeof y === 'number' && Number.isFinite(x) && Number.isFinite(y)) {
        this.au_lx = x;
        this.au_ly = y;
      }
    } catch (e) { this.au_fail('setListener', e); }
  }

  play(name, opts = {}) {
    if (!this.ready) return false;
    try {
      const def = typeof name === 'string' && Object.prototype.hasOwnProperty.call(AUDIO_DEFS, name) ? AUDIO_DEFS[name] : null;
      if (!def) {
        const key = String(name);
        if (!this.au_unknown.has(key) && this.au_unknown.size < 200) {
          this.au_unknown.add(key);
          au_warn('AudioManager: unknown sound "' + key + '"');
        }
        return false;
      }
      const o = opts && typeof opts === 'object' ? opts : {};
      const ctx = this.au_ctx;
      const now = au_num(ctx.currentTime, 0);
      // Rate limit identical sounds.
      const gapMs = def.rateLimitMs === undefined ? AU_MIN_GAP_MS : Math.max(0, au_num(def.rateLimitMs, AU_MIN_GAP_MS));
      if (gapMs > 0) {
        const last = this.au_last.get(name);
        if (last !== undefined && (now - last) * 1000 < gapMs && now >= last) return false;
      }
      let gain = clamp(au_num(o.volume, 1), 0, 2);
      if (gain <= 0) return false;
      let pan = null;
      let cutoff = 0;
      const sx = o.x, sy = o.y;
      if (typeof sx === 'number' && typeof sy === 'number' && Number.isFinite(sx) && Number.isFinite(sy) && this.au_lx !== null) {
        const d = dist(this.au_lx, this.au_ly, sx, sy);
        if (d >= AU_FALLOFF_PX) return false;
        const f = 1 - d / AU_FALLOFF_PX;
        gain *= f * f * (3 - 2 * f); // smoothstep falloff
        if (gain < 0.002) return false;
        pan = clamp((sx - this.au_lx) / (AU_FALLOFF_PX * 0.6), -1, 1) * 0.85;
        cutoff = 18000 * Math.pow(0.1, d / AU_FALLOFF_PX); // distant sounds get duller
      }
      let pitch = clamp(au_num(o.pitch, 1), 0.25, 4);
      const vary = au_num(def.vary, 0);
      if (vary > 0) pitch *= 1 + (this.au_rand() * 2 - 1) * vary;
      const ok = this.au_spawn(name, def, gain, pan, cutoff, pitch, this.au_sfx, now);
      if (ok) this.au_last.set(name, now);
      return ok;
    } catch (e) {
      this.au_fail('play', e);
      return false;
    }
  }

  startAmbient(mapId) {
    try {
      const id = typeof mapId === 'string' && mapId ? mapId : 'city';
      if (!this.ready) { this.au_ambPending = id; return; } // started on unlock
      if (this.au_amb && this.au_amb.mapId === id) return;
      this.au_startAmbientNow(id);
    } catch (e) { this.au_fail('startAmbient', e); }
  }

  stopAmbient() {
    try {
      this.au_ambPending = null;
      if (!this.ready) return;
      this.au_killAmbient(1.5);
    } catch (e) { this.au_fail('stopAmbient', e); }
  }

  update(dt) {
    if (!this.ready) return;
    try {
      const step = clamp(au_num(dt, 0), 0, 0.25);
      const now = au_num(this.au_ctx.currentTime, 0);
      this.au_prune(now);
      const g = this.game;
      const paused = !!(g && g.paused);
      // Heartbeat when HP is low.
      const p = g && g.raid ? g.raid.player : null;
      const hp = p ? Number(p.hp) : NaN;
      const inRaid = !(g && typeof g.state === 'string' && g.state !== 'raid');
      if (inRaid && !paused && Number.isFinite(hp) && hp > 0 && hp < 25) {
        this.au_hbTimer -= step;
        if (this.au_hbTimer <= 0) {
          const sev = clamp(1 - hp / 25, 0, 1);
          this.au_spawn('heartbeat', AU_HEARTBEAT, 0.45 + 0.55 * sev, null, 0, 1, this.au_sfx, now);
          this.au_hbTimer = lerp(1.15, 0.55, sev);
        }
      } else {
        this.au_hbTimer = 0;
      }
      // Ambient variation: wind gusts and distant accents.
      const a = this.au_amb;
      if (a) {
        a.gustT -= step;
        if (a.gustT <= 0) {
          a.gustT = this.au_range(a.flav.gustEvery, 9, 20);
          if (a.windGain) {
            const m = 1.4 + this.au_rand() * 0.9;
            const rise = 1.5 + this.au_rand() * 1.5;
            a.windGain.gain.setTargetAtTime(a.windBase * m, now, rise / 3);
            a.windGain.gain.setTargetAtTime(a.windBase, now + rise, 1.6);
          }
        }
        a.accentT -= step;
        if (a.accentT <= 0) {
          a.accentT = this.au_range(a.flav.accentEvery, 7, 16);
          const list = Array.isArray(a.flav.accents) ? a.flav.accents : [];
          if (list.length && !paused) {
            const def = list[Math.min(list.length - 1, Math.floor(this.au_rand() * list.length))];
            const vol = 0.45 + this.au_rand() * 0.45;
            const pan = (this.au_rand() * 2 - 1) * 0.9;
            const cutoff = 1800 + this.au_rand() * 3600;
            const pitch = 0.9 + this.au_rand() * 0.2;
            this.au_spawn('ambient_accent', def, vol, pan, cutoff, pitch, a.bus, now);
          }
        }
      }
    } catch (e) { this.au_fail('update', e); }
  }

  // ---------------------------------------------------------------- private helpers

  au_fail(where, e) {
    try {
      const msg = e && e.message ? e.message : String(e);
      const key = where + ':' + msg;
      if (this.au_failSeen.has(key) || this.au_failSeen.size > 64) return;
      this.au_failSeen.add(key);
      au_warn('AudioManager.' + where + ' failed:', msg);
    } catch (e2) { /* never throw */ }
  }

  au_rand() {
    try { if (this.au_rng) return this.au_rng.next(); } catch (e) { /* fall through */ }
    return 0.5;
  }

  au_range(r, lo, hi) {
    const a = Array.isArray(r) ? au_num(r[0], lo) : lo;
    const b = Array.isArray(r) ? au_num(r[1], hi) : hi;
    return Math.max(0.5, a + (b - a) * this.au_rand());
  }

  au_resume() {
    const ctx = this.au_ctx;
    if (ctx && ctx.state === 'suspended' && typeof ctx.resume === 'function') {
      const p = ctx.resume();
      if (p && typeof p.catch === 'function') p.catch((e) => this.au_fail('resume', e));
    }
  }

  au_build(ctx) {
    const now = au_num(ctx.currentTime, 0);
    this.au_master = ctx.createGain();
    this.au_sfx = ctx.createGain();
    this.au_music = ctx.createGain();
    this.au_sfx.connect(this.au_master);
    this.au_music.connect(this.au_master);
    let comp = null;
    if (typeof ctx.createDynamicsCompressor === 'function') {
      comp = ctx.createDynamicsCompressor();
      comp.threshold.setValueAtTime(-14, now);
      comp.knee.setValueAtTime(12, now);
      comp.ratio.setValueAtTime(4, now);
      comp.attack.setValueAtTime(0.003, now);
      comp.release.setValueAtTime(0.25, now);
      this.au_master.connect(comp);
      comp.connect(ctx.destination);
    } else {
      this.au_master.connect(ctx.destination);
    }
    // One shared white-noise buffer for every noise layer.
    const sr = au_num(ctx.sampleRate, 44100) > 0 ? au_num(ctx.sampleRate, 44100) : 44100;
    const len = Math.max(1, Math.floor(sr * AU_NOISE_SECONDS));
    const buf = ctx.createBuffer(1, len, sr);
    const data = buf.getChannelData(0);
    const rng = this.au_rng;
    for (let i = 0; i < len; i++) data[i] = (rng ? rng.next() : ((i * 7919) % 1000) / 1000) * 2 - 1;
    this.au_noise = buf;
    this.au_applyVolumes(true, ctx);
  }

  au_applyVolumes(immediate, ctxArg) {
    const ctx = ctxArg || this.au_ctx;
    if (!ctx || !this.au_master) return;
    const now = au_num(ctx.currentTime, 0);
    const pairs = [[this.au_master, this.au_vol.master], [this.au_sfx, this.au_vol.sfx], [this.au_music, this.au_vol.music]];
    for (let i = 0; i < pairs.length; i++) {
      const node = pairs[i][0];
      if (!node) continue;
      if (immediate) node.gain.setValueAtTime(pairs[i][1], now);
      else node.gain.setTargetAtTime(pairs[i][1], now, 0.03);
    }
  }

  au_teardown() {
    this.au_ctx = null;
    this.au_master = this.au_sfx = this.au_music = this.au_noise = null;
    this.au_voices = [];
    this.au_dying = [];
    this.au_amb = null;
    this.au_last.clear();
  }

  // Disconnects finished voices and faded-out ambience.
  au_prune(now) {
    const v = this.au_voices;
    for (let i = v.length - 1; i >= 0; i--) {
      if (now > v[i].end + 0.1) {
        this.au_disconnect(v[i].nodes);
        v.splice(i, 1);
      }
    }
    const d = this.au_dying;
    for (let i = d.length - 1; i >= 0; i--) {
      if (now > d[i].until) {
        this.au_disconnect(d[i].nodes);
        d.splice(i, 1);
      }
    }
  }

  au_disconnect(nodes) {
    if (!Array.isArray(nodes)) return;
    for (let i = 0; i < nodes.length; i++) {
      try { if (nodes[i]) nodes[i].disconnect(); } catch (e) { /* already disconnected */ }
    }
  }

  au_level(def) {
    let s = 0;
    const L = def && Array.isArray(def.layers) ? def.layers : [];
    for (let i = 0; i < L.length && i < 16; i++) s += Math.max(0, au_num(L[i] && L[i].gain, 0));
    return Math.min(1.5, s);
  }

  // Ensures a free voice slot: steals the quietest voice, where older voices count as quieter
  // (level decays with elapsed fraction). Drops the new sound if it is clearly the quietest.
  au_makeRoom(level, now) {
    this.au_prune(now);
    const v = this.au_voices;
    if (v.length < AU_MAX_VOICES) return true;
    let vi = -1;
    let best = Infinity;
    for (let i = 0; i < v.length; i++) {
      const span = Math.max(0.01, v[i].end - v[i].start);
      const rem = clamp((v[i].end - now) / span, 0, 1);
      const lvl = v[i].level * (0.25 + 0.75 * rem);
      if (lvl < best) { best = lvl; vi = i; }
    }
    if (vi < 0) return false;
    if (level < best * 0.5) return false;
    const victim = v[vi];
    v.splice(vi, 1);
    try {
      const g = victim.nodes[0].gain;
      g.cancelScheduledValues(now);
      g.setValueAtTime(g.value, now);
      g.linearRampToValueAtTime(0, now + 0.015);
    } catch (e) { /* ignore */ }
    for (let i = 0; i < victim.sources.length; i++) {
      try { victim.sources[i].stop(now + 0.03); } catch (e) { /* ignore */ }
    }
    this.au_dying.push({ until: now + 0.08, nodes: victim.nodes });
    return true;
  }

  // Creates the per-voice chain (gain → [lowpass] → [pan] → dest) and plays def through it.
  au_spawn(name, def, gain, pan, cutoff, pitch, dest, now) {
    const ctx = this.au_ctx;
    if (!ctx || !dest) return false;
    const level = gain * this.au_level(def);
    if (!this.au_makeRoom(level, now)) return false;
    const head = ctx.createGain();
    head.gain.setValueAtTime(gain, now);
    const nodes = [head];
    let node = head;
    if (cutoff > 0 && cutoff < 17000) {
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(clamp(cutoff, 200, 20000), now);
      lp.Q.setValueAtTime(0.5, now);
      node.connect(lp);
      node = lp;
      nodes.push(lp);
    }
    if (pan !== null && pan !== undefined && typeof ctx.createStereoPanner === 'function') {
      const sp = ctx.createStereoPanner();
      sp.pan.setValueAtTime(clamp(au_num(pan, 0), -1, 1), now);
      node.connect(sp);
      node = sp;
      nodes.push(sp);
    }
    node.connect(dest);
    const res = audioPlayDef(def, { ctx, out: head, noise: this.au_noise, pitch, time: now, rng: this.au_rng });
    if (!res || !res.sources.length) {
      this.au_disconnect(nodes);
      return false;
    }
    this.au_voices.push({ name, start: now, end: res.end, level, nodes, sources: res.sources });
    return true;
  }

  au_startAmbientNow(mapId) {
    const ctx = this.au_ctx;
    if (!ctx || !this.au_music) return;
    if (this.au_amb && this.au_amb.mapId === mapId) return;
    this.au_killAmbient(2);
    const flav = AU_AMBIENT[mapId] || AU_AMBIENT.city;
    const t = au_num(ctx.currentTime, 0);
    const bus = ctx.createGain();
    bus.gain.setValueAtTime(0, t);
    bus.gain.linearRampToValueAtTime(1, t + 3);
    bus.connect(this.au_music);
    const sources = [];
    let windGain = null;
    let windBase = 0;
    const layers = Array.isArray(flav.layers) ? flav.layers : [];
    for (let i = 0; i < layers.length && i < 12; i++) {
      const L = layers[i];
      if (!L) continue;
      const base = Math.max(0, au_num(L.gain, 0.03));
      const isNoise = L.type === 'noise';
      if (isNoise && !this.au_noise) continue;
      let src;
      if (isNoise) {
        src = ctx.createBufferSource();
        src.buffer = this.au_noise;
        src.loop = true;
        src.playbackRate.setValueAtTime(clamp(au_num(L.rate, 1), 0.05, 4), t);
      } else {
        src = ctx.createOscillator();
        src.type = AU_WAVES[L.type] || 'sine';
        src.frequency.setValueAtTime(clamp(au_num(L.freq, 55), 1, 20000), t);
        if (L.detune) src.detune.setValueAtTime(au_num(L.detune, 0), t);
      }
      let node = src;
      let filt = null;
      if (L.filter && typeof L.filter === 'object') {
        filt = ctx.createBiquadFilter();
        filt.type = L.filter.type || 'lowpass';
        filt.frequency.setValueAtTime(clamp(au_num(L.filter.freq, 500), 20, 20000), t);
        filt.Q.setValueAtTime(clamp(au_num(L.filter.q, 1), 0.0001, 40), t);
        node.connect(filt);
        node = filt;
      }
      if (L.lfo) {
        const target = isNoise ? (filt ? filt.frequency : null) : src.frequency;
        au_lfo(ctx, L.lfo, target, t, null, sources, 1);
      }
      const g = ctx.createGain();
      g.gain.setValueAtTime(base, t);
      if (L.swell) au_lfo(ctx, { freq: L.swell.freq, depth: clamp(au_num(L.swell.depth, 0), 0, 1) * base }, g.gain, t, null, sources, 1);
      node.connect(g);
      g.connect(bus);
      if (isNoise) src.start(t, this.au_rand() * (AU_NOISE_SECONDS - 0.1));
      else src.start(t);
      sources.push(src);
      if (L.wind && !windGain) { windGain = g; windBase = base; }
    }
    this.au_amb = {
      mapId, flav, bus, sources, windGain, windBase,
      gustT: this.au_range(flav.gustEvery, 9, 20),
      accentT: this.au_range(flav.accentEvery, 7, 16) * 0.6,
    };
  }

  au_killAmbient(fade) {
    const a = this.au_amb;
    if (!a) return;
    this.au_amb = null;
    const ctx = this.au_ctx;
    if (!ctx) return;
    const t = au_num(ctx.currentTime, 0);
    const f = Math.max(0.05, au_num(fade, 1.5));
    try {
      const g = a.bus.gain;
      g.cancelScheduledValues(t);
      g.setValueAtTime(g.value, t);
      g.linearRampToValueAtTime(0, t + f);
    } catch (e) { /* ignore */ }
    for (let i = 0; i < a.sources.length; i++) {
      try { a.sources[i].stop(t + f + 0.05); } catch (e) { /* ignore */ }
    }
    this.au_dying.push({ until: t + f + 0.2, nodes: [a.bus] });
  }
}


// ===== 06_input.js =====
// 06_input.js — InputManager: keyboard, mouse, virtual touch controls, debug entry points.
// Public API (SPEC §7): INPUT_ACTIONS, class InputManager { isDown, pressed, pressedRaw, released, moveAxis,
//   aimAngleFrom, lastAim, aimWorld, wantsFire, mouse, touchMode, setTouchMode, setStick, touchAction,
//   touchFire, endFrame, setEnabled, consumeAll, debugKey, debugMouse, debugAimWorld }.
// Decisions: touch 'sprint' and 'crouch' buttons are toggles — touchAction('sprint', true) flips a sticky
//   flag that isDown('sprint') honours; crouch is a press-toggle for keyboard and touch alike (Player).
// Dependencies: 00_util.js (clamp, angleTo). DOM access only inside the constructor/methods.

const INPUT_ACTIONS = {
  moveUp: ['KeyW', 'ArrowUp'], moveDown: ['KeyS', 'ArrowDown'], moveLeft: ['KeyA', 'ArrowLeft'], moveRight: ['KeyD', 'ArrowRight'],
  reload: ['KeyR'], interact: ['KeyE'], sprint: ['ShiftLeft', 'ShiftRight'], crouch: ['KeyC'], flashlight: ['KeyF'],
  inventory: ['Tab'], map: ['KeyM'], grenade: ['KeyG'], slot1: ['Digit1'], slot2: ['Digit2'], slot3: ['Digit3'],
  slot4: ['Digit4'], slot5: ['Digit5'], pause: ['Escape'], quickMed: ['KeyQ'], drop: ['KeyX'],
};

class InputManager {
  constructor(game, canvas) {
    this.game = game;
    this.canvas = canvas || null;
    this.enabled = true;
    this.keys = new Set();            // codes held
    this.edgesDown = new Set();       // action names pressed this frame
    this.edgesUp = new Set();         // action names released this frame
    this.codeToActions = new Map();
    for (const [action, codes] of Object.entries(INPUT_ACTIONS)) {
      for (const c of codes) {
        if (!this.codeToActions.has(c)) this.codeToActions.set(c, []);
        this.codeToActions.get(c).push(action);
      }
    }
    this._mouse = { x: 0, y: 0, down: false, rightDown: false };
    this.lastAim = 0;
    this.aimWorld = null;
    this.moveStick = { x: 0, y: 0 };
    this.aimStick = { x: 0, y: 0 };
    this.touchFireHeld = false;
    this.touchHeld = new Set();       // virtual buttons currently held
    this.touchToggles = { sprint: false };
    this._touchMode = false;
    this._forcedTouch = null;
    this._evaluateTouchMode();
    this._bind();
  }

  // ---------- touch mode ----------
  _evaluateTouchMode() {
    const s = (this.game && this.game.settings) || {};
    const pref = s.touchControls || 'auto';
    let coarse = false;
    try {
      const nav = typeof navigator !== 'undefined' ? navigator : null;
      const mm = typeof matchMedia === 'function' ? matchMedia('(pointer: coarse)') : null;
      coarse = !!((nav && nav.maxTouchPoints > 0) || (mm && mm.matches));
    } catch (e) { coarse = false; }
    this._touchMode = pref === 'on' || (pref === 'auto' && coarse);
    return this._touchMode;
  }
  get touchMode() { return this._touchMode; }
  setTouchMode(b) { this._touchMode = !!b; }
  reevaluateTouch() { return this._evaluateTouchMode(); }

  // ---------- DOM binding ----------
  _bind() {
    if (typeof window === 'undefined' || !window.addEventListener) return;
    this._onKeyDown = (e) => this._keyDown(e.code, e);
    this._onKeyUp = (e) => this._keyUp(e.code, e);
    this._onBlur = () => this.releaseAll();
    window.addEventListener('keydown', this._onKeyDown);
    window.addEventListener('keyup', this._onKeyUp);
    window.addEventListener('blur', this._onBlur);
    const c = this.canvas;
    if (c && c.addEventListener) {
      c.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'touch') return;
        this._setMouseFromEvent(e);
        this.aimWorld = null;
      });
      c.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'touch') return;
        this._setMouseFromEvent(e);
        if (e.button === 0) this._mouse.down = true;
        if (e.button === 2) this._mouse.rightDown = true;
      });
      window.addEventListener('pointerup', (e) => {
        if (e.pointerType === 'touch') return;
        if (e.button === 0) this._mouse.down = false;
        if (e.button === 2) this._mouse.rightDown = false;
      });
      c.addEventListener('contextmenu', (e) => e.preventDefault());
    }
    window.addEventListener('touchstart', () => {
      if (!this._touchSeen) {
        this._touchSeen = true;
        if (this._evaluateTouchMode() && this.game && this.game.ui && this.game.ui.applyTouchVisibility) this.game.ui.applyTouchVisibility();
      }
    }, { passive: true });
  }

  _setMouseFromEvent(e) {
    const c = this.canvas;
    if (!c || !c.getBoundingClientRect) { this._mouse.x = e.clientX; this._mouse.y = e.clientY; return; }
    const r = c.getBoundingClientRect();
    this._mouse.x = e.clientX - r.left;
    this._mouse.y = e.clientY - r.top;
  }

  _keyDown(code, e) {
    const actions = this.codeToActions.get(code);
    if (actions && e && e.preventDefault && this.game && this.game.state === 'raid') {
      // Do not steal keys from text inputs (seed field, import textarea).
      const t = e.target;
      const tag = t && t.tagName ? String(t.tagName).toLowerCase() : '';
      if (tag !== 'input' && tag !== 'textarea') e.preventDefault();
    }
    if (e && e.target) {
      const tag = e.target.tagName ? String(e.target.tagName).toLowerCase() : '';
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    }
    if (e && e.repeat) return;
    if (this.keys.has(code)) return;
    this.keys.add(code);
    if (actions) for (const a of actions) this.edgesDown.add(a);
  }

  _keyUp(code) {
    if (!this.keys.has(code)) return;
    this.keys.delete(code);
    const actions = this.codeToActions.get(code);
    if (actions) for (const a of actions) this.edgesUp.add(a);
  }

  releaseAll() {
    for (const code of Array.from(this.keys)) this._keyUp(code);
    this._mouse.down = false; this._mouse.rightDown = false;
    this.touchFireHeld = false;
    this.moveStick.x = this.moveStick.y = 0;
    this.touchHeld.clear();
  }

  // ---------- queries ----------
  _rawDown(action) {
    const codes = INPUT_ACTIONS[action];
    if (codes) for (const c of codes) if (this.keys.has(c)) return true;
    if (this.touchHeld.has(action)) return true;
    if (action === 'sprint' && this.touchToggles.sprint) return true;
    return false;
  }
  isDown(action) { return this.enabled && this._rawDown(action); }
  pressed(action) { return this.enabled && this.edgesDown.has(action); }
  pressedRaw(action) { return this.edgesDown.has(action); }
  released(action) { return this.enabled && this.edgesUp.has(action); }

  moveAxis() {
    if (!this.enabled) return { x: 0, y: 0 };
    let x = 0, y = 0;
    if (this._rawDown('moveLeft')) x -= 1;
    if (this._rawDown('moveRight')) x += 1;
    if (this._rawDown('moveUp')) y -= 1;
    if (this._rawDown('moveDown')) y += 1;
    x += this.moveStick.x; y += this.moveStick.y;
    const len = Math.hypot(x, y);
    if (len > 1) { x /= len; y /= len; }
    return { x, y };
  }

  aimAngleFrom(sx, sy) {
    const raid = this.game && this.game.raid;
    const p = raid && raid.player;
    if (this.aimWorld && p) {
      const a = angleTo(p.x, p.y, this.aimWorld.x, this.aimWorld.y);
      if (Number.isFinite(a)) this.lastAim = a;
      return this.lastAim;
    }
    if (this._touchMode) {
      const m = Math.hypot(this.aimStick.x, this.aimStick.y);
      if (m > 0.2) this.lastAim = Math.atan2(this.aimStick.y, this.aimStick.x);
      else if (Math.hypot(this.moveStick.x, this.moveStick.y) > 0.3 && !this.touchFireHeld) {
        // Without an aim input the character faces the walking direction.
        this.lastAim = Math.atan2(this.moveStick.y, this.moveStick.x);
      }
      return this.lastAim;
    }
    const dx = this._mouse.x - sx, dy = this._mouse.y - sy;
    if (dx * dx + dy * dy < 4) return this.lastAim;
    this.lastAim = Math.atan2(dy, dx);
    return this.lastAim;
  }

  wantsFire() {
    if (!this.enabled) return false;
    if (this.touchFireHeld) return true;
    const s = (this.game && this.game.settings) || {};
    if (this._touchMode && s.aimAssist !== false && Math.hypot(this.aimStick.x, this.aimStick.y) > 0.75) return true;
    return this._mouse.down;
  }

  get mouse() { return this._mouse; }

  // ---------- virtual controls ----------
  setStick(which, x, y) {
    const s = which === 'aim' ? this.aimStick : this.moveStick;
    s.x = clamp(Number(x) || 0, -1, 1);
    s.y = clamp(Number(y) || 0, -1, 1);
    if (which === 'aim') this.aimWorld = null;
  }

  touchAction(action, down) {
    if (!INPUT_ACTIONS[action]) return;
    if (action === 'sprint') {
      if (down) { this.touchToggles.sprint = !this.touchToggles.sprint; this.edgesDown.add('sprint'); }
      return;
    }
    if (down) {
      if (!this.touchHeld.has(action)) { this.touchHeld.add(action); this.edgesDown.add(action); }
    } else if (this.touchHeld.has(action)) {
      this.touchHeld.delete(action);
      this.edgesUp.add(action);
    }
  }

  touchFire(down) { this.touchFireHeld = !!down; }

  endFrame() { this.edgesDown.clear(); this.edgesUp.clear(); }
  setEnabled(b) {
    const was = this.enabled;
    this.enabled = !!b;
    if (was && !this.enabled) { this._mouse.down = false; this.touchFireHeld = false; }
  }
  consumeAll() { this.edgesDown.clear(); }

  // ---------- debug entry points (window.DZ) ----------
  debugKey(code, down) {
    if (down) this._keyDown(String(code), null); else this._keyUp(String(code));
  }
  debugMouse(x, y, down) {
    if (typeof x === 'number' && Number.isFinite(x)) { this._mouse.x = x; this.aimWorld = null; }
    if (typeof y === 'number' && Number.isFinite(y)) { this._mouse.y = y; this.aimWorld = null; }
    if (down === true) this._mouse.down = true;
    else if (down === false) this._mouse.down = false;
  }
  debugAimWorld(wx, wy) {
    if (!Number.isFinite(wx) || !Number.isFinite(wy)) return;
    this.aimWorld = { x: wx, y: wy };
  }
}


// ===== 07_camera.js =====
// 07_camera.js — Camera: smooth follow, bounds, shake, world/screen conversion (SPEC §8).
// Dependencies: 00_util.js (clamp). No DOM access.

class Camera {
  constructor(game) {
    this.game = game;
    this.x = 0; this.y = 0;
    this.zoom = 1;
    this.width = 1280; this.height = 720;
    this.bounds = null;
    this.shake = 0;
    this.shakeX = 0; this.shakeY = 0;
    this._t = 0;
  }
  resize(w, h) {
    this.width = Math.max(1, w | 0);
    this.height = Math.max(1, h | 0);
    this.zoom = this.width < 900 ? 0.9 : 1.15;
    this._clamp();
  }
  setBounds(worldW, worldH) {
    this.bounds = (worldW && worldH) ? { w: worldW, h: worldH } : null;
    this._clamp();
  }
  snap(x, y) {
    if (Number.isFinite(x)) this.x = x;
    if (Number.isFinite(y)) this.y = y;
    this._clamp();
  }
  follow(tx, ty, dt, lookAheadX = 0, lookAheadY = 0) {
    if (!Number.isFinite(tx) || !Number.isFinite(ty)) return;
    const k = 1 - Math.exp(-6 * Math.min(dt, 0.1));
    this.x += (tx + lookAheadX - this.x) * k;
    this.y += (ty + lookAheadY - this.y) * k;
    this._clamp();
  }
  _clamp() {
    if (!this.bounds) return;
    const hw = this.width / (2 * this.zoom), hh = this.height / (2 * this.zoom);
    if (this.bounds.w <= hw * 2) this.x = this.bounds.w / 2;
    else this.x = clamp(this.x, hw, this.bounds.w - hw);
    if (this.bounds.h <= hh * 2) this.y = this.bounds.h / 2;
    else this.y = clamp(this.y, hh, this.bounds.h - hh);
  }
  addShake(strength) {
    const s = this.game && this.game.settings;
    if (s && s.screenShake === false) return;
    this.shake = Math.min(24, this.shake + Math.max(0, Number(strength) || 0));
  }
  update(dt) {
    this._t += dt;
    if (this.shake > 0.05) {
      this.shake *= Math.exp(-9 * dt);
      this.shakeX = Math.sin(this._t * 91.7) * this.shake;
      this.shakeY = Math.cos(this._t * 77.3) * this.shake;
    } else {
      this.shake = 0; this.shakeX = 0; this.shakeY = 0;
    }
  }
  worldToScreen(wx, wy) {
    return {
      x: (wx - this.x) * this.zoom + this.width / 2 + this.shakeX,
      y: (wy - this.y) * this.zoom + this.height / 2 + this.shakeY,
    };
  }
  screenToWorld(sx, sy) {
    return {
      x: (sx - this.width / 2 - this.shakeX) / this.zoom + this.x,
      y: (sy - this.height / 2 - this.shakeY) / this.zoom + this.y,
    };
  }
  viewBounds() {
    const hw = this.width / (2 * this.zoom), hh = this.height / (2 * this.zoom);
    return { x: this.x - hw - TILE, y: this.y - hh - TILE, w: hw * 2 + TILE * 2, h: hh * 2 + TILE * 2 };
  }
}

function wg_range(v, def) {
  if (Array.isArray(v) && v.length >= 2) return [Number(v[0]) || def[0], Number(v[1]) || def[1]];
  if (Number.isFinite(v)) return [v, v];
  return def.slice();
}

function wg_makeItem(id, count) {
  if (typeof Items !== 'undefined' && Items.create) return Items.create(id, count);
  return { uid: Uid.next(), id, count };
}

class WorldGenerator {
  static generate(mapId, seed, missionDefs = []) {
    const map = (typeof MAPS !== 'undefined' && MAPS[mapId]) || (typeof MAPS !== 'undefined' && MAPS.city);
    if (!map) throw new Error('No map definitions loaded');
    const defs = Array.isArray(missionDefs) ? missionDefs.filter(Boolean) : [];
    const baseSeed = (typeof seed === 'number' && Number.isFinite(seed)) ? seed >>> 0 : hashString(String(seed));
    let world = null;
    for (let attempt = 0; attempt < 6; attempt++) {
      world = WorldGenerator._attempt(map, map.id || mapId, baseSeed, (baseSeed + attempt) >>> 0, defs);
      let v = WorldGenerator.validate(world, defs);
      for (let pass = 0; !v.ok && v.unreachable.length && pass < 4; pass++) {
        Log.warn('WorldGenerator: repairing ' + v.unreachable.length + ' unreachable targets (' + mapId + ', seed ' + baseSeed + ')');
        WorldGenerator._repair(world, v.unreachable);
        v = WorldGenerator.validate(world, defs);
      }
      if (v.ok) break;
      if (attempt < 5) Log.warn('WorldGenerator: attempt ' + (attempt + 1) + ' failed for ' + mapId + ' seed ' + baseSeed + ', retrying');
      else Log.warn('WorldGenerator: accepting last attempt with problems for ' + mapId);
    }
    world.seed = baseSeed;
    world.version = 0;
    world.dirtyChunks.clear();
    return world;
  }

  static validate(world, missionDefs = []) {
    const unreachable = [];
    const missingObjectives = [];
    if (!world) return { ok: false, unreachable: [{ kind: 'world', id: null, tx: 0, ty: 0 }], missingObjectives };
    const sx = Math.floor(world.playerSpawn.x / TILE), sy = Math.floor(world.playerSpawn.y / TILE);
    const reach = wgReachability(world, sx, sy);
    const R = (tx, ty) => tx >= 0 && ty >= 0 && tx < world.w && ty < world.h && reach[ty * world.w + tx] === 1;
    const near = (tx, ty) => {
      if (R(tx, ty)) return true;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (R(tx + dx, ty + dy)) return true;
      return false;
    };
    if (!world.isWalkable(sx, sy)) unreachable.push({ kind: 'spawn', id: 'spawn', tx: sx, ty: sy });
    for (const e of world.extractions) {
      const tx = Math.floor(e.x / TILE), ty = Math.floor(e.y / TILE);
      if (!R(tx, ty)) unreachable.push({ kind: 'extraction', id: e.id, tx, ty });
    }
    for (const p of world.pois) {
      const tx = Math.floor(p.x / TILE), ty = Math.floor(p.y / TILE);
      if (!near(tx, ty)) unreachable.push({ kind: 'poi', id: p.id, tx, ty });
    }
    for (const c of world.containers) {
      if (!near(c.tx, c.ty)) unreachable.push({ kind: 'container', id: c.uid, tx: c.tx, ty: c.ty });
    }
    for (const fl of world.floorLoot) {
      const tx = Math.floor(fl.x / TILE), ty = Math.floor(fl.y / TILE);
      if (!near(tx, ty)) unreachable.push({ kind: 'loot', id: fl.uid, tx, ty });
    }
    for (let i = 0; i < world.zombieSpawns.length; i++) {
      const z = world.zombieSpawns[i];
      const tx = Math.floor(z.x / TILE), ty = Math.floor(z.y / TILE);
      if (!R(tx, ty)) unreachable.push({ kind: 'zombie', id: 'z' + i, tx, ty });
    }
    // mission objectives
    const hasItem = (id) => {
      if (world.floorLoot.some(fl => fl.inst && fl.inst.id === id)) return true;
      for (const c of world.containers) {
        if (c.preset && c.preset.some(i => i && i.id === id)) return true;
        if (Array.isArray(c.items) && c.items.some(i => i && i.id === id)) return true;
      }
      return false;
    };
    for (const m of missionDefs || []) {
      if (!m) continue;
      for (const o of [...(m.objectives || []), ...(m.optional || [])]) {
        let ok = true;
        if (o.type === 'retrieve' || o.type === 'find_key') ok = hasItem(o.target);
        else if (o.type === 'investigate') ok = world.pois.some(p => p.type === o.target);
        else if (o.type === 'generator') ok = world.pois.some(p => p.type === 'generator');
        else if (o.type === 'kill_boss') ok = !!world.bossArena && world.zombieSpawns.some(z => (z.types || []).includes('boss'));
        else if (o.type === 'extract_at') ok = world.extractions.some(e => e.id === o.target);
        if (!ok) missingObjectives.push(o.id);
      }
    }
    return { ok: unreachable.length === 0 && missingObjectives.length === 0, unreachable, missingObjectives };
  }

  // Carves a 4-connected corridor from the nearest reachable tile to each unreachable target.
  static _repair(world, unreachable) {
    const sx = Math.floor(world.playerSpawn.x / TILE), sy = Math.floor(world.playerSpawn.y / TILE);
    for (const u of unreachable.slice(0, 40)) {
      const reach = wgReachability(world, sx, sy);
      let best = -1, bd = Infinity;
      for (let i = 0; i < reach.length; i++) {
        if (!reach[i]) continue;
        const x = i % world.w, y = (i - x) / world.w;
        const d = (x - u.tx) * (x - u.tx) + (y - u.ty) * (y - u.ty);
        if (d < bd) { bd = d; best = i; }
      }
      if (best < 0) continue;
      let x = best % world.w, y = (best - x) / world.w;
      let guard = 0;
      while ((x !== u.tx || y !== u.ty) && guard++ < 600) {
        if (Math.abs(u.tx - x) >= Math.abs(u.ty - y)) x += Math.sign(u.tx - x); else y += Math.sign(u.ty - y);
        if (x < 3 || y < 3 || x >= world.w - 3 || y >= world.h - 3) break;
        const t = world.tile(x, y);
        if (!tileBlocksMove(t) || t === T.DOOR_CLOSED || t === T.DOOR_LOCKED) continue;
        const inside = world.buildingIndexAtTile(x, y) >= 0;
        if (t === T.WALL || t === T.WINDOW) world.put(x, y, T.DOOR_CLOSED);
        else world.put(x, y, inside ? T.FLOOR : T.GROUND);
      }
    }
    // drop props whose tiles were carved away
    world.props = world.props.filter(p => {
      if (!p.solid) return true;
      for (let y = p.ty; y < p.ty + p.h; y++) for (let x = p.tx; x < p.tx + p.w; x++) if (!tileBlocksMove(world.tile(x, y))) return false;
      return true;
    });
  }

  static _attempt(map, mapId, seed, attemptSeed, missionDefs) {
    const rng = new RNG(hashString(mapId + ':' + attemptSeed));
    const size = map.size || { w: 150, h: 150 };
    const world = new World(mapId, seed, size.w || 150, size.h || 150);
    const g = { world, rng, map, missionDefs };
    const fnName = WG_LAYOUT_FN[map.layout] || 'wgLayoutCity';
    const layoutFns = { wgLayoutCity, wgLayoutCompound, wgLayoutIndustrial, wgLayoutCampus };
    const layout = layoutFns[fnName](g);
    const ctx = {
      world, rng, map, layout,
      reserved: new Uint8Array(world.w * world.h),
      containerSeq: 0, propSeq: 0, poiSeq: 0,
      outdoor: [],
    };
    world.blocks = layout.blocks;
    world.roads = layout.roads;
    world.yards = layout.yards;
    WorldGenerator._placeBuildings(ctx);
    if (layout.bossArena) WorldGenerator._bossHall(ctx, layout.bossArena);
    WorldGenerator._layoutFeatures(ctx);
    for (let i = 0; i < world.tileVariant.length; i++) world.tileVariant[i] = rng.int(0, 3);
    WorldGenerator._playerSpawn(ctx);
    WorldGenerator._extractions(ctx);
    WorldGenerator._generator(ctx);
    WorldGenerator._props(ctx);
    WorldGenerator._lights(ctx);
    WorldGenerator._zombies(ctx);
    WorldGenerator._missionPlacement(ctx, rng.fork('missions'), missionDefs);
    return world;
  }

  // ---------------- buildings ----------------
  static _normDefs(map) {
    const raw = Array.isArray(map.buildings) && map.buildings.length ? map.buildings : (WG_DEFAULT_BUILDINGS[map.layout] || WG_DEFAULT_BUILDINGS.city);
    return raw.filter(d => d && d.type).map(d => ({
      type: d.type,
      count: wg_range(d.count, [1, 2]),
      w: wg_range(d.w, [5, 8]).map(v => Math.max(5, v)),
      h: wg_range(d.h, [5, 8]).map(v => Math.max(5, v)),
      lootTier: Number.isFinite(d.lootTier) ? d.lootTier : 1,
      containers: Array.isArray(d.containers) && d.containers.length ? d.containers : (WG_DEFAULT_CONTAINERS[d.type] || ['crate']),
      containerCount: wg_range(d.containerCount, [2, 4]),
      placed: 0,
      target: 0,
    }));
  }

  static _zoneAllows(zone, type) {
    const list = WG_ZONE_TYPES[zone];
    return !!list && list.includes(type);
  }

  static _placeBuildings(ctx) {
    const { rng, layout, map } = ctx;
    const defs = WorldGenerator._normDefs(map);
    for (const d of defs) d.target = rng.int(d.count[0], d.count[1]);
    // every def needs at least one zone that allows it; otherwise allow everywhere
    const zones = new Set(layout.blocks.map(b => b.zone));
    for (const d of defs) d.anyZone = ![...zones].some(z => WorldGenerator._zoneAllows(z, d.type));
    const allows = (zone, d) => d.anyZone || WorldGenerator._zoneAllows(zone, d.type);
    const blocks = rng.shuffle(layout.blocks.slice());
    const large = defs.filter(d => d.w[0] >= 10 || d.h[0] >= 10).sort((a, b) => b.w[0] * b.h[0] - a.w[0] * a.h[0]);
    const freeRects = [];
    for (const block of blocks) {
      let rects = [{ tx: block.tx, ty: block.ty, w: block.w, h: block.h }];
      // one large building per block when a large def still needs placing
      const cand = large.filter(d => d.placed < d.target && allows(block.zone, d) && d.w[0] + 2 <= block.w && d.h[0] + 2 <= block.h);
      const pickLarge = cand.length ? cand.sort((a, b) => (a.placed / a.target) - (b.placed / b.target))[0] : null;
      if (pickLarge && rng.chance(0.85)) {
        const bw = rng.int(pickLarge.w[0], Math.min(pickLarge.w[1], block.w - 2));
        const bh = rng.int(pickLarge.h[0], Math.min(pickLarge.h[1], block.h - 2));
        const lotW = bw + 2, lotH = bh + 2;
        const right = rng.chance(0.5), bottom = rng.chance(0.5);
        const lx = right ? block.tx + block.w - lotW : block.tx;
        const ly = bottom ? block.ty + block.h - lotH : block.ty;
        WorldGenerator._building(ctx, pickLarge, lx + 1, ly + 1, bw, bh, block);
        pickLarge.placed++;
        rects = [];
        // remaining L-shape: a full-height strip beside the lot and a strip above/below it
        const sideW = block.w - lotW;
        if (sideW >= 7) rects.push({ tx: right ? block.tx : block.tx + lotW, ty: block.ty, w: sideW, h: block.h });
        else if (sideW > 0) freeRects.push({ tx: right ? block.tx : block.tx + lotW, ty: block.ty, w: sideW, h: block.h });
        const capH = block.h - lotH;
        if (capH >= 7) rects.push({ tx: lx, ty: bottom ? block.ty : block.ty + lotH, w: lotW, h: capH });
        else if (capH > 0) freeRects.push({ tx: lx, ty: bottom ? block.ty : block.ty + lotH, w: lotW, h: capH });
      }
      for (const r of rects) {
